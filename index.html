<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#17110d">

  <title>逆命錄・第四版乙</title>

  <style>
    :root {
      color-scheme: dark;

      --black: #0d0a08;
      --deep: #17110d;
      --panel: #211812;
      --panel-soft: #2b2018;

      --parchment: #decda6;
      --parchment-bright: #f1e4c4;
      --muted: #a99472;

      --border: #6c5234;
      --border-bright: #9b784c;

      --blood: #8c2924;
      --blood-bright: #bd493d;

      --gold: #c69a4b;
      --green: #72885d;
      --blue: #718496;

      --shadow: rgba(0, 0, 0, 0.52);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--black);
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);

      color: var(--parchment);

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(122, 84, 46, 0.18),
          transparent 34rem
        ),
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.012) 0,
          rgba(255, 255, 255, 0.012) 1px,
          transparent 1px,
          transparent 5px
        ),
        var(--black);

      font-family:
        "Songti TC",
        "Noto Serif TC",
        "PingFang TC",
        "Microsoft JhengHei",
        serif;

      line-height: 1.6;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #app {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 9px;
    }

    .masthead {
      margin-bottom: 9px;
      padding: 14px 10px;

      text-align: center;

      border: 1px solid var(--border);

      background:
        linear-gradient(
          rgba(27, 19, 14, 0.94),
          rgba(18, 13, 10, 0.97)
        ),
        var(--panel);

      box-shadow: 0 8px 24px var(--shadow);
    }

    .masthead h1 {
      margin: 0;

      color: var(--parchment-bright);

      font-size: clamp(1.8rem, 7vw, 2.8rem);
      letter-spacing: 0.2em;
      text-indent: 0.2em;
    }

    .masthead p {
      margin: 3px 0 0;

      color: var(--muted);

      font-size: 0.8rem;
      letter-spacing: 0.1em;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(270px, 325px) minmax(0, 1fr);
      gap: 9px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--border);

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.018),
          transparent 40%
        ),
        var(--panel);

      box-shadow: 0 8px 24px var(--shadow);
    }

    .character-panel {
      position: sticky;
      top: 9px;
      padding: 13px;
    }

    .main-panel {
      min-height: 630px;
      padding: clamp(14px, 4vw, 25px);
    }

    .panel-title {
      margin: 0 0 10px;
      padding-bottom: 7px;

      color: var(--gold);
      border-bottom: 1px solid var(--border);

      font-size: 0.95rem;
      letter-spacing: 0.12em;
    }

    .identity {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;

      margin-bottom: 11px;
    }

    .identity strong {
      color: var(--parchment-bright);
      font-size: 1.25rem;
      overflow-wrap: anywhere;
    }

    .identity span {
      flex: none;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .meter {
      margin-bottom: 10px;
    }

    .meter-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;

      margin-bottom: 4px;

      font-size: 0.84rem;
    }

    .meter-track {
      height: 11px;
      overflow: hidden;

      border: 1px solid #5d4731;
      background: #100c0a;
    }

    .meter-fill {
      height: 100%;
      transition: width 130ms ease;
    }

    .posture-fill {
      background: linear-gradient(90deg, #4e6270, #86a2b3);
    }

    .stamina-fill {
      background: linear-gradient(90deg, #4c5b3b, #829964);
    }

    .enemy-posture-fill {
      background: linear-gradient(90deg, #632a27, #a8463f);
    }

    .enemy-stamina-fill {
      background: linear-gradient(90deg, #57462e, #a17c47);
    }

    .abilities {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px 11px;

      margin: 11px 0;
    }

    .ability {
      display: flex;
      justify-content: space-between;
      gap: 8px;

      padding-bottom: 2px;
      border-bottom: 1px dotted rgba(222, 205, 166, 0.2);
    }

    .ability span:last-child {
      color: var(--parchment-bright);
      font-variant-numeric: tabular-nums;
    }

    .info-block {
      margin-top: 10px;
      padding-top: 8px;

      border-top: 1px solid rgba(108, 82, 52, 0.66);
    }

    .info-label {
      display: block;

      margin-bottom: 3px;

      color: var(--muted);

      font-size: 0.73rem;
      letter-spacing: 0.1em;
    }

    .info-value {
      color: var(--parchment-bright);
      overflow-wrap: anywhere;
    }

    .small-text {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .status-box {
      margin-top: 11px;
      padding: 9px 10px;

      border-left: 3px solid var(--gold);
      background: rgba(0, 0, 0, 0.2);
    }

    .story-heading {
      margin: 0 0 13px;

      color: var(--parchment-bright);

      font-size: clamp(1.3rem, 5vw, 1.9rem);
      line-height: 1.35;
    }

    #storyText p {
      margin: 0 0 11px;
    }

    .speech {
      color: var(--parchment-bright);
      font-weight: 600;
    }

    .warning {
      color: #e7b099;
    }

    .good {
      color: #bdc99f;
    }

    .intent-box {
      margin: 12px 0;
      padding: 11px 12px;

      border-left: 4px solid var(--blood-bright);
      background: rgba(87, 25, 21, 0.2);
    }

    .intent-title {
      margin-bottom: 3px;

      color: var(--blood-bright);

      font-size: 0.77rem;
      letter-spacing: 0.12em;
    }

    .intent-name {
      color: var(--parchment-bright);
      font-weight: 700;
    }

    .execution-alert {
      margin: 12px 0;
      padding: 11px 12px;

      color: #f2c7b7;

      border: 1px solid var(--blood-bright);
      background:
        linear-gradient(
          rgba(113, 30, 25, 0.32),
          rgba(54, 20, 17, 0.42)
        );
    }

    .enemy-card {
      margin: 13px 0;
      padding: 11px;

      border: 1px solid rgba(140, 41, 36, 0.75);
      background: rgba(75, 22, 19, 0.16);
    }

    .enemy-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;

      margin-bottom: 8px;
    }

    .enemy-header strong {
      color: var(--parchment-bright);
    }

    .wound-list {
      margin: 7px 0 0;
      padding-left: 19px;
    }

    .wound-list li {
      margin-bottom: 3px;
      color: #e0b09a;
    }

    .roll-box {
      margin: 13px 0;
      padding: 10px 11px;

      border: 1px solid rgba(155, 120, 76, 0.62);
      background: rgba(8, 6, 5, 0.43);

      color: var(--muted);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;

      font-size: 0.75rem;
      line-height: 1.55;

      overflow-wrap: anywhere;
    }

    .roll-line + .roll-line {
      margin-top: 4px;
    }

    .result-success {
      color: #bdc99f;
    }

    .result-failure {
      color: #e0aa97;
    }

    .actions-title {
      margin: 19px 0 8px;

      color: var(--gold);

      font-size: 0.87rem;
      letter-spacing: 0.11em;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .action-button {
      width: 100%;
      min-height: 57px;
      padding: 11px 12px;

      color: var(--parchment-bright);

      border: 1px solid var(--border-bright);
      border-radius: 0;

      background:
        linear-gradient(
          rgba(71, 51, 36, 0.78),
          rgba(43, 31, 23, 0.92)
        ),
        var(--panel-soft);

      cursor: pointer;
      text-align: left;
      line-height: 1.35;
    }

    .action-button:active:not(:disabled) {
      transform: translateY(1px);
      background: #513825;
    }

    .action-button.danger {
      border-color: var(--blood-bright);
      background: linear-gradient(#692b26, #381b18);
    }

    .action-button.execution {
      border-color: #e06654;

      background:
        linear-gradient(
          rgba(138, 37, 30, 0.94),
          rgba(66, 20, 17, 0.96)
        );

      box-shadow:
        inset 0 0 0 1px rgba(255, 177, 143, 0.15),
        0 0 14px rgba(140, 41, 36, 0.28);
    }

    .action-button.safe {
      border-color: var(--green);
    }

    .action-button.info {
      border-color: var(--blue);
    }

    .action-button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .action-button small {
      display: block;

      margin-top: 4px;

      color: var(--muted);
      font-size: 0.72rem;
    }

    .creation-box {
      margin: 12px 0;
      padding: 13px;

      border: 1px solid rgba(155, 120, 76, 0.56);
      background: rgba(0, 0, 0, 0.18);
    }

    .creation-box label {
      display: block;

      margin-bottom: 6px;

      color: var(--gold);
    }

    .creation-box input {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;

      color: var(--parchment-bright);

      border: 1px solid var(--border-bright);
      border-radius: 0;
      outline: none;

      background: #120e0b;
    }

    .creation-box input:focus {
      border-color: var(--gold);
    }

    .footer {
      padding: 14px 4px 5px;

      color: #77664f;

      text-align: center;
      font-size: 0.72rem;
    }

    @media (max-width: 760px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .character-panel {
        position: static;
      }

      .main-panel {
        min-height: 510px;
      }

      .mobile-summary {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 11px;
      }
    }

    @media (max-width: 460px) {
      #app {
        padding: 6px;
      }

      .masthead {
        padding: 11px 8px;
      }

      .main-panel {
        padding: 13px 11px;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .action-button {
        min-height: 59px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main id="app">
    <header class="masthead">
      <h1>逆命錄</h1>
      <p>轉生篇・黑松嶺首戰・第四版乙</p>
    </header>

    <div class="layout">
      <aside class="panel character-panel">
        <h2 class="panel-title">人物命簿</h2>

        <div class="identity">
          <strong id="playerName">未題名</strong>
          <span id="playerAge">尚未轉生</span>
        </div>

        <div class="meter">
          <div class="meter-header">
            <span>架勢</span>
            <span id="postureText">—</span>
          </div>

          <div class="meter-track">
            <div
              id="postureFill"
              class="meter-fill posture-fill"
            ></div>
          </div>
        </div>

        <div class="meter">
          <div class="meter-header">
            <span>體力</span>
            <span id="staminaText">—</span>
          </div>

          <div class="meter-track">
            <div

            ></div>
          </div>
        </div>

        <div id="abilities" class="abilities"></div>

        <div class="mobile-summary">
          <div class="info-block">
            <span class="info-label">前世經歷</span>

          </div>

          <div class="info-block">
            <span class="info-label">今世成長</span>
            <span id="formativeText" class="info-value">尚未選定</span>

          <div class="info-block">
            <span class="info-label">兵器</span>

            <span class="info-label">傷勢</span>
            <span id="woundText" class="info-value">無</span>

        <div class="status-box">
          <span class="info-label">此刻境況</span>
          <span id="statusText" class="info-value">命書尚未展開</span>
        </div>
      </aside>

      <section class="panel main-panel" aria-live="polite">
        <h2 id="storyHeading" class="story-heading">無字命頁</h2>

        <div id="storyText"></div>
        <div id="intentArea"></div>
        <div id="executionArea"></div>
        <div id="enemyArea"></div>
        <div id="rollArea"></div>

        <h3 class="actions-title">你要如何做？</h3>
        <div id="actions" class="actions"></div>
      </section>
    </div>

    <footer class="footer">
      每次判定都會真正擲骰；能力、武技、裝備、傷勢與戰術選擇共同決定結果。
    </footer>
  </main>

    const ARMOURS = {

    const INTENTS = {

    const ENEMY_DATA = {

      abilities: {
        might: 62,

        ability: "might",

    let state = null;

    let creation = {
      name: "",

    let rngState = 1;
    let buttonsLocked = false;

    function clamp(value, minimum, maximum) {
      return Math.max(minimum, Math.min(maximum, value));
    }

    function signed(value) {
      return value >= 0 ? `+${value}` : `${value}`;
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function createHiddenSeed() {
      if (
        window.crypto &&
        window.crypto.getRandomValues
      ) {
        const values = new Uint32Array(1);
        window.crypto.getRandomValues(values);

        return values[0] || 1;
      }

      return (
        Date.now() ^
        Math.floor(Math.random() * 4294967295)
      ) >>> 0 || 1;
    }

    function seedRng(seed) {
      rngState = seed >>> 0 || 1;
    }

    function random() {
      rngState += 0x6D2B79F5;

      let value = rngState;

      value = Math.imul(
        value ^ (value >>> 15),
        value | 1
      );

      value ^= value + Math.imul(
        value ^ (value >>> 7),
        value | 61
      );

      return (
        (value ^ (value >>> 14)) >>> 0
      ) / 4294967296;
    }

    function die(sides) {
      return Math.floor(random() * sides) + 1;
    }

    function abilityModifier(score) {
      return clamp(
        Math.round((score - 50) / 10),
        -5,
        5
      );
    }

    function skillModifier(score) {
      return clamp(
        Math.round((score - 50) / 10),
        -5,
        5
      );
    }

    function baseAbilities() {
      return {
        might: 50,
        agility: 50,
        endurance: 50,
        perception: 50,
        intellect: 50,
        will: 50,
        presence: 50
      };
    }

    function baseSkills() {
      return {
        blade: 30,
        spear: 30,
        polearm: 25,
        archery: 20,
        dueling: 32,
        awareness: 28,
        command: 15,
        tactics: 20,
        medicine: 10
      };
    }

    function applyBonuses(target, bonuses) {
      Object.entries(bonuses || {}).forEach(
        ([key, amount]) => {
          target[key] = clamp(
            (target[key] || 0) + amount,
            0,
            99
          );
        }
      );
    }

    function makeCombatant(data) {
      const endurance =
        abilityModifier(data.abilities.endurance);

      const will =
        abilityModifier(data.abilities.will);

      const maxPosture =
        Math.max(13, 17 + endurance + will);

      const maxStamina =
        Math.max(13, 17 + endurance * 2);

      return {
        name: data.name,

        abilities: clone(data.abilities),
        skills: clone(data.skills),

        weapon: clone(data.weapon),
        armour: clone(data.armour),

        maxPosture,
        posture: maxPosture,

        maxStamina,
        stamina: maxStamina,

        wounds: [],

        guarded: false,
        focus: 0,
        opening: false,
        executionWindow: false,

        defeated: false,
        dead: false,

        recoveries: 0
      };
    }

    function buildPlayer() {
      const abilities = baseAbilities();
      const skills = baseSkills();

      applyBonuses(
        abilities,
        PAST_LIVES[creation.pastLife].abilities
      );

      applyBonuses(
        skills,
        PAST_LIVES[creation.pastLife].skills
      );

      applyBonuses(
        abilities,
        FORMATIVE_CHOICES[creation.formative].abilities
      );

      applyBonuses(
        skills,
        FORMATIVE_CHOICES[creation.formative].skills
      );

      const weapon = WEAPONS[creation.weapon];

      skills[weapon.skill] = clamp(
        skills[weapon.skill] + 12,
        0,
        99
      );

      return makeCombatant({
        name: creation.name,
        abilities,
        skills,
        weapon,
        armour: ARMOURS.player
      });
    }

    function buildEnemy() {
      return makeCombatant(ENEMY_DATA);
    }

    function woundPenalty(combatant) {
      let penalty = 0;

      combatant.wounds.forEach(wound => {
        if (wound.severity === "輕傷") {
          penalty += 1;
        }

        if (wound.severity === "重傷") {
          penalty += 3;
        }

        if (wound.severity === "致命傷") {
          penalty += 6;
        }
      });

      if (
        combatant.stamina <=
        combatant.maxStamina * 0.25
      ) {
        penalty += 2;
      } else if (
        combatant.stamina <=
        combatant.maxStamina * 0.5
      ) {
        penalty += 1;
      }

      return penalty;
    }

    function defenceOf(combatant, extra = 0) {
      const agility =
        abilityModifier(combatant.abilities.agility);

      const dueling =
        skillModifier(combatant.skills.dueling);

      const guardBonus =
        combatant.guarded ? 3 : 0;

      return (
        11 +
        agility +
        dueling +
        guardBonus +
        extra -
        woundPenalty(combatant)
      );
    }

    function rollD20(
      advantage = false,
      disadvantage = false
    ) {
      const first = die(20);

      if (advantage && !disadvantage) {
        const second = die(20);

        return {
          value: Math.max(first, second),
          dice: [first, second],
          mode: "優勢"
        };
      }

      if (disadvantage && !advantage) {
        const second = die(20);

        return {
          value: Math.min(first, second),
          dice: [first, second],
          mode: "劣勢"
        };
      }

      return {
        value: first,
        dice: [first],
        mode: "正常"
      };
    }

    function attackRoll(
      attacker,
      defender,
      options = {}
    ) {
      const weapon = attacker.weapon;

      const ability =
        abilityModifier(
          attacker.abilities[weapon.ability]
        );

      const skill =
        skillModifier(
          attacker.skills[weapon.skill]
        );

      const injury = woundPenalty(attacker);

      const situation =
        (options.situation || 0) +
        attacker.focus;

      const advantage =
        Boolean(
          options.advantage ||
          attacker.opening
        );

      const disadvantage =
        Boolean(options.disadvantage);

      const roll = rollD20(
        advantage,
        disadvantage
      );

      const total =
        roll.value +
        ability +
        skill +
        weapon.accuracy +
        situation -
        injury;

      const defence =
        defenceOf(
          defender,
          options.defenceModifier || 0
        );

      const naturalOne = roll.value === 1;
      const naturalTwenty = roll.value === 20;

      const success =
        !naturalOne &&
        (
          naturalTwenty ||
          total >= defence
        );

      return {
        roll,
        ability,
        skill,
        weaponBonus: weapon.accuracy,
        situation,
        injury,
        total,
        defence,
        success,
        margin: total - defence,
        critical: naturalTwenty,
        disaster: naturalOne
      };
    }

    function attackLine(label, result) {
      const diceText =
        result.roll.dice.join("、");

      return (
        `${label}：${result.roll.mode} d20［${diceText}］ ` +
        `${signed(result.ability)} 能力 ` +
        `${signed(result.skill)} 武技 ` +
        `${signed(result.weaponBonus)} 兵器 ` +
        `${signed(result.situation)} 戰況 ` +
        `${signed(-result.injury)} 傷勢 ` +
        `= ${result.total}，對抗防守 ${result.defence}`
      );
    }

    function resultLine(result) {
      if (result.disaster) {
        return "結果：大失敗";
      }

      if (!result.success) {
        return "結果：失敗";
      }

      if (result.critical) {
        return "結果：大成功";
      }

      if (result.margin >= 5) {
        return "結果：強成功";
      }

      return "結果：成功";
    }

    function effectRoll(sides, critical = false) {
      const dice = [die(sides)];

      if (critical) {
        dice.push(die(sides));
      }

      return {
        dice,
        total: dice.reduce(
          (sum, value) => sum + value,
          0
        )
      };
    }

    function chooseWoundName(severity) {
      const names = {
        輕傷: [
          "手臂割傷",
          "肩背裂傷",
          "額角破裂",
          "肋側刀傷",
          "大腿擦創"
        ],

        重傷: [
          "大腿深創",
          "持兵手重傷",
          "肋骨重創",
          "肩部深裂",
          "腹側重創"
        ],

        致命傷: [
          "胸腹致命創傷",
          "頸側致命刀傷",
          "大量失血",
          "腹部致命傷"
        ]
      };

      const choices = names[severity];

      return choices[die(choices.length) - 1];
    }

    function addWound(target, severity) {
      const wound = {
        severity,
        name: chooseWoundName(severity)
      };

      target.wounds.push(wound);

      if (severity === "重傷") {
        target.defeated = true;
      }

      if (severity === "致命傷") {
        target.defeated = true;
        target.dead = true;
      }

      const minorCount =
        target.wounds.filter(
          item => item.severity === "輕傷"
        ).length;

      if (minorCount >= 2) {
        target.defeated = true;
      }

      return wound;
    }

    function resolveImpact(
      attacker,
      defender,
      attackResult,
      options = {}
    ) {
      const critical = attackResult.critical;

      const effect = effectRoll(
        options.damageSides ||
        attacker.weapon.damageSides,
        critical
      );

      const might =
        Math.max(
          0,
          abilityModifier(attacker.abilities.might)
        );

      const styleBonus =
        options.styleBonus || 0;

      const marginBonus =
        Math.max(
          0,
          Math.floor(attackResult.margin / 4)
        );

      const raw =
        effect.total +
        might +
        styleBonus +
        marginBonus;

      const mitigation =
        Math.max(
          0,
          defender.armour.mitigation -
          (attacker.weapon.armourPiercing || 0)
        );

      const impact =
        Math.max(1, raw - mitigation);

      const postureBefore = defender.posture;

      defender.posture =
        Math.max(
          0,
          defender.posture - impact
        );

      const postureRatioBefore =
        postureBefore / defender.maxPosture;

      let vulnerability = 0;

      if (postureRatioBefore <= 0) {
        vulnerability = 7;
      } else if (postureRatioBefore <= 0.3) {
        vulnerability = 5;
      } else if (postureRatioBefore <= 0.6) {
        vulnerability = 2;
      }

      const woundEligible =
        critical ||
        defender.posture <= 0 ||
        (
          defender.posture <=
          defender.maxPosture * 0.6 &&
          (
            attackResult.margin >= 3 ||
            impact >= 7
          )
        );

      let woundCheck = null;
      let wound = null;

      if (woundEligible) {
        const woundDie = die(20);

        const endurance =
          abilityModifier(
            defender.abilities.endurance
          );

        const armourProtection =
          defender.armour.woundProtection || 0;

        const woundTotal =
          woundDie +
          Math.floor(impact / 2) +
          vulnerability +
          Math.max(
            0,
            Math.floor(attackResult.margin / 5)
          ) -
          endurance -
          armourProtection;

        woundCheck = {
          die: woundDie,
          impact: Math.floor(impact / 2),
          vulnerability,
          endurance,
          armourProtection,
          total: woundTotal
        };

        let severity = null;

        if (woundTotal >= 25) {
          severity = "致命傷";
        } else if (woundTotal >= 20) {
          severity = "重傷";
        } else if (woundTotal >= 14) {
          severity = "輕傷";
        }

        if (
          defender.posture <= 0 &&
          !severity
        ) {
          severity = "輕傷";
        }

        if (severity) {
          wound = addWound(
            defender,
            severity
          );
        }
      }

      if (
        defender.posture <= 0 &&
        !defender.defeated
      ) {
        attacker.executionWindow = true;
      }

      return {
        effect,
        raw,
        mitigation,
        impact,
        postureBefore,
        woundCheck,
        wound
      };
    }

    function impactLines(label, impact) {
      const lines = [];

      lines.push(
        `${label}衝擊：` +
        `［${impact.effect.dice.join("、")}］` +
        `，總衝擊 ${impact.raw}`
      );

      lines.push(
        `護甲抵消 ${impact.mitigation}；` +
        `造成 ${impact.impact} 點架勢損失`
      );

      if (impact.woundCheck) {
        const check = impact.woundCheck;

        lines.push(
          `傷勢判定：d20 ${check.die} ` +
          `${signed(check.impact)} 衝擊 ` +
          `${signed(check.vulnerability)} 破綻 ` +
          `${signed(-check.endurance)} 體魄 ` +
          `${signed(-check.armourProtection)} 護甲 ` +
          `= ${check.total}`
        );
      }

      if (impact.wound) {
        lines.push(
          `造成傷勢：${impact.wound.name}（${impact.wound.severity}）`
        );
      }

      return lines;
    }

    function woundSummary(combatant) {
      if (
        !combatant ||
        combatant.wounds.length === 0
      ) {
        return "無";
      }

      return combatant.wounds
        .map(
          wound =>
            `${wound.name}（${wound.severity}）`
        )
        .join("、");
    }

    function chooseEnemyIntent() {
      const enemy = state.enemy;

      if (
        enemy.posture <=
        enemy.maxPosture * 0.3 &&
        enemy.recoveries < 1
      ) {
        if (random() < 0.6) {
          return "recover";
        }
      }

      if (
        enemy.stamina <=
        enemy.maxStamina * 0.3
      ) {
        return random() < 0.55
          ? "guard"
          : "quick";
      }

      const roll = random();

      if (roll < 0.22) return "quick";
      if (roll < 0.43) return "heavy";
      if (roll < 0.61) return "pressure";
      if (roll < 0.75) return "guard";
      if (roll < 0.87) return "feint";

      return "recover";
    }

    function showNextRound(
      paragraphs = [],
      lines = []
    ) {
      if (checkCombatEnd(paragraphs, lines)) {
        return;
      }

      state.round += 1;
      state.intent = chooseEnemyIntent();

      setScene(
        `山道鬥將・第 ${state.round} 合`,
        paragraphs,
        duelActions(),
        lines
      );
    }

    function clearPlayerPreparation() {
      state.player.focus = 0;
      state.player.opening = false;
    }

    function spendStamina(
      combatant,
      amount
    ) {
      combatant.stamina =
        Math.max(
          0,
          combatant.stamina - amount
        );
    }

    function basicPlayerAttack(
      type,
      paragraphs,
      lines
    ) {
      const player = state.player;
      const enemy = state.enemy;
      const intent = state.intent;

      let situation = 0;
      let styleBonus = 0;
      let staminaCost =
        player.weapon.staminaCost;

      let label = "快攻";
      let interrupt = false;

      if (type === "quick") {
        situation += 2;
        staminaCost = Math.max(
          1,
          staminaCost - 1
        );

        if (intent === "heavy") {
          situation += 3;
        }
      }

      if (type === "heavy") {
        label = "猛擊";
        situation -= 1;
        styleBonus = 4;
        staminaCost += 2;

        if (
          intent === "guard" ||
          intent === "recover"
        ) {
          situation += 4;
          styleBonus += 2;
        }
      }

      spendStamina(
        player,
        staminaCost
      );

      const result = attackRoll(
        player,
        enemy,
        { situation }
      );

      lines.push(
        attackLine(label, result),
        resultLine(result)
      );

      if (!result.success) {
        paragraphs.push(
          result.disaster
            ? "你腳下踩中鬆石，攻勢完全失去重心。韓魁立刻抓住空門。"
            : type === "heavy"
              ? "你全力揮出的猛擊被韓魁避開，沉重兵器一時未能回收。"
              : "韓魁橫刀封住來路，你的快攻未能越過防守。"
        );

        clearPlayerPreparation();

        return {
          interrupted: false,
          enemyBonus:
            result.disaster ? 4 : 0
        };
      }

      const impact = resolveImpact(
        player,
        enemy,
        result,
        {
          styleBonus
        }
      );

      lines.push(
        ...impactLines(label, impact)
      );

      if (impact.wound) {
        paragraphs.push(
          `你的${player.weapon.name}越過韓魁的防守，留下「${impact.wound.name}」。`
        );
      } else if (enemy.posture <= 0) {
        paragraphs.push(
          "韓魁勉強擋住這一擊，架勢卻已完全崩潰。你看見了可以決出生死的空門。"
        );
      } else {
        paragraphs.push(
          type === "heavy"
            ? "沉重一擊逼得韓魁連退數步，刀架明顯散亂。"
            : "你搶在韓魁動作完成前切入，逼佢倉促回刀。"
        );
      }

      if (
        type === "quick" &&
        intent === "heavy" &&
        (
          result.margin >= 3 ||
          result.critical
        )
      ) {
        interrupt = true;

        paragraphs.push(
          "韓魁的重斬尚未發力，已被你的快攻打斷。"
        );
      }

      if (
        type === "heavy" &&
        intent === "recover" &&
        result.success
      ) {
        interrupt = true;

        paragraphs.push(
          "韓魁未能完成重整，只能狼狽擋下猛擊。"
        );
      }

      clearPlayerPreparation();

      return {
        interrupted: interrupt,
        enemyBonus: 0
      };
    }

    function playerQuickAttack() {
      const paragraphs = [];
      const lines = [];

      const outcome = basicPlayerAttack(
        "quick",
        paragraphs,
        lines
      );

      if (checkCombatEnd(paragraphs, lines)) {
        return;
      }

      if (outcome.interrupted) {
        showNextRound(paragraphs, lines);
        return;
      }

      resolveEnemyIntent(
        paragraphs,
        lines,
        outcome.enemyBonus
      );
    }

    function playerHeavyAttack() {
      const paragraphs = [];
      const lines = [];

      const outcome = basicPlayerAttack(
        "heavy",
        paragraphs,
        lines
      );

      if (checkCombatEnd(paragraphs, lines)) {
        return;
      }

      if (outcome.interrupted) {
        showNextRound(paragraphs, lines);
        return;
      }

      resolveEnemyIntent(
        paragraphs,
        lines,
        outcome.enemyBonus
      );
    }

    function playerObserve() {
      const player = state.player;
      const enemy = state.enemy;
      const intent = state.intent;

      spendStamina(player, 1);

      const roll = rollD20();

      const perception =
        abilityModifier(
          player.abilities.perception
        );

      const awareness =
        skillModifier(
          player.skills.awareness
        );

      const injury =
        woundPenalty(player);

      const intentBonus =
        intent === "feint" ? 4 : 0;

      const total =
        roll.value +
        perception +
        awareness +
        intentBonus -
        injury;

      const difficulty =
        12 +
        abilityModifier(
          enemy.abilities.perception
        );

      const success =
        roll.value !== 1 &&
        (
          roll.value === 20 ||
          total >= difficulty
        );

      const lines = [
        `觀察判定：d20 ${roll.value} ` +
        `${signed(perception)} 洞察 ` +
        `${signed(awareness)} 戰場感覺 ` +
        `${signed(intentBonus)} 對應意圖 ` +
        `${signed(-injury)} 傷勢 ` +
        `= ${total}，對抗 ${difficulty}`,
        success
          ? "結果：成功"
          : "結果：失敗"
      ];

      const paragraphs = [];

      if (success) {
        player.focus =
          roll.value === 20 ? 4 : 3;

        paragraphs.push(
          "你沒有追逐刀鋒，而是觀察韓魁的肩膀、腰胯與換氣節奏。"
        );

        if (intent === "feint") {
          player.opening = true;

          paragraphs.push(
            "你看穿了韓魁的佯動。佢故意露出的空位沒有騙到你，真正重心反而暴露。"
          );

          showNextRound(
            paragraphs,
            lines
          );

          return;
        }

        paragraphs.push(
          "你已掌握下一次出手的節奏。下一次行動會獲得明顯加成。"
        );
      } else {
        player.focus = 0;

        paragraphs.push(
          "韓魁的腳步與刀鋒不斷改變，你未能看清真正意圖。"
        );
      }

      resolveEnemyIntent(
        paragraphs,
        lines,
        success ? -2 : 0
      );
    }

    function playerFeint() {
      const player = state.player;
      const enemy = state.enemy;
      const intent = state.intent;

      spendStamina(player, 1);

      const roll = rollD20();

      const agility =
        abilityModifier(
          player.abilities.agility
        );

      const dueling =
        skillModifier(
          player.skills.dueling
        );

      const intentBonus =
        intent === "guard" ||
        intent === "recover"
          ? 4
          : 0;

      const injury =
        woundPenalty(player);

      const total =
        roll.value +
        agility +
        dueling +
        player.focus +
        intentBonus -
        injury;

      const difficulty =
        12 +
        abilityModifier(
          enemy.abilities.perception
        ) +
        skillModifier(
          enemy.skills.dueling
        );

      const success =
        roll.value !== 1 &&
        (
          roll.value === 20 ||
          total >= difficulty
        );

      const margin =
        total - difficulty;

      const lines = [
        `佯攻判定：d20 ${roll.value} ` +
        `${signed(agility)} 身法 ` +
        `${signed(dueling)} 單挑 ` +
        `${signed(player.focus)} 掌握節奏 ` +
        `${signed(intentBonus)} 對應意圖 ` +
        `${signed(-injury)} 傷勢 ` +
        `= ${total}，對抗 ${difficulty}`,
        success
          ? margin >= 5
            ? "結果：強成功"
            : "結果：成功"
          : "結果：失敗"
      ];

      const paragraphs = [];

      player.focus = 0;

      if (success) {
        player.opening = true;

        paragraphs.push(
          "你將兵刃送向韓魁肩側，卻在佢回刀前突然變勢。"
        );

        if (
          margin >= 5 ||
          roll.value === 20
        ) {
          player.executionWindow = true;

          paragraphs.push(
            "韓魁整個防守被假動作牽開。你眼前出現了一瞬即逝的致命空門。"
          );
        } else {
          paragraphs.push(
            "韓魁的刀勢被帶離中線。下一次攻擊會獲得優勢。"
          );
        }

        if (
          intent === "guard" ||
          intent === "recover"
        ) {
          paragraphs.push(
            "韓魁原本的防守或重整已被你完全打亂。"
          );

          showNextRound(
            paragraphs,
            lines
          );

          return;
        }
      } else {
        player.opening = false;

        paragraphs.push(
          "韓魁沒有追著假動作移動，只以刀尖守住中線。"
        );
      }

      resolveEnemyIntent(
        paragraphs,
        lines,
        success ? -1 : 0
      );
    }

    function playerPressure() {
      const player = state.player;
      const enemy = state.enemy;
      const intent = state.intent;

      spendStamina(player, 2);

      let situation = 1;

      if (intent === "recover") {
        situation += 4;
      }

      const result = attackRoll(
        player,
        enemy,
        { situation }
      );

      const lines = [
        attackLine("迫攻", result),
        resultLine(result)
      ];

      const paragraphs = [];

      if (result.success) {
        const effect = effectRoll(
          8,
          result.critical
        );

        const might =
          Math.max(
            0,
            abilityModifier(
              player.abilities.might
            )
          );

        const pressure =
          effect.total +
          might +
          Math.max(
            0,
            Math.floor(result.margin / 4)
          );

        enemy.posture =
          Math.max(
            0,
            enemy.posture - pressure
          );

        enemy.stamina =
          Math.max(
            0,
            enemy.stamina -
            (result.critical ? 4 : 2)
          );

        lines.push(
          `迫攻效果：［${effect.dice.join("、")}］ ` +
          `${signed(might)} 勁力 ` +
          `= ${pressure} 點架勢損失`
        );

        paragraphs.push(
          "你不急於斬入身體，而係連續迫使韓魁格擋、退步與重新舉刀。"
        );

        if (enemy.posture <= 0) {
          player.executionWindow = true;

          paragraphs.push(
            "韓魁的刀架被完全壓開，致命空門已經出現。"
          );
        }

        clearPlayerPreparation();

        if (checkCombatEnd(paragraphs, lines)) {
          return;
        }

        if (intent === "recover") {
          paragraphs.push(
            "韓魁未能完成重整，反而被你進一步壓垮架勢。"
          );

          showNextRound(
            paragraphs,
            lines
          );

          return;
        }
      } else {
        paragraphs.push(
          result.disaster
            ? "你壓得太急，兵刃撞向山壁，反而失去先機。"
            : "韓魁以刀背撞開攻勢，沒有讓你形成連續壓力。"
        );

        clearPlayerPreparation();
      }

      resolveEnemyIntent(
        paragraphs,
        lines,
        result.disaster ? 3 : 0
      );
    }

    function playerCounter() {
      const player = state.player;

      spendStamina(player, 1);
      player.guarded = true;

      const paragraphs = [
        "你收緊架勢，沒有急於出手，準備在韓魁攻入時反擊。"
      ];

      const lines = [];

      const enemyOutcome =
        resolveEnemyIntent(
          paragraphs,
          lines,
          0,
          true
        );

      if (!enemyOutcome) {
        return;
      }

      if (
        enemyOutcome.attacked &&
        !enemyOutcome.hit &&
        !state.enemy.defeated
      ) {
        const result = attackRoll(
          state.player,
          state.enemy,
          {
            situation:
              state.intent === "quick" ||
              state.intent === "pressure"
                ? 4
                : 1
          }
        );

        lines.push(
          attackLine("反擊", result),
          resultLine(result)
        );

        if (result.success) {
          const impact = resolveImpact(
            state.player,
            state.enemy,
            result,
            {
              damageSides: 8,
              styleBonus: 2
            }
          );

          lines.push(
            ...impactLines("反擊", impact)
          );

          paragraphs.push(
            impact.wound
              ? `你避開刀鋒後立即切入，造成「${impact.wound.name}」。`
              : "你避過攻勢後立即回擊，韓魁來不及重整刀架。"
          );
        } else {
          paragraphs.push(
            "你成功守住攻勢，但反擊未能越過韓魁的回防。"
          );
        }
      }

      player.guarded = false;

      showNextRound(
        paragraphs,
        lines
      );
    }

    function playerRecover() {
      const player = state.player;

      const recoveryDie = die(6);

      const endurance =
        Math.max(
          0,
          abilityModifier(
            player.abilities.endurance
          )
        );

      const recovery =
        recoveryDie +
        endurance +
        2;

      const oldPosture =
        player.posture;

      player.posture =
        Math.min(
          player.maxPosture,
          player.posture + recovery
        );

      player.stamina =
        Math.min(
          player.maxStamina,
          player.stamina + 3
        );

      player.guarded = true;

      const lines = [
        `重整架勢：d6 ${recoveryDie} ` +
        `${signed(endurance)} 體魄 ` +
        `+2 = ${recovery}`,
        `實際恢復 ${player.posture - oldPosture} 點架勢及 3 點體力`
      ];

      const paragraphs = [
        "你退開半步調整呼吸，重新將兵刃收回中線。"
      ];

      const enemyBonus =
        state.intent === "heavy" ||
        state.intent === "pressure"
          ? 3
          : 0;

      resolveEnemyIntent(
        paragraphs,
        lines,
        enemyBonus
      );
    }

    function playerWithdraw() {
      const player = state.player;
      const enemy = state.enemy;

      spendStamina(player, 1);

      const roll = rollD20();

      const agility =
        abilityModifier(
          player.abilities.agility
        );

      const dueling =
        skillModifier(
          player.skills.dueling
        );

      const injury =
        woundPenalty(player);

      const total =
        roll.value +
        agility +
        dueling -
        injury;

      const difficulty =
        13 +
        Math.max(
          0,
          abilityModifier(
            enemy.abilities.agility
          )
        );

      const success =
        roll.value !== 1 &&
        (
          roll.value === 20 ||
          total >= difficulty
        );

      const lines = [
        `抽身判定：d20 ${roll.value} ` +
        `${signed(agility)} 身法 ` +
        `${signed(dueling)} 單挑 ` +
        `${signed(-injury)} 傷勢 ` +
        `= ${total}，對抗 ${difficulty}`,
        success
          ? "結果：成功"
          : "結果：失敗"
      ];

      if (success) {
        state.phase = "ending";

        setScene(
          "退回車陣",
          [
            "你用兵刃封住韓魁的追擊路線，逐步退回糧車與鄉勇之間。",
            "單挑未分生死。韓魁仍然活著，山賊亦未退去。",
            "之後版本會由此進入多人混戰。目前試玩暫時在此結束。",
            `你帶著「${woundSummary(player)}」退出單挑。`
          ],
          endingActions(),
          lines
        );

        return;
      }

      const paragraphs = [
        "你試圖拉開距離，但韓魁一直用刀鋒封住退路。",
        "韓魁趁你轉身時逼近。"
      ];

      resolveEnemyIntent(
        paragraphs,
        lines,
        roll.value === 1 ? 4 : 2
      );
    }

    function playerExecute() {
      const player = state.player;
      const enemy = state.enemy;

      spendStamina(player, 3);

      const roll = rollD20(
        player.opening ||
        enemy.posture <= 0
      );

      const ability =
        abilityModifier(
          player.abilities[
            player.weapon.ability
          ]
        );

      const skill =
        skillModifier(
          player.skills[
            player.weapon.skill
          ]
        );

      const injury =
        woundPenalty(player);

      const openingBonus =
        player.executionWindow ? 3 : 0;

      const total =
        roll.value +
        ability +
        skill +
        player.weapon.accuracy +
        openingBonus -
        injury;

      const difficulty =
        13 +
        Math.max(
          0,
          abilityModifier(
            enemy.abilities.agility
          )
        ) +
        Math.max(
          0,
          skillModifier(
            enemy.skills.dueling
          )
        );

      const success =
        roll.value !== 1 &&
        (
          roll.value === 20 ||
          total >= difficulty
        );

      const lines = [
        `決死斬擊：${roll.mode} d20［${roll.dice.join("、")}］ ` +
        `${signed(ability)} 能力 ` +
        `${signed(skill)} 武技 ` +
        `${signed(player.weapon.accuracy)} 兵器 ` +
        `${signed(openingBonus)} 致命空門 ` +
        `${signed(-injury)} 傷勢 ` +
        `= ${total}，對抗 ${difficulty}`
      ];

      player.executionWindow = false;
      player.opening = false;
      player.focus = 0;

      if (success) {
        enemy.defeated = true;
        enemy.dead = true;

        lines.push(
          roll.value === 20
            ? "結果：大成功・乾淨利落的致命一擊"
            : "結果：成功・造成致命傷"
        );

        checkCombatEnd(
          [
            "你踏入韓魁已經崩潰的防線，沒有再留退路。",
            roll.value === 20
              ? `你的${player.weapon.name}從山刀與身體之間的唯一空隙切入。韓魁甚至來不及回頭，便重重倒在山路中央。`
              : `韓魁勉強舉刀，你已撞入近身。${player.weapon.name}破開防守，致命一擊令佢再也無法站立。`,
            "黑石寨眾賊目睹頭領敗亡，叫喊聲瞬間變成驚亂。"
          ],
          lines
        );

        return;
      }

      lines.push(
        roll.value === 1
          ? "結果：大失敗"
          : "結果：失敗"
      );

      const paragraphs = [
        "你決意在這一擊分出生死。",
        roll.value === 1
          ? "偏在踏入斬殺線時，你的腳步失去平衡。致命一擊擦身而過，胸腹完全暴露。"
          : "韓魁在最後一瞬橫刀架住攻勢。你已經踏得太深，無法立即退出。",
        "失去的斬殺機會不會再次停在原地等待。韓魁立即拼死反擊。"
      ];

      enemyAttack(
        "heavy",
        paragraphs,
        lines,
        5
      );

      if (checkCombatEnd(paragraphs, lines)) {
        return;
      }

      showNextRound(
        paragraphs,
        lines
      );
    }

    function enemyAttack(
      type,
      paragraphs,
      lines,
      bonus = 0
    ) {
      const enemy = state.enemy;
      const player = state.player;

      let situation = bonus;
      let styleBonus = 0;
      let staminaCost =
        enemy.weapon.staminaCost;

      let label = "韓魁快攻";

      if (type === "quick") {
        situation += 2;
        staminaCost =
          Math.max(1, staminaCost - 1);
      }

      if (type === "heavy") {
        label = "韓魁猛攻";
        situation -= 1;
        styleBonus = 4;
        staminaCost += 2;
      }

      if (type === "pressure") {
        label = "韓魁迫攻";
        situation += 1;
        staminaCost += 1;
      }

      spendStamina(
        enemy,
        staminaCost
      );

      const result = attackRoll(
        enemy,
        player,
        { situation }
      );

      lines.push(
        attackLine(label, result),
        resultLine(result)
      );

      if (!result.success) {
        paragraphs.push(
          result.disaster
            ? "韓魁用力過猛，山刀撞向旁邊山壁。刀勢彈開，身前露出巨大空門。"
            : player.guarded
              ? "你穩穩守住中線，將韓魁的刀勢引到一旁。"
              : "韓魁的山刀從你身前掃過，只割開一角衣袖。"
        );

        if (result.disaster) {
          player.executionWindow = true;
          player.opening = true;
        }

        return {
          attacked: true,
          hit: false
        };
      }

      if (type === "pressure") {
        const effect = effectRoll(
          8,
          result.critical
        );

        const might =
          Math.max(
            0,
            abilityModifier(
              enemy.abilities.might
            )
          );

        const pressure =
          effect.total +
          might +
          Math.max(
            0,
            Math.floor(result.margin / 4)
          );

        player.posture =
          Math.max(
            0,
            player.posture - pressure
          );

        player.stamina =
          Math.max(
            0,
            player.stamina -
            (result.critical ? 4 : 2)
          );

        lines.push(
          `韓魁迫攻效果：［${effect.dice.join("、")}］ ` +
          `${signed(might)} 勁力 ` +
          `= ${pressure} 點架勢損失`
        );

        paragraphs.push(
          "韓魁連續壓刀逼近，迫使你不斷格擋退步。"
        );

        if (player.posture <= 0) {
          enemy.executionWindow = true;

          paragraphs.push(
            "你的架勢已經崩潰，韓魁開始尋找致命一擊。"
          );
        }

        return {
          attacked: true,
          hit: true
        };
      }

      const impact = resolveImpact(
        enemy,
        player,
        result,
        {
          styleBonus
        }
      );

      lines.push(
        ...impactLines(label, impact)
      );

      if (impact.wound) {
        paragraphs.push(
          `韓魁的山刀越過防守，造成「${impact.wound.name}」。`
        );
      } else if (player.posture <= 0) {
        paragraphs.push(
          "你勉強擋下山刀，雙臂卻已經發麻，架勢完全崩潰。"
        );
      } else {
        paragraphs.push(
          type === "heavy"
            ? "沉重山刀正面壓下，你被逼得連退數步。"
            : "你避開要害，但韓魁的攻勢仍然削弱了架勢。"
        );
      }

      return {
        attacked: true,
        hit: true
      };
    }

    function resolveEnemyIntent(
      paragraphs,
      lines,
      bonus = 0,
      returnOnly = false
    ) {
      if (checkCombatEnd(paragraphs, lines)) {
        return null;
      }

      const enemy = state.enemy;
      const player = state.player;
      const intent = state.intent;

      enemy.guarded = false;

      let outcome = {
        attacked: false,
        hit: false
      };

      if (intent === "quick") {
        outcome = enemyAttack(
          "quick",
          paragraphs,
          lines,
          bonus
        );
      }

      if (intent === "heavy") {
        outcome = enemyAttack(
          "heavy",
          paragraphs,
          lines,
          bonus
        );
      }

      if (intent === "pressure") {
        outcome = enemyAttack(
          "pressure",
          paragraphs,
          lines,
          bonus
        );
      }

      if (intent === "guard") {
        const recovery = die(4) + 1;

        const oldPosture =
          enemy.posture;

        enemy.posture =
          Math.min(
            enemy.maxPosture,
            enemy.posture + recovery
          );

        enemy.guarded = true;

        lines.push(
          `韓魁固守：恢復 ${enemy.posture - oldPosture} 點架勢，防守提高`
        );

        paragraphs.push(
          "韓魁收刀護住胸腹，重新站穩腳步。"
        );
      }

      if (intent === "recover") {
        const recovery =
          die(6) +
          Math.max(
            0,
            abilityModifier(
              enemy.abilities.endurance
            )
          );

        const oldPosture =
          enemy.posture;

        enemy.posture =
          Math.min(
            enemy.maxPosture,
            enemy.posture + recovery
          );

        enemy.stamina =
          Math.min(
            enemy.maxStamina,
            enemy.stamina + 3
          );

        enemy.recoveries += 1;

        lines.push(
          `韓魁重整：恢復 ${enemy.posture - oldPosture} 點架勢及 3 點體力`
        );

        paragraphs.push(
          "韓魁退後換氣，重新整理刀架。"
        );
      }

      if (intent === "feint") {
        const roll = rollD20();

        const agility =
          abilityModifier(
            enemy.abilities.agility
          );

        const dueling =
          skillModifier(
            enemy.skills.dueling
          );

        const total =
          roll.value +
          agility +
          dueling;

        const difficulty =
          12 +
          abilityModifier(
            player.abilities.perception
          );

        const success =
          roll.value !== 1 &&
          (
            roll.value === 20 ||
            total >= difficulty
          );

        lines.push(
          `韓魁佯動：d20 ${roll.value} ` +
          `${signed(agility)} 身法 ` +
          `${signed(dueling)} 單挑 ` +
          `= ${total}，對抗 ${difficulty}`
        );

        if (success) {
          paragraphs.push(
            "韓魁以肩膀帶動假斬，等你防守偏移後突然從另一側逼入。"
          );

          outcome = enemyAttack(
            "quick",
            paragraphs,
            lines,
            bonus + 3
          );
        } else {
          paragraphs.push(
            "你沒有被韓魁的假動作完全騙開，佢只能放棄後續攻勢。"
          );

          outcome = {
            attacked: true,
            hit: false
          };
        }
      }

      player.guarded = false;

      if (returnOnly) {
        return outcome;
      }

      if (checkCombatEnd(paragraphs, lines)) {
        return outcome;
      }

      showNextRound(
        paragraphs,
        lines
      );

      return outcome;
    }

    function checkCombatEnd(
      paragraphs,
      lines
    ) {
      if (!state || state.phase !== "duel") {
        return false;
      }

      const player = state.player;
      const enemy = state.enemy;

      if (enemy.defeated) {
        state.phase = "ending";

        setScene(
          enemy.dead
            ? "斬將破賊"
            : "韓魁倒地",
          [
            ...paragraphs,
            enemy.dead
              ? "韓魁受到致命傷，再也無法站起。"
              : "韓魁傷勢太重，兵器脫手落地，再也無法繼續戰鬥。",
            "山賊眼見頭領敗亡，原本的叫陣聲迅速變成混亂。有人逃入林中，亦有人拋下兵器。",
            `這場 duel 在第 ${state.round} 合結束。`,
            `你仍有 ${player.posture} 點架勢及 ${player.stamina} 點體力。`,
            `你留下的傷勢是：${woundSummary(player)}。`
          ],
          endingActions(),
          lines
        );

        return true;
      }

      if (player.defeated) {
        state.phase = "ending";

        setScene(
          player.dead
            ? "命斷黑松嶺"
            : "重傷倒地",
          [
            ...paragraphs,
            player.dead
              ? "你再也無法握住兵器。山道上的聲音逐漸遠去。"
              : "你失去平衡倒在山道。意志仍然清醒，身體卻已經無法繼續戰鬥。",
            player.dead
              ? "你曾跨越千多年重新出生，卻仍然只是一個會流血、會死亡的人。"
              : "正式版本中，你可能被俘、獲救，或者目睹糧隊潰敗。",
            `這場 duel 在第 ${state.round} 合結束。`,
            `傷勢：${woundSummary(player)}。`
          ],
          endingActions(),
          lines
        );

        return true;
      }

      if (state.round >= 12) {
        state.phase = "ending";

        setScene(
          "兩敗俱疲",
          [
            ...paragraphs,
            "十二合激戰過後，雙方呼吸散亂，山道兩旁的人群亦開始失去耐性。",
            "韓魁退回賊眾之前，你亦被鄉勇接回車陣。這場單挑未能分出生死。",
            "超過十二合代表戰鬥節奏仍然可能過慢；請將今次結果視為平衡測試資料。",
            `你的傷勢：${woundSummary(player)}。`,
            `韓魁的傷勢：${woundSummary(enemy)}。`
          ],
          endingActions(),
          lines
        );

        return true;
      }

      return false;
    }

    function duelActions() {
      if (
        !state ||
        state.phase !== "duel"
      ) {
        return [];
      }

      const player = state.player;

      const actions = [];

      if (
        player.executionWindow &&
        !state.enemy.defeated
      ) {
        actions.push({
          label: "決死斬擊",
          note:
            "致命空門已經出現。成功可立即擊殺韓魁；失敗會遭受拼死反擊。",
          className: "execution",
          handler: playerExecute
        });
      }

      actions.push(
        {
          label: "快攻",
          note:
            "命中較穩、消耗較低；可以打斷正在準備的猛攻。",
          handler: playerQuickAttack
        },

        {
          label: "猛擊",
          note:
            "衝擊強大；特別適合對付固守或重整中的敵人。",
          className: "danger",
          disabled: player.stamina < 4,
          handler: playerHeavyAttack
        },

        {
          label: "迫攻",
          note:
            "快速削減敵人架勢與體力，並可以打斷重整。",
          handler: playerPressure
        },

        {
          label: "防守反擊",
          note:
            "提高防守；對快攻及迫攻較有效，避開後會立即反擊。",
          className: "safe",
          handler: playerCounter
        },

        {
          label: "佯攻",
          note:
            "破解固守與重整；強成功可以直接製造斬殺機會。",
          handler: playerFeint
        },

        {
          label: "觀察",
          note:
            "看穿佯動並掌握下一次行動節奏。",
          className: "info",
          handler: playerObserve
        },

        {
          label: "重整架勢",
          note:
            "恢復架勢與體力，但容易被猛攻或迫攻壓制。",
          className: "safe",
          handler: playerRecover
        },

        {
          label: "抽身後退",
          note:
            "嘗試離開單挑，返回糧車陣線。",
          className: "safe",
          handler: playerWithdraw
        }
      );

      return actions;
    }

    function setScene(
      heading,
      paragraphs,
      actions = [],
      lines = []
    ) {
      document.getElementById(
        "storyHeading"
      ).textContent = heading;

      document.getElementById(
        "storyText"
      ).innerHTML = paragraphs
        .map(paragraph => {
          const className =
            paragraph.startsWith("『")
              ? "speech"
              : "";

          return (
            `<p class="${className}">` +
            `${escapeHtml(paragraph)}` +
            `</p>`
          );
        })
        .join("");

      document.getElementById(
        "rollArea"
      ).innerHTML =
        lines.length > 0
          ? `
            <div class="roll-box">
              ${lines
                .map(line => {
                  let className = "";

                  if (
                    line.includes("結果：成功") ||
                    line.includes("結果：強成功") ||
                    line.includes("結果：大成功")
                  ) {
                    className = "result-success";
                  }

                  if (
                    line.includes("結果：失敗") ||
                    line.includes("結果：大失敗")
                  ) {
                    className = "result-failure";
                  }

                  return (
                    `<div class="roll-line ${className}">` +
                    `${escapeHtml(line)}` +
                    `</div>`
                  );
                })
                .join("")}
            </div>
          `
          : "";

      renderActions(actions);
      renderAll();
    }

    function renderActions(actions) {
      const container =
        document.getElementById("actions");

      container.innerHTML = "";
      buttonsLocked = false;

      actions.forEach(action => {
        const button =
          document.createElement("button");

        button.type = "button";

        button.className =
          `action-button ${action.className || ""}`;

        button.disabled =
          Boolean(action.disabled);

        button.innerHTML =
          `${escapeHtml(action.label)}` +
          (
            action.note
              ? `<small>${escapeHtml(action.note)}</small>`
              : ""
          );

        button.addEventListener(
          "click",
          () => {
            if (
              buttonsLocked ||
              button.disabled
            ) {
              return;
            }

            buttonsLocked = true;

            container
              .querySelectorAll("button")
              .forEach(item => {
                item.disabled = true;
              });

            action.handler();
          }
        );

        container.appendChild(button);
      });
    }

    function renderAll() {
      renderPlayer();
      renderEnemy();
      renderIntent();
      renderExecution();
    }

    function renderPlayer() {
      const player =
        state ? state.player : null;

      document.getElementById(
        "playerName"
      ).textContent =
        player
          ? player.name
          : creation.name || "未題名";

      document.getElementById(
        "playerAge"
      ).textContent =
        state
          ? "十八歲・光和六年"
          : "尚未轉生";

      document.getElementById(
        "pastLifeText"
      ).textContent =
        creation.pastLife
          ? PAST_LIVES[
              creation.pastLife
            ].name
          : "尚未選定";

      document.getElementById(
        "formativeText"
      ).textContent =
        creation.formative
          ? FORMATIVE_CHOICES[
              creation.formative
            ].name
          : "尚未選定";

      document.getElementById(
        "weaponText"
      ).textContent =
        player
          ? `${player.weapon.name}・${player.armour.name}`
          : creation.weapon
            ? WEAPONS[
                creation.weapon
              ].name
            : "尚未持兵";

      if (!player) {
        document.getElementById(
          "postureText"
        ).textContent = "—";

        document.getElementById(
          "staminaText"
        ).textContent = "—";

        document.getElementById(
          "postureFill"
        ).style.width = "0%";

        document.getElementById(
          "staminaFill"
        ).style.width = "0%";

        document.getElementById(
          "woundText"
        ).textContent = "無";

        document.getElementById(
          "abilities"
        ).innerHTML = "";

        document.getElementById(
          "statusText"
        ).textContent = "命書尚未展開";

        return;
      }

      document.getElementById(
        "postureText"
      ).textContent =
        `${player.posture} / ${player.maxPosture}`;

      document.getElementById(
        "staminaText"
      ).textContent =
        `${player.stamina} / ${player.maxStamina}`;

      document.getElementById(
        "postureFill"
      ).style.width =
        `${clamp(
          player.posture /
          player.maxPosture *
          100,
          0,
          100
        )}%`;

      document.getElementById(
        "staminaFill"
      ).style.width =
        `${clamp(
          player.stamina /
          player.maxStamina *
          100,
          0,
          100
        )}%`;

      document.getElementById(
        "woundText"
      ).textContent =
        woundSummary(player);

      document.getElementById(
        "abilities"
      ).innerHTML =
        Object.entries(ABILITY_NAMES)
          .map(([key, label]) => {
            return `
              <div class="ability">
                <span>${escapeHtml(label)}</span>
                <span>${player.abilities[key]}</span>
              </div>
            `;
          })
          .join("");

      let status = "正與韓魁交鋒";

      if (player.defeated) {
        status = player.dead
          ? "命斷黑松嶺"
          : "已失去戰鬥能力";
      } else if (player.executionWindow) {
        status = "致命空門已經出現";
      } else if (player.posture <= 0) {
        status = "架勢崩潰，下一擊極度危險";
      } else if (
        player.stamina <=
        player.maxStamina * 0.25
      ) {
        status = "體力將盡，動作開始變慢";
      } else if (player.opening) {
        status = "已取得攻擊優勢";
      } else if (player.focus > 0) {
        status = "已掌握韓魁的節奏";
      }

      document.getElementById(
        "statusText"
      ).textContent = status;
    }

    function renderEnemy() {
      const container =
        document.getElementById(
          "enemyArea"
        );

      if (
        !state ||
        !state.enemy ||
        state.phase !== "duel"
      ) {
        container.innerHTML = "";
        return;
      }

      const enemy = state.enemy;

      const posturePercent =
        clamp(
          enemy.posture /
          enemy.maxPosture *
          100,
          0,
          100
        );

      const staminaPercent =
        clamp(
          enemy.stamina /
          enemy.maxStamina *
          100,
          0,
          100
        );

      const wounds =
        enemy.wounds.length > 0
          ? `
            <ul class="wound-list">
              ${enemy.wounds
                .map(
                  wound =>
                    `<li>${escapeHtml(wound.name)}（${escapeHtml(wound.severity)}）</li>`
                )
                .join("")}
            </ul>
          `
          : `<div class="small-text">暫無明顯傷勢</div>`;

      container.innerHTML = `
        <div class="enemy-card">
          <div class="enemy-header">
            <strong>${escapeHtml(enemy.name)}</strong>
            <span>防守 ${defenceOf(enemy)}</span>
          </div>

          <div class="meter">
            <div class="meter-header">
              <span>敵方架勢</span>
              <span>${enemy.posture} / ${enemy.maxPosture}</span>
            </div>

            <div class="meter-track">
              <div
                class="meter-fill enemy-posture-fill"
                style="width:${posturePercent}%"
              ></div>
            </div>
          </div>

          <div class="meter">
            <div class="meter-header">
              <span>敵方體力</span>
              <span>${enemy.stamina} / ${enemy.maxStamina}</span>
            </div>

            <div class="meter-track">
              <div
                class="meter-fill enemy-stamina-fill"
                style="width:${staminaPercent}%"
              ></div>
            </div>
          </div>

          <div class="small-text">
            ${escapeHtml(enemy.weapon.name)}・
            ${escapeHtml(enemy.armour.name)}
          </div>

          ${wounds}
        </div>
      `;
    }

    function renderIntent() {
      const area =
        document.getElementById(
          "intentArea"
        );

      if (
        !state ||
        state.phase !== "duel" ||
        !state.intent
      ) {
        area.innerHTML = "";
        return;
      }

      const intent =
        INTENTS[state.intent];

      area.innerHTML = `
        <div class="intent-box">
          <div class="intent-title">韓魁意圖</div>
          <div class="intent-name">${escapeHtml(intent.name)}</div>
          <div class="small-text">${escapeHtml(intent.description)}</div>
        </div>
      `;
    }

    function renderExecution() {
      const area =
        document.getElementById(
          "executionArea"
        );

      if (
        !state ||
        state.phase !== "duel" ||
        !state.player.executionWindow
      ) {
        area.innerHTML = "";
        return;
      }

      area.innerHTML = `
        <div class="execution-alert">
          <strong>斬殺機會</strong><br>
          韓魁的防線出現致命空門。你可以冒險用一擊決出生死。
        </div>
      `;
    }

    function startCreation() {
      state = null;

      creation = {
        name: "",
        pastLife: null,
        formative: null,
        weapon: null
      };

      document.getElementById(
        "enemyArea"
      ).innerHTML = "";

      document.getElementById(
        "intentArea"
      ).innerHTML = "";

      document.getElementById(
        "executionArea"
      ).innerHTML = "";

      document.getElementById(
        "rollArea"
      ).innerHTML = "";

      document.getElementById(
        "storyHeading"
      ).textContent = "前世已盡";

      document.getElementById(
        "storyText"
      ).innerHTML = `
        <p>你原本生活在另一個時代。</p>

        <p>
          死亡之後，你沒有迎來虛無。
          再次睜眼時，屋頂是煙燻發黑的木樑，
          窗外有人談論漢室、徵斂與太平道。
        </p>

        <p>
          你帶著前世記憶，在東漢末年重新出生。
          但記憶本身不是力量。這具身體仍要重新成長，
          兵器仍會割開血肉，而你記得的歷史亦可能被改寫。
        </p>

        <div class="creation-box">
          <label for="nameInput">今世姓名</label>

          <input
            id="nameInput"
            type="text"
            maxlength="12"
            placeholder="例如：沈越"
            autocomplete="off"
            enterkeyhint="done"
          >
        </div>
      `;

      const actions =
        Object.entries(PAST_LIVES)
          .map(([key, pastLife]) => ({
            label: pastLife.name,
            note: pastLife.description,
            className: "info",
            handler: () =>
              choosePastLife(key)
          }));

      renderActions(actions);
      renderAll();
    }

    function choosePastLife(key) {
      const input =
        document.getElementById(
          "nameInput"
        );

      const name =
        input.value.trim();

      if (!name) {
        alert("請先輸入今世姓名。");
        input.focus();
        buttonsLocked = false;

        document
          .querySelectorAll(
            "#actions button"
          )
          .forEach(button => {
            button.disabled = false;
          });

        return;
      }

      creation.name =
        name.slice(0, 12);

      creation.pastLife = key;

      setScene(
        "兩世記憶",
        [
          `${creation.name}，你在漢末的一戶尋常人家長大。`,
          `前世的你是「${PAST_LIVES[key].name}」。`,
          "你不能向任何人證明自己曾活在千多年後。你只能將記憶藏在心底，等待真正能夠運用它們的一日。",
          "成長期間，哪一段經歷對你影響最大？"
        ],
        Object.entries(
          FORMATIVE_CHOICES
        ).map(([choiceKey, choice]) => ({
          label: choice.name,
          note: choice.description,
          handler: () =>
            chooseFormative(choiceKey)
        }))
      );
    }

    function chooseFormative(key) {
      creation.formative = key;

      setScene(
        "光和六年・大亂前夕",
        [
          `十八歲時，你已因「${FORMATIVE_CHOICES[key].name}」形成自己的本領。`,
          "你記得黃巾之亂將近，但準確日期與細節已經模糊。",
          "附近村落準備押送糧藥穿過黑松嶺。山路近來有盜匪出沒，鄉勇讓你從有限兵械中選一件上陣。"
        ],
        Object.entries(WEAPONS)
          .map(([weaponKey, weapon]) => ({
            label: weapon.name,
            note:
              `${weapon.description} ` +
              `命中 ${signed(weapon.accuracy)}・` +
              `衝擊 1d${weapon.damageSides}`,
            handler: () =>
              chooseWeapon(weaponKey)
          }))
      );
    }

    function chooseWeapon(key) {
      creation.weapon = key;

      startDuel(
        createHiddenSeed()
      );
    }

    function startDuel(seed) {
      seedRng(seed);

      state = {
        phase: "duel",
        seed,
        round: 1,
        player: buildPlayer(),
        enemy: buildEnemy(),
        intent: null
      };

      state.intent =
        chooseEnemyIntent();

      setScene(
        "黑松嶺・山道叫陣",
        [
          "糧隊走入山道深處時，坡上忽然傳來碎石滾動的聲音。",
          "十餘名山賊從林間現身，弓箭與短矛對準糧車。一名虯髯大漢提著缺口山刀走落山道。",
          "『留下糧車，我可以讓其他人走。若有人自認是好漢，便出來與韓魁決個生死！』",
          "你知道歷史上的黃巾大亂即將來臨，卻可能先死在一個史書從未記載的山賊手上。"
        ],
        duelActions()
      );
    }

    function endingActions() {
      return [
        {
          label: "以相同骰局重新挑戰",
          note:
            "角色與骰局不變，可以嘗試不同戰術。",
          className: "safe",
          handler: () =>
            startDuel(state.seed)
        },

        {
          label: "以新骰局再戰",
          note:
            "角色不變，重新產生所有骰局。",
          handler: () =>
            startDuel(
              createHiddenSeed()
            )
        },

        {
          label: "建立新人物",
          className: "danger",
          handler: startCreation
        }
      ];
    }

    startCreation();
  </script>
</body>
</html>
