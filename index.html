<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#17110d">

  <title>逆命錄・第四版丙</title>

  <style>
    :root {
      color-scheme: dark;

      --black: #0d0a08;
      --deep: #17110d;
      --panel: #211812;
      --panel-soft: #2b2018;

      --parchment: #decda6;
      --parchment-bright: #f1e4c4;
      --muted: #a99472;

      --border: #6c5234;
      --border-bright: #9b784c;

      --blood: #8c2924;
      --blood-bright: #bd493d;

      --gold: #c69a4b;
      --green: #72885d;
      --blue: #718496;

      --shadow: rgba(0, 0, 0, 0.52);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--black);
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);

      color: var(--parchment);

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(122, 84, 46, 0.18),
          transparent 34rem
        ),
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.012) 0,
          rgba(255, 255, 255, 0.012) 1px,
          transparent 1px,
          transparent 5px
        ),
        var(--black);

      font-family:
        "Songti TC",
        "Noto Serif TC",
        "PingFang TC",
        "Microsoft JhengHei",
        serif;

      line-height: 1.6;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #app {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 8px;
    }

    .masthead {
      margin-bottom: 8px;
      padding: 13px 10px;

      text-align: center;

      border: 1px solid var(--border);

      background:
        linear-gradient(
          rgba(27, 19, 14, 0.94),
          rgba(18, 13, 10, 0.97)
        ),
        var(--panel);

      box-shadow: 0 8px 24px var(--shadow);
    }

    .masthead h1 {
      margin: 0;

      color: var(--parchment-bright);

      font-size: clamp(1.8rem, 7vw, 2.8rem);
      letter-spacing: 0.2em;
      text-indent: 0.2em;
    }

    .masthead p {
      margin: 3px 0 0;

      color: var(--muted);

      font-size: 0.8rem;
      letter-spacing: 0.1em;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(270px, 325px) minmax(0, 1fr);
      gap: 8px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--border);

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.018),
          transparent 40%
        ),
        var(--panel);

      box-shadow: 0 8px 24px var(--shadow);
    }

    .character-panel {
      position: sticky;
      top: 8px;
      padding: 13px;
    }

    .main-panel {
      min-height: 620px;
      padding: clamp(14px, 4vw, 25px);
    }

    .panel-title {
      margin: 0 0 10px;
      padding-bottom: 7px;

      color: var(--gold);
      border-bottom: 1px solid var(--border);

      font-size: 0.95rem;
      letter-spacing: 0.12em;
    }

    .identity {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;

      margin-bottom: 11px;
    }

    .identity strong {
      color: var(--parchment-bright);
      font-size: 1.25rem;
      overflow-wrap: anywhere;
    }

    .identity span {
      flex: none;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .meter {
      margin-bottom: 10px;
    }

    .meter-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;

      margin-bottom: 4px;
      font-size: 0.84rem;
    }

    .meter-track {
      height: 11px;
      overflow: hidden;

      border: 1px solid #5d4731;
      background: #100c0a;
    }

    .meter-fill {
      height: 100%;
      transition: width 120ms ease;
    }

    .player-posture {
      background: linear-gradient(90deg, #4e6270, #86a2b3);
    }

    .player-stamina {
      background: linear-gradient(90deg, #4c5b3b, #829964);
    }

    .enemy-posture {
      background: linear-gradient(90deg, #632a27, #a8463f);
    }

    .enemy-stamina {
      background: linear-gradient(90deg, #57462e, #a17c47);
    }

    .abilities {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px 11px;

      margin: 11px 0;
    }

    .ability {
      display: flex;
      justify-content: space-between;
      gap: 8px;

      padding-bottom: 2px;

      border-bottom:
        1px dotted rgba(222, 205, 166, 0.2);
    }

    .ability span:last-child {
      color: var(--parchment-bright);
      font-variant-numeric: tabular-nums;
    }

    .info-block {
      margin-top: 10px;
      padding-top: 8px;

      border-top:
        1px solid rgba(108, 82, 52, 0.66);
    }

    .info-label {
      display: block;
      margin-bottom: 3px;

      color: var(--muted);

      font-size: 0.73rem;
      letter-spacing: 0.1em;
    }

    .info-value {
      color: var(--parchment-bright);
      overflow-wrap: anywhere;
    }

    .small-text {
      color: var(--muted);
      font-size: 0.77rem;
    }

    .status-box {
      margin-top: 11px;
      padding: 9px 10px;

      border-left: 3px solid var(--gold);
      background: rgba(0, 0, 0, 0.2);
    }

    .story-heading {
      margin: 0 0 13px;

      color: var(--parchment-bright);

      font-size: clamp(1.3rem, 5vw, 1.9rem);
      line-height: 1.35;
    }

    #storyText p {
      margin: 0 0 11px;
    }

    .speech {
      color: var(--parchment-bright);
      font-weight: 600;
    }

    .tell-box {
      margin: 12px 0;
      padding: 11px 12px;

      border-left: 4px solid var(--blood-bright);
      background: rgba(87, 25, 21, 0.2);
    }

    .tell-title {
      margin-bottom: 4px;

      color: var(--blood-bright);

      font-size: 0.76rem;
      letter-spacing: 0.12em;
    }

    .tell-text {
      color: var(--parchment-bright);
    }

    .initiative-box {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;

      margin: 11px 0;
      padding: 8px 10px;

      border: 1px solid rgba(155, 120, 76, 0.42);
      background: rgba(0, 0, 0, 0.18);

      font-size: 0.79rem;
    }

    .initiative-box span:first-child {
      text-align: left;
    }

    .initiative-box span:last-child {
      text-align: right;
    }

    .initiative-centre {
      color: var(--gold);
      font-weight: 700;
    }

    .execution-alert {
      margin: 12px 0;
      padding: 11px 12px;

      color: #f2c7b7;

      border: 1px solid var(--blood-bright);

      background:
        linear-gradient(
          rgba(113, 30, 25, 0.34),
          rgba(54, 20, 17, 0.45)
        );
    }

    .enemy-card {
      margin: 13px 0;
      padding: 11px;

      border: 1px solid rgba(140, 41, 36, 0.75);
      background: rgba(75, 22, 19, 0.16);
    }

    .enemy-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;

      margin-bottom: 8px;
    }

    .enemy-header strong {
      color: var(--parchment-bright);
    }

    .wound-list {
      margin: 7px 0 0;
      padding-left: 19px;
    }

    .wound-list li {
      margin-bottom: 3px;
      color: #e0b09a;
    }

    .roll-box {
      margin: 13px 0;
      padding: 10px 11px;

      border: 1px solid rgba(155, 120, 76, 0.62);
      background: rgba(8, 6, 5, 0.43);

      color: var(--muted);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;

      font-size: 0.74rem;
      line-height: 1.55;

      overflow-wrap: anywhere;
    }

    .roll-line + .roll-line {
      margin-top: 4px;
    }

    .success-line {
      color: #bdc99f;
    }

    .failure-line {
      color: #e0aa97;
    }

    .actions-title {
      margin: 19px 0 8px;

      color: var(--gold);

      font-size: 0.87rem;
      letter-spacing: 0.11em;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .action-button {
      width: 100%;
      min-height: 57px;
      padding: 11px 12px;

      color: var(--parchment-bright);

      border: 1px solid var(--border-bright);
      border-radius: 0;

      background:
        linear-gradient(
          rgba(71, 51, 36, 0.78),
          rgba(43, 31, 23, 0.92)
        ),
        var(--panel-soft);

      cursor: pointer;
      text-align: left;
      line-height: 1.35;
    }

    .action-button:active:not(:disabled) {
      transform: translateY(1px);
      background: #513825;
    }

    .action-button.danger {
      border-color: var(--blood-bright);
      background: linear-gradient(#692b26, #381b18);
    }

    .action-button.execution {
      border-color: #ed715d;

      background:
        linear-gradient(
          rgba(144, 38, 30, 0.96),
          rgba(65, 18, 15, 0.98)
        );

      box-shadow:
        inset 0 0 0 1px rgba(255, 177, 143, 0.16),
        0 0 14px rgba(140, 41, 36, 0.3);
    }

    .action-button.safe {
      border-color: var(--green);
    }

    .action-button.info {
      border-color: var(--blue);
    }

    .action-button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .action-button small {
      display: block;
      margin-top: 4px;

      color: var(--muted);
      font-size: 0.72rem;
    }

    .creation-box {
      margin: 12px 0;
      padding: 13px;

      border: 1px solid rgba(155, 120, 76, 0.56);
      background: rgba(0, 0, 0, 0.18);
    }

    .creation-box label {
      display: block;
      margin-bottom: 6px;

      color: var(--gold);
    }

    .creation-box input {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;

      color: var(--parchment-bright);

      border: 1px solid var(--border-bright);
      border-radius: 0;
      outline: none;

      background: #120e0b;
    }

    .creation-box input:focus {
      border-color: var(--gold);
    }

    .footer {
      padding: 14px 4px 5px;

      color: #77664f;

      text-align: center;
      font-size: 0.72rem;
    }

    @media (max-width: 760px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .character-panel {
        position: static;
      }

      .main-panel {
        min-height: 500px;
      }

      .mobile-summary {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 11px;
      }
    }

    @media (max-width: 460px) {
      #app {
        padding: 6px;
      }

      .masthead {
        padding: 11px 8px;
      }

      .main-panel {
        padding: 13px 11px;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .action-button {
        min-height: 59px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main id="app">
    <header class="masthead">
      <h1>逆命錄</h1>
      <p>轉生篇・黑松嶺首戰・第四版丙</p>
    </header>

    <div class="layout">
      <aside class="panel character-panel">
        <h2 class="panel-title">人物命簿</h2>

        <div class="identity">
          <strong id="playerName">未題名</strong>
          <span id="playerAge">尚未轉生</span>
        </div>

        <div class="meter">
          <div class="meter-header">
            <span>架勢</span>
            <span id="postureText">—</span>
          </div>

          <div class="meter-track">
            <div
              id="postureFill"
              class="meter-fill player-posture"
            ></div>
          </div>
        </div>

        <div class="meter">
          <div class="meter-header">
            <span>體力</span>
            <span id="staminaText">—</span>
          </div>

          <div class="meter-track">
            <div
              id="staminaFill"
              class="meter-fill player-stamina"
            ></div>
          </div>
        </div>

        <div id="abilities" class="abilities"></div>

        <div class="mobile-summary">
          <div class="info-block">
            <span class="info-label">前世經歷</span>
            <span id="pastLifeText" class="info-value">尚未選定</span>
          </div>

          <div class="info-block">
            <span class="info-label">今世成長</span>
            <span id="formativeText" class="info-value">尚未選定</span>
          </div>

          <div class="info-block">
            <span class="info-label">兵器</span>
            <span id="weaponText" class="info-value">尚未持兵</span>
          </div>

          <div class="info-block">
            <span class="info-label">傷勢</span>
            <span id="woundText" class="info-value">無</span>
          </div>
        </div>

        <div class="status-box">
          <span class="info-label">此刻境況</span>
          <span id="statusText" class="info-value">命書尚未展開</span>
        </div>
      </aside>

      <section class="panel main-panel" aria-live="polite">
        <h2 id="storyHeading" class="story-heading">無字命頁</h2>

        <div id="storyText"></div>
        <div id="tellArea"></div>
        <div id="initiativeArea"></div>
        <div id="executionArea"></div>
        <div id="enemyArea"></div>
        <div id="rollArea"></div>

        <h3 class="actions-title">你要如何做？</h3>
        <div id="actions" class="actions"></div>
      </section>
    </div>

    <footer class="footer">
      敵人動作只會留下線索。真正規律，需要由你喺交鋒中判斷。
    </footer>
  </main>

    };

    let rngState = 1;
    let buttonsLocked = false;

    function clamp(value, minimum, maximum) {
      return Math.max(
        minimum,
        Math.min(maximum, value)
      );
    }

    function signed(value) {
      return value >= 0
        ? `+${value}`
        : `${value}`;
    }

    function clone(value) {
      return JSON.parse(
        JSON.stringify(value)
      );
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function createHiddenSeed() {
      if (
        window.crypto &&
        window.crypto.getRandomValues
      ) {
        const values =
          new Uint32Array(1);

        window.crypto.getRandomValues(values);

        return values[0] || 1;
      }

      return (
        (
          Date.now() ^
          Math.floor(
            Math.random() * 4294967295
          )
        ) >>> 0
      ) || 1;
    }

    function seedRng(seed) {
      rngState = seed >>> 0 || 1;
    }

    function random() {
      rngState += 0x6D2B79F5;

      let value = rngState;

      value = Math.imul(
        value ^ (value >>> 15),
        value | 1
      );

      value ^= value + Math.imul(
        value ^ (value >>> 7),
        value | 61
      );

      return (
        (value ^ (value >>> 14)) >>> 0
      ) / 4294967296;
    }

    function die(sides) {
      return Math.floor(
        random() * sides
      ) + 1;
    }

    function randomChoice(list) {
      return list[
        die(list.length) - 1
      ];
    }

    function abilityModifier(score) {
      return clamp(
        Math.round((score - 50) / 10),
        -5,
        5
      );
    }

    function skillModifier(score) {
      return clamp(
        Math.round((score - 50) / 10),
        -5,
        5
      );
    }

    function baseAbilities() {
      return {
        might: 50,
        agility: 50,
        endurance: 50,
        perception: 50,
        intellect: 50,
        will: 50,
        presence: 50
      };
    }

    function baseSkills() {
      return {
        blade: 31,
        spear: 31,
        polearm: 26,
        archery: 20,
        dueling: 34,
        awareness: 29,
        command: 15,
        tactics: 20,
        medicine: 10
      };
    }

    function applyBonuses(target, bonuses) {
      Object.entries(
        bonuses || {}
      ).forEach(([key, amount]) => {
        target[key] = clamp(
          (target[key] || 0) + amount,
          0,
          99
        );
      });
    }

    function makeCombatant(data) {
      const endurance =
        abilityModifier(
          data.abilities.endurance
        );

      const will =
        abilityModifier(
          data.abilities.will
        );

      const maxPosture =
        Math.max(
          15,
          18 + endurance + will
        );

      const maxStamina =
        Math.max(
          14,
          17 + endurance * 2
        );

      return {
        name: data.name,

        abilities: clone(data.abilities),
        skills: clone(data.skills),

        weapon: clone(data.weapon),
        armour: clone(data.armour),

        maxPosture,
        posture: maxPosture,

        maxStamina,
        stamina: maxStamina,

        wounds: [],

        guarded: false,
        focus: 0,
        opening: false,

        defeated: false,
        dead: false,

        lastAction: null,
        repeatCount: 0,
        recoveries: 0
      };
    }

    function buildPlayer() {
      const abilities = baseAbilities();
      const skills = baseSkills();

      applyBonuses(
        abilities,
        PAST_LIVES[
          creation.pastLife
        ].abilities
      );

      applyBonuses(
        skills,
        PAST_LIVES[
          creation.pastLife
        ].skills
      );

      applyBonuses(
        abilities,
        FORMATIVE_CHOICES[
          creation.formative
        ].abilities
      );

      applyBonuses(
        skills,
        FORMATIVE_CHOICES[
          creation.formative
        ].skills
      );

      const weapon =
        WEAPONS[creation.weapon];

      skills[weapon.skill] =
        clamp(
          skills[weapon.skill] + 11,
          0,
          99
        );

      return makeCombatant({
        name: creation.name,
        abilities,
        skills,
        weapon,
        armour: ARMOURS.player
      });
    }

    function buildEnemy() {
      return makeCombatant(
        ENEMY_DATA
      );
    }

    function woundPenalty(combatant) {
      let penalty = 0;

      combatant.wounds.forEach(
        wound => {
          if (
            wound.severity === "輕傷"
          ) {
            penalty += 1;
          }

          if (
            wound.severity === "重傷"
          ) {
            penalty += 3;
          }

          if (
            wound.severity === "致命傷"
          ) {
            penalty += 6;
          }
        }
      );

      if (
        combatant.stamina <=
        combatant.maxStamina * 0.25
      ) {
        penalty += 2;
      } else if (
        combatant.stamina <=
        combatant.maxStamina * 0.5
      ) {
        penalty += 1;
      }

      return penalty;
    }

    function defenceOf(
      combatant,
      extra = 0
    ) {
      const agility =
        abilityModifier(
          combatant.abilities.agility
        );

      const dueling =
        skillModifier(
          combatant.skills.dueling
        );

      const guardBonus =
        combatant.guarded ? 3 : 0;

      const brokenPenalty =
        combatant.posture <= 0
          ? 3
          : 0;

      return (
        12 +
        agility +
        dueling +
        guardBonus +
        extra -
        woundPenalty(combatant) -
        brokenPenalty
      );
    }

    function rollD20(
      advantage = false,
      disadvantage = false
    ) {
      const first = die(20);

      if (
        advantage &&
        !disadvantage
      ) {
        const second = die(20);

        return {
          value: Math.max(
            first,
            second
          ),
          dice: [first, second],
          mode: "優勢"
        };
      }

      if (
        disadvantage &&
        !advantage
      ) {
        const second = die(20);

        return {
          value: Math.min(
            first,
            second
          ),
          dice: [first, second],
          mode: "劣勢"
        };
      }

      return {
        value: first,
        dice: [first],
        mode: "正常"
      };
    }

    function spendStamina(
      combatant,
      amount
    ) {
      combatant.stamina =
        Math.max(
          0,
          combatant.stamina - amount
        );
    }

    function repetitionPenalty(
      combatant,
      action
    ) {
      if (
        combatant.lastAction === action
      ) {
        combatant.repeatCount += 1;
      } else {
        combatant.lastAction = action;
        combatant.repeatCount = 1;
      }

      if (
        combatant.repeatCount <= 2
      ) {
        return 0;
      }

      return clamp(
        combatant.repeatCount - 2,
        1,
        4
      ) * -2;
    }

    function initiativeModifier(
      forPlayer
    ) {
      if (!state) {
        return 0;
      }

      return forPlayer
        ? state.initiative
        : -state.initiative;
    }

    function attackRoll(
      attacker,
      defender,
      options = {}
    ) {
      const weapon = attacker.weapon;

      const ability =
        abilityModifier(
          attacker.abilities[
            weapon.ability
          ]
        );

      const skill =
        skillModifier(
          attacker.skills[
            weapon.skill
          ]
        );

      const injury =
        woundPenalty(attacker);

      const situation =
        options.situation || 0;

      const roll =
        rollD20(
          Boolean(options.advantage),
          Boolean(options.disadvantage)
        );

      const total =
        roll.value +
        ability +
        skill +
        weapon.accuracy +
        situation -
        injury;

      const defence =
        defenceOf(
          defender,
          options.defenceModifier || 0
        );

      const naturalOne =
        roll.value === 1;

      const naturalTwenty =
        roll.value === 20;

      const success =
        !naturalOne &&
        (
          naturalTwenty ||
          total >= defence
        );

      return {
        roll,
        ability,
        skill,
        weaponBonus:
          weapon.accuracy,
        situation,
        injury,
        total,
        defence,
        success,
        margin: total - defence,
        critical: naturalTwenty,
        disaster: naturalOne
      };
    }

    function attackLine(
      label,
      result
    ) {
      return (
        `${label}：${result.roll.mode} d20［` +
        `${result.roll.dice.join("、")}］ ` +
        `${signed(result.ability)} 能力 ` +
        `${signed(result.skill)} 武技 ` +
        `${signed(result.weaponBonus)} 兵器 ` +
        `${signed(result.situation)} 戰況 ` +
        `${signed(-result.injury)} 傷勢 ` +
        `= ${result.total}，對抗防守 ${result.defence}`
      );
    }

    function resultLine(result) {
      if (result.disaster) {
        return "結果：大失敗";
      }

      if (!result.success) {
        return "結果：失敗";
      }

      if (result.critical) {
        return "結果：大成功";
      }

      if (result.margin >= 5) {
        return "結果：強成功";
      }

      return "結果：成功";
    }

    function effectRoll(
      sides,
      critical = false
    ) {
      const dice = [die(sides)];

      if (critical) {
        dice.push(die(sides));
      }

      return {
        dice,
        total: dice.reduce(
          (sum, value) =>
            sum + value,
          0
        )
      };
    }

    function woundName(severity) {
      const names = {
        輕傷: [
          "手臂割傷",
          "肩背裂傷",
          "額角破裂",
          "肋側刀傷",
          "大腿創傷"
        ],

        重傷: [
          "大腿深創",
          "持兵手重傷",
          "肋骨重創",
          "肩部深裂",
          "腹側重創"
        ],

        致命傷: [
          "胸腹致命創傷",
          "頸側致命刀傷",
          "大量失血",
          "腹部致命傷"
        ]
      };

      return randomChoice(
        names[severity]
      );
    }

    function addWound(
      target,
      severity
    ) {
      const wound = {
        severity,
        name: woundName(severity)
      };

      target.wounds.push(wound);

      if (severity === "重傷") {
        target.defeated = true;
      }

      if (
        severity === "致命傷"
      ) {
        target.defeated = true;
        target.dead = true;
      }

      const minorCount =
        target.wounds.filter(
          item =>
            item.severity === "輕傷"
        ).length;

      if (minorCount >= 2) {
        target.defeated = true;
      }

      return wound;
    }

    function resolveImpact(
      attacker,
      defender,
      attackResult,
      options = {}
    ) {
      const effect =
        effectRoll(
          options.damageSides ||
          attacker.weapon.damageSides,
          attackResult.critical
        );

      const might =
        Math.max(
          0,
          abilityModifier(
            attacker.abilities.might
          )
        );

      const styleBonus =
        options.styleBonus || 0;

      const marginBonus =
        Math.max(
          0,
          Math.floor(
            attackResult.margin / 5
          )
        );

      const raw =
        effect.total +
        might +
        styleBonus +
        marginBonus;

      const mitigation =
        Math.max(
          0,
          defender.armour.mitigation -
          (attacker.weapon.piercing || 0)
        );

      const impact =
        Math.max(
          1,
          raw - mitigation
        );

      const postureBefore =
        defender.posture;

      defender.posture =
        Math.max(
          0,
          defender.posture - impact
        );

      const ratioAfter =
        defender.posture /
        defender.maxPosture;

      let vulnerability = 0;

      if (ratioAfter <= 0) {
        vulnerability = 6;
      } else if (ratioAfter <= 0.3) {
        vulnerability = 4;
      } else if (ratioAfter <= 0.6) {
        vulnerability = 2;
      }

      const woundEligible =
        attackResult.critical ||
        ratioAfter <= 0.3 ||
        (
          ratioAfter <= 0.6 &&
          attackResult.margin >= 5
        );

      let woundCheck = null;
      let wound = null;

      if (woundEligible) {
        const woundDie = die(20);

        const endurance =
          abilityModifier(
            defender.abilities.endurance
          );

        const protection =
          defender.armour.woundProtection || 0;

        const total =
          woundDie +
          Math.floor(impact / 2) +
          vulnerability -
          endurance -
          protection;

        woundCheck = {
          die: woundDie,
          impact:
            Math.floor(impact / 2),
          vulnerability,
          endurance,
          protection,
          total
        };

        let severity = null;

        if (total >= 25) {
          severity = "致命傷";
        } else if (total >= 20) {
          severity = "重傷";
        } else if (total >= 15) {
          severity = "輕傷";
        }

        if (severity) {
          wound =
            addWound(
              defender,
              severity
            );
        }
      }

      return {
        effect,
        raw,
        mitigation,
        impact,
        postureBefore,
        woundCheck,
        wound
      };
    }

    function impactLines(
      label,
      impact
    ) {
      const lines = [
        `${label}衝擊：d${impact.effect.dice.length > 1 ? "雙骰" : ""}` +
        `［${impact.effect.dice.join("、")}］，總衝擊 ${impact.raw}`,

        `護甲抵消 ${impact.mitigation}；` +
        `造成 ${impact.impact} 點架勢損失`
      ];

      if (impact.woundCheck) {
        const check =
          impact.woundCheck;

        lines.push(
          `傷勢判定：d20 ${check.die} ` +
          `${signed(check.impact)} 衝擊 ` +
          `${signed(check.vulnerability)} 破綻 ` +
          `${signed(-check.endurance)} 體魄 ` +
          `${signed(-check.protection)} 護甲 ` +
          `= ${check.total}`
        );
      }

      if (impact.wound) {
        lines.push(
          `造成傷勢：${impact.wound.name}` +
          `（${impact.wound.severity}）`
        );
      }

      return lines;
    }

    function woundSummary(combatant) {
      if (
        !combatant ||
        combatant.wounds.length === 0
      ) {
        return "無";
      }

      return combatant.wounds
        .map(
          wound =>
            `${wound.name}（${wound.severity}）`
        )
        .join("、");
    }

    function shiftInitiative(amount) {
      state.initiative =
        clamp(
          state.initiative + amount,
          -2,
          2
        );
    }

    function chooseEnemyIntent() {
      const enemy = state.enemy;

      if (
        enemy.posture <=
        enemy.maxPosture * 0.35 &&
        enemy.recoveries < 2 &&
        random() < 0.48
      ) {
        return "recover";
      }

      if (
        enemy.stamina <=
        enemy.maxStamina * 0.3
      ) {
        return random() < 0.55
          ? "guard"
          : "quick";
      }

      const roll = random();

      if (roll < 0.21) return "quick";
      if (roll < 0.40) return "heavy";
      if (roll < 0.59) return "pressure";
      if (roll < 0.75) return "guard";
      if (roll < 0.89) return "feint";

      return "recover";
    }

    function currentTell() {
      if (
        !state ||
        !state.intent
      ) {
        return "";
      }

      return randomChoice(
        INTENT_TELLS[state.intent]
      );
    }

    function consumePlayerOpening() {
      state.player.opening = false;
      state.player.focus = 0;
    }

    function playerAttack(type) {
      const player = state.player;
      const enemy = state.enemy;
      const intent = state.intent;

      const paragraphs = [];
      const lines = [];

      let label = "快攻";
      let situation = 0;
      let styleBonus = 0;
      let staminaCost = 2;
      let interrupts = false;

      const repeat =
        repetitionPenalty(
          player,
          type
        );

      situation += repeat;
      situation +=
        initiativeModifier(true);

      if (type === "quick") {
        label = "快攻";
        situation += 1;
        staminaCost = 1;

        if (intent === "heavy") {
          situation += 3;
        }
      }

      if (type === "heavy") {
        label = "猛擊";
        situation -= 1;
        styleBonus = 3;
        staminaCost = 4;

        if (
          intent === "guard" ||
          intent === "recover"
        ) {
          situation += 3;
          styleBonus += 2;
        }
      }

      if (type === "pressure") {
        label = "迫攻";
        situation += 0;
        staminaCost = 3;

        if (intent === "recover") {
          situation += 4;
        }

        if (intent === "guard") {
          situation += 1;
        }
      }

      spendStamina(
        player,
        staminaCost
      );

      if (repeat < 0) {
        paragraphs.push(
          "韓魁似乎已經開始熟悉你反覆使用的節奏。"
        );
      }

      const result =
        attackRoll(
          player,
          enemy,
          {
            situation,
            advantage:
              player.opening ||
              player.focus >= 3
          }
        );

      lines.push(
        attackLine(label, result),
        resultLine(result)
      );

      if (!result.success) {
        paragraphs.push(
          result.disaster
            ? "你踏步時失去平衡，攻勢完全走空。韓魁立即搶回主動。"
            : `${label}未能越過韓魁的防守。`
        );

        shiftInitiative(
          result.disaster ? -2 : -1
        );

        if (result.disaster) {
          enemy.opening = true;
        }

        consumePlayerOpening();

        resolveEnemyIntent(
          paragraphs,
          lines,
          result.disaster ? 2 : 0
        );

        return;
      }

      if (type === "pressure") {
        const effect =
          effectRoll(
            6,
            result.critical
          );

        const pressure =
          effect.total +
          Math.max(
            0,
            abilityModifier(
              player.abilities.might
            )
          ) +
          Math.max(
            0,
            Math.floor(
              result.margin / 5
            )
          );

        enemy.posture =
          Math.max(
            0,
            enemy.posture - pressure
          );

        enemy.stamina =
          Math.max(
            0,
            enemy.stamina -
            (result.critical ? 4 : 2)
          );

        lines.push(
          `迫攻效果：d6［${effect.dice.join("、")}］，` +
          `造成 ${pressure} 點架勢損失`
        );

        paragraphs.push(
          "你連續逼近，不畀韓魁輕易重新站穩。"
        );

        if (
          intent === "recover" &&
          result.margin >= 2
        ) {
          interrupts = true;

          paragraphs.push(
            "韓魁未能完成換氣，重整被你打斷。"
          );
        }
      } else {
        const impact =
          resolveImpact(
            player,
            enemy,
            result,
            { styleBonus }
          );

        lines.push(
          ...impactLines(
            label,
            impact
          )
        );

        if (impact.wound) {
          paragraphs.push(
            `你的${player.weapon.name}越過防守，留下「${impact.wound.name}」。`
          );
        } else if (
          enemy.posture <= 0
        ) {
          paragraphs.push(
            "韓魁勉強架住兵刃，但刀架已經完全崩潰。"
          );
        } else {
          paragraphs.push(
            type === "heavy"
              ? "沉重衝擊逼得韓魁連退數步。"
              : "你搶入韓魁動作之間，逼佢倉促回刀。"
          );
        }

        if (
          type === "quick" &&
          intent === "heavy" &&
          result.margin >= 3
        ) {
          interrupts = true;

          paragraphs.push(
            "韓魁原本積蓄的刀勢被你搶先破壞。"
          );
        }

        if (
          type === "heavy" &&
          (
            intent === "guard" ||
            intent === "recover"
          ) &&
          result.margin >= 2
        ) {
          interrupts = true;
        }
      }

      if (result.margin >= 5) {
        shiftInitiative(1);
      }

      if (
        enemy.posture <= 0 &&
        (
          result.critical ||
          result.margin >= 5
        )
      ) {
        player.opening = true;

        paragraphs.push(
          "喺架勢崩潰的一瞬，你捕捉到一條直通要害的空隙。"
        );
      } else {
        consumePlayerOpening();
      }

      if (
        checkCombatEnd(
          paragraphs,
          lines
        )
      ) {
        return;
      }

      if (interrupts) {
        finishRound(
          paragraphs,
          lines
        );

        return;
      }

      resolveEnemyIntent(
        paragraphs,
        lines,
        0
      );
    }

    function playerObserve() {
      const player = state.player;
      const enemy = state.enemy;
      const intent = state.intent;

      const paragraphs = [];
      const lines = [];

      const repeat =
        repetitionPenalty(
          player,
          "observe"
        );

      spendStamina(player, 1);

      const roll = rollD20();

      const perception =
        abilityModifier(
          player.abilities.perception
        );

      const awareness =
        skillModifier(
          player.skills.awareness
        );

      const injury =
        woundPenalty(player);

      const situation =
        repeat +
        initiativeModifier(true);

      const total =
        roll.value +
        perception +
        awareness +
        situation -
        injury;

      const difficulty =
        13 +
        abilityModifier(
          enemy.abilities.perception
        );

      const success =
        roll.value !== 1 &&
        (
          roll.value === 20 ||
          total >= difficulty
        );

      lines.push(
        `觀察判定：d20［${roll.value}］ ` +
        `${signed(perception)} 洞察 ` +
        `${signed(awareness)} 臨敵經驗 ` +
        `${signed(situation)} 戰況 ` +
        `${signed(-injury)} 傷勢 ` +
        `= ${total}，對抗 ${difficulty}`,

        success
          ? "結果：成功"
          : "結果：失敗"
      );

      if (success) {
        player.focus =
          roll.value === 20 ? 4 : 3;

        shiftInitiative(1);

        paragraphs.push(
          "你沒有追逐刀鋒，而係觀察韓魁肩膀、腰胯與換氣節奏。"
        );

        if (intent === "feint") {
          enemy.opening = true;

          paragraphs.push(
            "你察覺刀鋒只係誘餌。韓魁真正的重心反而暴露在另一側。"
          );

          if (
            enemy.posture <= 0
          ) {

            paragraphs.push(
              "韓魁架勢本已崩潰，假動作反而令致命空門完全暴露。"
            );
          }

          finishRound(

            lines
          );

          return;
        }

        paragraphs.push(
          "你大致掌握了下一次交鋒的節奏。"
        );

        resolveEnemyIntent(
          paragraphs,
          lines,
          -2
        );

      }

      player.focus = 0;
      shiftInitiative(-1);

      paragraphs.push(
        "韓魁的步法與刀鋒不斷改變，你未能看出真正落點。"
      );

      resolveEnemyIntent(
        paragraphs,
        lines,
        1
      );
    }

    function playerFeint() {
      const player = state.player;
      const enemy = state.enemy;
      const intent = state.intent;

      const paragraphs = [];
      const lines = [];

      const repeat =
        repetitionPenalty(
          player,
          "feint"
        );

      spendStamina(player, 2);

      const roll = rollD20();

      const agility =
        abilityModifier(
          player.abilities.agility
        );

      const dueling =
        skillModifier(
          player.skills.dueling
        );

      const injury =
        woundPenalty(player);

      let situation =
        repeat +
        initiativeModifier(true);

      if (
        intent === "guard" ||
        intent === "recover"
      ) {
        situation += 3;
      }

      const total =
        roll.value +
        agility +
        dueling +
        situation -
        injury;

      const difficulty =
        13 +
        abilityModifier(
          enemy.abilities.perception
        ) +
        Math.max(
          0,
          skillModifier(
            enemy.skills.dueling
          )
        );

      const success =
        roll.value !== 1 &&
        (
          roll.value === 20 ||
          total >= difficulty
        );

      const margin =
        total - difficulty;

      lines.push(
        `佯攻判定：d20［${roll.value}］ ` +
        `${signed(agility)} 身法 ` +
        `${signed(dueling)} 單挑技巧 ` +
        `${signed(situation)} 戰況 ` +
        `${signed(-injury)} 傷勢 ` +
        `= ${total}，對抗 ${difficulty}`,

        success
          ? margin >= 5
            ? "結果：強成功"
            : "結果：成功"
          : "結果：失敗"
      );

      if (!success) {
        paragraphs.push(
          "韓魁沒有追著假動作移動，反而趁你變勢時壓近。"
        );

        shiftInitiative(-1);

        if (roll.value === 1) {
          enemy.opening = true;
        }

        resolveEnemyIntent(
          paragraphs,
          lines,
          roll.value === 1 ? 2 : 0
        );

        return;
      }

      shiftInitiative(
        margin >= 5 ? 2 : 1
      );

      enemy.posture =
        Math.max(
          0,
          enemy.posture -
          (margin >= 5 ? 4 : 2)
        );

      player.opening = true;

      paragraphs.push(
        "你故意露出錯誤方向，等韓魁回刀之後突然變勢。"
      );

      if (
        enemy.posture <= 0
      ) {
        paragraphs.push(
          "韓魁的刀架已經崩潰。假動作將佢最後一道防線牽離要害。"
        );
      } else {
        paragraphs.push(
          "韓魁被迫改變防守，腳步與刀鋒之間出現短暫脫節。"
        );
      }

      if (
        intent === "guard" ||
        intent === "recover"
      ) {
        finishRound(
          paragraphs,
          lines
        );

        return;
      }

      resolveEnemyIntent(
        paragraphs,
        lines,
        -1
      );
    }

    function playerDefend() {
      const player = state.player;

      const paragraphs = [
        "你收緊架勢，將注意力放在韓魁兵刃真正進入攻擊距離的一刻。"
      ];

      const lines = [];

      repetitionPenalty(
        player,
        "defend"
      );

      spendStamina(player, 1);

      player.guarded = true;

      const result =
        resolveEnemyIntent(
          paragraphs,
          lines,
          0,
          true
        );

      if (
        !result ||
        state.phase !== "duel"
      ) {
        return;
      }

      if (
        result.attacked &&
        !result.hit &&
        !state.enemy.defeated
      ) {
        const situation =
          initiativeModifier(true) +
          (
            state.intent === "quick" ||
            state.intent === "pressure"
              ? 3
              : 0
          );

        const counter =
          attackRoll(
            player,
            state.enemy,
            { situation }
          );

        lines.push(
          attackLine(
            "守後反擊",
            counter
          ),
          resultLine(counter)
        );

        if (counter.success) {
          const impact =
            resolveImpact(
              player,
              state.enemy,
              counter,
              {
                damageSides: 8,
                styleBonus: 1
              }
            );

          lines.push(
            ...impactLines(
              "守後反擊",
              impact
            )
          );

          paragraphs.push(
            impact.wound
              ? `你避開刀鋒後立即切入，造成「${impact.wound.name}」。`
              : "你喺韓魁收刀之前回擊，逼佢失去原本位置。"
          );

          shiftInitiative(1);

          if (
            state.enemy.posture <= 0 &&
            (
              counter.critical ||
              counter.margin >= 5
            )
          ) {
            player.opening = true;

            paragraphs.push(
              "韓魁架勢崩潰，而你正好站在可以直取要害的位置。"
            );
          }
        } else {
          paragraphs.push(
            "你成功守住攻勢，但反擊仍被韓魁及時封住。"
          );
        }
      }

      player.guarded = false;

      if (
        checkCombatEnd(
          paragraphs,
          lines
        )
      ) {
        return;
      }

      finishRound(
        paragraphs,
        lines
      );
    }

    function playerRecover() {
      const player = state.player;

      const paragraphs = [
        "你拉開半步，重新調整握兵、呼吸與腳下重心。"
      ];

      const lines = [];

      const repeat =
        repetitionPenalty(
          player,
          "recover"
        );

      const recoveryDie = die(6);

      const endurance =
        Math.max(
          0,
          abilityModifier(
            player.abilities.endurance
          )
        );

      const recovery =
        Math.max(
          1,
          recoveryDie +
          endurance +
          repeat
        );

      const oldPosture =
        player.posture;

      player.posture =
        Math.min(
          player.maxPosture,
          player.posture + recovery
        );

      player.stamina =
        Math.min(
          player.maxStamina,
          player.stamina + 3
        );

      lines.push(
        `重整架勢：d6［${recoveryDie}］ ` +
        `${signed(endurance)} 體魄 ` +
        `${signed(repeat)} 重複影響 ` +
        `= ${recovery}`,

        `實際恢復 ${player.posture - oldPosture} 點架勢及 3 點體力`
      );

      let enemyBonus = 0;

      if (
        state.intent === "heavy" ||
        state.intent === "pressure"
      ) {
        enemyBonus = 3;
      }

      resolveEnemyIntent(
        paragraphs,
        lines,
        enemyBonus
      );
    }

    function playerExecute() {
      const player = state.player;
      const enemy = state.enemy;

      const paragraphs = [];
      const lines = [];

      spendStamina(player, 3);

      const roll =
        rollD20(true, false);

      const ability =
        abilityModifier(
          player.abilities[
            player.weapon.ability
          ]
        );

      const skill =
        skillModifier(
          player.skills[
            player.weapon.skill
          ]
        );

      const injury =
        woundPenalty(player);

      const initiative =
        initiativeModifier(true);

      const total =
        roll.value +
        ability +
        skill +
        player.weapon.accuracy +
        initiative -
        injury;

      const difficulty =
        15 +
        Math.max(
          0,
          abilityModifier(
            enemy.abilities.agility
          )
        );

      const success =
        roll.value !== 1 &&
        (
          roll.value === 20 ||
          total >= difficulty
        );

      const margin =
        total - difficulty;

      lines.push(
        `決死斬擊：${roll.mode} d20［${roll.dice.join("、")}］ ` +
        `${signed(ability)} 能力 ` +
        `${signed(skill)} 武技 ` +
        `${signed(player.weapon.accuracy)} 兵器 ` +
        `${signed(initiative)} 先機 ` +
        `${signed(-injury)} 傷勢 ` +

      player.opening = false;

      if (success) {

          roll.value === 20 ||
          margin >= 6
        ) {
          enemy.defeated = true;
          enemy.dead = true;

          lines.push(
            roll.value === 20
              ? "結果：大成功・乾淨俐落的致命一擊"
              : "結果：強成功・造成致命傷"
          );

          paragraphs.push(
            "你踏入韓魁已經崩潰的防線，沒有再留退路。",
            `你的${player.weapon.name}沿住刀架與身體之間唯一的空隙切入。`,
            "韓魁來不及重新站穩，便重重倒在山路中央。"
          );
        } else {
          enemy.defeated = true;

          const wound =
            addWound(
              enemy,
              "重傷"
            );

          lines.push(
            "結果：成功・擊敗對手"
          );

          paragraphs.push(
            "你踏入致命空門，將所有力量集中在一擊之內。",
            `韓魁勉強避開真正要害，仍然受到「${wound.name}」。`,
            "山刀脫手落地，佢已經無法繼續戰鬥。"
          );
        }

        checkCombatEnd(
          paragraphs,
          lines
        );

        return;
      }

      lines.push(
        roll.value === 1
          ? "結果：大失敗"
          : "結果：失敗"
      );

      paragraphs.push(
        "你決意用呢一擊分出生死。",
        roll.value === 1
          ? "踏入斬殺線時，你的腳步突然失去平衡。兵刃擦身而過，胸腹完全暴露。"
          : "韓魁喺最後一瞬勉強扭開身體。致命空門已經消失，而你踏得太深。",
        "韓魁立即拼死反擊。"
      );

      enemy.opening = true;
      shiftInitiative(-2);

      enemyAttack(
        "heavy",
        paragraphs,
        lines,
        roll.value === 1 ? 4 : 2
      );

      if (
        checkCombatEnd(
          paragraphs,
          lines
        )
      ) {
        return;
      }

      finishRound(
        paragraphs,
        lines
      );

    function enemyAttack(
      type,
      paragraphs,
      lines,
      bonus = 0
    ) {
      const enemy = state.enemy;
      const player = state.player;

      let label = "韓魁快攻";
      let situation =
        bonus +
        initiativeModifier(false);

      let styleBonus = 0;
      let staminaCost = 2;

      if (type === "quick") {
        label = "韓魁快攻";
        situation += 1;
        staminaCost = 1;
      }

      if (type === "heavy") {
        label = "韓魁猛擊";
        situation -= 1;
        styleBonus = 3;
        staminaCost = 4;
      }

      if (type === "pressure") {
        label = "韓魁迫攻";
        staminaCost = 3;
      }

      spendStamina(
        enemy,
        staminaCost
      );

      const result =
        attackRoll(
          enemy,
          player,
          {
            situation,
            advantage: enemy.opening
          }
        );

      lines.push(
        attackLine(label, result),
        resultLine(result)
      );

      enemy.opening = false;

      if (!result.success) {
        paragraphs.push(
          result.disaster
            ? "韓魁用力過猛，山刀撞上山壁，整個身前暴露。"
            : player.guarded
              ? "你守住中線，將韓魁的刀鋒引向空處。"
              : "韓魁的山刀從你身前掃過，沒有真正斬中。"
        );

        shiftInitiative(
          result.disaster ? 2 : 1
        );

        if (result.disaster) {
          player.opening = true;
        }

        return {
          attacked: true,
          hit: false
        };
      }

      if (type === "pressure") {
        const effect =
          effectRoll(
            6,
            result.critical
          );

        const pressure =
          effect.total +
          Math.max(
            0,
            abilityModifier(
              enemy.abilities.might
            )
          ) +
          Math.max(
            0,
            Math.floor(
              result.margin / 5
            )
          );

        player.posture =
          Math.max(
            0,
            player.posture - pressure
          );

        player.stamina =
          Math.max(
            0,
            player.stamina -
            (result.critical ? 4 : 2)
          );

        lines.push(
          `韓魁迫攻：d6［${effect.dice.join("、")}］，` +
          `造成 ${pressure} 點架勢損失`
        );

        paragraphs.push(
          "韓魁連續壓刀逼近，迫使你不斷格擋退步。"
        );
      } else {
        const impact =
          resolveImpact(
            enemy,
            player,
            result,
            { styleBonus }
          );

        lines.push(
          ...impactLines(
            label,
            impact
          )
        );

        if (impact.wound) {
          paragraphs.push(
            `山刀越過你的防守，造成「${impact.wound.name}」。`
          );
        } else if (
          player.posture <= 0
        ) {
          paragraphs.push(
            "你勉強架住山刀，雙臂卻已經發麻，架勢完全崩潰。"
          );
        } else {
          paragraphs.push(
            type === "heavy"
              ? "沉重山刀正面壓下，你被逼得連退數步。"
              : "韓魁搶入你兵刃回收前的一瞬，削弱了你的架勢。"
          );
        }
      }

      if (result.margin >= 5) {
        shiftInitiative(-1);
      }

      if (
        player.posture <= 0 &&
        (
          result.critical ||
          result.margin >= 5
        )
      ) {
        enemy.opening = true;

        paragraphs.push(
          "韓魁看見你架勢崩潰，山刀開始移向真正致命的位置。"
        );
      }

      return {
        attacked: true,
        hit: true
      };
    }

    function enemyExecution(

      lines
    ) {
      const enemy = state.enemy;
      const player = state.player;

      const roll =
        rollD20(true, false);

      const ability =
        abilityModifier(
          enemy.abilities.might
        );

      const skill =
        skillModifier(
          enemy.skills.blade
        );

      const total =
        roll.value +
        ability +
        skill +
        initiativeModifier(false);

      const difficulty =
        15 +
        Math.max(
          0,
          abilityModifier(
            player.abilities.agility
          )
        );

      const success =
        roll.value !== 1 &&
        (
          roll.value === 20 ||
          total >= difficulty
        );

      const margin =
        total - difficulty;

      lines.push(
        `韓魁決死斬擊：${roll.mode} d20［${roll.dice.join("、")}］ ` +
        `${signed(ability)} 能力 ` +
        `${signed(skill)} 武技 ` +
        `${signed(initiativeModifier(false))} 先機 ` +
        `= ${total}，對抗 ${difficulty}`
      );

      enemy.opening = false;

      if (success) {
        if (
          roll.value === 20 ||
          margin >= 6
        ) {
          player.defeated = true;
          player.dead = true;

          addWound(
            player,
            "致命傷"
          );

          lines.push(
            "結果：致命一擊"
          );

          paragraphs.push(
            "韓魁踏入你已經崩潰的防線，山刀沒有再留半點餘地。",
            "寒光越過兵刃與甲衣之間的空隙，你再也無法站穩。"
          );
        } else {
          player.defeated = true;

          const wound =
            addWound(
              player,
              "重傷"
            );

          lines.push(
            "結果：重傷倒地"
          );

          paragraphs.push(
            `你喺最後一瞬避開真正要害，仍然受到「${wound.name}」。`,
            "兵器脫手落地，你已經無法繼續戰鬥。"
          );
        }

        return;
      }

      lines.push(
        roll.value === 1
          ? "結果：大失敗"
          : "結果：失敗"
      );

      paragraphs.push(
        "韓魁試圖把握你架勢崩潰的一瞬，但致命刀鋒擦身而過。",
        "佢踏得太深，原本握住的主動亦開始動搖。"
      );

      player.opening = true;
      shiftInitiative(2);
    }

    function resolveEnemyIntent(
      paragraphs,
      lines,
      bonus = 0,
      returnOnly = false
    ) {
      if (
        checkCombatEnd(
          paragraphs,
          lines
        )
      ) {
        return null;
      }

      const enemy = state.enemy;
      const player = state.player;
      const intent = state.intent;

      enemy.guarded = false;

      if (
        player.posture <= 0 &&
        enemy.opening
      ) {
        enemyExecution(
          paragraphs,
          lines
        );

        if (returnOnly) {
          return {
            attacked: true,
            hit: true
          };
        }

        if (
          checkCombatEnd(
            paragraphs,
            lines
          )
        ) {
          return null;
        }

        finishRound(
          paragraphs,
          lines
        );

        return {
          attacked: true,
          hit: true
        };
      }

      let outcome = {
        attacked: false,
        hit: false
      };

      if (intent === "quick") {
        outcome =
          enemyAttack(
            "quick",
            paragraphs,
            lines,
            bonus
          );
      }

      if (intent === "heavy") {
        outcome =
          enemyAttack(
            "heavy",
            paragraphs,
            lines,
            bonus
          );
      }

      if (intent === "pressure") {
        outcome =
          enemyAttack(
            "pressure",
            paragraphs,
            lines,
            bonus
          );
      }

      if (intent === "guard") {
        const recovery = die(4);

        const oldPosture =
          enemy.posture;

        enemy.posture =
          Math.min(
            enemy.maxPosture,
            enemy.posture + recovery
          );

        enemy.guarded = true;

        lines.push(
          `韓魁固守：恢復 ${enemy.posture - oldPosture} 點架勢`
        );

        paragraphs.push(
          "韓魁將山刀橫在身前，收緊防線，沒有貿然進攻。"
        );
      }

      if (intent === "recover") {
        const recovery =
          die(6) +
          Math.max(
            0,
            abilityModifier(
              enemy.abilities.endurance
            )
          );

        const oldPosture =
          enemy.posture;

        enemy.posture =
          Math.min(
            enemy.maxPosture,
            enemy.posture + recovery
          );

        enemy.stamina =
          Math.min(
            enemy.maxStamina,
            enemy.stamina + 3
          );

        enemy.recoveries += 1;

        lines.push(
          `韓魁重整：恢復 ${enemy.posture - oldPosture} 點架勢及 3 點體力`
        );

        paragraphs.push(
          "韓魁拉開距離調整呼吸，重新整理刀架。"
        );
      }

      if (intent === "feint") {
        const roll = rollD20();

        const agility =
          abilityModifier(
            enemy.abilities.agility
          );

        const dueling =
          skillModifier(
            enemy.skills.dueling
          );

        const total =
          roll.value +
          agility +
          dueling +
          initiativeModifier(false);

        const difficulty =
          13 +
          abilityModifier(
            player.abilities.perception
          );

        const success =
          roll.value !== 1 &&
          (
            roll.value === 20 ||
            total >= difficulty
          );

        lines.push(
          `韓魁佯動：d20［${roll.value}］ ` +
          `${signed(agility)} 身法 ` +
          `${signed(dueling)} 單挑技巧 ` +
          `${signed(initiativeModifier(false))} 先機 ` +
          `= ${total}，對抗 ${difficulty}`
        );

        if (success) {
          enemy.opening = true;
          shiftInitiative(-1);

          paragraphs.push(
            "你跟住刀鋒移動的一瞬，韓魁突然改變真正落點。"
          );

          outcome =
            enemyAttack(
              "quick",
              paragraphs,
              lines,
              bonus + 2
            );
        } else {
          shiftInitiative(1);

          paragraphs.push(
            "韓魁的假動作未能完全騙開你，佢只好放棄後續攻勢。"
          );

          outcome = {
            attacked: true,
            hit: false
          };
        }
      }

      player.guarded = false;

      if (returnOnly) {
        return outcome;
      }

      if (
        checkCombatEnd(
          paragraphs,
          lines
        )
      ) {
        return outcome;
      }

      finishRound(
        paragraphs,
        lines
      );

      return outcome;
    }

    function applyLateFightPressure(
      paragraphs
    ) {
      if (state.round < 8) {
        return;
      }

      const player = state.player;
      const enemy = state.enemy;

      player.stamina =
        Math.max(
          0,
          player.stamina - 1
        );

      enemy.stamina =
        Math.max(
          0,
          enemy.stamina - 1
        );

      if (state.round >= 10) {
        player.posture =
          Math.max(
            0,
            player.posture - 1
          );

        enemy.posture =
          Math.max(
            0,
            enemy.posture - 1
          );

        paragraphs.push(
          "長時間交鋒令雙方呼吸愈來愈亂，任何細小失誤都可能變成致命空隙。"
        );
      }
    }

    function finishRound(
      paragraphs,
      lines
    ) {
      applyLateFightPressure(
        paragraphs
      );

      if (
        checkCombatEnd(
          paragraphs,
          lines
        )
      ) {
        return;
      }

      state.round += 1;
      state.intent =
        chooseEnemyIntent();
      state.tell =
        currentTell();

      setScene(
        `山道交鋒・第 ${state.round} 合`,
        paragraphs,
        duelActions(),
        lines
      );
    }

    function checkCombatEnd(
      paragraphs,
      lines
    ) {
      if (
        !state ||
        state.phase !== "combat"
      ) {
        return false;
      }

      const player = state.player;
      const enemy = state.enemy;

      if (enemy.defeated) {
        state.phase = "ending";

        setScene(
          enemy.dead
            ? "斬將破賊"
            : "韓魁倒地",
          [
            ...paragraphs,

            enemy.dead
              ? "韓魁受到致命傷，再也無法站起。"
              : "韓魁傷勢太重，山刀脫手落地，再也無法戰鬥。",

            "黑石寨眾賊眼見頭領敗亡，原本的叫陣聲迅速變成混亂。",

            `這場交鋒在第 ${state.round} 合結束。`,

            `你仍有 ${player.posture} 點架勢、${player.stamina} 點體力。`,

            `你留下的傷勢：${woundSummary(player)}。`
          ],
          endingActions(),
          lines
        );

        return true;
      }

      if (player.defeated) {
        state.phase = "ending";

        setScene(
          player.dead
            ? "命斷黑松嶺"
            : "重傷倒地",
          [
            ...paragraphs,

            player.dead
              ? "你再也無法握住兵器。山道上的聲音逐漸遠去。"
              : "你失去平衡倒在山道，意志仍然清醒，身體卻已經無法繼續。",

            player.dead
              ? "你曾跨越千多年重新出生，卻仍然只係一個會流血、會死亡的人。"
              : "正式版本中，你可能被俘、獲救，或者目睹糧隊潰敗。",

            `這場交鋒在第 ${state.round} 合結束。`,

            `傷勢：${woundSummary(player)}。`
          ],
          endingActions(),
          lines
        );

        return true;
      }

      if (state.round >= 14) {
        state.phase = "ending";

        setScene(
          "兩敗俱疲",
          [
            ...paragraphs,

            "雙方都已經無法維持最初的攻勢。韓魁退回賊眾之前，你亦被鄉勇接回車陣。",

            "這場交鋒未能分出生死，但雙方都付出了代價。",

            `你的傷勢：${woundSummary(player)}。`,

            `韓魁的傷勢：${woundSummary(enemy)}。`
          ],
          endingActions(),
          lines
        );

        return true;
      }

      return false;
    }

    function canPlayerExecute() {
      return Boolean(
        state &&
        state.phase === "combat" &&
        state.enemy.posture <= 0 &&
        state.player.opening &&
        !state.enemy.defeated
      );
    }

    function duelActions() {
      if (
        !state ||
        state.phase !== "combat"
      ) {
        return [];
      }

      const player = state.player;
      const actions = [];

      if (canPlayerExecute()) {
        actions.push({
          label: "決死斬擊",
          note:
            "對方架勢崩潰，而你已捕捉到致命空門。成功可以立即擊敗甚至斬殺對手；失敗會遭受危險反擊。",
          className: "execution",
          handler: playerExecute
        });
      }

      actions.push(
        {
          label: "快攻",
          note:
            "以短促動作搶先出手，衝擊較低，體力消耗亦較少。",
          handler: () =>
            playerAttack("quick")
        },

        {
          label: "猛擊",
          note:
            "投入較多體力發出沉重攻勢，失手後較難立即回防。",
          className: "danger",
          disabled:
            player.stamina < 4,
          handler: () =>
            playerAttack("heavy")
        },

        {
          label: "迫攻",
          note:
            "連續壓縮對手的活動空間，主要削弱架勢與體力。",
          disabled:
            player.stamina < 3,
          handler: () =>
            playerAttack("pressure")
        },

        {
          label: "防守反擊",
          note:
            "收緊防線，等待對方真正進入攻擊距離。",
          className: "safe",
          handler: playerDefend
        },

        {
          label: "觀察",
          note:
            "暫緩出手，判斷對方重心、呼吸與兵刃節奏。",
          className: "info",
          handler: playerObserve
        },

        {
          label: "佯攻",
          note:
            "以假動作嘗試牽動對方防守，成功後可能創造空隙。",
          handler: playerFeint
        },

        {
          label: "重整架勢",
          note:
            "拉開少量距離，恢復部分架勢與體力。",
          className: "safe",
          handler: playerRecover
        }
      );

      return actions;
    }

    function initiativeText() {
      if (!state) {
        return "勢均力敵";
      }

      if (state.initiative >= 2) {
        return "你完全掌握先機";
      }

      if (state.initiative === 1) {
        return "你略佔先機";
      }

      if (state.initiative <= -2) {
        return "韓魁完全掌握先機";
      }

      if (state.initiative === -1) {
        return "韓魁略佔先機";
      }

      return "勢均力敵";
    }

    function setScene(
      heading,
      paragraphs,
      actions = [],
      lines = []
    ) {
      document.getElementById(
        "storyHeading"
      ).textContent = heading;

      document.getElementById(
        "storyText"
      ).innerHTML =
        paragraphs
          .map(paragraph => {
            const className =
              paragraph.startsWith("『")
                ? "speech"
                : "";

            return (
              `<p class="${className}">` +
              `${escapeHtml(paragraph)}` +
              `</p>`
            );
          })
          .join("");

      document.getElementById(
        "rollArea"
      ).innerHTML =
        lines.length > 0
          ? `
            <div class="roll-box">
              ${lines
                .map(line => {
                  let className = "";

                  if (
                    line.includes("結果：成功") ||
                    line.includes("結果：強成功") ||
                    line.includes("結果：大成功")
                  ) {
                    className =
                      "success-line";
                  }

                  if (
                    line.includes("結果：失敗") ||
                    line.includes("結果：大失敗")
                  ) {
                    className =
                      "failure-line";
                  }

                  return (
                    `<div class="roll-line ${className}">` +
                    `${escapeHtml(line)}` +
                    `</div>`
                  );
                })
                .join("")}
            </div>
          `
          : "";

      renderActions(actions);
      renderAll();
    }

    function renderActions(actions) {
      const container =
        document.getElementById(
          "actions"
        );

      container.innerHTML = "";
      buttonsLocked = false;

      actions.forEach(action => {
        const button =
          document.createElement(
            "button"
          );

        button.type = "button";

        button.className =
          `action-button ${action.className || ""}`;

        button.disabled =
          Boolean(action.disabled);

        button.innerHTML =
          `${escapeHtml(action.label)}` +
          (
            action.note
              ? `<small>${escapeHtml(action.note)}</small>`
              : ""
          );

        button.addEventListener(
          "click",
          () => {
            if (
              buttonsLocked ||
              button.disabled
            ) {
              return;
            }

            buttonsLocked = true;

            container
              .querySelectorAll(
                "button"
              )
              .forEach(item => {
                item.disabled = true;
              });

            action.handler();
          }
        );

        container.appendChild(button);
      });
    }

    function renderAll() {
      renderPlayer();
      renderEnemy();
      renderTell();
      renderInitiative();
      renderExecution();
    }

    function renderPlayer() {
      const player =
        state ? state.player : null;

      document.getElementById(
        "playerName"
      ).textContent =
        player
          ? player.name
          : creation.name || "未題名";

      document.getElementById(
        "playerAge"
      ).textContent =
        state
          ? "十八歲・光和六年"
          : "尚未轉生";

      document.getElementById(
        "pastLifeText"
      ).textContent =
        creation.pastLife
          ? PAST_LIVES[
              creation.pastLife
            ].name
          : "尚未選定";

      document.getElementById(
        "formativeText"
      ).textContent =
        creation.formative
          ? FORMATIVE_CHOICES[
              creation.formative
            ].name
          : "尚未選定";

      document.getElementById(
        "weaponText"
      ).textContent =
        player
          ? `${player.weapon.name}・${player.armour.name}`
          : creation.weapon
            ? WEAPONS[
                creation.weapon
              ].name
            : "尚未持兵";

      if (!player) {
        document.getElementById(
          "postureText"
        ).textContent = "—";

        document.getElementById(
          "staminaText"
        ).textContent = "—";

        document.getElementById(
          "postureFill"
        ).style.width = "0%";

        document.getElementById(
          "staminaFill"
        ).style.width = "0%";

        document.getElementById(
          "woundText"
        ).textContent = "無";

        document.getElementById(
          "abilities"
        ).innerHTML = "";

        document.getElementById(
          "statusText"
        ).textContent =
          "命書尚未展開";

        return;
      }

      document.getElementById(
        "postureText"
      ).textContent =
        `${player.posture} / ${player.maxPosture}`;

      document.getElementById(
        "staminaText"
      ).textContent =
        `${player.stamina} / ${player.maxStamina}`;

      document.getElementById(
        "postureFill"
      ).style.width =
        `${clamp(
          player.posture /
          player.maxPosture *
          100,
          0,
          100
        )}%`;

      document.getElementById(
        "staminaFill"
      ).style.width =
        `${clamp(
          player.stamina /
          player.maxStamina *
          100,
          0,
          100
        )}%`;

      document.getElementById(
        "woundText"
      ).textContent =
        woundSummary(player);

      document.getElementById(
        "abilities"
      ).innerHTML =
        Object.entries(
          ABILITY_NAMES
        )
          .map(([key, label]) => {
            return `
              <div class="ability">
                <span>${escapeHtml(label)}</span>
                <span>${player.abilities[key]}</span>
              </div>
            `;
          })
          .join("");

      let status =
        "正與韓魁交鋒";

      if (player.defeated) {
        status = player.dead
          ? "命斷黑松嶺"
          : "已失去戰鬥能力";
      } else if (
        canPlayerExecute()
      ) {
        status =
          "致命空門已經出現";
      } else if (
        player.posture <= 0
      ) {
        status =
          "架勢崩潰，隨時可能遭到斬殺";
      } else if (
        player.stamina <=
        player.maxStamina * 0.25
      ) {
        status =
          "體力將盡，動作開始變慢";
      } else if (
        player.opening
      ) {
        status =
          "已捕捉到對方空隙";
      } else if (
        player.focus > 0
      ) {
        status =
          "已掌握部分交鋒節奏";
      }

      document.getElementById(
        "statusText"
      ).textContent = status;
    }

    function renderEnemy() {
      const container =
        document.getElementById(
          "enemyArea"
        );

      if (
        !state ||
        !state.enemy ||
        state.phase !== "combat"
      ) {
        container.innerHTML = "";
        return;
      }

      const enemy = state.enemy;

      const posturePercent =
        clamp(
          enemy.posture /
          enemy.maxPosture *
          100,
          0,
          100
        );

      const staminaPercent =
        clamp(
          enemy.stamina /
          enemy.maxStamina *
          100,
          0,
          100
        );

      const wounds =
        enemy.wounds.length > 0
          ? `
            <ul class="wound-list">
              ${enemy.wounds
                .map(
                  wound =>
                    `<li>${escapeHtml(wound.name)}（${escapeHtml(wound.severity)}）</li>`
                )
                .join("")}
            </ul>
          `
          : `
            <div class="small-text">
              暫無明顯傷勢
            </div>
          `;

      container.innerHTML = `
        <div class="enemy-card">
          <div class="enemy-header">
            <strong>${escapeHtml(enemy.name)}</strong>
            <span>防守 ${defenceOf(enemy)}</span>
          </div>

          <div class="meter">
            <div class="meter-header">
              <span>敵方架勢</span>
              <span>${enemy.posture} / ${enemy.maxPosture}</span>
            </div>

            <div class="meter-track">
              <div
                class="meter-fill enemy-posture"
                style="width:${posturePercent}%"
              ></div>
            </div>
          </div>

          <div class="meter">
            <div class="meter-header">
              <span>敵方體力</span>
              <span>${enemy.stamina} / ${enemy.maxStamina}</span>
            </div>

            <div class="meter-track">
              <div
                class="meter-fill enemy-stamina"
                style="width:${staminaPercent}%"
              ></div>
            </div>
          </div>

          <div class="small-text">
            ${escapeHtml(enemy.weapon.name)}・
            ${escapeHtml(enemy.armour.name)}
          </div>

          ${wounds}
        </div>
      `;
    }

    function renderTell() {
      const area =
        document.getElementById(
          "tellArea"
        );

      if (
        !state ||
        state.phase !== "combat" ||
        !state.tell
      ) {
        area.innerHTML = "";
        return;
      }

      area.innerHTML = `
        <div class="tell-box">
          <div class="tell-title">眼前動靜</div>
          <div class="tell-text">${escapeHtml(state.tell)}</div>
        </div>
      `;
    }

    function renderInitiative() {
      const area =
        document.getElementById(
          "initiativeArea"
        );

      if (
        !state ||
        state.phase !== "combat"
      ) {
        area.innerHTML = "";
        return;
      }

      area.innerHTML = `
        <div class="initiative-box">
          <span>${escapeHtml(state.player.name)}</span>
          <span class="initiative-centre">${escapeHtml(initiativeText())}</span>
          <span>韓魁</span>
        </div>
      `;
    }

    function renderExecution() {
      const area =
        document.getElementById(
          "executionArea"
        );

      if (!canPlayerExecute()) {
        area.innerHTML = "";
        return;
      }

      area.innerHTML = `
        <div class="execution-alert">
          <strong>斬殺機會</strong><br>
          韓魁架勢已經崩潰，而你正掌握致命空門。呢個機會只會維持到戰況再次改變。
        </div>
      `;
    }

    function startCreation() {
      state = null;

      creation = {
        name: "",
        pastLife: null,
        formative: null,
        weapon: null
      };

      document.getElementById(
        "enemyArea"
      ).innerHTML = "";

      document.getElementById(
        "tellArea"
      ).innerHTML = "";

      document.getElementById(
        "initiativeArea"
      ).innerHTML = "";

      document.getElementById(
        "executionArea"
      ).innerHTML = "";

      document.getElementById(
        "rollArea"
      ).innerHTML = "";

      document.getElementById(
        "storyHeading"
      ).textContent =
        "前世已盡";

      document.getElementById(
        "storyText"
      ).innerHTML = `
        <p>你原本生活在另一個時代。</p>

        <p>
          死亡之後，你沒有迎來虛無。
          再次睜眼時，屋頂是煙燻發黑的木樑，
          窗外有人談論漢室、徵斂與太平道。
        </p>

        <p>
          你帶著前世記憶，在東漢末年重新出生。
          但記憶本身不是力量。這具身體仍要重新成長，
          兵刃仍會割開血肉，而你熟悉的歷史亦可能被改寫。
        </p>

        <div class="creation-box">
          <label for="nameInput">今世姓名</label>

          <input
            id="nameInput"
            type="text"
            maxlength="12"
            placeholder="例如：沈越"
            autocomplete="off"
            enterkeyhint="done"
          >
        </div>
      `;

      renderActions(
        Object.entries(
          PAST_LIVES
        ).map(([key, pastLife]) => ({
          label: pastLife.name,
          note: pastLife.description,
          className: "info",
          handler: () =>
            choosePastLife(key)
        }))
      );

      renderAll();
    }

    function choosePastLife(key) {
      const input =
        document.getElementById(
          "nameInput"
        );

      const name =
        input.value.trim();

      if (!name) {
        alert("請先輸入今世姓名。");

        input.focus();
        buttonsLocked = false;

        document
          .querySelectorAll(
            "#actions button"
          )
          .forEach(button => {
            button.disabled = false;
          });

        return;
      }

      creation.name =
        name.slice(0, 12);

      creation.pastLife = key;

      setScene(
        "兩世記憶",
        [
          `${creation.name}，你在漢末一戶尋常人家長大。`,

          `前世的你是「${PAST_LIVES[key].name}」。`,

          "你無法向任何人證明自己曾活在千多年後，只能將記憶藏在心底。",

          "成長期間，邊一段經歷對你影響最大？"
        ],

        Object.entries(
          FORMATIVE_CHOICES
        ).map(([choiceKey, choice]) => ({
          label: choice.name,
          note: choice.description,
          handler: () =>
            chooseFormative(choiceKey)
        }))
      );
    }

    function chooseFormative(key) {
      creation.formative = key;

      setScene(
        "光和六年・大亂前夕",
        [
          `十八歲時，你已經因「${FORMATIVE_CHOICES[key].name}」形成自己的本領。`,

          "你記得黃巾之亂將近，但準確日期與細節已經模糊。",

          "附近村落準備押送糧藥穿過黑松嶺。山路近來有盜匪出沒，鄉勇讓你從有限兵械中選一件上陣。"
        ],

        Object.entries(
          WEAPONS
        ).map(([weaponKey, weapon]) => ({
          label: weapon.name,

          note:
            `${weapon.description} ` +
            `命中 ${signed(weapon.accuracy)}・` +
            `衝擊 d${weapon.damageSides}`,

          handler: () =>
            chooseWeapon(weaponKey)
        }))
      );
    }

    function chooseWeapon(key) {
      creation.weapon = key;

      startCombat(
        createHiddenSeed()
      );
    }

    function startCombat(seed) {
      seedRng(seed);

      state = {
        phase: "combat",
        seed,
        round: 1,
        initiative: 0,
        player: buildPlayer(),
        enemy: buildEnemy(),
        intent: null,
        tell: ""
      };

      state.intent =
        chooseEnemyIntent();

      state.tell =
        currentTell();

      setScene(
        "黑松嶺・山道叫陣",
        [
          "糧隊走入山道深處時，坡上忽然傳來碎石滾動的聲音。",

          "十餘名山賊從林間現身，弓箭與短矛對準糧車。一名虯髯大漢提著缺口山刀走落山道。",

          "『留下糧車，我可以讓其他人走。若有人自認是好漢，便出來與韓魁決個生死！』",

          "你知道歷史上的黃巾大亂即將來臨，卻可能先死在一個史書從未記載的山賊手上。"
        ],

        duelActions()
      );
    }

    function endingActions() {
      return [
        {
          label: "重試同一骰局",
          note:
            "角色、敵人與骰局起點保持不變，可以改用另一套戰術。",
          className: "safe",
          handler: () =>
            startCombat(state.seed)
        },

        {
          label: "以新骰局重試",
          note:
            "角色保持不變，重新產生所有骰局。",
          handler: () =>
            startCombat(
              createHiddenSeed()
            )
        },

        {
          label: "建立新人物",
          className: "danger",
          handler: startCreation
        }
      ];
    }

    startCreation();
  </script>
</body>
</html>
