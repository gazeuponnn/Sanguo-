<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#17110d">
  <title>逆命錄・V3.2</title>

  <style>
    :root {
      color-scheme: dark;
      --black: #0d0a08;
      --deep: #17110d;
      --panel: #211812;
      --panel-soft: #2b2018;
      --parchment: #decda6;
      --parchment-bright: #f1e4c4;
      --muted: #a99472;
      --border: #6c5234;
      --border-bright: #9b784c;
      --blood: #8c2924;
      --blood-bright: #bd493d;
      --gold: #c69a4b;
      --green: #72885d;
      --shadow: rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--black);
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
      color: var(--parchment);
      background:
        radial-gradient(circle at 50% 0%, rgba(122, 84, 46, 0.16), transparent 35rem),
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.012) 0,
          rgba(255, 255, 255, 0.012) 1px,
          transparent 1px,
          transparent 5px
        ),
        var(--black);
      font-family:
        "Songti TC",
        "Noto Serif TC",
        "PingFang TC",
        "Microsoft JhengHei",
        serif;
      line-height: 1.65;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 14px;
    }

    .masthead {
      padding: 18px 16px 14px;
      margin-bottom: 12px;
      text-align: center;
      border: 1px solid var(--border);
      background:
        linear-gradient(rgba(27, 19, 14, 0.92), rgba(18, 13, 10, 0.96)),
        var(--panel);
      box-shadow: 0 8px 24px var(--shadow);
    }

    .masthead h1 {
      margin: 0;
      color: var(--parchment-bright);
      font-size: clamp(1.9rem, 7vw, 3rem);
      letter-spacing: 0.22em;
      text-indent: 0.22em;
      font-weight: 700;
    }

    .masthead p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.12em;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(250px, 320px) minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .character-panel,
    .story-panel {
      border: 1px solid var(--border);
      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.018),
          transparent 40%
        ),
        var(--panel);
      box-shadow: 0 8px 24px var(--shadow);
    }

    .character-panel {
      position: sticky;
      top: 12px;
      padding: 15px;
    }

    .story-panel {
      min-height: 640px;
      padding: clamp(16px, 4vw, 28px);
    }

    .panel-title {
      margin: 0 0 12px;
      padding-bottom: 8px;
      color: var(--gold);
      border-bottom: 1px solid var(--border);
      font-size: 1rem;
      letter-spacing: 0.13em;
    }

    .identity {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
      margin-bottom: 12px;
    }

    .identity strong {
      color: var(--parchment-bright);
      font-size: 1.35rem;
      overflow-wrap: anywhere;
    }

    .identity span {
      flex: none;
      color: var(--muted);
    }

    .hp-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 5px;
      font-size: 0.92rem;
    }

    .hp-track {
      height: 13px;
      margin-bottom: 13px;
      overflow: hidden;
      border: 1px solid #67433a;
      background: #100c0a;
    }

    .hp-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #6f1c1a, var(--blood-bright));
      transition: width 240ms ease;
    }

    .abilities {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
      margin: 12px 0;
    }

    .ability {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 3px;
      border-bottom: 1px dotted rgba(222, 205, 166, 0.22);
    }

    .ability span:last-child {
      color: var(--parchment-bright);
      font-variant-numeric: tabular-nums;
    }

    .info-block {
      margin-top: 13px;
      padding-top: 10px;
      border-top: 1px solid rgba(108, 82, 52, 0.7);
    }

    .info-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
    }

    .info-value {
      color: var(--parchment-bright);
      overflow-wrap: anywhere;
    }

    .equipment-detail {
      display: block;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .status-box {
      margin-top: 13px;
      padding: 10px;
      border-left: 3px solid var(--gold);
      background: rgba(0, 0, 0, 0.19);
    }

    .story-heading {
      margin: 0 0 15px;
      color: var(--parchment-bright);
      font-size: clamp(1.35rem, 5vw, 2rem);
      line-height: 1.35;
    }

    #storyText {
      min-height: 180px;
    }

    #storyText p {
      margin: 0 0 13px;
    }

    #storyText .speech {
      color: var(--parchment-bright);
      font-weight: 600;
    }

    #storyText .warning {
      color: #e7b099;
    }

    #storyText .good {
      color: #bdc99f;
    }

    .roll-box {
      margin: 15px 0;
      padding: 10px 12px;
      border: 1px solid rgba(155, 120, 76, 0.62);
      background: rgba(8, 6, 5, 0.42);
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.79rem;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .roll-line + .roll-line {
      margin-top: 4px;
    }

    .actions-title {
      margin: 22px 0 9px;
      color: var(--gold);
      font-size: 0.9rem;
      letter-spacing: 0.12em;
    }

    #actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .action-button {
      width: 100%;
      min-height: 54px;
      padding: 12px 13px;
      color: var(--parchment-bright);
      border: 1px solid var(--border-bright);
      border-radius: 0;
      background:
        linear-gradient(rgba(71, 51, 36, 0.76), rgba(43, 31, 23, 0.9)),
        var(--panel-soft);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.28);
      cursor: pointer;
      text-align: left;
      line-height: 1.35;
    }

    .action-button:active:not(:disabled) {
      transform: translateY(1px);
      background: #513825;
    }

    .action-button.danger {
      border-color: var(--blood-bright);
      background: linear-gradient(#602824, #351b18);
    }

    .action-button.safe {
      border-color: var(--green);
    }

    .action-button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .action-button small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: normal;
    }

    .creation-box {
      padding: 14px;
      border: 1px solid rgba(155, 120, 76, 0.55);
      background: rgba(0, 0, 0, 0.18);
    }

    .creation-box label {
      display: block;
      margin-bottom: 7px;
      color: var(--gold);
    }

    .creation-box input {
      width: 100%;
      min-height: 49px;
      margin-bottom: 15px;
      padding: 10px 12px;
      color: var(--parchment-bright);
      border: 1px solid var(--border-bright);
      border-radius: 0;
      outline: none;
      background: #120e0b;
    }

    .creation-box input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(198, 154, 75, 0.17);
    }

    .choice-note {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: normal;
    }

    .enemy-card {
      margin: 13px 0;
      padding: 11px 12px;
      border: 1px solid rgba(140, 41, 36, 0.72);
      background: rgba(75, 22, 19, 0.16);
    }

    .enemy-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .enemy-track {
      height: 9px;
      margin-top: 7px;
      border: 1px solid #5e3530;
      background: #100b09;
    }

    .enemy-fill {
      height: 100%;
      background: #8f322b;
    }

    .footer {
      padding: 16px 4px 6px;
      color: #77664f;
      text-align: center;
      font-size: 0.76rem;
    }

    @media (max-width: 760px) {
      #app {
        padding: 8px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .character-panel {
        position: static;
      }

      .story-panel {
        min-height: 520px;
      }

      .character-panel .compact-mobile {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 12px;
      }
    }

    @media (max-width: 450px) {
      .masthead {
        padding: 13px 10px 11px;
      }

      .masthead h1 {
        font-size: 1.85rem;
      }

      .story-panel {
        padding: 16px 14px;
      }

      #actions {
        grid-template-columns: 1fr;
      }

      .action-button {
        min-height: 57px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main id="app">

      <h1>逆命錄</h1>
      <p>亂世生涯試卷・V3.2</p>

    <div class="layout">
      <aside class="character-panel" aria-label="人物狀態">

          <span id="playerAge">初生</span>
        </div>

        <div class="hp-header">
          <span>氣血</span>
          <span id="hpText">尚未定命</span>
        </div>
        <div class="hp-track" aria-hidden="true">
          <div id="hpFill" class="hp-fill"></div>
        </div>

        <div id="abilities" class="abilities"></div>

        <div class="compact-mobile">
          <div class="info-block">
            <span class="info-label">天賦所向</span>
            <span id="potentialText" class="info-value">尚未選定</span>
          </div>

          <div class="info-block">
            <span class="info-label">傷勢</span>
            <span id="injuryText" class="info-value">無</span>
          </div>

          <div class="info-block">
            <span class="info-label">兵器</span>
            <span id="weaponText" class="info-value">尚未持兵</span>
            <span id="weaponDetail" class="equipment-detail"></span>
          </div>

          <div class="info-block">
            <span class="info-label">甲衣</span>
            <span id="armourText" class="info-value">尋常布衣</span>
            <span id="armourDetail" class="equipment-detail"></span>
          </div>
        </div>

        <div class="status-box">
          <span class="info-label">此刻境況</span>
          <span id="battleStatus" class="info-value">命書尚未展開</span>
        </div>
      </aside>

      <section class="story-panel" aria-live="polite">
        <h2 id="storyHeading" class="story-heading">一頁無字之書</h2>
        <div id="storyText"></div>
        <div id="enemyArea"></div>
        <div id="rollArea"></div>

        <h3 class="actions-title">你要如何做？</h3>
        <div id="actions"></div>
      </section>
    </div>

    <footer class="footer">
      本卷止於你的第一場真實戰役。生死皆不受天命偏袒。
    </footer>
  </main>

  let state;
  let rngState = 1;
  let encounterSnapshot = null;
  let encounterSeed = null;

  const lastTextChoice = {};

  function deepClone(value) {
    return JSON.parse(JSON.stringify(value));
  }

  function clamp(number, minimum, maximum) {
    return Math.max(minimum, Math.min(maximum, number));
  }

  function signed(number) {
    return number >= 0 ? `+${number}` : `${number}`;
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function createSeed() {
    if (window.crypto && window.crypto.getRandomValues) {
      const values = new Uint32Array(1);
      window.crypto.getRandomValues(values);
      return values[0] || 1;
    }

    return (
      (
        Date.now() ^
        Math.floor(Math.random() * 4294967295)
      ) >>> 0
    ) || 1;
  }

  function seedRng(seed) {
    rngState = seed >>> 0 || 1;
  }

  function random() {
    rngState += 0x6D2B79F5;

    let value = rngState;

    value = Math.imul(
      value ^ (value >>> 15),
      value | 1
    );

    value ^= value + Math.imul(
      value ^ (value >>> 7),
      value | 61
    );

    return (
      (value ^ (value >>> 14)) >>> 0
    ) / 4294967296;
  }

  function die(sides) {
    return Math.floor(random() * sides) + 1;
  }

  function varied(key, choices) {
    let index = Math.floor(random() * choices.length);

    if (
      choices.length > 1 &&
      lastTextChoice[key] === index
    ) {
      index = (
        index +
        1 +
        Math.floor(random() * (choices.length - 1))
      ) % choices.length;
    }

    lastTextChoice[key] = index;
    return choices[index];
  }

  function abilityModifier(score) {
    return clamp(
      Math.round((score - 50) / 12.5),
      -3,
      5
    );
  }

  function skillModifier(score) {
    return clamp(
      Math.round((score - 40) / 15),
      -2,
      4
    );
  }

  function newState() {
    return {
      locked: false,
      phase: "creation",
      name: "未題名",
      age: 0,

      maxHp: 30,
      hp: 30,

      pastLife: null,

      abilities: {
        might: 50,
        agility: 50,
        endurance: 50,
        perception: 50,
        intellect: 50,
        will: 50,
        presence: 50
      },

        blade: 20,
        spear: 20,
        polearm: 15,
        archery: 15,
        dueling: 20,
        awareness: 20,
        command: 15,
        tactics: 15,
        medicine: 10
      },

      weapon: null,
      armour: null,
      injury: "無",

      childhoodIndex: 0,
      status: "命書尚未展開",

      ambushDetected: null,
      enemyLocated: false,
      duelActive: false,

      friendlyMorale: 50,
      enemyMorale: 60,

  function cloneEnemy() {
    return deepClone(ENEMY_TEMPLATE);
  }

  function applyGrowth(gains, skillGains) {
    Object.entries(gains || {}).forEach(
      ([ability, amount]) => {
        state.abilities[ability] = clamp(
          state.abilities[ability] + amount,
          0,
          99
        );
      }
    );

    Object.entries(skillGains || {}).forEach(
      ([skill, amount]) => {
        state.skills[skill] = clamp(
          state.skills[skill] + amount,
          0,
          99
        );
      }
    );
  }

  function updateMaxHp() {
    const enduranceBonus =
      abilityModifier(state.abilities.endurance);

    state.maxHp = Math.max(
      26,
      31 + enduranceBonus * 2
    );

    state.hp = state.maxHp;
  }

  function formatParagraphs(paragraphs) {
    return paragraphs
      .filter(Boolean)
      .map((paragraph) => {
        const className =
          paragraph.startsWith("『")
            ? "speech"
            : "";

        return (
          `<p class="${className}">` +
          `${escapeHtml(paragraph)}` +
          `</p>`
        );
      })
      .join("");
  }

  function playerDefence(extra = 0) {
    const armourDefence =
      state.armour
        ? state.armour.defence
        : 0;

    const agility =
      abilityModifier(
        state.abilities.agility
      );

    const dueling =
      skillModifier(
        state.skills.dueling
      );

    const injuryPenalty =
      state.injury === "無"
        ? 0
        : state.hp <= state.maxHp * 0.3
          ? 2
          : 1;

    return (
      10 +
      armourDefence +
      agility +
      Math.max(0, dueling) +
      extra -
      injuryPenalty
    );
  }

  function enemyDefence() {
    const agility =
      abilityModifier(
        state.enemy.abilities.agility
      );

    const dueling =
      skillModifier(
        state.enemy.skills.dueling
      );

    return (
      10 +
      state.enemy.armour.defence +
      agility +
      Math.max(0, dueling)
    );
  }

  function battlefieldModifier(forPlayer = true) {
    let modifier = 0;

    if (state.friendlyMorale >= 70) {
      modifier += 1;
    }

    if (state.friendlyMorale <= 30) {
      modifier -= 1;
    }

    if (state.position >= 2) {
      modifier += 1;
    }

    if (state.position <= -2) {
      modifier -= 1;
    }

    if (!forPlayer) {
      modifier = -modifier;
      modifier += state.enemyAdvantage;

      if (state.enemyMorale >= 75) {
        modifier += 1;
      }

      if (state.enemyMorale <= 25) {
        modifier -= 1;
      }
    }

    return clamp(modifier, -3, 4);
  }

  function rollCheck(
    ability,
    dc,
    extra = 0,
    skill = null
  ) {
    const natural = die(20);

    const abilityMod =
      abilityModifier(
        state.abilities[ability]
      );

    const skillMod =
      skill
        ? skillModifier(state.skills[skill])
        : 0;

    const total =
      natural +
      abilityMod +
      skillMod +
      extra;

    const success =
      natural === 20 ||
      (
        natural !== 1 &&
        total >= dc
      );

    return {
      natural,
      abilityMod,
      skillMod,
      extra,
      total,
      dc,
      success,
      critical: natural === 20,
      disaster: natural === 1
    };
  }

  function checkLine(result, label) {
    return (
      `${label}：d20 ${result.natural} ` +
      `${signed(result.abilityMod)} 能力 ` +
      `${signed(result.skillMod)} 技能 ` +
      `${signed(result.extra)} 戰況 ` +
      `= ${result.total}，對抗 ${result.dc}`
    );
  }

  function damageRoll(
    sides,
    critical,
    reduction
  ) {
    const rolls = [die(sides)];

    if (critical) {
      rolls.push(die(sides));
    }

    const raw = rolls.reduce(
      (sum, value) => sum + value,
      0
    );

    const final = Math.max(
      0,
      raw - reduction
    );

    return {
      rolls,
      raw,
      reduction,
      final
    };
  }

  function damageLine(result, weaponName) {
    return (
      `${weaponName}：${result.rolls.join(" + ")}，` +
      `甲衣抵去 ${result.reduction}，` +
      `造成 ${result.final} 點傷害`
    );
  }

  function updateInjuryFromHp(critical = false) {
    if (state.hp <= 0) {
      return;
    }

    const ratio =
      state.hp / state.maxHp;

    if (
      critical &&
      ratio <= 0.45
    ) {
      state.injury = varied(
        "seriousInjury",
        [
          "肋側深創",
          "肩骨重挫",
          "大腿裂傷"
        ]
      );
    } else if (
      critical &&
      state.injury === "無"
    ) {
      state.injury = varied(
        "criticalInjury",
        [
          "額角裂傷",
          "左臂刀創",
          "胸腹挫傷"
        ]
      );
    } else if (
      ratio <= 0.3 &&
      state.injury === "無"
    ) {
      state.injury = varied(
        "lowHpInjury",
        [
          "失血眩暈",
          "多處創傷",
          "步履不穩"
        ]
      );
    } else if (
      ratio <= 0.65 &&
      state.injury === "無"
    ) {
      state.injury = varied(
        "minorInjury",
        [
          "皮肉傷",
          "手臂擦傷",
          "肩背瘀傷"
        ]
      );
    }
  }

  function naturalBattleStatus() {
    if (state.phase === "creation") {
      return "命書尚未展開";
    }

    if (state.phase === "childhood") {
      return "尚在漢末成長";
    }

    if (state.phase === "equipment") {
      return "即將第一次披甲";
    }

    if (state.phase === "road") {
      return "正隨鄉勇進入山道";
    }

    if (state.phase === "challenge") {
      return "賊首攔路叫陣";
    }

    if (state.phase === "duel") {
      if (
        state.hp <=
        state.maxHp * 0.3
      ) {
        return "血染衣甲，生死只在數合";
      }

      if (
        state.enemy.hp <=
        state.enemy.maxHp * 0.35
      ) {
        return "賊首腳步已亂";
      }

      if (state.exposed) {
        return "韓魁露出空門";
      }

      return "正與山賊頭領交鋒";
    }

    if (state.phase === "battlefield") {
      const pieces = [];

      if (state.friendlyMorale <= 30) {
        pieces.push("眾人已有潰意");
      } else if (
        state.friendlyMorale >= 70
      ) {
        pieces.push("鄉勇鬥志正盛");
      } else {
        pieces.push("軍心仍在動搖");
      }

      if (state.formation <= 30) {
        pieces.push("隊形散亂");
      } else if (
        state.formation >= 70
      ) {
        pieces.push("陣腳穩固");
      } else {
        pieces.push("尚能勉強相護");
      }

      return pieces.join("，");
    }

    if (state.phase === "victory") {
      return "山賊敗退，首戰得勝";
    }

    if (state.phase === "defeat") {
      return "首戰失利，僥倖生還";
    }

    if (state.phase === "death") {
      return "命絕黑松嶺";
    }

    return state.status;
  }

            `命中 ${signed(state.weapon.attack)}・` +

  function renderEnemy() {
    const area =
      document.getElementById(
        "enemyArea"
      );

    if (
      state.phase !== "duel" ||
      state.enemy.hp <= 0
    ) {
      area.innerHTML = "";
      return;
    }

    const safeEnemyHp =
      Math.max(0, state.enemy.hp);

    const percentage = clamp(
      safeEnemyHp /
      state.enemy.maxHp *
      100,
      0,
      100
    );

    area.innerHTML = `
      <div class="enemy-card">
        <div class="enemy-row">
          <strong>${escapeHtml(state.enemy.name)}</strong>
          <span>${safeEnemyHp} / ${state.enemy.maxHp}</span>
        </div>

        <div class="enemy-track">
          <div
            class="enemy-fill"
            style="width:${percentage}%"
          ></div>
        </div>

        <span class="equipment-detail">
          ${escapeHtml(state.enemy.weapon.name)}・
          ${escapeHtml(state.enemy.armour.name)}
        </span>
      </div>
    `;
  }

  function setScene(
    heading,
    paragraphs,
    rolls,
    actions
  ) {
    state.locked = false;

    renderSidebar();

    document.getElementById(
      "storyHeading"
    ).textContent = heading;

    document.getElementById(
      "storyText"
    ).innerHTML =
      formatParagraphs(paragraphs);

    const rollArea =
      document.getElementById(
        "rollArea"
      );

    if (rolls && rolls.length > 0) {
      rollArea.innerHTML = `
        <div class="roll-box" aria-label="判定結果">
          ${rolls
            .map(
              line =>
                `<div class="roll-line">${escapeHtml(line)}</div>`
            )
            .join("")}
        </div>
      `;
    } else {
      rollArea.innerHTML = "";
    }

    renderEnemy();
    setActions(actions || []);
  }

  function setActions(actions) {
    const container =
      document.getElementById(
        "actions"
      );

    container.innerHTML = "";

    actions.forEach((action) => {
      const button =
        document.createElement(
          "button"
        );

      button.type = "button";

      button.className =
        `action-button` +
        (
          action.className
            ? ` ${action.className}`
            : ""
        );

      button.innerHTML =
        `${escapeHtml(action.label)}` +
        (
          action.note
            ? `<small>${escapeHtml(action.note)}</small>`
            : ""
        );

      button.addEventListener(
        "click",
        () => {
          if (
            state.locked ||
            (
              state.hp <= 0 &&
              state.phase !== "death"
            )
          ) {
            return;
          }

          state.locked = true;

          container
            .querySelectorAll("button")
            .forEach((item) => {
              item.disabled = true;
            });

          action.handler();
        },
        { once: true }
      );

      container.appendChild(button);
    });
  }

  function choosePastLife(key) {
    const input =
      document.getElementById(
        "nameInput"
      );

    const chosenName =
      input
        ? input.value.trim()
        : "";

    if (!chosenName) {
      state.locked = false;

      document
        .querySelectorAll(
          "#actions button"
        )
        .forEach((button) => {
          button.disabled = false;
        });

      alert("請先寫下今世姓名。");

      if (input) {
        input.focus();
      }

      return;
    }

    state.name =
      chosenName.slice(0, 12);

    state.pastLife = key;

    state.abilities =
      deepClone(
        PAST_LIVES[key].scores
      );

    state.skills =
      deepClone(
        PAST_LIVES[key].skills
      );

    state.age = 1;
    state.phase = "childhood";

    updateMaxHp();

    setScene(
      "生於漢末",
      [
        `${state.name}，你嘅名字被寫入一戶尋常人家嘅舊冊。`,

        `前世嘅你係「${PAST_LIVES[key].name}」。某啲記憶仍然清晰，更多內容就好似夢境一樣逐年淡化。`,

        "你知道東漢將亂，卻暫時只係一個連路都未行得穩嘅孩子。"
      ],
      [],
      [
        {
          label: "讓歲月向前",
          handler: showChildhoodStage
        }
      ]
    );
  }

  function showChildhoodStage() {
    const stage =
      childhoodStages[
        state.childhoodIndex
      ];

    state.age = stage.age;
    state.phase = "childhood";

    setScene(
      stage.heading,
      [stage.intro],
      [],
      stage.choices.map(
        (choice) => ({
          label: choice.label,
          handler: () =>
            resolveChildhoodChoice(
              choice
            )
        })
      )
    );
  }

  function resolveChildhoodChoice(choice) {
    const oldAbilities =
      deepClone(state.abilities);

    const oldSkills =
      deepClone(state.skills);

    applyGrowth(
      choice.gains,
      choice.skillGains
    );

    updateMaxHp();

    const growthDescriptions = [];

    Object.entries(
      choice.gains || {}
    ).forEach(([ability]) => {
      const actual =
        state.abilities[ability] -
        oldAbilities[ability];

      growthDescriptions.push(
        `${ABILITY_NAMES[ability]}有所精進（${signed(actual)}）`
      );
    });

    Object.entries(
      choice.skillGains || {}
    ).forEach(([skill]) => {
      const actual =
        state.skills[skill] -
        oldSkills[skill];

      growthDescriptions.push(
        `${SKILL_NAMES[skill]}有所精進（${signed(actual)}）`
      );
    });

    state.childhoodIndex += 1;

    if (
      state.childhoodIndex <
      childhoodStages.length
    ) {
      setScene(
        "歲月留痕",
        [
          choice.text,

          "呢啲改變唔會立即令你名震天下，但會一點一滴決定你日後能夠走到幾遠。"
        ],
        growthDescriptions,
        [
          {
            label: "走向下一段歲月",
            handler: showChildhoodStage
          }
        ]
      );

      return;
    }

    state.age = 18;
    state.phase = "equipment";

    setScene(
      "光和六年・大亂前夕",
      [
        choice.text,

        "你記得黃巾之亂即將爆發，但準確日子同細節已經模糊。附近村落仍然耕作，官吏仍然催稅，只有愈來愈多流民同秘密集會令人不安。",

        "呢一年，附近數村決定合力押送糧藥穿過黑松嶺。山中盜匪已經劫過兩隊商旅，鄉勇缺少能夠持兵嘅人。",

        "村中拿出僅有嘅幾套兵械，畀你選擇第一次真正上陣所持之物。"
      ],
      growthDescriptions,
      equipmentActions()
    );
  }

  function equipmentActions() {
    return [
      {
        label: "取百鍊環首刀與綴片皮甲",
        note: "刀勢穩健，攻守平衡。",
        handler: () =>
          chooseEquipment(
            "sword",
            "leather"
          )
      },

      {
        label: "取白蠟短矛與輕皮護衣",
        note: "較容易命中，護身稍薄。",
        handler: () =>
          chooseEquipment(
            "spear",
            "light"
          )
      },

      {
        label: "取沉背戰斧與厚絮戰衣",
        note: "命中較難，但傷害沉重。",
        handler: () =>
          chooseEquipment(
            "axe",
            "padded"
          )
      },

      {
        label: "取舊制鐵劍與綴片皮甲",
        note: "依靠身法進退，冇明顯短處。",
        handler: () =>
          chooseEquipment(
            "straightSword",
            "leather"
          )
      }
    ];

  function chooseEquipment(
    weaponKey,
    armourKey
  ) {
    state.weapon =
      deepClone(
        WEAPONS[weaponKey]
      );

    state.armour =
      deepClone(
        ARMOURS[armourKey]
      );

    state.skills[
      state.weapon.skill
    ] = clamp(
      state.skills[state.weapon.skill] + 6,
      0,
      99
    );

    state.phase = "road";

    updateMaxHp();

    encounterSnapshot =
      deepClone(state);

    encounterSeed =
      createSeed();

    seedRng(encounterSeed);

    setScene(
      "第一次披甲",
      [
        `你握住${state.weapon.name}，試過分量。${state.weapon.flavour}`,

        `身上嘅${state.armour.name}並唔華美。${state.armour.flavour}`,

        "呢啲都唔係傳說中嘅神兵寶甲，卻足以決定今日邊個可以活住離開山道。"
      ],
      [],
      [
        {
          label: "隨隊進入黑松嶺",
          className: "danger",
          handler: showRoadApproach
        }
      ]
    );
  }

  function restartEncounter(
    useSameSeed
  ) {
    state =
      deepClone(
        encounterSnapshot
      );

    state.locked = false;
    state.phase = "road";
    state.enemy = cloneEnemy();

    if (!useSameSeed) {
      encounterSeed =
        createSeed();
    }

    seedRng(encounterSeed);

    showRoadApproach();
  }

  function showRoadApproach() {
    state.phase = "road";
    state.status =
      "隊伍正進入狹窄山道";

    setScene(
      "黑松嶺山道",
      [
        "午後霧氣沿山腰沉落。運糧車輪陷入濕泥，十餘名鄉勇前後拉成一條長線。",

        "兩側林木過密，山壁與斜坡遮住更遠處嘅動靜。領隊催促眾人加快腳步。",

        "你決定點樣走過呢段山路？"
      ],
      [],
      [
        {
          label: "仔細觀察四周",
          handler: () =>
            resolveDetection(
              "observe"
            )
        },

        {
          label: "靠近糧車，與眾人保持照應",
          handler: () =>
            resolveDetection(
              "formation"
            )
        },

        {
          label: "先行數十步探看前路",
          handler: () =>
            resolveDetection(
              "advance"
            )
        }
      ]
    );
  }

  function resolveDetection(approach) {
    let ability;
    let skill;
    let dc;
    let extra = 0;

    if (approach === "observe") {
      ability = "perception";
      skill = "awareness";
      dc = 13;
      extra = 1;
    } else if (
      approach === "formation"
    ) {
      ability = "intellect";
      skill = "tactics";
      dc = 13;
    } else {
      ability = "agility";
      skill = "awareness";
      dc = 14;
      extra = -1;
    }

    const result =
      rollCheck(
        ability,
        dc,
        extra,
        skill
      );

    state.ambushDetected =
      result.success;

    if (result.success) {
      state.friendlyMorale = 58;
      state.enemyMorale = 60;
      state.position = 1;
      state.formation = 58;
      state.enemyAdvantage = 0;
      state.danger = 2;

      showDetectedAmbush(
        approach,
        result.critical
      );
    } else {
      state.friendlyMorale =
        result.disaster
          ? 30
          : 38;

      state.enemyMorale =
        result.disaster
          ? 78
          : 72;

      state.position =
        result.disaster
          ? -3
          : -2;

      state.formation =
        result.disaster
          ? 18
          : 27;

      state.enemyAdvantage =
        result.disaster
          ? 4
          : 3;

      state.danger = 4;

      showFailedAmbush(
        approach,
        result.disaster
      );
    }
  }

  function showDetectedAmbush(
    approach,
    critical
  ) {
    state.phase = "challenge";

    const approachText = {
      observe:
        "你冇只係望向林間，而係留意路旁泥地。幾枚新落松針被靴底壓入濕土，坡上卻冇樵夫。",

      formation:
        "糧車轉過彎口時，你發現前後腳步聲唔對。自己人全部喺山道，坡頂卻另有碎石被踩落。",

      advance:
        "你先行越過突出山石，忽然聽到上方有人壓低聲音喝止同伴。"
    };

    const extra = critical
      ? "你喺第一支箭離弦之前高聲示警。鄉勇立即靠向糧車，冇人被首輪箭矢射倒。"
      : "你猛然喝停隊伍。幾乎同一刻，坡上弓弦輕響；首輪箭矢落喺眾人原本將要踏入嘅位置。";

    setScene(
      "林上伏兵",
      [
        approachText[approach],
        extra,

        "灌木被人分開。一名滿臉虯髯嘅大漢提住缺口山刀走落山道，身後十餘名賊眾吶喊助威。",

        "『好個眼尖小兒！某乃黑石寨韓魁。爾等若有膽氣，便遣一人與我決生死；若無膽，糧車與甲兵盡數留下！』"
      ],
      [
        "一次隱藏警覺判定已經完成。"
      ],
      [
        {
          label: "迎戰韓魁",
          className: "danger",
          handler: startDuel
        },

        {
          label: "拒絕單挑，令眾人守住糧車",
          className: "safe",
          handler: refuseDuel
        }
      ]
    );
  }

  function showFailedAmbush(
    approach,
    disaster
  ) {
    state.phase = "battlefield";

    const approachText = {
      observe:
        "你反覆掃視林間，卻被風吹枝影誤導。真正伏兵藏喺更高處嘅斷坡後。",

      formation:
        "你靠向糧車時，隊伍已經進入最窄彎口。前車突然停低，後方眾人仍然繼續擁上。",

      advance:
        "你越過彎口後回頭，自己與隊伍之間已經落下數根滾木。"
    };

    const disasterText = disaster
      ? "一支箭擦過你頭側，另一名鄉勇當場倒下。有人高喊逃命，鬆散隊列瞬間斷成數截。"
      : "坡上突然響起吶喊。碎石與箭矢一同落下，牲口受驚，糧車橫喺路中。";

    setScene(
      "伏擊驟發",
      [
        approachText[approach],
        disasterText,

        "你冇睇清賊首所在，亦冇人嚟到陣前叫戰。此刻只有混亂、飛矢，同由兩側坡地壓落嚟嘅山賊。",

        "你必須先令身邊嘅人捱過呢輪伏擊。"
      ],
      [
        "一次隱藏警覺判定已經完成。"
      ],
      battlefieldActions()
    );
  }

  function startDuel() {
    state.phase = "duel";
    state.duelActive = true;
    state.enemy = cloneEnemy();
    state.exposed = false;
    state.executionAttempted = false;

    setScene(
      "山道鬥將",
      [
        "你越過糧車，踏入山道中央。左右鄉勇讓開窄路，林上賊眾亦逐漸收聲。",

        `韓魁將${state.enemy.weapon.name}扛上肩頭，咧嘴露出黃牙。`,

        "『亂世敢企出嚟便算半條好漢。另一半，要睇你嘅血係咪熱！』"
      ],
      [],
      duelActions()
    );
  }

  function refuseDuel() {
    state.phase = "battlefield";
    state.duelActive = false;

    state.friendlyMorale = 52;
    state.enemyMorale = 68;
    state.position = 0;
    state.formation = 57;
    state.enemyAdvantage = 1;
    state.danger = 2;
    state.enemyLocated = true;

    setScene(
      "不受賊言所激",
      [
        "你冇走出隊列，而係將兵刃橫喺糧車旁。",

        "『此行為護鄉民糧藥，唔係成全你一人威風。要取糧車，便嚟撞我哋嘅陣！』",

        "韓魁冷笑揮刀，命群賊壓落山道。敵人聲勢更盛，但你哋嘅隊形尚未散亂。"
      ],
      [],
      battlefieldActions()
    );
  }

  function duelActions() {
    if (
      state.hp <= 0 ||
      state.enemy.hp <= 0
    ) {
      return [];
    }

    const actions = [
      {
        label:
          `以${state.weapon.name}進攻`,
        handler: playerAttack
      },

      {
        label: "沉身守勢，伺機反擊",
        note:
          "提高本回合防護，並嘗試取得更有利位置。",
        handler: defendInDuel
      },

      {
        label: "厲聲挫其膽氣",
        note:
          "嘗試動搖韓魁與旁觀賊眾，但仍可能遭到攻擊。",
        handler: intimidateInDuel
      }
    ];

    const weaponSkill =
      state.skills[
        state.weapon.skill
      ];

    const martialAbility =
      state.abilities[
        state.weapon.ability
      ];

    const executionAvailable =
      (
        martialAbility >= 67 ||
        weaponSkill >= 55
      ) &&
      state.enemy.hp <
        state.enemy.maxHp &&
      (
        state.enemy.hp <=
          state.enemy.maxHp * 0.35 ||
        state.exposed
      ) &&
      !state.executionAttempted;

    if (executionAvailable) {
      actions.unshift({
        label:
          "踏入斬殺線，決死一擊",

        note:
          "只有此刻能夠出手。成功可以斬殺韓魁；失敗會將自己暴露喺山刀之下。",

        className: "danger",
        handler: executeEnemy
      });
    }

    return actions;
  }

  function playerAttack() {
    const natural = die(20);

    const abilityKey =
      state.weapon.ability;

    const skillKey =
      state.weapon.skill;

    const abilityMod =
      abilityModifier(
        state.abilities[abilityKey]
      );

    const skillMod =
      skillModifier(
        state.skills[skillKey]
      );

    const fieldMod =
      battlefieldModifier(true);

    const exposedBonus =
      state.exposed ? 2 : 0;

    const injuryPenalty =
      state.injury === "無"
        ? 0
        : 1;

    const total =
      natural +
      state.weapon.attack +
      abilityMod +
      skillMod +
      fieldMod +
      exposedBonus -
      injuryPenalty;

    const defence =
      enemyDefence();

    const hit =
      natural === 20 ||
      (
        natural !== 1 &&
        total >= defence
      );

    const rolls = [
      (
        `攻擊：d20 ${natural} ` +
        `${signed(state.weapon.attack)} 兵器 ` +
        `${signed(abilityMod)} 能力 ` +
        `${signed(skillMod)} 武技 ` +
        `${signed(fieldMod + exposedBonus)} 戰況 ` +
        `${signed(-injuryPenalty)} 傷勢 ` +
        `= ${total}，對抗 ${defence}`
      )
    ];

    const paragraphs = [];

    if (natural === 1) {
      state.exposed = false;

      state.position =
        Math.max(
          -3,
          state.position - 1
        );

      paragraphs.push(
        varied(
          "playerNat1",
          [
            "你腳下踩中鬆動碎石，刀勢尚未展開就偏向山壁。韓魁立即睇見空門。",

            "你出手過急，兵刃擦過韓魁肩側，反被刀背震得雙臂發麻。",

            "一名山賊突然喺旁高喊。你分神半瞬，韓魁已經欺近。"
          ]
        )
      );
    } else if (!hit) {
      state.exposed = false;

      paragraphs.push(
        varied(
          "playerMiss",
          [
            "韓魁看似粗重，退步卻唔慢。你嘅刃鋒由佢胸前掠過，只割斷半截皮帶。",

            "兵刃相撞，震聲沿山壁迴盪。韓魁將攻勢推向一旁，仍然穩穩企住。",

            "你試圖逼佢靠向糧車，韓魁卻橫刀卡住路線。"
          ]
        )
      );
    } else {
      const damage =
        damageRoll(
          state.weapon.sides,
          natural === 20,
          state.enemy.armour.reduction
        );

      state.enemy.hp =
        Math.max(
          0,
          state.enemy.hp -
          damage.final
        );

      state.exposed = false;

      rolls.push(
        damageLine(
          damage,
          state.weapon.name
        )
      );

      if (natural === 20) {
        state.enemyMorale =
          clamp(
            state.enemyMorale - 14,
            0,
            100
          );

        state.friendlyMorale =
          clamp(
            state.friendlyMorale + 10,
            0,
            100
          );

        paragraphs.push(
          varied(
            "playerCrit",
            [
              "你迎住刀光踏入半步，刃鋒由韓魁格擋空隙斬入。血沿甲縫湧出，兩側賊眾嘅叫喊同時一停。",

              "韓魁先啱啱舉刀，你已經轉到佢外側。呢一擊撕開皮甲，將佢劈得撞向山壁。",

              "雙刃交錯一瞬，你突然變勢。韓魁胸前裂開血口，狂笑變成沉重喘息。"
            ]
          )
        );
      } else if (
        damage.final === 0
      ) {
        paragraphs.push(
          "兵刃正中韓魁硬皮坎肩，力道卻被厚皮卸開。佢被迫後退，身上冇留下明顯傷口。"
        );
      } else {
        paragraphs.push(
          varied(
            "playerHit",
            [
              "刀鋒越過韓魁防守，喺佢上臂帶出血線。佢怒吼住退咗半步。",

              "你先壓住山刀，再由下方挑入。韓魁腰側中刃，皮甲迅速染黑。",

              "兵刃撞開嘅剎那，你順勢切入韓魁肩頭。佢腳步已經唔及先前穩健。"
            ]
          )
        );
      }
    }

    if (state.enemy.hp <= 0) {
      winBattle(
        paragraphs.concat([
          "韓魁嘅山刀脫手墜地。佢踉蹌兩步，終於跪倒喺染血山路。",

          "賊眾眼見頭領敗亡，叫喊立即變成驚叫。有人轉身奔入林中，其餘人亦再無戰意。"
        ]),
        rolls,
        "斬將破賊"
      );

      return;
    }

    const enemyResult =
      enemyAttack(
        natural === 1 ? 2 : 0
      );

    paragraphs.push(
      ...enemyResult.paragraphs
    );

    rolls.push(
      ...enemyResult.rolls
    );

    if (state.hp <= 0) {
      showDeath(
        paragraphs,
        rolls
      );

      return;
    }

    setScene(
      "刀光未歇",
      paragraphs,
      rolls,
      duelActions()
    );
  }

  function defendInDuel() {
    const result =
      rollCheck(
        "intellect",
        12,
        battlefieldModifier(true),
        "dueling"
      );

    const paragraphs = [];
    const rolls = [
      checkLine(
        result,
        "守勢判定"
      )
    ];

    state.guarded = true;

    if (result.critical) {
      state.position =
        clamp(
          state.position + 2,
          -3,
          3
        );

      state.exposed = true;

      paragraphs.push(
        "你故意讓出半步，引韓魁將重刀劈向糧車邊緣。刀刃嵌入木板，你已經轉到佢側後。"
      );
    } else if (result.success) {
      state.position =
        clamp(
          state.position + 1,
          -3,
          3
        );

      paragraphs.push(
        varied(
          "defendSuccess",
          [
            "你冇同重刀硬碰，只以兵刃斜引其勢。韓魁連攻兩次，都被帶向空處。",

            "你壓低重心守住中線。韓魁雖然逼近數步，始終未能斬中要害。",

            "你借糧車遮住一側，迫使韓魁只能由正面出刀。局勢逐漸變得可讀。"
          ]
        )
      );
    } else {
      state.position =
        clamp(
          state.position - 1,
          -3,
          3
        );

      paragraphs.push(
        "你想借守勢誘佢深入，韓魁卻冇上當。佢以刀背猛撞兵刃，反而將你逼向山壁。"
      );
    }

    const enemyResult =
      enemyAttack(0);

    paragraphs.push(
      ...enemyResult.paragraphs
    );

    rolls.push(
      ...enemyResult.rolls
    );

    state.guarded = false;

    if (state.hp <= 0) {
      showDeath(
        paragraphs,
        rolls
      );

      return;
    }

    setScene(
      "守中待變",
      paragraphs,
      rolls,
      duelActions()
    );
  }

  function intimidateInDuel() {
    const dc =
      14 +
      Math.max(
        0,
        Math.floor(
          state.enemyMorale / 40
        )
      );

    const result =
      rollCheck(
        "presence",
        dc,
        battlefieldModifier(true),
        "command"
      );

    const paragraphs = [];

    const rolls = [
      checkLine(
        result,
        "喝陣判定"
      )
    ];

    if (result.critical) {
      state.enemyMorale =
        clamp(
          state.enemyMorale - 22,
          0,
          100
        );

      state.exposed = true;

      paragraphs.push(
        "你突然踏前，厲聲喝出韓魁方才每一次退步。山壁將聲音層層送回，賊眾竟然以為頭領已敗。韓魁暴怒回首，胸前空門盡露。"
      );
    } else if (result.success) {
      state.enemyMorale =
        clamp(
          state.enemyMorale - 12,
          0,
          100
        );

      state.exposed =
        state.enemy.hp <
        state.enemy.maxHp * 0.7;

      paragraphs.push(
        varied(
          "intimidateSuccess",
          [
            "你指出韓魁呼吸已亂，喝令賊眾早作逃命打算。林上果然傳嚟幾聲不安低語。",

            "你以兵刃直指韓魁，聲稱下一合就取佢首級。佢嘴上怒罵，握刀隻手卻不自覺收緊。",

            "你高聲令鄉勇記住賊首面貌，戰後逐戶追索。幾名山賊聞言悄悄退後。"
          ]
        )
      );
    } else {
      state.enemyMorale =
        clamp(
          state.enemyMorale + 5,
          0,
          100
        );

      paragraphs.push(
        "韓魁仰頭大笑，以刀刃重重拍打皮甲。賊眾跟住鼓噪，你嘅說話反被聲浪壓過。"
      );
    }

    const enemyResult =
      enemyAttack(
        result.disaster ? 2 : 0
      );

    paragraphs.push(
      ...enemyResult.paragraphs
    );

    rolls.push(
      ...enemyResult.rolls
    );

    if (state.hp <= 0) {
      showDeath(
        paragraphs,
        rolls
      );

      return;
    }

    setScene(
      "兩陣奪氣",
      paragraphs,
      rolls,
      duelActions()
    );
  }

  function executeEnemy() {
    state.executionAttempted = true;

    const natural = die(20);

    const abilityMod =
      abilityModifier(
        state.abilities[
          state.weapon.ability
        ]
      );

    const skillMod =
      skillModifier(
        state.skills[
          state.weapon.skill
        ]
      );

    const fieldMod =
      battlefieldModifier(true);

    const total =
      natural +
      abilityMod +
      skillMod +
      state.weapon.attack +
      fieldMod;

    const target =
      enemyDefence() + 2;

    const success =
      natural === 20 ||
      (
        natural !== 1 &&
        total >= target
      );

    const rolls = [
      (
        `決死斬擊：d20 ${natural} ` +
        `${signed(abilityMod)} 能力 ` +
        `${signed(skillMod)} 武技 ` +
        `${signed(state.weapon.attack)} 兵器 ` +
        `${signed(fieldMod)} 戰況 ` +
        `= ${total}，對抗 ${target}`
      )
    ];

    if (success) {
      const damage =
        damageRoll(
          state.weapon.sides,
          true,
          state.enemy.armour.reduction
        );

      rolls.push(
        damageLine(
          damage,
          state.weapon.name
        )
      );

      state.enemy.hp = 0;

      winBattle(
        [
          "你睇見佢腳下已亂。",

          "刀鋒已經進入斬殺線。此刻若退，韓魁尚有一戰之力；若出手，就係生死一瞬。",

          natural === 20
            ? `你由迎面落下嘅山刀之下穿過，雙手將${state.weapon.name}由韓魁肋側斬入。骨裂聲被兩軍吶喊吞沒，你旋身拔刃，韓魁重重墜入泥中。`
            : `你以肩頭撞開佢嘅兵刃，踏碎泥地全力揮斬。${state.weapon.name}破開皮甲與血肉，韓魁喉中只剩半聲怒吼，便倒落山路中央。`,

          "黑石寨眾賊望見頭領橫屍，軍心如破堤之水，頃刻潰散。"
        ],
        rolls,
        "斬殺賊首"
      );

      return;
    }

    const paragraphs = [
      "你睇見韓魁腳下已亂，決意喺呢一擊分出生死。",

      natural === 1
        ? "偏在踏步時，你受傷嘅腿突然一軟。斬擊擦住韓魁頸側飛過，胸腹完全暴露喺山刀之下。"
        : "韓魁喺最後一刻以山刀卡住兵刃。佢滿手鮮血，卻獰笑住扭身反壓，將你逼入無法收勢嘅位置。",

      "呢次機會已經失去。韓魁嘅反擊比之前更加兇狠。"
    ];

    const enemyResult =
      enemyAttack(
        natural === 1 ? 4 : 3
      );

    paragraphs.push(
      ...enemyResult.paragraphs
    );

    rolls.push(
      ...enemyResult.rolls
    );

    if (state.hp <= 0) {
      showDeath(
        paragraphs,
        rolls
      );

      return;
    }

    setScene(
      "生死一瞬",
      paragraphs,
      rolls,
      duelActions()
    );
  }

  function enemyAttack(bonus = 0) {
    if (
      state.enemy.hp <= 0 ||
      state.hp <= 0
    ) {
      return {
        paragraphs: [],
        rolls: []
      };
    }

    const natural = die(20);

    const abilityMod =
      abilityModifier(
        state.enemy.abilities[
          state.enemy.weapon.ability
        ]
      );

    const skillMod =
      skillModifier(
        state.enemy.skills[
          state.enemy.weapon.skill
        ]
      );

    const fieldMod =
      battlefieldModifier(false);

    const guardBonus =
      state.guarded ? 3 : 0;

    const defence =
      playerDefence(guardBonus);

    const total =
      natural +
      state.enemy.weapon.attack +
      abilityMod +
      skillMod +
      fieldMod +
      bonus;

    const hit =
      natural === 20 ||
      (
        natural !== 1 &&
        total >= defence
      );

    const rolls = [
      (
        `韓魁攻擊：d20 ${natural} ` +
        `${signed(state.enemy.weapon.attack)} 兵器 ` +
        `${signed(abilityMod)} 能力 ` +
        `${signed(skillMod)} 武技 ` +
        `${signed(fieldMod + bonus)} 戰況 ` +
        `= ${total}，對抗 ${defence}`
      )
    ];

    const paragraphs = [];

    if (natural === 1) {
      state.enemyMorale =
        clamp(
          state.enemyMorale - 8,
          0,
          100
        );

      state.exposed = true;

      paragraphs.push(
        varied(
          "enemyNat1",
          [
            "韓魁重刀劈落，刀刃卻卡入糧車木框。佢怒吼住拔刀，側腹完全暴露。",

            "韓魁踩中自己流下嘅血，身形突然一晃。林上賊眾發出不安驚呼。",

            "韓魁掄刀過猛，刀背撞上山壁，火星喺兩人之間炸開。佢一時無法回守。"
          ]
        )
      );

      return {
        paragraphs,
        rolls
      };
    }

    if (!hit) {
      paragraphs.push(
        varied(
          "enemyMiss",
          [
            "韓魁山刀貼住你衣甲掃過，沉重風聲幾乎令人窒息，最終冇斬實。",

            "你喺刀刃落下之前側身避開。山刀劈入泥地，濺起一片碎石。",

            "韓魁連斬數步，你用兵刃與甲肩交替遮擋，總算冇畀刀鋒咬入身體。"
          ]
        )
      );

      return {
        paragraphs,
        rolls
      };
    }

    const damage =
      damageRoll(
        state.enemy.weapon.sides,
        natural === 20,
        state.armour.reduction
      );

    state.hp =
      Math.max(
        0,
        state.hp - damage.final
      );

    updateInjuryFromHp(
      natural === 20
    );

    rolls.push(
      damageLine(
        damage,
        state.enemy.weapon.name
      )
    );

    if (natural === 20) {
      state.friendlyMorale =
        clamp(
          state.friendlyMorale - 12,
          0,
          100
        );

      state.enemyMorale =
        clamp(
          state.enemyMorale + 10,
          0,
          100
        );

      paragraphs.push(
        varied(
          "enemyCrit",
          [
            "韓魁先以刀背撞開防守，隨即旋身重斬。甲片喺巨響中迸開，你被鮮血與衝力一同掀倒。",

            "你只睇見寒光由下方翻起。山刀破開護衣，喺肋側留下深長傷口。",

            "韓魁以肩頭硬撞你嘅格擋，近身一刀斬中要害。劇痛瞬間奪走呼吸。"
          ]
        )
      );
    } else if (
      damage.final === 0
    ) {
      paragraphs.push(
        "山刀重重撞落甲衣，幾乎將你擊退。護具卸開刀勢，冇令刃口真正切入。"
      );
    } else {
      paragraphs.push(
        varied(
          "enemyHit",
          [
            "韓魁突然縮短握刀距離，刀尖由你防守旁穿入。熱血立即沿衣襟流下。",

            "你擋住正面一斬，卻被回刀割中肩臂。痛楚令持兵手短暫發麻。",

            "韓魁逼你退向山壁，趁你轉身時斬中腰側。甲衣擋去部分力道，傷口仍然火辣作痛。"
          ]
        )
      );
    }

    return {
      paragraphs,
      rolls
    };
  }

  function battlefieldActions() {
    if (state.hp <= 0) {
      return [];
    }

    const actions = [
      {
        label: "穩住隊形",
        note:
          "喝止潰散，重新組織鄉勇。",
        handler: () =>
          resolveBattlefieldAction(
            "rally"
          )
      },

      {
        label: "護住退路",
        note:
          "整理後方道路，避免全隊被堵死。",
        handler: () =>
          resolveBattlefieldAction(
            "route"
          )
      },

      {
        label: "尋找敵人位置",
        note:
          "辨認賊眾來向與坡地空隙。",
        handler: () =>
          resolveBattlefieldAction(
            "locate"
          )
      }
    ];

    const canCounter =
      state.formation >= 43 &&
      state.position >= -1 &&
      (
        state.enemyLocated ||
        state.ambushDetected === true
      );

    if (canCounter) {
      actions.unshift({
        label: "率眾反擊",
        note:
          "隊形與位置已經容許你向敵陣施壓。",
        className: "danger",
        handler: () =>
          resolveBattlefieldAction(
            "counter"
          )
      });
    }

    if (
      state.enemyMorale <= 18
    ) {
      actions.unshift({
        label: "逼退群賊",
        note:
          "敵軍已經動搖，但仍然要把握時機。",
        className: "safe",
        handler: () =>
          resolveBattlefieldAction(
            "break"
          )
      });
    }

    if (
      state.friendlyMorale <= 42 ||
      state.danger >= 4 ||
      state.formation <= 28
    ) {
      actions.push({
        label: "撤出山道",
        note:
          "嘗試帶住殘存人手離開戰場。",
        className: "safe",
        handler: () =>
          resolveBattlefieldAction(
            "retreat"
          )
      });
    }

    return actions;
  }

  function resolveBattlefieldAction(type) {
    const paragraphs = [];
    const rolls = [];

    let result;

    if (type === "rally") {
      result =
        rollCheck(
          "presence",
          13 +
          Math.max(
            0,
            state.enemyAdvantage - 1
          ),
          state.friendlyMorale <= 30
            ? -1
            : 0,
          "command"
        );

      rolls.push(
        checkLine(
          result,
          "整隊判定"
        )
      );

      if (result.critical) {
        state.friendlyMorale += 20;
        state.formation += 20;
        state.enemyMorale -= 8;

        paragraphs.push(
          "你一把抓住正要逃走嘅鄉勇，將佢推回糧車之後。",

          "『企住！背對住佢哋先係真正死路！』",

          "命令好似火一樣傳過隊列，散開嘅人重新靠埋。"
        );
      } else if (result.success) {
        state.friendlyMorale += 12;
        state.formation += 11;
        state.enemyMorale -= 3;

        paragraphs.push(
          "你沿糧車逐人喝令，令持盾者在外、長兵由車隙伸出。原本各自揮舞嘅鄉勇終於重新睇見彼此。"
        );
      } else {
        state.friendlyMorale -=
          result.disaster ? 12 : 7;

        state.formation -=
          result.disaster ? 9 : 5;

        paragraphs.push(
          "你嘅聲音被箭雨與哭喊切碎。有人聽到命令，更多人只顧尋找藏身位置。"
        );
      }
    }

    if (type === "route") {
      result =
        rollCheck(
          "intellect",
          13 +
          Math.max(
            0,
            state.danger - 3
          ),
          state.position <= -2
            ? -1
            : 0,
          "tactics"
        );

      rolls.push(
        checkLine(
          result,
          "護路判定"
        )
      );

      if (result.critical) {
        state.position += 2;
        state.formation += 12;
        state.enemyAdvantage -= 2;
        state.danger -= 1;

        paragraphs.push(
          "你命人卸下一袋糧米，墊住即將翻覆嘅車輪。後路喺最短時間內被清出，伏兵包圍出現缺口。"
        );
      } else if (result.success) {
        state.position += 1;
        state.formation += 8;
        state.enemyAdvantage -= 1;

        paragraphs.push(
          "你帶人砍斷套繩，令受驚牲口離開車道。堵死嘅後路總算露出通行空隙。"
        );
      } else {
        state.formation -= 5;

        if (result.disaster) {
          state.position -= 1;
        }

        paragraphs.push(
          "橫倒糧車嘅車軸卡死喺石縫。幾名幫手反被散落貨物絆倒，退路仍然不暢。"
        );
      }
    }

    if (type === "locate") {
      result =
        rollCheck(
          "perception",
          12 +
          Math.max(
            0,
            state.danger - 2
          ),
          state.formation <= 25
            ? -1
            : 0,
          "awareness"
        );

      rolls.push(
        checkLine(
          result,
          "察敵判定"
        )
      );

      if (result.critical) {
        state.enemyLocated = true;
        state.enemyAdvantage -= 2;
        state.position += 2;
        state.enemyMorale -= 7;

        paragraphs.push(
          "你循箭矢角度望去，搵到枝葉後規律晃動嘅長矛。賊眾主力集中喺左側斷坡，右側只係疑兵。"
        );
      } else if (result.success) {
        state.enemyLocated = true;
        state.enemyAdvantage -= 1;
        state.position += 1;

        paragraphs.push(
          "你由碎石滾落方向分清箭手同疑兵。敵人行動唔再完全隱蔽。"
        );
      } else {
        if (result.disaster) {
          state.enemyAdvantage += 1;
        }

        paragraphs.push(
          "樹影、人聲同山壁回音混埋一齊。你幾次以為搵到旗號，最後都只係破布。"
        );
      }
    }

    if (type === "counter") {
      const ability =
        state.weapon.ability;

      const skill =
        state.weapon.skill;

      result =
        rollCheck(
          ability,
          14 +
          Math.max(
            0,
            state.enemyAdvantage
          ),
          state.weapon.attack +
          battlefieldModifier(true),
          skill
        );

      rolls.push(
        checkLine(
          result,
          "反擊判定"
        )
      );

      if (result.critical) {
        state.enemyMorale -= 25;
        state.friendlyMorale += 12;
        state.position += 2;
        state.enemyAdvantage -= 2;
        state.formation += 6;

        paragraphs.push(
          "你以兵刃敲擊車板，率先由兩車之間衝出。鄉勇緊隨其後，長矛一齊刺向落坡賊眾。",

          "最前方山賊當場翻倒，後排收勢不及，十餘人撞成一團。"
        );
      } else if (result.success) {
        state.enemyMorale -= 15;
        state.friendlyMorale += 6;
        state.position += 1;
        state.enemyAdvantage -= 1;

        paragraphs.push(
          "你捉住賊眾換箭空隙帶人衝前。幾名山賊被迫棄弓拔刀，原本壓制頓時中斷。"
        );
      } else {
        state.friendlyMorale -= 8;
        state.formation -= 8;
        state.position -= 1;

        if (result.disaster) {
          state.danger += 1;
        }

        paragraphs.push(
          "你先啱啱帶人離開糧車，坡上就落下第二輪箭矢。反擊被迫停喺半途。"
        );
      }
    }

    if (type === "break") {
      result =
        rollCheck(
          "presence",
          12 +
          Math.max(
            0,
            state.enemyAdvantage
          ),
          battlefieldModifier(true),
          "command"
        );

      rolls.push(
        checkLine(
          result,
          "破膽判定"
        )
      );

      if (result.success) {
        state.enemyMorale = 0;

        paragraphs.push(
          "你見敵陣旗號搖擺，立即令眾人齊聲踏地，高喊援兵將至。",

          "一名山賊先轉身逃入林中，其他人亦相繼潰散。"
        );
      } else {
        state.enemyMorale +=
          result.disaster ? 18 : 11;

        state.enemyAdvantage +=
          result.disaster ? 1 : 0;

        paragraphs.push(
          "賊眾本已後退，卻被頭目強行壓住潰勢，再次向山道聚攏。"
        );
      }
    }

    if (type === "retreat") {
      result =
        rollCheck(
          "intellect",
          13 +
          Math.max(
            0,
            state.enemyAdvantage
          ),
          (
            Math.floor(
              state.formation / 30
            ) -
            state.danger +
            2
          ),
          "tactics"
        );

      rolls.push(
        checkLine(
          result,
          "撤離判定"
        )
      );

      if (result.success) {
        showDefeat(
          paragraphs.concat([
            "你命最後一排交替掩護，傷者與仍能行動嘅人沿退路逐步撤下。",

            "糧車終究留喺黑松嶺，但山賊冇能夠將所有人困死。"
          ]),
          rolls,
          "敗退而還"
        );

        return;
      }

      state.friendlyMorale -=
        result.disaster ? 15 : 9;

      state.formation -= 10;
      state.position -= 1;

      paragraphs.push(
        "撤退命令先啱啱傳到後排，前方眾人就以為全隊已敗，爭相擠向狹路。"
      );
    }

    normalizeBattlefield();

    if (state.enemyMorale <= 0) {
      winBattle(
        paragraphs.concat([
          "山賊再維持唔住陣勢。坡上旗號倒下，殘餘賊眾沿山徑四散而逃。",

          "糧車雖然受損，仍然可以繼續前行。"
        ]),
        rolls,
        "山道破賊"
      );

      return;
    }

    if (state.friendlyMorale <= 0) {
      showDefeat(
        paragraphs.concat([
          "最後一點秩序亦消失。有人棄械奔逃，有人鑽入車底，已經冇人聽得清命令。"
        ]),
        rolls,
        "軍心潰散"
      );

      return;
    }

    const pressure =
      enemyBattlefieldPressure();

    paragraphs.push(
      ...pressure.paragraphs
    );

    rolls.push(
      ...pressure.rolls
    );

    normalizeBattlefield();

    if (state.hp <= 0) {
      showDeath(
        paragraphs,
        rolls
      );

      return;
    }

    if (state.friendlyMorale <= 0) {
      showDefeat(
        paragraphs.concat([
          "呢輪猛攻終於擊碎鄉勇最後勇氣。眾人四散逃命，你亦只能拖住傷勢離開。"
        ]),
        rolls,
        "陣勢崩潰"
      );

      return;
    }

    setScene(
      battlefieldHeading(),
      paragraphs,
      rolls,
      battlefieldActions()
    );
  }

  function normalizeBattlefield() {
    state.friendlyMorale =
      clamp(
        state.friendlyMorale,
        0,
        100
      );

    state.enemyMorale =
      clamp(
        state.enemyMorale,
        0,
        100
      );

    state.position =
      clamp(
        state.position,
        -3,
        3
      );

    state.formation =
      clamp(
        state.formation,
        0,
        100
      );

    state.enemyAdvantage =
      clamp(
        state.enemyAdvantage,
        -2,
        5
      );

    state.danger =
      clamp(
        state.danger,
        1,
        5
      );
  }

  function enemyBattlefieldPressure() {
    if (
      state.enemyMorale <= 0 ||
      state.hp <= 0
    ) {
      return {
        paragraphs: [],
        rolls: []
      };
    }

    const natural = die(20);

    const attackBonus =
      1 +
      state.enemyAdvantage +
      (
        state.enemyMorale >= 75
          ? 1
          : 0
      );

    const defence =
      playerDefence() +
      Math.floor(
        state.formation / 35
      ) +
      (
        state.position >= 2
          ? 1
          : 0
      );

    const total =
      natural + attackBonus;

    const hit =
      natural === 20 ||
      (
        natural !== 1 &&
        total >= defence
      );

    const rolls = [
      (
        `賊眾攻勢：d20 ${natural} ` +
        `${signed(attackBonus)} 戰況 ` +
        `= ${total}，對抗 ${defence}`
      )
    ];

    const paragraphs = [];

    if (natural === 1) {
      state.enemyMorale -= 7;
      state.friendlyMorale += 5;

      paragraphs.push(
        "坡上一名山賊過早鬆手，滾木反而撞倒自己人。鄉勇見狀爆出喝彩。"
      );

      return {
        paragraphs,
        rolls
      };
    }

    if (!hit) {
      state.formation -= 2;

      paragraphs.push(
        "坡上再落下一陣箭矢，多數被糧車與甲衣擋住。眾人雖然被迫低頭，仍然冇完全散開。"
      );

      return {
        paragraphs,
        rolls
      };
    }

    const critical =
      natural === 20;

    const damage =
      damageRoll(
        6,
        critical,
        state.armour.reduction
      );

    state.hp =
      Math.max(
        0,
        state.hp - damage.final
      );

    state.friendlyMorale -=
      critical ? 12 : 6;

    state.formation -=
      critical ? 13 : 7;

    state.enemyMorale +=
      critical ? 8 : 3;

    updateInjuryFromHp(critical);

    rolls.push(
      damageLine(
        damage,
        "亂軍刀箭"
      )
    );

    paragraphs.push(
      critical
        ? "敵人由兩側同時湧下。你被人群撞離隊列，刀箭接連落喺身上。"
        : "敵人趁箭雨壓近。你護住身旁鄉勇，自己卻被刀鋒掃中。"
    );

    return {
      paragraphs,
      rolls
    };
  }

  function battlefieldHeading() {
    if (
      state.enemyMorale <= 20
    ) {
      return "賊眾已有潰意";
    }

    if (
      state.friendlyMorale <= 30
    ) {
      return "軍心將散";
    }

    if (
      state.formation >= 70 &&
      state.position >= 1
    ) {
      return "陣腳漸穩";
    }

    if (
      state.enemyAdvantage >= 3
    ) {
      return "山勢仍在敵手";
    }

    return "黑松嶺激戰";
  }

  function retryActions() {
    return [
      {
        label: "重試同一骰局",
        note:
          "保留人物與同一組隨機序列，可以改用另一套選擇。",
        className: "safe",
        handler: () =>
          restartEncounter(true)
      },

      {
        label: "以新骰局重試",
        note:
          "保留人物，但重新產生所有骰局。",
        handler: () =>
          restartEncounter(false)
      },

      {
        label: "建立新人物",
        className: "danger",
        handler: startCreation
      }
    ];
  }

  function winBattle(
    paragraphs,
    rolls,
    heading
  ) {
    state.phase = "victory";
    state.duelActive = false;

    state.enemy.hp =
      Math.max(
        0,
        state.enemy.hp
      );

    state.status =
      "山賊敗退，首戰得勝";

    setScene(
      heading,
      paragraphs.concat([
        "你活過第一場真正戰鬥。勝利冇抹去傷口，亦冇令死者重新企起。",

        "但由今日開始，你唔再只係被亂世裹挾嘅無名少年。"
      ]),
      rolls,
      retryActions()
    );
  }

  function showDefeat(
    paragraphs,
    rolls,
    heading
  ) {
    state.phase = "defeat";
    state.duelActive = false;

    state.status =
      "首戰失利，僥倖生還";

    setScene(
      heading,
      paragraphs.concat([
        "你冇死，但失敗同樣會留喺一個人嘅一生之中。",

        "傷勢、同伴目光，同被奪走嘅糧藥都唔會憑空消失。"
      ]),
      rolls,
      retryActions()
    );
  }

  function showDeath(
    paragraphs,
    rolls
  ) {
    state.hp = 0;
    state.phase = "death";
    state.duelActive = false;
    state.injury = "致命傷";
    state.status = "命絕黑松嶺";

    setScene(
      "命斷黑松嶺",
      paragraphs.concat([
        "你嘅手指再握唔住兵刃。山道喊殺逐漸遠去，天空只剩被枝葉割碎嘅一小片灰白。",

        `${state.name}，年十八。你跨越千多年重新出生，命運卻冇因為你係轉生者而收回呢一擊。`,

        "此頁至此染血，再無後文。"
      ]),
      rolls,
      retryActions()
    );
  }

  startCreation();
</script>
</body>
</html>
