<style>
*{box-sizing:border-box}body{margin:0;background:#08090c;color:#eeeae0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}#app{max-width:860px;margin:auto;padding:12px}.top{position:sticky;top:0;z-index:3;background:#0b0c0feF;backdrop-filter:blur(12px);border:1px solid #282c34;border-radius:14px;padding:10px;margin-bottom:10px}.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px}.name{font-weight:700}.age{color:#cba75d;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.stat{background:#111318;border:1px solid #282c34;border-radius:9px;padding:7px}.stat b{display:block;font-size:15px}.stat small{color:#9297a0}.main{background:#111318;border:1px solid #282c34;border-radius:16px;padding:19px;min-height:430px}.ey{color:#cba75d;font-size:10px;letter-spacing:.16em;margin-bottom:7px}h1{font-size:25px;margin:3px 0 14px}.story{white-space:pre-line;line-height:1.9;font-size:16px}.divider{height:1px;background:#282c34;margin:17px 0}.btn{display:block;width:100%;padding:13px 14px;margin:8px 0;border:1px solid #30343d;border-radius:11px;background:#17191f;color:#eeeae0;text-align:left;font:inherit;cursor:pointer}.btn:hover{border-color:#777}.btn strong{display:block}.btn small{display:block;color:#999da5;margin-top:4px}.primary{background:#58451f;border-color:#876b39}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.panel{background:#0d0f13;border:1px solid #282c34;border-radius:11px;padding:11px}.panel h3{margin:0 0 7px;font-size:13px}.tags span,.equip span{display:inline-block;border:1px solid #4c4536;color:#d1b56e;border-radius:20px;padding:4px 7px;font-size:11px;margin:2px}.event{background:#0c0e12;border-left:3px solid #8b6d38;border-radius:8px;padding:11px;line-height:1.7}.fighters{display:grid;grid-template-columns:1fr 1fr;gap:9px}.fighter{background:#0c0e12;border:1px solid #292d36;border-radius:10px;padding:10px}.fighter h3{margin:0 0 8px}.bar{height:7px;background:#252832;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#bd5955}.you .bar i{background:#709d76}.fighter p{font-size:11px;color:#999;margin:7px 0}.log{background:#0b0d10;border:1px solid #292d36;border-radius:11px;padding:11px;min-height:145px;margin-top:10px;line-height:1.6}.log div{margin:5px 0}.state{display:inline-block;border:1px solid #3b3f48;border-radius:20px;padding:4px 8px;font-size:11px;color:#aaa;margin:0 4px 5px 0}.warn{color:#d88b83;border-color:#633d39}.good{color:#9ab791;border-color:#3d563a}.danger{color:#d88b83}.damage{color:#d5b36a;font-weight:700}.muted{color:#8e939c;font-size:12px}.disabled{opacity:.42;pointer-events:none}.loot{border:1px solid #5b4b2f;background:#16130d;border-radius:10px;padding:11px;margin:9px 0}.portrait{font-size:38px}.notice{color:#cba75d}.hide{display:none}@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.fighters{grid-template-columns:1fr 1fr}.main{padding:15px}}
</style></head><body><div id="app"></div><script>
const S={name:"",age:0,stats:{str:25,int:25,agi:25,cha:25},pot:{martial:50,scholar:50},traits:[],equip:["粗布衣"],weapon:null,level:1,points:0,history:[],scene:null};
const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,cl=(x,a,b)=>Math.max(a,Math.min(b,x));
function hud(){return `<div class=top><div class=toprow><div class=name>${S.name||"未命名"} <span class=age>· ${S.age}歲</span></div><div class=muted>Lv.${S.level}</div></div><div class=stats><div class=stat><small>武力</small><b>${S.stats.str}</b></div><div class=stat><small>智略</small><b>${S.stats.int}</b></div><div class=stat><small>身法</small><b>${S.stats.agi}</b></div><div class=stat><small>魅力</small><b>${S.stats.cha}</b></div></div></div>`}
function render(body){$("app").innerHTML=hud()+`<main class=main>${body}</main>`}
function start(){S.age=0;render(`<div class=ey>天下將亂</div><div class=portrait>🗡️</div><h1>三國・逆命錄</h1><div class=story>你來到了亂世。
你不知道自己會成為英雄、謀士、武人，還是籍籍無名之人。

但你知道一件事：
你的人生，會由你自己的選擇塑造。</div><div class=divider></div><input id=name class=btn style="cursor:text" maxlength=10 placeholder="請輸入你的名字"><button class="btn primary" id=go><strong>開始新人生</strong><small>從出生開始，直到你的第一場戰鬥。</small></button>`);$("go").onclick=()=>{if(!$("name").value.trim())return alert("請先輸入你的名字。");S.name=$("name").value.trim();birth()}}
function scene(title,text,choices){render(`<div class=ey>${S.age}歲 · 人生事件</div><h1>${title}</h1><div class=story>${text}</div><div class=divider></div>${choices.map((c,i)=>`<button class=btn data-i=${i}><strong>${c[0]}</strong></button>`).join("")}`);document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>choices[+b.dataset.i][1]())}
function result(title,text,next,delta={}){Object.entries(delta).forEach(([k,v])=>S.stats[k]+=v);let changes=Object.entries(delta).filter(([,v])=>v).map(([k,v])=>`${{str:"武力",int:"智略",agi:"身法",cha:"魅力"}[k]} ${v>0?"+":""}${v}`).join(" · ");render(`<div class=ey>${S.age}歲 · 你的選擇</div><h1>${title}</h1><div class=story>${text}</div>${changes?`<div class=event style="margin-top:13px"><b>你留下了痕跡</b><br>${changes}</div>`:""}<button class="btn primary" id=next><strong>繼續</strong></button>`);$("next").onclick=next}
function birth(){S.age=0;scene("一聲啼哭",`黃巾之亂的餘波尚未散去。
你出生於一個不起眼的小村。

沒有人知道，這個孩子將來會走到哪裡。`,[["握住父親伸來的手",()=>{S.traits.push("膽識初萌");result("出生",`你小小的手，竟沒有縮回去。

父親愣了一下，笑了。`,()=>at6(),{str:2})}],["安靜地望著他們",()=>{S.traits.push("沉靜");result("出生","你沒有哭得太久，只是安靜地望著兩張陌生又溫暖的臉。",()=>at6(),{int:2})}],["放聲大哭",()=>{S.traits.push("存在感");result("出生",`你的哭聲穿過屋瓦。

隔壁的人都聽見了。`,()=>at6(),{cha:2})}]]);}
function at6(){S.age=6;scene("村口的孩子",`幾個年長孩子正在欺負一個更小的孩子。

大人就在不遠處，但沒有人出手。`,[["站出去",()=>{S.traits.push("不屈");result("不屈",`你明知自己可能會挨打，仍然走了過去。

「夠了。」`,()=>at9(),{str:5})}],["去找大人",()=>{S.traits.push("審慎");result("審慎",`你轉身跑去找大人。

事情很快被制止。父親卻問你：「如果沒有人來呢？」`,()=>at9(),{int:5})}],["站在旁邊看",()=>{S.traits.push("旁觀");result("旁觀",`你沒有出聲。

那個孩子最後哭著跑走。
你記住了他的眼神。`,()=>at9(),{cha:4})}]])}
function at9(){S.age=9;scene("九歲 · 你想成為怎樣的人",`村裡來了一名遊方先生。
他說可以教孩子一件事，但只能選一樣。`,[["跟他讀書",()=>{S.pot.scholar+=8;S.traits.push("好學");result("紙上的世界",`你開始喜歡那些能把混亂說清楚的文字。

有些東西，刀劍做不到。`,()=>at12(),{int:8})}],["跟鄉勇練身手",()=>{S.pot.martial+=10;S.traits.push("苦練");result("木刀與汗水",`木刀很重，手掌很快磨出水泡。

第二天，你又去了。`,()=>at12(),{str:7,agi:4})}],["學怎樣說服人",()=>{S.traits.push("口才");result("一句話的重量","你發現一句話，有時比拳頭更快讓人改變主意。",()=>at12(),{cha:8})}]])}
function at12(){S.age=12;scene("雨夜的陌生人",`暴雨淹過村路。
一名陌生旅人倒在屋外，身上有血。

父親看著你。`,[["開門救他",()=>{S.traits.push("仁心");result("雨夜",`你把陌生人拖進屋。

第二天，他只留下了一句話：
「亂世裡，記住你今天的選擇。」`,()=>at14(),{cha:5})}],["先搜他的東西",()=>{S.traits.push("多疑");result("令牌",`你先確認他是不是帶著麻煩。

你在他身上找到一枚陌生令牌。`,()=>at14(),{int:6})}],["不靠近",()=>{S.traits.push("警覺");result("活下來",`你沒有冒險。

那一夜，你第一次知道，活下來本身也是本事。`,()=>at14(),{agi:4})}]])}
function at14(){S.age=14;scene("真刀",`父親把一把舊刀放到桌上。

「木刀可以讓你練習。」
「這把，會讓你受傷。」`,[["拿起來",()=>{S.weapon="舊環首刀";S.equip.push("舊環首刀");S.traits.push("敢於見血");result("第一次握刀",`刀比你想像中重。

你沒有放下。

從這天開始，你知道自己的手終有一天會碰上真正的刀。`,()=>at15(),{str:7,agi:3})}],["先研究它",()=>{S.weapon="舊環首刀";S.equip.push("舊環首刀");S.traits.push("觀刀");result("看刀",`你沒有急著拔刀。

你看見刀刃磨損的位置，也看見護手留下的舊痕。`,()=>at15(),{int:7,str:3})}],["拒絕",()=>{S.traits.push("自持");result("自持",`「我不需要。」

父親看了你很久。
「希望有一天，你仍然可以這樣說。」`,()=>at15(),{cha:5})}]])}
function at15(){S.age=15;render(`<div class=ey>15歲 · 命運轉折</div><h1>山道</h1><div class=story>天色漸暗。

馬突然停下。

林間沒有風。

卻有一片葉子，慢慢落在你的肩上。

你會……</div><div class=divider></div><button class=btn id=a><strong>繼續前進</strong></button><button class=btn id=b><strong>停下來</strong></button><button class=btn id=c><strong>觀察四周</strong></button>`);a.onclick=()=>ambush("continue");b.onclick=()=>ambush("stop");c.onclick=()=>ambush("observe")}
function ambush(choice){let score=S.stats.agi*.42+S.stats.int*.34+S.pot.martial*.08+S.pot.scholar*.06+(S.traits.includes("警覺")?13:0)+(choice==="observe"?13:choice==="stop"?7:-4);let noticed=Math.random()*100<cl(score,20,88);let text=noticed?{observe:`你沒有抬頭。

你只是看著泥地。

新鮮的腳印。
一、二、三……

不。
還有一個。

就在你身後。`,stop:`你抬起手。
商隊停住。

風穿過樹梢。
你忽然看見樹影中那一抹不自然的黑。`,continue:`你走了兩步，忽然停下。

不是因為害怕。
而是因為太安靜了。

你回頭，看見泥地上新鮮的腳印。`}[choice]:{continue:`你繼續向前。

一步。
兩步。

轟——！

巨石從山坡滾落。

「敵襲！」`,stop:`你停了下來。

但已經遲了。

林中突然響起弓弦聲。

嗖——！

箭矢擦過你的肩。`,observe:`你仔細看著四周。

什麼也沒有。

你正準備轉身——

嗖！

一支箭釘進身旁的木箱。`}[choice];result("山道",text,()=>leader(noticed))}
function leader(noticed){let text=noticed?`山林深處傳來一聲大笑。

「好眼力！」

一名披著獸皮的男人從樹後走出，手中提著長刀。

「小小年紀，竟能看穿我的埋伏。」

他把刀指向你。

「報上名來。」`:`山林中傳來一聲大笑。

「哈哈哈哈！」

一名男人騎馬走出，身後的山賊已將商隊圍住。

「小子。」

「你連刀都未拔出來，也敢走這條山路？」`;result("山賊頭目",text,()=>offerDuel(noticed))}
function offerDuel(noticed){let text=noticed?`你報上姓名。

他聽完，嘴角揚起。

「好！」

「今日便讓我看看，你這名字值不值得留在世上！」`:`他看著你，長刀一橫。

「可敢與我一戰？」

林中的山賊發出笑聲。

你知道，這一戰若退下去，商隊的人都會看見。`;scene("山賊頭目",text,[["接下單挑",()=>startDuel(noticed)],["拒絕單挑",()=>refuseDuel(noticed)]])}
function startDuel(noticed){S.scene={type:"duel",noticed,turn:1,enemy:{hp:100,m:100},you:{hp:100,m:100},log:[],execute:false,ambushUsed:false};duelUI()}
function duelChance(a){let c=S.scene,x=25;if(a==="clash")x+=S.stats.str*.42;if(a==="evade")x+=S.stats.agi*.45;if(a==="bait")x+=S.stats.int*.35+S.stats.agi*.12;return cl(Math.round(x),18,88)}
function duelAction(a){let c=S.scene,ok=Math.random()*100<duelChance(a);if(ok){let dmg=Math.round((a==="clash"?r(14,21)+S.stats.str/18:a==="evade"?r(9,16)+S.stats.agi/22:r(11,19)+S.stats.int/25));let crit=Math.random()<.10+(S.stats.str>=70?.08:0);if(crit)dmg=Math.round(dmg*1.5);c.enemy.hp=Math.max(0,c.enemy.hp-dmg);c.enemy.m=Math.max(0,c.enemy.m-Math.round(dmg*.65));c.log.unshift(`<b>${crit?"🔥 ":""}${pick(["你踏前一刀，逼得他退了半步。","刀鋒撞上長刀，火星四濺。","你抓住他的重心，猛然切入。","他以為你會退，你卻反而向前。"])}</b> <span class=damage>${dmg}</span>`)}else{let dmg=r(6,13);c.you.hp-=dmg;c.you.m-=8;c.log.unshift(`<span class=danger>${pick(["他的長刀擦著你胸前掠過。","你避開第一刀，卻被第二刀逼退。","他看穿了你的意圖，反手一擊。"])}</span> <span class=damage>-${dmg}</span>`)}c.turn++;if(c.enemy.hp<=25||c.enemy.m<=25)c.execute=S.stats.str>70;if(c.enemy.hp<=0||c.enemy.m<=0)return duelWin();if(c.you.hp<=0)return duelLose();duelUI()}
function duelWin(){S.scene.result="win";result("單挑 · 勝",`你的刀架在他的頸側。

他沒有再向前一步。

身後的山賊開始互相張望。

剛才還不可一世的聲勢，像被人一刀斬斷。`,()=>battlefield("win"),{str:2})}
function duelLose(){S.scene.result="lose";result("單挑 · 敗",`你擋下第一刀。

第二刀卻慢了一瞬。

砰！

你被震退數步。

山賊頭目大笑。

「就這點本事？」

山賊們爆發出笑聲。

你感覺到身後的人，正在失去膽氣。`,()=>battlefield("lose"))}
function execute(){let c=S.scene;c.enemy.hp=0;c.enemy.m=0;c.result="win";result("終結",`你沒有再退。

你抬刀。

他剛轉身——

寒光已經越過他的視線。

山道突然安靜。`,()=>battlefield("win"),{str:3})}
function duelUI(){let c=S.scene;let ex=c.execute&&c.enemy.hp<=25?`<button class="btn primary" id=ex><strong>⚔️ 終結</strong><small>你看見了他的破綻。一次性機會。</small></button>`:"";render(`<div class=ey>15歲 · 個人戰場</div><h1>單挑</h1>${c.noticed?`<span class="state good">你先看穿了局勢</span>`:`<span class="state warn">敵方掌握主動</span>`}<div class=fighters><div class="fighter you"><h3>${S.name}</h3><div class=bar><i style="width:${cl(c.you.hp,0,100)}%"></i></div><p>狀態 ${cl(c.you.hp,0,100)} · 士氣 ${cl(c.you.m,0,100)}</p></div><div class=fighter><h3>山賊頭目</h3><div class=bar><i style="width:${c.enemy.hp}%"></i></div><p>狀態 ${c.enemy.hp} · 士氣 ${c.enemy.m}</p></div></div><div class=log>${c.log.slice(0,6).map(x=>`<div>${x}</div>`).join("")}</div><div class=grid><button class=btn data-d=clash><strong>⚔️ 正面迎擊</strong><small>以力破力</small></button><button class=btn data-d=evade><strong>🌪️ 避其鋒芒</strong><small>等待破綻</small></button><button class=btn data-d=bait><strong>🪤 誘敵</strong><small>引他先出手</small></button>${ex}</div>`);document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>duelAction(b.dataset.d));if($("ex"))$("ex").onclick=execute}
function refuseDuel(noticed){S.scene={type:"field",stage:noticed?"ready":"crisis",noticed,ally:noticed?"穩住":"動搖",enemy:noticed?"動搖":"得勢",log:[]};result("拒絕單挑",noticed?`你沒有出刀。

山賊頭目冷笑一聲。

「小心翼翼，倒也算聰明。」

你退回商隊一側。

雙方沒有決出勝負，但主動權仍握在你們手中。`:`你沒有回答。

你退後一步。

山賊頭目放聲大笑。

「原來如此。」

「這便是他們所謂的英雄？」

鬨笑聲在山谷間回盪。

你感覺到身後的氣息，正在變弱。`,()=>battlefield(noticed?"refused":"ambushed"))}
function battlefield(outcome){let noticed=S.scene.noticed;S.scene={type:"field",stage:outcome==="win"?"advantage":outcome==="lose"||outcome==="ambushed"?"crisis":noticed?"ready":"crisis",noticed,ally:outcome==="win"?"振奮":outcome==="lose"||outcome==="ambushed"?"動搖":"穩住",enemy:outcome==="win"?"動搖":outcome==="lose"||outcome==="ambushed"?"得勢":"得勢",log:[]};fieldUI()}
function fieldAction(a){let c=S.scene;
if(c.stage==="crisis"){if(a==="protect"){c.log.unshift("你擋在馬車前，先把最危險的缺口封住。");c.stage="stabilizing";c.ally="勉強穩住";}else if(a==="retreat"){c.log.unshift("你帶人退向較窄的山路，避免被完全包圍。");c.stage="stabilizing";c.ally="勉強穩住";}else if(a==="observe"){c.log.unshift("你重新尋找敵人的位置。你終於看見第二支弓隊。");c.stage="stabilizing";c.enemy="仍然得勢";}else return;
}else if(c.stage==="stabilizing"){if(a==="rally"){c.log.unshift("你沒有讓所有人立刻反攻。你只是讓他們重新站好。");c.ally="穩住";c.stage="ready";}else if(a==="observe"){c.log.unshift("你抓到敵陣的一個空隙。還不夠，但至少你知道下一步。");c.stage="ready";}else if(a==="protect"){c.log.unshift("你守住退路。敵人的攻勢沒有再擴大。");c.stage="ready";}else return;
}else if(c.stage==="ready"){if(a==="counter"){c.log.unshift("你等到山賊隊形拉長，終於可以反擊。");c.stage="advantage";c.enemy="動搖";}else if(a==="rally"){c.log.unshift("商隊重新站穩。有人開始跟著你的腳步。");c.ally="振奮";c.stage="advantage";}else if(a==="protect"){c.log.unshift("你守住核心，敵人找不到突破口。");}else return;
}else if(c.stage==="advantage"){if(a==="pursue"){c.log.unshift("你帶頭壓上。山賊的隊形開始真正崩散。");c.stage="end";}else if(a==="counter"){c.log.unshift("你逼退最後一批山賊。");c.stage="end";}else return}
if(c.stage==="end")return ending();fieldUI()}
function fieldUI(){let c=S.scene,buttons=[];if(c.stage==="crisis")buttons=[["🛡️ 護住商隊","先封住最危險的缺口","protect"],["🏃 尋找退路","避免被完全包圍","retreat"],["👁 重新觀察","找出敵人的位置","observe"]];else if(c.stage==="stabilizing")buttons=[["📯 穩住陣腳","令所有人重新站好，而不是立刻反攻","rally"],["👁 尋找空隙","等待真正可以反擊的時機","observe"],["🛡️ 守住退路","不讓局勢再次惡化","protect"]];else if(c.stage==="ready")buttons=[["⚔️ 準備反擊","你終於有條件奪回主動","counter"],["📯 重振士氣","把勉強站穩變成真正的勇氣","rally"],["🛡️ 穩守","不急於冒險","protect"]];else buttons=[["⚔️ 帶頭追擊","敵陣已經開始崩散","pursue"],["⚔️ 最後反擊","把剩餘敵人逼退","counter"]];render(`<div class=ey>15歲 · 整體戰場</div><h1>山道戰局</h1><span class="state ${c.ally==="動搖"?"warn":"good"}">我方：${c.ally}</span><span class="state ${c.enemy==="得勢"?"warn":"good"}">敵方：${c.enemy}</span>${!c.noticed?`<div class="event"><b>你未能在伏擊前取得情報。</b><br>現在的目標不是追擊，而是先活著把商隊帶出危險。</div>`:`<div class="event"><b>你早已看穿伏擊。</b><br>你們沒有被第一波攻勢打亂。</div>`}<div class=log>${c.log.slice(0,6).map(x=>`<div>${x}</div>`).join("")}</div>${buttons.map(b=>`<button class=btn data-f=${b[2]}><strong>${b[0]}</strong><small>${b[1]}</small></button>`).join("")}`);document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>fieldAction(b.dataset.f))}
function ending(){S.level=2;S.points=3;S.equip.push(S.scene.noticed?"山賊頭目的短刀":"山賊留下的佩刀");result("第一場戰鬥 · 結束",`山賊終於撤退。

你站在山道中央，手中的刀還在滴血。

身後的人看著你。

沒有人知道，你將來會成為誰。

但今日之後，他們會記住你的名字。`,()=>profile())}
function profile(){let tags=S.traits.map(x=>`<span>${x}</span>`).join("");let eq=S.equip.map(x=>`<span>⚔️ ${x}</span>`).join("");render(`<div class=ey>V3 · 第一章完</div><h1>${S.name}</h1><div class=grid><div class=panel><h3>角色</h3><div>年齡：${S.age}</div><div>等級：Lv.${S.level}</div><div>可用成長點：${S.points}</div></div><div class=panel><h3>潛質</h3><div>武藝潛質：${cl(Math.round(S.pot.martial),0,100)}</div><div>學識潛質：${cl(Math.round(S.pot.scholar),0,100)}</div></div></div><div class=panel style="margin-top:8px"><h3>天賦與人生痕跡</h3><div class=tags>${tags}</div></div><div class=panel style="margin-top:8px"><h3>裝備</h3><div class=equip>${eq}</div></div><div class=divider></div><div class=story>第一場戰鬥結束。

V3 到此為止。
你的下一段人生，留待下一章。</div><button class=btn primary onclick="location.reload()"><strong>重新開始</strong><small>每一次人生選擇，都可能把你帶向另一條路。</small></button>`)}
start();
</script></body></html>
