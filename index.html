    function chapter2EnemyPressure() {
      const b = state.battle;
      const paragraphs = [];
      const rolls = [];

      const natural = die(20);
      const attackBonus =
        2 +
        b.enemyAdvantage +
        (b.enemyMorale >= 75 ? 1 : 0) +
        Math.max(0, b.personalThreat);

      const defence =
        playerDefence() +
        Math.floor(b.formation / 35) +
        (b.position >= 2 ? 1 : 0);

      const total = natural + attackBonus;
      const hit =
        natural === 20 ||
        (natural !== 1 && total >= defence);

      rolls.push(
        `渡口敵軍攻勢：d20 ${natural} ${signed(attackBonus)} = ${total}，對抗 ${defence}`
      );

      if (natural === 1) {
        b.enemyMorale -= 9;
        b.morale += 5;
        b.personalThreat = Math.max(0, b.personalThreat - 1);

        paragraphs.push(
          "強硬派催促前排向橋面擠壓，後方卻誤將火油撞翻。火勢反向燒入自己營地，黃巾陣中頓時一片混亂。"
        );

        return { paragraphs, rolls };
      }

      if (!hit) {
        b.formation -= 2;
        b.bridgeIntegrity -= natural >= 15 ? 1 : 0;
        b.personalThreat = Math.max(0, b.personalThreat - 1);

        paragraphs.push(
          natural >= 15
            ? "敵軍未能撞開隊形，幾支火箭卻釘入橋側木欄。火勢被暫時壓下，橋身仍受到損害。"
            : "持矛者由南岸壓近，卻被交錯伸出的長兵逼退。難民通道仍然保持。"
        );

        return { paragraphs, rolls };
      }

      const critical = natural === 20;
      const dealt = damage(6, critical, state.armour.reduction);

      state.hp = Math.max(0, state.hp - dealt.final);
      b.morale -= critical ? 12 : 6;
      b.formation -= critical ? 12 : 7;
      b.bridgeIntegrity -= critical ? 1 : 0;
      b.personalThreat = Math.max(0, b.personalThreat - 1);

      setInjury(critical);

      rolls.push(
        `亂軍矛箭：${dealt.rolls.join(" + ")}，甲衣抵去 ${dealt.reduction}，造成 ${dealt.final} 點傷害`
      );

      paragraphs.push(
        critical
          ? "南岸銅鑼驟響，箭矢集中落向同一段橋頭。木欄碎裂，人群倒下，你亦被衝入缺口的長矛重重刺中。"
          : "一隊持刀黃巾借人群遮掩逼近。你護住身旁難民時，刀鋒越過甲衣，在腰側留下血口。"
      );

      return { paragraphs, rolls };
    }

    function normalizeChapter2Battle() {
      const b = state.battle;

      b.morale = clamp(b.morale, 0, 100);
      b.formation = clamp(b.formation, 0, 100);
      b.enemyMorale = clamp(b.enemyMorale, 0, 100);
      b.position = clamp(b.position, -3, 3);
      b.enemyAdvantage = clamp(b.enemyAdvantage, -2, 5);
      b.protected = clamp(b.protected, 0, 7);
      b.bridgeIntegrity = clamp(b.bridgeIntegrity, 0, 3);
      b.personalThreat = clamp(b.personalThreat, 0, 4);
    }

    function checkChapter2BattleEnd(paragraphs, rolls) {
      const b = state.battle;

      if (b.protected >= 6) {
        finishChapter2Victory(
          paragraphs.concat([
            "最後一批傷者與孩童越過北岸。橋面仍有兵刃相撞，但需要保護的人已經離開最危險的位置。",
            "劉備立即命人收縮隊形，唔再為追殺潰兵而堵塞通道。渡口主要目標已經達成。"
          ]),
          rolls,
          "百姓盡渡",
          "rescue"
        );
        return true;
      }

      if (b.enemyMorale <= 0) {
        if (b.protected >= 4) {
          finishChapter2Victory(
            paragraphs.concat([
              "強硬派陣中先有人丟下兵器，隨後整片黃巾旗號向南倒退。",
              "敵軍未被殺盡，但已無法繼續控制渡口。餘下難民得以由義兵與溫和信眾共同護送過橋。"
            ]),
            rolls,
            "渡口解圍",
            "rout"
          );
        } else {
          finishChapter2Mixed(
            paragraphs.concat([
              "敵軍終於潰退，但橋面已留下過多屍體。你們贏得渡口，卻未能及時保護所有被困百姓。",
              "有人會把今日稱為勝仗；失去家人的人未必同意。"
            ]),
            rolls,
            "勝中有失",
            "costlyVictory"
          );
        }
        return true;
      }

      if (b.bridgeIntegrity <= 0) {
        finishChapter2Defeat(
          paragraphs.concat([
            "橋側木樁終於在火中斷裂。半邊橋面連同尚未過河的人群一同向水面傾斜。",
            "有人抓住繩索，有人直接被木板與人潮壓入涿水。兩岸隊伍被徹底分開。",
            "渡口已經失守。你只能決定帶住邊一批生還者離開。"
          ]),
          rolls,
          "橋斷涿水",
          "bridgeLost"
        );
        return true;
      }

      if (b.morale <= 0 || b.formation <= 0) {
        finishChapter2Defeat(
          paragraphs.concat([
            "隊伍最後一點秩序亦被人潮沖散。有人高喊撤退，有人仍在橋頭死戰，但已經無人能統一行動。",
            "難民通道被兵卒與潰兵重新堵死。你們未能完成原本目標。"
          ]),
          rolls,
          "陣勢崩潰",
          "formationCollapsed"
        );
        return true;
      }

      return false;
    }

    function resolveChapter2Timeout(paragraphs, rolls) {
      const b = state.battle;

      if (
        b.protected >= 5 &&
        b.bridgeIntegrity >= 1 &&
        b.morale >= 25
      ) {
        finishChapter2Victory(
          paragraphs.concat([
            "黃昏前，絕大部分難民已經離開橋面。剩餘敵軍見火勢無法蔓延，亦不願繼續承受兩岸夾擊，逐步退往南方。",
            "你未能取得乾淨俐落的勝利，但渡口與人命大致保住。"
          ]),
          rolls,
          "守至日暮",
          "held"
        );
        return;
      }

      if (
        b.protected >= 3 &&
        b.bridgeIntegrity >= 1
      ) {
        finishChapter2Mixed(
          paragraphs.concat([
            "日暮令兩邊都無法再維持完整攻勢。你帶著已經過橋的人撤離，仍有一批難民被迫散入南岸荒野。",
            "渡口沒有完全落入任何一方，但你亦未能救走所有人。"
          ]),
          rolls,
          "殘陽退兵",
          "partial"
        );
        return;
      }

      finishChapter2Defeat(
        paragraphs.concat([
          "夜色落下時，橋上仍然擠滿無法前進的人。強硬派重新掌握南岸，義兵亦只能帶殘存人手後撤。",
          "渡口行動失敗，失散者數目到第二日仍無人能點算清楚。"
        ]),
        rolls,
        "渡口失陷",
        "fordLost"
      );
    }

    function chapter2BattleHeading() {
      const b = state.battle;

      if (b.bridgeIntegrity <= 1) return "橋火將噬人群";
      if (b.protected >= 5) return "最後一批難民";
      if (b.enemyMorale <= 25) return "強硬派已有潰意";
      if (b.morale <= 30) return "橋頭軍心將散";
      if (b.position >= 2) return "兩岸漸入掌握";
      if (b.enemyAdvantage >= 3) return "南岸壓力大增";
      return "涿水血戰";
    }

    function awardChapter2Reputation(outcome) {
      if (outcome === "victory") {
        state.reputation.military += 16;
        state.reputation.village += 12;
        state.reputation.government +=
          state.chapter2.allegiance === "涿郡黃巾" ? -10 : 8;
      }

      if (outcome === "mixed") {
        state.reputation.military += 7;
        state.reputation.village += 4;
        state.reputation.government +=
          state.chapter2.allegiance === "涿郡黃巾" ? -12 : 2;
      }

      if (outcome === "defeat") {
        state.reputation.military -= 3;
        state.reputation.village -= 2;
        state.reputation.government +=
          state.chapter2.allegiance === "涿郡黃巾" ? -15 : 0;
      }

      if (state.chapter2.civiliansSaved >= 25) {
        addTrait("benevolent");
      }

      if (state.battle?.morale >= 65) {
        addTrait("commanding");
      }

      if (state.chapter2.route === "logistics") {
        addTrait("strategist");
      }

      if (
        state.chapter2.route === "scout" ||
        state.chapter2.route === "stay"
      ) {
        addTrait("prudent");
      }
    }

    function finishChapter2Victory(paragraphs, rolls, heading, result) {
      awardChapter2Reputation("victory");

      state.phase = "chapter2End";
      state.chapter2.outcome = result;
      state.chapter2.resultClass = "victory";
      state.status = "黃巾初戰得勝";
      state.location = "涿水北岸";

      addHistory(`涿水渡口之戰：${heading}。`);

      state.battle = null;
      state.combat = null;

      setScene({
        heading,
        paragraphs: paragraphs.concat(historicalParagraphs, [
          "你在黑松嶺學到如何活過一場伏擊；在涿水渡口，你第一次明白一場戰役可以勝利，仍然留下數不清的屍體與失散者。",
          "你唔再只係桑澤里一個無名少年。有人記得你持兵的樣子，有人記得你打開過一條生路，亦可能有人因你今日選擇而永遠把你視為敵人。"
        ]),
        rolls,
        actions: [{
          label: "查看第二卷結語",
          className: "history-action",
          handler: showChapter2Ending
        }]
      });

    function finishChapter2Mixed(paragraphs, rolls, heading, result) {
      awardChapter2Reputation("mixed");

      state.chapter2.resultClass = "mixed";
      state.status = "渡口一戰勝敗相半";

      state.combat = null;

      setScene({
        heading,
        paragraphs: paragraphs.concat(historicalParagraphs, [
          "軍中有人稱你們守住了渡口，村民則只計算有幾多人未能回來。歷史往往用一句勝負，遮住每個家庭付出的代價。",
          "你活下來，亦帶走一個不會因章節完結而消失的結果。"
        ]),
        rolls,
        actions: [{
          label: "查看第二卷結語",
          handler: showChapter2Ending
        }]

    function finishChapter2Defeat(paragraphs, rolls, heading, result) {
      awardChapter2Reputation("defeat");

      state.phase = "chapter2End";
      state.chapter2.outcome = result;

      setScene({
        heading,
        paragraphs: paragraphs.concat(historicalParagraphs, [

          "若下一卷展開，今日失去的信任與機會都不會自動恢復。"
        ]),
        rolls,
        actions: [{
          label: "查看第二卷結語",
          handler: showChapter2Ending
        }]
      });

    function historyFigureAftermath(clearVictory) {
      const paragraphs = [];

      if (
        state.chapter2.allegiance === "涿郡黃巾" ||
        state.chapter2.allegiance === "太平道溫和信眾"
      ) {
        paragraphs.push(
          clearVictory
            ? "劉備沒有命令義兵追殺已經放下兵器的信眾。佢隔著滿地斷矛望向你，顯然記住了渡口另一邊曾有人保護百姓。"
            : "義兵撤走前，劉備仍下令留出一條讓傷者離開的路。你與佢並非同袍，但今日亦未成為非要互相殺死的仇敵。"
        );

        if (state.chapter2.allegiance === "涿郡黃巾") {
          paragraphs.push(
            "你仍然身在黃巾一方，卻已公開違抗強硬渠帥。官府會視你為賊，部分太平道頭目亦會視你為叛徒。"
          );
        }
      } else {
        state.chapter2.metLiuBei = true;
        state.chapter2.metGuanYu = true;
        state.chapter2.metZhangFei = true;

        paragraphs.push(
          clearVictory
            ? "戰後，劉備親自沿橋點算傷者，關羽守住南岸退路，張飛則帶人撲滅橋火。三人沒有因初勝而飲宴，只在泥地上分食剩下的乾糧。"
            : "劉備收攏殘兵時沒有掩飾失敗，關羽負責殿後，張飛則幾次回頭尋找未能撤走的人。三人的名字尚未震動天下，但已有人願意繼續跟隨。"
        );

        if (state.reputation.military >= 18) {
          paragraphs.push(
            "劉備記下你的姓名與籍貫，並問你是否願意在下一次行軍前往軍帳議事。這不是顯赫官位，只代表你終於由無名新卒變成一個值得再次召見的人。"
          );
        } else {
          paragraphs.push(
            "你仍然只係新募人手之一。關羽與張飛未必記得你的全部經歷，但至少認得你曾在渡口站穩。"
          );
        }
      }

      return paragraphs;
    }

    function showChapter2Ending() {
      state.phase = "chapter2End";
      state.chapter = 2;
      state.year = 184;
      state.month = "三月";
      state.age = 16;

      const resultText =
        state.chapter2.resultClass === "victory"
          ? "你在涿水渡口完成了主要目標。"
          : state.chapter2.resultClass === "mixed"
            ? "你帶走部分勝果，亦留下無法挽回的損失。"
            : "你在涿水渡口未能完成主要目標，但仍然活著離開。";

      const allegianceText =
        state.chapter2.allegiance === "涿郡黃巾"
          ? "你已踏入黃巾陣營，卻同強硬渠帥決裂。"
          : state.chapter2.allegiance === "太平道溫和信眾"
            ? "你與願意護民的太平道信眾建立了聯繫。"
            : state.chapter2.allegiance === "桑澤里"
              ? "你仍以桑澤里存亡為首要責任。"
              : `你目前與「${state.faction}」建立了聯繫。`;

      const hanKuiText =
        state.chapter1.hanKuiFate === "killed" ||
        state.chapter1.hanKuiFate === "死於涿水渡口"
          ? "韓魁已死，黑石寨留下的線索卻指向更大的地方網絡。"
          : state.chapter1.hanKuiFate === "涿水被俘"
            ? "韓魁已被俘，佢對所謂「神上使」的供詞可能在下一卷產生作用。"
            : `韓魁命運仍為：「${state.chapter1.hanKuiFate}」。`;

      setScene({
        heading: "逆命錄・第二卷終",
        paragraphs: [
          resultText,
          allegianceText,
          hanKuiText,
          `此時的${state.name}年十六，仍持有${state.weapon.name}與${state.armour.name}。`,
          `你現時傷勢為「${state.injury.name}」，鄉里、軍中與官府亦已各自留下對你的評價。`,
          "【史勢】黃巾之亂並未因涿水一戰結束。皇甫嵩、朱儁、盧植等人將先後率軍鎮壓各地起事；劉備、關羽、張飛亦會在戰亂之中逐步建立名聲。",
          "如果第三卷展開，你將帶住現有能力、經歷、裝備、傷勢、關係、陣營與全部重大後果繼續生活。",
          "本版本內容至此結束。"
        ],
        actions: [
          {
            label: "查看完整人物命簿",
            className: "safe",
            handler: openLedger
          },
          {
            label: "以新人物重新開始",
            className: "danger",
            handler: confirmNewCampaign
          }
        ]
      });

      saveCheckpoint();
    }

    function showDeath(paragraphs, rolls, heading) {
      state.hp = 0;
      state.phase = "death";
      state.status = "命書染血";
      state.injury = {
        name: "致命傷",
        severity: 4,
        ability: null,
        penalty: 0
      };

      state.battle = null;
      state.combat = null;

      addHistory(`${state.year} 年，${state.age} 歲，死於${state.location}附近。`);

      setScene({
        heading,
        paragraphs: paragraphs.concat([
          "你的手指再也握不住兵刃。周圍喊殺漸漸遠去，最後只剩風吹過旗布的聲音。",
          `${state.name}，生於公元一六八年，卒年十六。你曾經嘗試改變自己與身邊人的命運。`,
          "命運沒有因你係故事主角而收回最後一擊。",
          "此頁至此染血，再無後文。"
        ]),
        rolls,
        actions: [
          {
            label: "重新開始本章",
            note: "回到本章開始時保存的角色狀態。",
            handler: restartChapter
          },
          {
            label: "建立新人物",
            className: "danger",
            handler: confirmNewCampaign
          }
        ]
      });
    }

    function restartChapter() {
      const checkpoint = loadStored(CHECKPOINT_KEY);

      if (!checkpoint) {
        alert("未有可用章節存檔。");
        confirmNewCampaign();
        return;
      }

      state = checkpoint;
      state.locked = false;
      saveGame();
      resumeLoadedState(true);
    }

    function relationDescription(value) {
      if (value >= 45) return "生死相託";
      if (value >= 25) return "信任";
      if (value >= 10) return "熟悉";
      if (value <= -35) return "深恨";
      if (value <= -15) return "不滿";
      return "平常";
    }

              ${esc(npc.role)}・${esc(relationDescription(npc.relationship))}・${esc(npc.status)}
            </span>
            ${
              npc.memories.length

      openModal(

            <span class="info-label">氣血與傷勢</span>

              ${Math.max(0, state.hp)} / ${state.maxHp}・${esc(state.injury.name)}
            </span>
          </div>

          <div class="info-block">
            <span class="info-label">裝備</span>

              鄉里 ${state.reputation.village}・
              軍中 ${state.reputation.military}・

            </span>
          </div>

          <div class="info-block">
            <span class="info-label">重要物品與線索</span>

                state.items.length

    function openMenu() {
      const hasCheckpoint = Boolean(loadStored(CHECKPOINT_KEY));

      openModal(
        "卷冊",
        `
          <p>進度會自動保存在此瀏覽器的 <code>localStorage</code>。</p>
          <p class="choice-note">
            重新開始本章會回到該章開端；建立新人物會刪除現有命書。
          </p>
        `,
        [
          {
            label: "返回遊戲",
            className: "safe",
            handler: closeModal
          },
          {
            label: "查看人物命簿",
            handler: openLedger
          },
          {
            label: "重新開始本章",
            available: hasCheckpoint,
            reason: "未有章節 checkpoint。",
            handler: () => {
              closeModal();
              restartChapter();
            }
          },
          {
            label: "建立新人物",
            className: "danger",
            handler: () => {
              closeModal();
              confirmNewCampaign();
            }
          }
        ]
      );
    }

    function openModal(title, content, actions = []) {
      $("modalTitle").textContent = title;
      $("modalContent").innerHTML = content;

      const container = $("modalActions");
      container.innerHTML = "";

      actions.forEach((action) => {
        const button = document.createElement("button");
        const available = action.available !== false;

        button.type = "button";
        button.className =
          `action-button${action.className ? ` ${action.className}` : ""}`;
        button.disabled = !available;
        button.innerHTML =
          `${esc(action.label)}` +
          (!available && action.reason
            ? `<small>${esc(action.reason)}</small>`
            : "");

        if (available) {
          button.addEventListener("click", action.handler);
        }

        container.appendChild(button);
      });

      $("modalBackdrop").hidden = false;
    }

    function closeModal() {
      $("modalBackdrop").hidden = true;
    }

    function confirmNewCampaign() {
      const hasSave = Boolean(loadStored(SAVE_KEY));

      if (
        hasSave &&
        !confirm("建立新人物會刪除目前命書與章節存檔。確定繼續？")
      ) {
        state.locked = false;
        renderSidebar();
        return;
      }

      closeModal();
      startCreation();
    }

    function resumeLoadedState(fromCheckpoint = false) {
      state.locked = false;
      renderSidebar();

      if (state.phase === "death") {
        setScene({
          heading: "染血命頁",
          paragraphs: [
            `${state.name}的命書已經停止在死亡一頁。`,
            fromCheckpoint
              ? "章節存檔已經重展，你可以重新走入尚未發生的危機。"
              : "你可以重新開始本章，或者建立另一個人物。"
          ],
          actions: [
            {
              label: "重新開始本章",
              handler: restartChapter
            },
            {
              label: "建立新人物",
              className: "danger",
              handler: confirmNewCampaign
            }
          ]
        });
        return;
      }

      if (state.phase === "childhood") {
        setScene({
          heading: fromCheckpoint ? "第一卷重新展開" : "歲月續行",
          paragraphs: [
            fromCheckpoint
              ? "命頁回到第一卷開始時。角色的童年將重新由你選擇。"
              : "舊卷記錄仍在。你可以由目前人生階段繼續。"
          ],
          actions: [{
            label: "繼續成長",
            handler: showChildhoodStage
          }]
        });
        return;
      }

      if (state.phase === "equipment") {
        setScene({
          heading: "成年命頁重展",
          paragraphs: [
            "村中兵械仍放在你面前。你尚未踏入黑松嶺。"
          ],
          actions: equipmentActions()
        });
        return;
      }

      if (state.phase === "duel" && state.combat?.enemy) {
        setScene({
          heading: "山道鬥將・續",
          paragraphs: [
            "卷冊重新展開時，韓魁仍站在山道對面。刀上血跡與傷勢都沒有消失。"
          ],
          actions: duelActions()
        });
        return;
      }

      if (state.phase === "battlefield1" && state.battle) {
        setScene({
          heading: "黑松嶺激戰・續",
          paragraphs: [
            "糧車、傷者與山賊仍留在原本位置。戰場狀態已由命書恢復。"
          ],
          actions: blackPineBattleActions()
        });
        return;
      }

      if (state.phase === "chapter1") {
        setScene({
          heading: "黑松嶺之前",
          paragraphs: [
            "命頁重新展開於護糧隊進入山路之前。"
          ],
          actions: [{
            label: "進入黑松嶺",
            className: "danger",
            handler: blackPineApproach
          }]
        });
        return;
      }

      if (state.phase === "chapter1End") {
        setScene({
          heading: "第一卷餘波",
          paragraphs: [
            "黑松嶺一戰已經結束，所有傷亡與後果仍然保留。"
          ],
          actions: [{
            label: "進入第一卷結語",
            handler: chapter1Aftermath
          }]
        });
        return;
      }

      if (state.phase === "battlefield2" && state.battle) {
        setScene({
          heading: "涿水渡口・續",
          paragraphs: [
            "橋火、難民與兩岸兵馬仍維持存檔時的狀態。你要繼續完成原本目標。"
          ],
          actions: chapter2BattleActions()
        });
        return;
      }

      if (state.phase === "chapter2End") {
        setScene({
          heading: "第二卷餘頁",
          paragraphs: [
            "涿水渡口一戰已經留下結果。人物能力、裝備、傷勢、關係與聲望全部仍在。",
            "你可以查看本卷總結與完整人物命簿。"
          ],
          actions: [
            {
              label: "查看第二卷結語",
              className: "history-action",
              handler: showChapter2Ending
            },
            {
              label: "查看人物命簿",
              className: "safe",
              handler: openLedger
            }
          ]
        });
        return;
      }

      if (state.phase === "chapter2") {
        if (!state.chapter2.route) {
          setScene({
            heading: "黃巾初起・續",
            paragraphs: [
              "涿郡仍在徵募人手。你尚未決定以甚麼身份進入亂局。"
            ],
            actions: chapter2RouteActions()
          });
        } else {
          setScene({
            heading: "前往涿水渡口",
            paragraphs: [
              `命書記得你選擇了「${routeName(state.chapter2.route)}」道路。`,
              "為避免讀檔後遺失中途狀態，你可以由渡口決戰前繼續。所有角色資料與前章後果仍然保留。"
            ],
            actions: [{
              label: "前往渡口決戰",
              className: "danger",
              handler: () => chapter2Convergence(routeName(state.chapter2.route))
            }]
          });
        }
        return;
      }

      startCreation();
    }

    function routeName(route) {
      const names = {
        volunteer: "義兵前線",
        scout: "斥候情報",
        logistics: "軍糧後勤",
        organize: "鄉里組織",
        stay: "留守護民",
        taiping: "太平道接觸"
      };

      return names[route] || "未定道路";
    }

    function showBootScreen(saved) {
      state = saved || newState();
      renderSidebar();

      $("storyHeading").textContent = saved
        ? "舊卷尚存"
        : "一頁無字之書";

      $("sceneMeta").textContent = saved
        ? `${state.originRegion}・${state.year} 年`
        : "幽州・涿郡・公元一六八年";

      $("enemyArea").innerHTML = "";
      $("battleArea").innerHTML = "";
      $("rollArea").innerHTML = "";

      if (saved) {
        $("storyText").innerHTML = formatParagraphs([
          `命簿記得${state.name}曾經作出的選擇。`,
          `目前進度位於第 ${state.chapter || 1} 卷，時間為公元 ${state.year} 年。`,
          "讀取後會恢復人物能力、經歷、裝備、傷勢、聲望、NPC 記憶與當前戰鬥狀態。"
        ]);

        setActions([
          {
            label: "繼續舊卷",
            className: "safe",
            handler: () => resumeLoadedState(false)
          },
          {
            label: "建立新人物",
            className: "danger",
            handler: confirmNewCampaign
          }
        ]);
      } else {
        $("storyText").innerHTML = formatParagraphs([
          "漢室未亡，天下已處處腐壞。",
          "你會生於幽州涿郡一戶尋常人家。你並非天命英雄，所有能力、關係、傷勢與後果都要由往後人生親自承擔。"
        ]);

        setActions([{
          label: "展開新命書",
          className: "history-action",
          handler: startCreation
        }]);
      }
    }

    function boot() {
      $("ledgerButton").addEventListener("click", openLedger);
      $("menuButton").addEventListener("click", openMenu);

      $("modalBackdrop").addEventListener("click", (event) => {
        if (event.target === $("modalBackdrop")) closeModal();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !$("modalBackdrop").hidden) {
          closeModal();
        }
      });

      const saved = loadStored(SAVE_KEY);
      showBootScreen(saved);
    }

    boot();
  </script>
</body>
</html>
