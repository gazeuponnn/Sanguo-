<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#17110d">

  <title>逆命錄・V4.0A</title>

  <style>
    :root {
      color-scheme: dark;

      --black: #0d0a08;
      --deep: #17110d;
      --panel: #211812;
      --panel-soft: #2b2018;

      --parchment: #decda6;
      --parchment-bright: #f1e4c4;
      --muted: #a99472;

      --border: #6c5234;
      --border-bright: #9b784c;

      --blood: #8c2924;
      --blood-bright: #bd493d;

      --gold: #c69a4b;
      --green: #72885d;
      --blue: #718496;

      --shadow: rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--black);
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);

      color: var(--parchment);

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(122, 84, 46, 0.16),
          transparent 35rem
        ),
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.012) 0,
          rgba(255, 255, 255, 0.012) 1px,
          transparent 1px,
          transparent 5px
        ),
        var(--black);

      font-family:
        "Songti TC",
        "Noto Serif TC",
        "PingFang TC",
        "Microsoft JhengHei",
        serif;

      line-height: 1.6;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 10px;
    }

    .masthead {
      margin-bottom: 10px;
      padding: 15px 12px;

      text-align: center;

      border: 1px solid var(--border);

      background:
        linear-gradient(
          rgba(27, 19, 14, 0.92),
          rgba(18, 13, 10, 0.96)
        ),
        var(--panel);

      box-shadow: 0 8px 24px var(--shadow);
    }

    .masthead h1 {
      margin: 0;

      color: var(--parchment-bright);

      font-size: clamp(1.8rem, 7vw, 2.8rem);
      letter-spacing: 0.2em;
      text-indent: 0.2em;
    }

    .masthead p {
      margin: 4px 0 0;

      color: var(--muted);

      font-size: 0.83rem;
      letter-spacing: 0.1em;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(270px, 330px) minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--border);

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.018),
          transparent 40%
        ),
        var(--panel);

      box-shadow: 0 8px 24px var(--shadow);
    }

    .character-panel {
      position: sticky;
      top: 10px;
      padding: 14px;
    }

    .main-panel {
      min-height: 650px;
      padding: clamp(15px, 4vw, 26px);
    }

    .panel-title {
      margin: 0 0 11px;
      padding-bottom: 7px;

      color: var(--gold);
      border-bottom: 1px solid var(--border);

      font-size: 0.95rem;
      letter-spacing: 0.12em;
    }

    .identity {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;

      margin-bottom: 12px;
    }

    .identity strong {
      color: var(--parchment-bright);
      font-size: 1.25rem;
    }

    .identity span {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .meter {
      margin-bottom: 11px;
    }

    .meter-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;

      margin-bottom: 4px;
      font-size: 0.84rem;
    }

    .meter-track {
      height: 11px;
      overflow: hidden;

      border: 1px solid #5d4731;
      background: #100c0a;
    }

    .meter-fill {
      height: 100%;
      width: 100%;

      transition: width 180ms ease;
    }

    .guard-fill {
      background: linear-gradient(90deg, #4f6370, #87a3b5);
    }

    .stamina-fill {
      background: linear-gradient(90deg, #4d5c3d, #859b65);
    }

    .enemy-guard-fill {
      background: linear-gradient(90deg, #642b28, #a7473f);
    }

    .enemy-stamina-fill {
      background: linear-gradient(90deg, #57472f, #a17d48);
    }

    .abilities {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px 12px;

      margin: 12px 0;
    }

    .ability {
      display: flex;
      justify-content: space-between;
      gap: 8px;

      padding-bottom: 2px;
      border-bottom: 1px dotted rgba(222, 205, 166, 0.2);
    }

    .ability span:last-child {
      color: var(--parchment-bright);
      font-variant-numeric: tabular-nums;
    }

    .info-block {
      margin-top: 11px;
      padding-top: 8px;

      border-top: 1px solid rgba(108, 82, 52, 0.65);
    }

    .info-label {
      display: block;

      margin-bottom: 3px;

      color: var(--muted);

      font-size: 0.74rem;
      letter-spacing: 0.1em;
    }

    .info-value {
      color: var(--parchment-bright);
      overflow-wrap: anywhere;
    }

    .small-text {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .status-box {
      margin-top: 12px;
      padding: 9px 10px;

      border-left: 3px solid var(--gold);
      background: rgba(0, 0, 0, 0.2);
    }

    .story-heading {
      margin: 0 0 14px;

      color: var(--parchment-bright);

      font-size: clamp(1.3rem, 5vw, 1.9rem);
      line-height: 1.35;
    }

    #storyText p {
      margin: 0 0 12px;
    }

    .speech {
      color: var(--parchment-bright);
      font-weight: 600;
    }

    .warning {
      color: #e7b099;
    }

    .good {
      color: #bdc99f;
    }

    .enemy-card {
      margin: 14px 0;
      padding: 12px;

      border: 1px solid rgba(140, 41, 36, 0.75);
      background: rgba(75, 22, 19, 0.16);
    }

    .enemy-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;

      margin-bottom: 8px;
    }

    .enemy-header strong {
      color: var(--parchment-bright);
    }

    .wounds {
      margin: 7px 0 0;
      padding-left: 20px;
    }

    .wounds li {
      margin-bottom: 3px;
      color: #e0b09a;
    }

    .roll-box {
      margin: 14px 0;
      padding: 10px 11px;

      border: 1px solid rgba(155, 120, 76, 0.62);
      background: rgba(8, 6, 5, 0.42);

      color: var(--muted);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;

      font-size: 0.75rem;
      line-height: 1.55;

      overflow-wrap: anywhere;
    }

    .roll-line + .roll-line {
      margin-top: 4px;
    }

    .actions-title {
      margin: 20px 0 8px;

      color: var(--gold);

      font-size: 0.88rem;
      letter-spacing: 0.11em;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .action-button {
      width: 100%;
      min-height: 56px;
      padding: 11px 12px;

      color: var(--parchment-bright);

      border: 1px solid var(--border-bright);
      border-radius: 0;

      background:
        linear-gradient(
          rgba(71, 51, 36, 0.76),
          rgba(43, 31, 23, 0.9)
        ),
        var(--panel-soft);

      cursor: pointer;
      text-align: left;
      line-height: 1.35;
    }

    .action-button:active:not(:disabled) {
      transform: translateY(1px);
      background: #513825;
    }

    .action-button.danger {
      border-color: var(--blood-bright);
      background: linear-gradient(#602824, #351b18);
    }

    .action-button.safe {
      border-color: var(--green);
    }

    .action-button.info {
      border-color: var(--blue);
    }

    .action-button:disabled {
      opacity: 0.42;
      cursor: default;
    }

    .action-button small {
      display: block;

      margin-top: 4px;

      color: var(--muted);
      font-size: 0.73rem;
    }

    .creation-box {
      margin: 12px 0;
      padding: 13px;

      border: 1px solid rgba(155, 120, 76, 0.55);
      background: rgba(0, 0, 0, 0.18);
    }

    .creation-box label {
      display: block;

      margin-bottom: 6px;

      color: var(--gold);
    }

    .creation-box input {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;

      color: var(--parchment-bright);

      border: 1px solid var(--border-bright);
      border-radius: 0;
      outline: none;

      background: #120e0b;
    }

    .creation-box input:focus {
      border-color: var(--gold);
    }

    .selection-summary {
      margin: 12px 0;
      padding: 11px;

      border-left: 3px solid var(--green);
      background: rgba(0, 0, 0, 0.18);
    }

    .footer {
      padding: 15px 4px 6px;

      color: #77664f;

      text-align: center;
      font-size: 0.72rem;
    }

    @media (max-width: 760px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .character-panel {
        position: static;
      }

      .main-panel {
        min-height: 520px;
      }

      .mobile-summary {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 12px;
      }
    }

    @media (max-width: 460px) {
      #app {
        padding: 7px;
      }

      .masthead {
        padding: 12px 8px;
      }

      .main-panel {
        padding: 14px 12px;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .action-button {
        min-height: 58px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main id="app">
    <header class="masthead">
      <h1>逆命錄</h1>
      <p>轉生篇・黑松嶺首戰・V4.0A</p>
    </header>

    <div class="layout">
      <aside class="panel character-panel">
        <h2 class="panel-title">人物命簿</h2>

        <div class="identity">
          <strong id="playerName">未題名</strong>
          <span id="playerAge">尚未轉生</span>
        </div>

        <div class="meter">
          <div class="meter-header">
            <span>Guard</span>
            <span id="guardText">—</span>
          </div>

          <div class="meter-track">
            <div id="guardFill" class="meter-fill guard-fill"></div>
          </div>
        </div>

        <div class="meter">
          <div class="meter-header">
            <span>Stamina</span>
            <span id="staminaText">—</span>
          </div>

          <div class="meter-track">
            <div id="staminaFill" class="meter-fill stamina-fill"></div>
          </div>
        </div>

        <div id="abilities" class="abilities"></div>

        <div class="mobile-summary">
          <div class="info-block">
            <span class="info-label">前世</span>
            <span id="pastLifeText" class="info-value">尚未選定</span>
          </div>

          <div class="info-block">
            <span class="info-label">成長經歷</span>
            <span id="formativeText" class="info-value">尚未選定</span>
          </div>

          <div class="info-block">
            <span class="info-label">兵器</span>
            <span id="weaponText" class="info-value">尚未持兵</span>
          </div>

          <div class="info-block">
            <span class="info-label">傷勢</span>
            <span id="woundText" class="info-value">無</span>
          </div>
        </div>

        <div class="status-box">
          <span class="info-label">此刻境況</span>
          <span id="statusText" class="info-value">命書尚未展開</span>
        </div>

        <div class="info-block">
          <span class="info-label">Random Seed</span>
          <span id="seedText" class="small-text">—</span>
        </div>
      </aside>

      <section class="panel main-panel" aria-live="polite">
        <h2 id="storyHeading" class="story-heading">無字命頁</h2>

        <div id="storyText"></div>
        <div id="enemyArea"></div>
        <div id="rollArea"></div>

        <h3 class="actions-title">你要如何做？</h3>
        <div id="actions" class="actions"></div>
      </section>
    </div>

    <footer class="footer">
      Prototype V4.0A：本版本只測試角色建立、骰局與一對一 duel。
    </footer>
  </main>

  <script>
    "use strict";

    const ABILITY_NAMES = {
      might: "Might",
      agility: "Agility",
      endurance: "Endurance",
      perception: "Perception",
      intellect: "Intellect",
      will: "Will",
      presence: "Presence"
    };

    const PAST_LIVES = {
      history: {
        name: "歷史愛好者",
        description:
          "你記得漢末大勢、重要人物與部分年份，但記憶並不完整。",
        abilities: {
          intellect: 8,
          perception: 4,
          will: 2
        },
        skills: {
          tactics: 12,
          battlefieldAwareness: 6
        }
      },

      martial: {
        name: "現代武術愛好者",
        description:
          "你理解距離、步法與訓練原則，但未曾真正持兵殺敵。",
        abilities: {
          agility: 6,
          endurance: 3,
          will: 4
        },
        skills: {
          dueling: 12,
          blade: 6,
          spear: 5
        }
      },

      medical: {
        name: "醫科學生",
        description:
          "你明白衛生、失血、感染與基礎人體結構。",
        abilities: {
          intellect: 7,
          endurance: 4,
          perception: 3,
          will: 3
        },
        skills: {
          medicine: 15
        }
      },

      management: {
        name: "管理工作者",
        description:
          "你熟悉組織、分工、談判與有限資源下的決策。",
        abilities: {
          presence: 7,
          intellect: 5,
          will: 4
        },
        skills: {
          command: 12,
          tactics: 6
        }
      }
    };

    const FORMATIVE_CHOICES = {
      hunter: {
        name: "跟隨獵戶翻山",
        description:
          "你熟悉山林聲息、腳印與危險來臨前的細微變化。",
        abilities: {
          perception: 8,
          agility: 4,
          endurance: 3
        },
        skills: {
          battlefieldAwareness: 8,
          archery: 10
        }
      },

      militia: {
        name: "隨鄉勇操練",
        description:
          "你搬運兵械、練習隊列，亦曾用木兵器與成年人較量。",
        abilities: {
          might: 7,
          endurance: 5,
          will: 3
        },
        skills: {
          blade: 8,
          spear: 8,
          battlefieldAwareness: 4
        }
      },

      scholar: {
        name: "研讀經史兵書",
        description:
          "你學會書寫、推演地形，亦嘗試將前世記憶與今世知識連接。",
        abilities: {
          intellect: 8,
          perception: 3,
          will: 3
        },
        skills: {
          tactics: 10,
          command: 4
        }
      },

      mediator: {
        name: "協助鄉里調解紛爭",
        description:
          "你學會觀察利益、恐懼與人群在壓力下的反應。",
        abilities: {
          presence: 8,
          will: 5,
          perception: 2
        },
        skills: {
          command: 8,
          dueling: 3
        }
      }
    };

    const WEAPONS = {
      blade: {
        key: "blade",
        name: "舊制環首刀",
        ability: "might",
        skill: "blade",
        accuracy: 1,
        damageSides: 8,
        staminaCost: 2,
        armourPiercing: 0,
        description:
          "攻守平衡，近身時容易運用。"
      },

      spear: {
        key: "spear",
        name: "白蠟長矛",
        ability: "agility",
        skill: "spear",
        accuracy: 2,
        damageSides: 6,
        staminaCost: 2,
        armourPiercing: 0,
        description:
          "命中較穩定，擅長保持距離。"
      },

      polearm: {
        key: "polearm",
        name: "沉背長戟",
        ability: "might",
        skill: "heavyPolearm",
        accuracy: 0,
        damageSides: 10,
        staminaCost: 3,
        armourPiercing: 1,
        description:
          "Impact 強，但揮動時消耗較大。"
      }
    };

    const ARMOURS = {
      player: {
        name: "綴片皮甲",
        mitigation: 2,
        woundProtection: 1
      },

      enemy: {
        name: "硬皮坎肩",
        mitigation: 1,
        woundProtection: 1
      }
    };

    const ENEMY_TEMPLATE = {
      name: "黑石寨頭領・韓魁",

      abilities: {
        might: 63,
        agility: 54,
        endurance: 60,
        perception: 52,
        intellect: 43,
        will: 61,
        presence: 57
      },

      skills: {
        blade: 55,
        spear: 20,
        heavyPolearm: 25,
        archery: 20,
        dueling: 50,
        battlefieldAwareness: 45,
        command: 42,
        tactics: 35,
        medicine: 5
      },

      weapon: {
        key: "blade",
        name: "缺口山刀",
        ability: "might",
        skill: "blade",
        accuracy: 1,
        damageSides: 8,
        staminaCost: 2,
        armourPiercing: 0
      },

      armour: ARMOURS.enemy
    };

    let state = null;
    let creation = {
      name: "",
      pastLife: null,
      formative: null,
      weapon: null
    };

    let rngState = 1;

    function clamp(value, minimum, maximum) {
      return Math.max(minimum, Math.min(maximum, value));
    }

    function signed(value) {
      return value >= 0 ? `+${value}` : `${value}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function seedRng(seed) {
      rngState = seed >>> 0;

      if (rngState === 0) {
        rngState = 1;
      }
    }

    function random() {
      rngState += 0x6D2B79F5;

      let value = rngState;

      value = Math.imul(value ^ (value >>> 15), value | 1);
      value ^= value + Math.imul(value ^ (value >>> 7), value | 61);

      return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
    }

    function die(sides) {
      return Math.floor(random() * sides) + 1;
    }

    function abilityModifier(score) {
      return clamp(Math.round((score - 50) / 10), -5, 5);
    }

    function skillModifier(score) {
      return clamp(Math.round((score - 50) / 10), -5, 5);
    }

    function blankAbilities() {
      return {
        might: 50,
        agility: 50,
        endurance: 50,
        perception: 50,
        intellect: 50,
        will: 50,
        presence: 50
      };
    }

    function blankSkills() {
      return {
        blade: 25,
        spear: 25,
        heavyPolearm: 20,
        archery: 20,
        dueling: 25,
        battlefieldAwareness: 25,
        command: 15,
        tactics: 20,
        medicine: 10
      };
    }

    function applyBonuses(target, bonuses) {
      Object.entries(bonuses || {}).forEach(([key, amount]) => {
        target[key] = clamp((target[key] || 0) + amount, 0, 99);
      });
    }

    function makeCombatant(data) {
      const enduranceMod = abilityModifier(data.abilities.endurance);
      const willMod = abilityModifier(data.abilities.will);

      const maxGuard = 15 + enduranceMod + willMod;
      const maxStamina = 18 + enduranceMod * 2;

      return {
        name: data.name,
        abilities: structuredClone(data.abilities),
        skills: structuredClone(data.skills),

        weapon: structuredClone(data.weapon),
        armour: structuredClone(data.armour),

        maxGuard: Math.max(10, maxGuard),
        guard: Math.max(10, maxGuard),

        maxStamina: Math.max(12, maxStamina),
        stamina: Math.max(12, maxStamina),

        wounds: [],

        guarded: false,
        opening: false,
        focus: 0,
        defeated: false,
        dead: false
      };
    }

    function buildPlayer() {
      const abilities = blankAbilities();
      const skills = blankSkills();

      applyBonuses(
        abilities,
        PAST_LIVES[creation.pastLife].abilities
      );

      applyBonuses(
        skills,
        PAST_LIVES[creation.pastLife].skills
      );

      applyBonuses(
        abilities,
        FORMATIVE_CHOICES[creation.formative].abilities
      );

      applyBonuses(
        skills,
        FORMATIVE_CHOICES[creation.formative].skills
      );

      const weapon = WEAPONS[creation.weapon];

      skills[weapon.skill] = clamp(
        skills[weapon.skill] + 10,
        0,
        99
      );

      return makeCombatant({
        name: creation.name,
        abilities,
        skills,
        weapon,
        armour: ARMOURS.player
      });
    }

    function buildEnemy() {
      return makeCombatant(ENEMY_TEMPLATE);
    }

    function woundPenalty(combatant) {
      let penalty = 0;

      for (const wound of combatant.wounds) {
        if (wound.severity === "Minor") {
          penalty += 0.5;
        }

        if (wound.severity === "Serious") {
          penalty += 2;
        }

        if (wound.severity === "Critical") {
          penalty += 5;
        }
      }

      if (combatant.stamina <= combatant.maxStamina * 0.25) {
        penalty += 2;
      } else if (combatant.stamina <= combatant.maxStamina * 0.5) {
        penalty += 1;
      }

      return Math.floor(penalty);
    }

    function defenceOf(combatant) {
      const agilityMod =
        abilityModifier(combatant.abilities.agility);

      const duelingMod =
        skillModifier(combatant.skills.dueling);

      const guardBonus = combatant.guarded ? 3 : 0;

      return (
        11 +
        agilityMod +
        duelingMod +
        guardBonus -
        woundPenalty(combatant)
      );
    }

    function rollD20(hasAdvantage = false, hasDisadvantage = false) {
      const first = die(20);

      if (hasAdvantage && !hasDisadvantage) {
        const second = die(20);

        return {
          value: Math.max(first, second),
          dice: [first, second],
          mode: "Advantage"
        };
      }

      if (hasDisadvantage && !hasAdvantage) {
        const second = die(20);

        return {
          value: Math.min(first, second),
          dice: [first, second],
          mode: "Disadvantage"
        };
      }

      return {
        value: first,
        dice: [first],
        mode: "Normal"
      };
    }

    function actionRoll(
      attacker,
      defender,
      options = {}
    ) {
      const weapon = attacker.weapon;

      const abilityMod =
        abilityModifier(attacker.abilities[weapon.ability]);

      const skillMod =
        skillModifier(attacker.skills[weapon.skill]);

      const injuryPenalty = woundPenalty(attacker);

      const situation =
        (options.situation || 0) +
        attacker.focus;

      const hasAdvantage =
        Boolean(options.advantage || attacker.opening);

      const hasDisadvantage =
        Boolean(options.disadvantage);

      const roll = rollD20(hasAdvantage, hasDisadvantage);

      const total =
        roll.value +
        abilityMod +
        skillMod +
        weapon.accuracy +
        situation -
        injuryPenalty;

      const defence = defenceOf(defender);

      const naturalOne = roll.value === 1;
      const naturalTwenty = roll.value === 20;

      const success =
        !naturalOne &&
        (
          naturalTwenty ||
          total >= defence
        );

      const margin = total - defence;

      return {
        roll,
        abilityMod,
        skillMod,
        weaponBonus: weapon.accuracy,
        situation,
        injuryPenalty,
        total,
        defence,
        success,
        margin,
        critical: naturalTwenty,
        disaster: naturalOne
      };
    }

    function effectDice(sides, critical = false) {
      const dice = [die(sides)];

      if (critical) {
        dice.push(die(sides));
      }

      return {
        dice,
        total: dice.reduce((sum, value) => sum + value, 0)
      };
    }

    function actionRollLine(label, result) {
      const diceText = result.roll.dice.join(", ");

      return (
        `${label}：${result.roll.mode} d20 [${diceText}] ` +
        `${signed(result.abilityMod)} Ability ` +
        `${signed(result.skillMod)} Skill ` +
        `${signed(result.weaponBonus)} Weapon ` +
        `${signed(result.situation)} Situation ` +
        `${signed(-result.injuryPenalty)} Injury ` +
        `= ${result.total}，對抗 Defense ${result.defence}`
      );
    }

    function addWound(target, severity) {
      const woundNames = {
        Minor: [
          "手臂割傷",
          "肩背挫傷",
          "額角裂傷",
          "肋側擦傷"
        ],

        Serious: [
          "大腿深創",
          "左臂重傷",
          "肋骨受創",
          "肩部裂傷"
        ],

        Critical: [
          "胸腹重創",
          "頸側深創",
          "大量失血",
          "腿骨重創"
        ],

        Mortal: [
          "致命胸創",
          "頸部致命傷",
          "腹部致命傷",
          "失血瀕死"
        ]
      };

      const list = woundNames[severity];
      const name = list[die(list.length) - 1];

      target.wounds.push({
        severity,
        name
      });

      if (severity === "Critical") {
        target.defeated = true;
      }

      if (severity === "Mortal") {
        target.defeated = true;
        target.dead = true;
      }

      const seriousCount = target.wounds.filter(
        wound => wound.severity === "Serious"
      ).length;

      if (seriousCount >= 2) {
        target.defeated = true;
      }

      return name;
    }

    function applyImpact(
      attacker,
      target,
      rawImpact,
      margin,
      armourPiercing = 0
    ) {
      const result = {
        rawImpact,
        armourMitigation: Math.max(
          0,
          target.armour.mitigation - armourPiercing
        ),
        finalImpact: 0,
        guardLoss: 0,
        overflow: 0,
        woundRoll: null,
        wound: null
      };

      result.finalImpact = Math.max(
        1,
        rawImpact - result.armourMitigation
      );

      result.guardLoss = Math.min(
        target.guard,
        result.finalImpact
      );

      target.guard -= result.guardLoss;

      result.overflow =
        result.finalImpact - result.guardLoss;

      if (result.overflow <= 0) {
        return result;
      }

      const woundDie = die(20);

      const enduranceMod =
        abilityModifier(target.abilities.endurance);

      const marginBonus =
        Math.max(0, Math.floor(margin / 5));

      const woundProtection =
        target.armour.woundProtection || 0;

      const woundScore =
        woundDie +
        result.overflow +
        marginBonus -
        enduranceMod -
        woundProtection;

      result.woundRoll = {
        die: woundDie,
        overflow: result.overflow,
        marginBonus,
        enduranceMod,
        woundProtection,
        total: woundScore
      };

      let severity = null;

      if (woundScore >= 24) {
        severity = "Mortal";
      } else if (woundScore >= 20) {
        severity = "Critical";
      } else if (woundScore >= 16) {
        severity = "Serious";
      } else if (woundScore >= 12) {
        severity = "Minor";
      }

      if (severity) {
        result.wound = {
          severity,
          name: addWound(target, severity)
        };
      }

      return result;
    }

    function impactLines(label, diceResult, impactResult) {
      const lines = [];

      lines.push(
        `${label} Effect：` +
        `[${diceResult.dice.join(", ")}] = ${diceResult.total}`
      );

      lines.push(
        `Impact：${impactResult.rawImpact} ` +
        `- Armor ${impactResult.armourMitigation} ` +
        `= ${impactResult.finalImpact}；` +
        `Guard 損失 ${impactResult.guardLoss}`
      );

      if (impactResult.woundRoll) {
        const wound = impactResult.woundRoll;

        lines.push(
          `Wound Roll：d20 ${wound.die} ` +
          `${signed(wound.overflow)} Overflow ` +
          `${signed(wound.marginBonus)} Margin ` +
          `${signed(-wound.enduranceMod)} Endurance ` +
          `${signed(-wound.woundProtection)} Armor ` +
          `= ${wound.total}`
        );
      }

      if (impactResult.wound) {
        lines.push(
          `傷勢：${impactResult.wound.severity}・` +
          `${impactResult.wound.name}`
        );
      }

      return lines;
    }

    function woundSummary(combatant) {
      if (!combatant || combatant.wounds.length === 0) {
        return "無";
      }

      return combatant.wounds
        .map(wound => `${wound.name}（${wound.severity}）`)
        .join("、");
    }

    function setScene(
      heading,
      paragraphs,
      actions = [],
      rolls = []
    ) {
      document.getElementById("storyHeading").textContent = heading;

      document.getElementById("storyText").innerHTML =
        paragraphs
          .map(paragraph => {
            const className =
              paragraph.startsWith("『")
                ? "speech"
                : "";

            return (
              `<p class="${className}">` +
              `${escapeHtml(paragraph)}` +
              `</p>`
            );
          })
          .join("");

      document.getElementById("rollArea").innerHTML =
        rolls.length > 0
          ? `
            <div class="roll-box">
              ${rolls
                .map(line => (
                  `<div class="roll-line">${escapeHtml(line)}</div>`
                ))
                .join("")}
            </div>
          `
          : "";

      renderActions(actions);
      renderAll();
    }

    function renderActions(actions) {
      const container = document.getElementById("actions");

      container.innerHTML = "";

      actions.forEach(action => {
        const button = document.createElement("button");

        button.type = "button";
        button.className =
          `action-button ${action.className || ""}`;

        button.disabled = Boolean(action.disabled);

        button.innerHTML =
          `${escapeHtml(action.label)}` +
          (
            action.note
              ? `<small>${escapeHtml(action.note)}</small>`
              : ""
          );

        button.addEventListener("click", action.handler);

        container.appendChild(button);
      });
    }

    function renderAll() {
      renderPlayer();
      renderEnemy();
    }

    function renderPlayer() {
      const player = state ? state.player : null;

      document.getElementById("playerName").textContent =
        player ? player.name : creation.name || "未題名";

      document.getElementById("playerAge").textContent =
        state ? "18 歲・光和六年" : "尚未轉生";

      document.getElementById("pastLifeText").textContent =
        creation.pastLife
          ? PAST_LIVES[creation.pastLife].name
          : "尚未選定";

      document.getElementById("formativeText").textContent =
        creation.formative
          ? FORMATIVE_CHOICES[creation.formative].name
          : "尚未選定";

      document.getElementById("weaponText").textContent =
        player
          ? `${player.weapon.name}・${player.armour.name}`
          : creation.weapon
            ? WEAPONS[creation.weapon].name
            : "尚未持兵";

      document.getElementById("seedText").textContent =
        state ? String(state.seed) : "—";

      if (!player) {
        document.getElementById("guardText").textContent = "—";
        document.getElementById("staminaText").textContent = "—";
        document.getElementById("guardFill").style.width = "0%";
        document.getElementById("staminaFill").style.width = "0%";
        document.getElementById("woundText").textContent = "無";
        document.getElementById("abilities").innerHTML = "";
        document.getElementById("statusText").textContent =
          "命書尚未展開";

        return;
      }

      document.getElementById("guardText").textContent =
        `${player.guard} / ${player.maxGuard}`;

      document.getElementById("staminaText").textContent =
        `${player.stamina} / ${player.maxStamina}`;

      document.getElementById("guardFill").style.width =
        `${clamp(player.guard / player.maxGuard * 100, 0, 100)}%`;

      document.getElementById("staminaFill").style.width =
        `${clamp(player.stamina / player.maxStamina * 100, 0, 100)}%`;

      document.getElementById("woundText").textContent =
        woundSummary(player);

      document.getElementById("abilities").innerHTML =
        Object.entries(ABILITY_NAMES)
          .map(([key, label]) => {
            return `
              <div class="ability">
                <span>${escapeHtml(label)}</span>
                <span>${player.abilities[key]}</span>
              </div>
            `;
          })
          .join("");

      let status = "正與韓魁交鋒";

      if (player.defeated) {
        status = player.dead
          ? "命斷黑松嶺"
          : "已失去戰鬥能力";
      } else if (player.stamina <= player.maxStamina * 0.25) {
        status = "體力將盡，動作開始變慢";
      } else if (player.guard <= 0) {
        status = "Guard 已崩潰，下一擊可能造成重傷";
      } else if (player.opening) {
        status = "已看穿敵人空門";
      } else if (player.focus > 0) {
        status = "已掌握敵人部分節奏";
      }

      document.getElementById("statusText").textContent = status;
    }

    function renderEnemy() {
      const container = document.getElementById("enemyArea");

      if (!state || !state.enemy || state.phase !== "duel") {
        container.innerHTML = "";
        return;
      }

      const enemy = state.enemy;

      const guardPercent = clamp(
        enemy.guard / enemy.maxGuard * 100,
        0,
        100
      );

      const staminaPercent = clamp(
        enemy.stamina / enemy.maxStamina * 100,
        0,
        100
      );

      const woundsHtml =
        enemy.wounds.length > 0
          ? `
            <ul class="wounds">
              ${enemy.wounds
                .map(wound => (
                  `<li>${escapeHtml(wound.name)}（${escapeHtml(wound.severity)}）</li>`
                ))
                .join("")}
            </ul>
          `
          : `<div class="small-text">暫無明顯傷勢</div>`;

      container.innerHTML = `
        <div class="enemy-card">
          <div class="enemy-header">
            <strong>${escapeHtml(enemy.name)}</strong>
            <span>Defense ${defenceOf(enemy)}</span>
          </div>

          <div class="meter">
            <div class="meter-header">
              <span>Enemy Guard</span>
              <span>${enemy.guard} / ${enemy.maxGuard}</span>
            </div>

            <div class="meter-track">
              <div
                class="meter-fill enemy-guard-fill"
                style="width: ${guardPercent}%"
              ></div>
            </div>
          </div>

          <div class="meter">
            <div class="meter-header">
              <span>Enemy Stamina</span>
              <span>${enemy.stamina} / ${enemy.maxStamina}</span>
            </div>

            <div class="meter-track">
              <div
                class="meter-fill enemy-stamina-fill"
                style="width: ${staminaPercent}%"
              ></div>
            </div>
          </div>

          <div class="small-text">
            ${escapeHtml(enemy.weapon.name)}・
            ${escapeHtml(enemy.armour.name)}
          </div>

          ${woundsHtml}
        </div>
      `;
    }

    function startCreation() {
      state = null;

      creation = {
        name: "",
        pastLife: null,
        formative: null,
        weapon: null
      };

      document.getElementById("enemyArea").innerHTML = "";
      document.getElementById("rollArea").innerHTML = "";

      document.getElementById("storyHeading").textContent =
        "前世已盡";

      document.getElementById("storyText").innerHTML = `
        <p>你原本生活在另一個時代。</p>

        <p>
          死亡之後，你沒有迎來虛無。
          再次睜眼時，屋頂是煙燻發黑的木樑，
          窗外有人談論漢室、徵斂與太平道。
        </p>

        <p>
          你帶著前世記憶，在東漢末年重新出生。
          但記憶不是力量本身。這具身體仍要重新成長，
          兵器仍會割開血肉，而你記得的歷史亦可能被自己的選擇改寫。
        </p>

        <div class="creation-box">
          <label for="nameInput">今世姓名</label>

          <input
            id="nameInput"
            type="text"
            maxlength="12"
            placeholder="例如：沈越"
            autocomplete="off"
          >
        </div>
      `;

      const actions = Object.entries(PAST_LIVES).map(
        ([key, pastLife]) => ({
          label: pastLife.name,
          note: pastLife.description,
          className: "info",
          handler: () => choosePastLife(key)
        })
      );

      renderActions(actions);
      renderAll();
    }

    function choosePastLife(key) {
      const input = document.getElementById("nameInput");
      const name = input.value.trim();

      if (!name) {
        alert("請先輸入今世姓名。");
        input.focus();
        return;
      }

      creation.name = name.slice(0, 12);
      creation.pastLife = key;

      setScene(
        "兩世記憶",
        [
          `${creation.name}，你在漢末的一戶尋常人家長大。`,
          `前世的你是「${PAST_LIVES[key].name}」。`,
          "你不能向任何人證明自己曾活在千多年後。你只能將模糊記憶藏在心底，等待真正能夠運用它們的一日。",
          "成長期間，哪一段經歷對你影響最大？"
        ],
        Object.entries(FORMATIVE_CHOICES).map(
          ([choiceKey, choice]) => ({
            label: choice.name,
            note: choice.description,
            handler: () => chooseFormative(choiceKey)
          })
        )
      );
    }

    function chooseFormative(key) {
      creation.formative = key;

      setScene(
        "光和六年・大亂前夕",
        [
          `十八歲時，你已因「${FORMATIVE_CHOICES[key].name}」形成自己的本領。`,
          "你記得黃巾之亂將近，但準確日期與細節已經模糊。附近村落仍然照常耕作，官吏仍然催收糧稅，只有愈來愈多流民與秘密集會令人不安。",
          "村中準備押送糧藥穿過黑松嶺。山路近來有盜匪出沒，鄉勇讓你從有限兵械中選一件上陣。"
        ],
        Object.entries(WEAPONS).map(
          ([weaponKey, weapon]) => ({
            label: weapon.name,
            note:
              `${weapon.description} ` +
              `命中 ${signed(weapon.accuracy)}・` +
              `Effect 1d${weapon.damageSides}`,
            handler: () => chooseWeapon(weaponKey)
          })
        )
      );
    }

    function chooseWeapon(key) {
      creation.weapon = key;

      const seed =
        (
          Date.now() ^
          Math.floor(Math.random() * 2147483647)
        ) >>> 0;

      startDuel(seed);
    }

    function startDuel(seed) {
      seedRng(seed);

      state = {
        phase: "duel",
        seed,
        round: 1,
        player: buildPlayer(),
        enemy: buildEnemy()
      };

      setScene(
        "黑松嶺・山道叫陣",
        [
          "糧隊走入山道深處時，坡上忽然傳來碎石滾動的聲音。",
          "十餘名山賊從林間現身，弓箭與短矛對準糧車。一名虯髯大漢提著缺口山刀走落山道。",
          "『留下糧車，我可以讓其他人走。若有人自認是好漢，便出來與韓魁決個生死！』",
          "你知道歷史上的黃巾大亂即將來臨，卻可能先死在一個史書從未記載的山賊手上。"
        ],
        duelActions()
      );
    }

    function duelActions() {
      if (!state || state.phase !== "duel") {
        return [];
      }

      const player = state.player;

      return [
        {
          label: "Observe",
          note:
            "觀察步法與呼吸。成功後提高下一次 Action Roll。",
          className: "info",
          handler: playerObserve
        },

        {
          label: "Feint",
          note:
            "製造假動作。成功後下一次攻擊獲得 Advantage。",
          handler: playerFeint
        },

        {
          label: "Pressure",
          note:
            "集中削減敵人 Guard 與 Stamina，較難直接造成傷勢。",
          handler: playerPressure
        },

        {
          label: "Quick Strike",
          note:
            "Stamina 消耗較低，命中獲得小量加成。",
          handler: () => playerStrike("quick")
        },

        {
          label: "Heavy Strike",
          note:
            "Effect 較強，但消耗更大，命中較困難。",
          className: "danger",
          disabled: player.stamina < 4,
          handler: () => playerStrike("heavy")
        },

        {
          label: "Guard",
          note:
            "恢復部分 Guard，並提高本回合 Defense。",
          className: "safe",
          handler: playerGuard
        },

        {
          label: "Withdraw",
          note:
            "嘗試離開 duel，返回糧車陣線。",
          className: "safe",
          handler: playerWithdraw
        }
      ];
    }

    function preparePlayerAction(staminaCost = 0) {
      const player = state.player;

      player.guarded = false;
      player.stamina = Math.max(
        0,
        player.stamina - staminaCost
      );
    }

    function consumeSetup(player) {
      player.focus = 0;
      player.opening = false;
    }

    function playerObserve() {
      const player = state.player;
      const enemy = state.enemy;

      preparePlayerAction(1);

      const roll = rollD20();

      const perceptionMod =
        abilityModifier(player.abilities.perception);

      const awarenessMod =
        skillModifier(player.skills.battlefieldAwareness);

      const injuryPenalty = woundPenalty(player);

      const total =
        roll.value +
        perceptionMod +
        awarenessMod -
        injuryPenalty;

      const difficulty =
        12 +
        abilityModifier(enemy.abilities.perception);

      const success =
        roll.value !== 1 &&
        (
          roll.value === 20 ||
          total >= difficulty
        );

      const lines = [
        `Observe：d20 [${roll.dice.join(", ")}] ` +
        `${signed(perceptionMod)} Perception ` +
        `${signed(awarenessMod)} Awareness ` +
        `${signed(-injuryPenalty)} Injury ` +
        `= ${total}，對抗 ${difficulty}`
      ];

      const paragraphs = [];

      if (success) {
        player.focus = roll.value === 20 ? 4 : 2;

        paragraphs.push(
          "你沒有立即出手，而是觀察韓魁肩膀、握刀與換氣節奏。"
        );

        paragraphs.push(
          roll.value === 20
            ? "你發現他每次準備重斬之前，右腳都會先向外轉開。這個習慣幾乎將下一步寫在地上。"
            : "你逐漸掌握他重刀發力前的細微停頓。下一次行動會更有把握。"
        );
      } else {
        player.focus = 0;

        paragraphs.push(
          "韓魁故意左右晃動刀鋒，腳步與呼吸都沒有固定節奏。你未能看穿他的真正意圖。"
        );
      }

      enemyTurn(paragraphs, lines);
    }

    function playerFeint() {
      const player = state.player;
      const enemy = state.enemy;

      preparePlayerAction(2);

      const roll = rollD20();

      const agilityMod =
        abilityModifier(player.abilities.agility);

      const duelingMod =
        skillModifier(player.skills.dueling);

      const injuryPenalty = woundPenalty(player);

      const total =
        roll.value +
        agilityMod +
        duelingMod +
        player.focus -
        injuryPenalty;

      const difficulty =
        12 +
        abilityModifier(enemy.abilities.perception) +
        skillModifier(enemy.skills.dueling);

      const success =
        roll.value !== 1 &&
        (
          roll.value === 20 ||
          total >= difficulty
        );

      const lines = [
        `Feint：d20 [${roll.dice.join(", ")}] ` +
        `${signed(agilityMod)} Agility ` +
        `${signed(duelingMod)} Dueling ` +
        `${signed(player.focus)} Focus ` +
        `${signed(-injuryPenalty)} Injury ` +
        `= ${total}，對抗 ${difficulty}`
      ];

      const paragraphs = [];

      player.focus = 0;

      if (success) {
        player.opening = true;

        paragraphs.push(
          "你將兵刃向韓魁左肩一送，卻在他舉刀攔截前突然收勢。"
        );

        paragraphs.push(
          roll.value === 20
            ? "韓魁全力轉向錯誤方向，胸腹與持刀手同時暴露。你已完全奪得這一合的節奏。"
            : "韓魁的防守被假動作牽開。下一次攻擊會獲得 Advantage。"
        );
      } else {
        player.opening = false;

        paragraphs.push(
          "韓魁沒有追著你的兵刃移動，只用刀尖守住中線。你的假動作未能騙過他。"
        );
      }

      enemyTurn(paragraphs, lines);
    }

    function playerPressure() {
      const player = state.player;
      const enemy = state.enemy;

      preparePlayerAction(2);

      const result = actionRoll(
        player,
        enemy,
        {
          situation: 1
        }
      );

      const lines = [
        actionRollLine("Pressure", result)
      ];

      const paragraphs = [];

      if (result.success) {
        const effect = effectDice(6, result.critical);

        const mightMod =
          Math.max(
            0,
            abilityModifier(player.abilities.might)
          );

        const guardDamage =
          effect.total +
          mightMod +
          Math.max(0, Math.floor(result.margin / 5));

        enemy.guard = Math.max(
          0,
          enemy.guard - guardDamage
        );

        const staminaDamage =
          result.critical ? 4 : 2;

        enemy.stamina = Math.max(
          0,
          enemy.stamina - staminaDamage
        );

        lines.push(
          `Pressure Effect：[${effect.dice.join(", ")}] ` +
          `${signed(mightMod)} Might = ${guardDamage} Guard；` +
          `${staminaDamage} Stamina`
        );

        paragraphs.push(
          result.critical
            ? "你連續逼近，不讓韓魁重新站穩。兵刃碰撞之間，他的防守被徹底壓開，呼吸亦開始散亂。"
            : "你不急於斬中身體，只是不斷迫使韓魁格擋、退步與重新舉刀。他的 Guard 與體力同時受壓。"
        );
      } else {
        paragraphs.push(
          result.disaster
            ? "你壓得太急，兵刃撞上山壁。韓魁趁機將你逼回原位。"
            : "韓魁以刀背強行撞開你的攻勢，沒有讓你建立持續壓力。"
        );
      }

      consumeSetup(player);

      if (checkCombatEnd(paragraphs, lines)) {
        return;
      }

      enemyTurn(paragraphs, lines);
    }

    function playerStrike(type) {
      const player = state.player;
      const enemy = state.enemy;

      const heavy = type === "heavy";

      const staminaCost =
        player.weapon.staminaCost +
        (heavy ? 2 : 0);

      preparePlayerAction(staminaCost);

      const result = actionRoll(
        player,
        enemy,
        {
          situation: heavy ? -2 : 1
        }
      );

      const label =
        heavy ? "Heavy Strike" : "Quick Strike";

      const lines = [
        actionRollLine(label, result)
      ];

      const paragraphs = [];

      if (!result.success) {
        paragraphs.push(
          result.disaster
            ? "你踏步時踩中鬆石，攻勢完全失去重心。韓魁立刻看見你的空門。"
            : heavy
              ? "你全力揮出的重擊被韓魁及時避開，兵器的重量反而拖慢了回守。"
              : "韓魁將刀橫在身前，你的快速攻擊只擦過刀背。"
        );

        consumeSetup(player);

        enemyTurn(
          paragraphs,
          lines,
          result.disaster ? 3 : 0
        );

        return;
      }

      const effect = effectDice(
        player.weapon.damageSides,
        result.critical
      );

      const mightMod =
        Math.max(
          0,
          abilityModifier(player.abilities.might)
        );

      const styleBonus = heavy ? 4 : 0;

      const marginBonus =
        Math.max(
          0,
          Math.floor(result.margin / 5)
        );

      const rawImpact =
        effect.total +
        mightMod +
        styleBonus +
        marginBonus;

      const impact = applyImpact(
        player,
        enemy,
        rawImpact,
        result.margin,
        player.weapon.armourPiercing
      );

      lines.push(
        ...impactLines(label, effect, impact)
      );

      if (impact.wound) {
        paragraphs.push(
          `你的${player.weapon.name}越過韓魁的防守，造成「${impact.wound.name}」。`
        );
      } else if (enemy.guard <= 0) {
        paragraphs.push(
          "韓魁勉強擋下攻擊，但 Guard 已經完全崩潰。下一次有效命中可能造成真正重傷。"
        );
      } else {
        paragraphs.push(
          result.critical
            ? "你抓住破綻猛然切入。韓魁雖未立即倒下，防守節奏已被這一擊打亂。"
            : "兵刃正面相撞。韓魁被逼退數步，Guard 明顯下降。"
        );
      }

      consumeSetup(player);

      if (checkCombatEnd(paragraphs, lines)) {
        return;
      }

      enemyTurn(paragraphs, lines);
    }

    function playerGuard() {
      const player = state.player;

      preparePlayerAction(0);

      const recoveryDie = die(6);

      const enduranceMod =
        Math.max(
          0,
          abilityModifier(player.abilities.endurance)
        );

      const recovery =
        recoveryDie +
        enduranceMod;

      const oldGuard = player.guard;

      player.guard = Math.min(
        player.maxGuard,
        player.guard + recovery
      );

      player.stamina = Math.min(
        player.maxStamina,
        player.stamina + 2
      );

      player.guarded = true;

      const actualRecovery =
        player.guard - oldGuard;

      const paragraphs = [
        "你沒有追擊，而是重新整理腳步，將兵刃收回能夠防守與反擊的位置。",
        `你恢復了 ${actualRecovery} Guard，並準備承受韓魁下一次攻勢。`
      ];

      const lines = [
        `Guard Recovery：d6 ${recoveryDie} ` +
        `${signed(enduranceMod)} Endurance ` +
        `= ${recovery}`
      ];

      enemyTurn(paragraphs, lines);
    }

    function playerWithdraw() {
      const player = state.player;
      const enemy = state.enemy;

      preparePlayerAction(1);

      const roll = rollD20();

      const agilityMod =
        abilityModifier(player.abilities.agility);

      const duelingMod =
        skillModifier(player.skills.dueling);

      const enemyPressure =
        Math.max(
          0,
          abilityModifier(enemy.abilities.agility)
        );

      const injuryPenalty = woundPenalty(player);

      const total =
        roll.value +
        agilityMod +
        duelingMod -
        injuryPenalty;

      const difficulty =
        13 +
        enemyPressure;

      const success =
        roll.value !== 1 &&
        (
          roll.value === 20 ||
          total >= difficulty
        );

      const lines = [
        `Withdraw：d20 ${roll.value} ` +
        `${signed(agilityMod)} Agility ` +
        `${signed(duelingMod)} Dueling ` +
        `${signed(-injuryPenalty)} Injury ` +
        `= ${total}，對抗 ${difficulty}`
      ];

      if (success) {
        state.phase = "ending";

        setScene(
          "退回車陣",
          [
            "你以兵刃封住韓魁追擊路線，逐步退回鄉勇與糧車之間。",
            "這場 duel 沒有分出生死。韓魁仍然活著，而山賊亦未退去。",
            "正式版本之中，戰鬥會由 duel 轉入 group skirmish。V4.0A 暫時在此結束。",
            `你帶著「${woundSummary(player)}」離開單挑位置。`
          ],
          endingActions()
        );

        return;
      }

      const paragraphs = [
        "你試圖拉開距離，但韓魁一直用刀鋒封住退路。",
        "撤離失敗，韓魁已趁你轉身時追上。"
      ];

      enemyTurn(
        paragraphs,
        lines,
        roll.value === 1 ? 3 : 1
      );
    }

    function enemyTurn(
      paragraphs,
      lines,
      bonus = 0
    ) {
      const enemy = state.enemy;
      const player = state.player;

      if (checkCombatEnd(paragraphs, lines)) {
        return;
      }

      enemy.guarded = false;

      if (
        enemy.stamina <= enemy.maxStamina * 0.3 &&
        enemy.guard < enemy.maxGuard * 0.7
      ) {
        const recoveryDie = die(4);

        const recovery =
          recoveryDie +
          Math.max(
            0,
            abilityModifier(enemy.abilities.endurance)
          );

        const oldGuard = enemy.guard;

        enemy.guard = Math.min(
          enemy.maxGuard,
          enemy.guard + recovery
        );

        enemy.stamina = Math.min(
          enemy.maxStamina,
          enemy.stamina + 2
        );

        enemy.guarded = true;

        lines.push(
          `韓魁 Guard Recovery：d4 ${recoveryDie}，` +
          `恢復 ${enemy.guard - oldGuard} Guard`
        );

        paragraphs.push(
          "韓魁沒有立即進攻。他退開半步重新握刀，趁機調整呼吸與防守。"
        );

        player.guarded = false;

        finishRound(paragraphs, lines);
        return;
      }

      const heavy =
        enemy.stamina >= 5 &&
        random() < 0.35;

      const staminaCost =
        enemy.weapon.staminaCost +
        (heavy ? 2 : 0);

      enemy.stamina = Math.max(
        0,
        enemy.stamina - staminaCost
      );

      const result = actionRoll(
        enemy,
        player,
        {
          situation: bonus + (heavy ? -2 : 0)
        }
      );

      const label =
        heavy ? "韓魁重斬" : "韓魁攻擊";

      lines.push(
        actionRollLine(label, result)
      );

      if (!result.success) {
        paragraphs.push(
          result.disaster
            ? "韓魁怒吼著揮刀，卻因用力過猛撞上山壁。他一時無法立即收刀。"
            : player.guarded
              ? "你穩穩守住中線，將韓魁的刀勢引向甲片與兵刃之外。"
              : "韓魁的山刀從你身前掃過，只割開一小片衣角。"
        );

        if (result.disaster) {
          player.opening = true;
        }

        player.guarded = false;

        finishRound(paragraphs, lines);
        return;
      }

      const effect = effectDice(
        enemy.weapon.damageSides,
        result.critical
      );

      const mightMod =
        Math.max(
          0,
          abilityModifier(enemy.abilities.might)
        );

      const heavyBonus =
        heavy ? 4 : 0;

      const marginBonus =
        Math.max(
          0,
          Math.floor(result.margin / 5)
        );

      const rawImpact =
        effect.total +
        mightMod +
        heavyBonus +
        marginBonus;

      const impact = applyImpact(
        enemy,
        player,
        rawImpact,
        result.margin,
        enemy.weapon.armourPiercing
      );

      lines.push(
        ...impactLines(label, effect, impact)
      );

      if (impact.wound) {
        paragraphs.push(
          `韓魁的山刀越過你的防守，造成「${impact.wound.name}」。`
        );
      } else if (player.guard <= 0) {
        paragraphs.push(
          "你勉強擋下山刀，雙臂卻被震得發麻。Guard 已經崩潰。"
        );
      } else {
        paragraphs.push(
          heavy
            ? "沉重山刀正面壓下，你被逼得連退數步，Guard 大幅下降。"
            : "你以兵刃與護甲卸開部分力量，但韓魁的攻勢仍然消耗了你的 Guard。"
        );
      }

      player.guarded = false;

      if (checkCombatEnd(paragraphs, lines)) {
        return;
      }

      finishRound(paragraphs, lines);
    }

    function finishRound(paragraphs, lines) {
      state.round += 1;

      setScene(
        `山道鬥將・第 ${state.round} 合`,
        paragraphs,
        duelActions(),
        lines
      );
    }

    function checkCombatEnd(paragraphs, lines) {
      const player = state.player;
      const enemy = state.enemy;

      if (enemy.defeated) {
        state.phase = "ending";

        const outcome = enemy.dead
          ? "韓魁受到致命傷，山刀脫手落地。"
          : "韓魁傷勢太重，再也無法維持戰鬥姿勢。";

        setScene(
          "首戰得勝",
          [
            ...paragraphs,
            outcome,
            "山賊看見頭領倒下，叫喊聲迅速變成混亂。有人逃入林中，亦有人拋下兵器。",
            "你不是因為主角身份而勝利。前世經歷、今世成長、兵器、每一次 decision 與每一粒骰，都共同造成了這個結果。",
            `你結束戰鬥時仍有 ${player.guard} Guard、${player.stamina} Stamina。`,
            `你留下的傷勢是：${woundSummary(player)}。`
          ],
          endingActions(),
          lines
        );

        return true;
      }

      if (player.defeated) {
        state.phase = "ending";

        if (player.dead) {
          setScene(
            "命斷黑松嶺",
            [
              ...paragraphs,
              "你再也無法握住兵器。山道上的聲音逐漸遠去。",
              "你曾跨越千多年重新出生，卻仍然只是一個會流血、會死亡的人。",
              `${player.name}，十八歲，死於光和六年的黑松嶺。`
            ],
            endingActions(),
            lines
          );
        } else {
          setScene(
            "重傷倒地",
            [
              ...paragraphs,
              "你失去平衡跪倒在山道。兵器仍在手邊，身體卻已經無法繼續服從意志。",
              "韓魁沒有立即補刀。正式版本之中，你可能被俘、獲救，或者目睹糧隊潰敗。",
              `今次 prototype 以失去戰鬥能力結束。傷勢：${woundSummary(player)}。`
            ],
            endingActions(),
            lines
          );
        }

        return true;
      }

      return false;
    }

    function endingActions() {
      return [
        {
          label: "以相同角色重新挑戰",
          note:
            "使用相同 Random Seed，方便重現同檢查戰鬥結果。",
          className: "safe",
          handler: () => startDuel(state.seed)
        },

        {
          label: "使用新 Seed 再戰",
          note:
            "角色不變，但產生另一組骰局。",
          handler: () => {
            const newSeed =
              (
                Date.now() ^
                Math.floor(Math.random() * 2147483647)
              ) >>> 0;

            startDuel(newSeed);
          }
        },

        {
          label: "建立新人物",
          className: "danger",
          handler: startCreation
        }
      ];
    }

    startCreation();
  </script>
</body>
