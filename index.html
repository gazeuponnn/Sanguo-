<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#17110d">
  <title>逆命錄・黃巾初起</title>

  <style>
    :root {
      color-scheme: dark;
      --black: #0d0a08;
      --deep: #17110d;
      --panel: #211812;
      --panel-soft: #2b2018;
      --parchment: #decda6;
      --bright: #f1e4c4;
      --muted: #aa9675;
      --border: #6c5234;
      --border-bright: #9b784c;
      --blood: #8c2924;
      --blood-bright: #bd493d;
      --gold: #c69a4b;
      --green: #72885d;
      --blue: #687f88;
      --shadow: rgba(0, 0, 0, 0.52);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--black);
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
      color: var(--parchment);
      background:
        radial-gradient(circle at 50% 0%, rgba(122, 84, 46, 0.16), transparent 36rem),
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.012) 0,
          rgba(255, 255, 255, 0.012) 1px,
          transparent 1px,
          transparent 5px
        ),
        var(--black);
      font-family:
        "Songti TC",
        "Noto Serif TC",
        "PingFang TC",
        "Microsoft JhengHei",
        serif;
      line-height: 1.65;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    button:focus-visible,
    input:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    #app {
      width: min(1200px, 100%);
      margin: 0 auto;
      padding: 14px;
    }

    .masthead {
      position: relative;
      padding: 18px 150px 14px;
      margin-bottom: 12px;
      text-align: center;
      border: 1px solid var(--border);
      background:
        linear-gradient(rgba(27, 19, 14, 0.92), rgba(18, 13, 10, 0.96)),
        var(--panel);
      box-shadow: 0 8px 24px var(--shadow);
    }

    .masthead h1 {
      margin: 0;
      color: var(--bright);
      font-size: clamp(1.9rem, 7vw, 3rem);
      letter-spacing: 0.22em;
      text-indent: 0.22em;
    }

    .masthead p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      letter-spacing: 0.1em;
    }

    .top-controls {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 7px;
    }

    .small-button {
      min-height: 38px;
      padding: 7px 10px;
      color: var(--parchment);
      border: 1px solid var(--border);
      border-radius: 0;
      background: #211812;
      cursor: pointer;
    }

    .small-button:hover {
      border-color: var(--gold);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(260px, 330px) minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .character-panel,
    .story-panel {
      border: 1px solid var(--border);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.018), transparent 40%),
        var(--panel);
      box-shadow: 0 8px 24px var(--shadow);
    }

    .character-panel {
      position: sticky;
      top: 12px;
      padding: 15px;
    }

    .story-panel {
      min-height: 660px;
      padding: clamp(16px, 4vw, 28px);
    }

    .panel-title {
      margin: 0 0 12px;
      padding-bottom: 8px;
      color: var(--gold);
      border-bottom: 1px solid var(--border);
      font-size: 1rem;
      letter-spacing: 0.13em;
    }

    .identity,
    .bar-header,
    .enemy-row,
    .battle-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
    }

    .identity {
      margin-bottom: 11px;
    }

    .identity strong {
      color: var(--bright);
      font-size: 1.35rem;
      overflow-wrap: anywhere;
    }

    .identity span,
    .bar-header {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .track {
      height: 12px;
      margin: 5px 0 12px;
      overflow: hidden;
      border: 1px solid #67433a;
      background: #100c0a;
    }

    .fill {
      height: 100%;
      width: 100%;
      transition: width 220ms ease;
    }

    .hp-fill {
      background: linear-gradient(90deg, #6f1c1a, var(--blood-bright));
    }

    .enemy-fill {
      background: linear-gradient(90deg, #6d221d, #9e3b32);
    }

    .morale-fill {
      background: linear-gradient(90deg, #536347, #81976b);
    }

    .formation-fill {
      background: linear-gradient(90deg, #4d6066, #78909a);
    }

    .abilities {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
      margin: 12px 0;
    }

    .ability {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 3px;
      border-bottom: 1px dotted rgba(222, 205, 166, 0.22);
    }

    .ability span:last-child {
      color: var(--bright);
      font-variant-numeric: tabular-nums;
    }

    .info-block {
      margin-top: 12px;
      padding-top: 9px;
      border-top: 1px solid rgba(108, 82, 52, 0.7);
    }

    .info-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 0.76rem;
      letter-spacing: 0.1em;
    }

    .info-value {
      color: var(--bright);
      overflow-wrap: anywhere;
    }

    .equipment-detail {
      display: block;
      color: var(--muted);
      font-size: 0.81rem;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 5px;
    }

    .tag {
      padding: 2px 6px;
      border: 1px solid rgba(155, 120, 76, 0.56);
      color: var(--muted);
      background: rgba(0, 0, 0, 0.15);
      font-size: 0.72rem;
    }

    .status-box {
      margin-top: 13px;
      padding: 10px;
      border-left: 3px solid var(--gold);
      background: rgba(0, 0, 0, 0.19);
    }

    .story-heading {
      margin: 0 0 4px;
      color: var(--bright);
      font-size: clamp(1.35rem, 5vw, 2rem);
      line-height: 1.35;
    }

    .scene-meta {
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
    }

    #storyText {
      min-height: 180px;
    }

    #storyText p {
      margin: 0 0 13px;
    }

    #storyText .speech {
      color: var(--bright);
      font-weight: 600;
    }

    #storyText .warning {
      color: #e7b099;
    }

    #storyText .good {
      color: #bdc99f;
    }

    #storyText .history {
      padding-left: 11px;
      border-left: 2px solid var(--border);
      color: var(--muted);
    }

    .creation-box,
    .enemy-card,
    .battle-card,
    .chapter-card,
    .ending-card {
      margin: 14px 0;
      padding: 13px;
      border: 1px solid rgba(155, 120, 76, 0.58);
      background: rgba(0, 0, 0, 0.18);
    }

    .enemy-card {
      border-color: rgba(140, 41, 36, 0.75);
      background: rgba(75, 22, 19, 0.16);
    }

    .battle-card {
      border-color: rgba(104, 127, 136, 0.72);
    }

    .chapter-card {
      border-left: 4px solid var(--gold);
    }

    .ending-card {
      border-color: var(--gold);
    }

    .creation-box label {
      display: block;
      margin-bottom: 7px;
      color: var(--gold);
    }

    .creation-box input {
      width: 100%;
      min-height: 49px;
      margin-bottom: 14px;
      padding: 10px 12px;
      color: var(--bright);
      border: 1px solid var(--border-bright);
      border-radius: 0;
      background: #120e0b;
    }

    .choice-note {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
    }

    details.roll-details,
    details.ledger-details {
      margin: 15px 0;
      border: 1px solid rgba(155, 120, 76, 0.5);
      background: rgba(8, 6, 5, 0.38);
    }

    details summary {
      padding: 9px 11px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .roll-lines,
    .ledger-content {
      padding: 0 11px 10px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      overflow-wrap: anywhere;
    }

    .roll-line + .roll-line {
      margin-top: 5px;
    }

    .actions-title {
      margin: 22px 0 9px;
      color: var(--gold);
      font-size: 0.9rem;
      letter-spacing: 0.12em;
    }

    #actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .action-button {
      width: 100%;
      min-height: 56px;
      padding: 12px 13px;
      color: var(--bright);
      border: 1px solid var(--border-bright);
      border-radius: 0;
      background:
        linear-gradient(rgba(71, 51, 36, 0.76), rgba(43, 31, 23, 0.9)),
        var(--panel-soft);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.28);
      cursor: pointer;
      text-align: left;
      line-height: 1.35;
    }

    .action-button:hover:not(:disabled) {
      border-color: var(--gold);
    }

    .action-button:active:not(:disabled) {
      transform: translateY(1px);
    }

    .action-button.danger {
      border-color: var(--blood-bright);
      background: linear-gradient(#602824, #351b18);
    }

    .action-button.safe {
      border-color: var(--green);
    }

    .action-button.history-action {
      border-color: var(--blue);
    }

    .action-button:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .action-button small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: normal;
    }

    .footer {
      padding: 16px 4px 6px;
      color: #77664f;
      text-align: center;
      font-size: 0.75rem;
    }

    .modal-backdrop {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.76);
    }

    .modal-backdrop[hidden] {
      display: none;
    }

    .modal {
      width: min(540px, 100%);
      max-height: 90vh;
      overflow: auto;
      padding: 18px;
      border: 1px solid var(--border-bright);
      background: var(--panel);
      box-shadow: 0 18px 60px #000;
    }

    .modal h2 {
      margin-top: 0;
      color: var(--bright);
    }

    .modal-actions {
      display: grid;
      gap: 9px;
      margin-top: 16px;
    }

    @media (max-width: 760px) {
      #app {
        padding: 8px;
      }

      .masthead {
        padding: 14px 10px 54px;
      }

      .top-controls {
        top: auto;
        right: 10px;
        bottom: 9px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .character-panel {
        position: static;
      }

      .story-panel {
        min-height: 540px;
      }

      .compact-mobile {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 12px;
      }
    }

    @media (max-width: 460px) {
      .masthead h1 {
        font-size: 1.85rem;
      }

      .story-panel {
        padding: 16px 14px;
      }

      #actions {
        grid-template-columns: 1fr;
      }

      .action-button {
        min-height: 58px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main id="app">
    <header class="masthead">
      <h1>逆命錄</h1>
      <p>第一、二卷・黑松嶺與黃巾初起</p>

      <div class="top-controls">
        <button id="ledgerButton" class="small-button" type="button">命簿</button>
        <button id="menuButton" class="small-button" type="button">卷冊</button>
      </div>
    </header>

    <div class="layout">
      <aside class="character-panel" aria-label="人物狀態">
        <h2 class="panel-title">人物命簿</h2>

        <div class="identity">
          <strong id="playerName">未題名</strong>
          <span id="playerAge">初生</span>
        </div>

        <div class="bar-header">
          <span>氣血</span>
          <span id="hpText">尚未定命</span>
        </div>
        <div class="track" aria-hidden="true">
          <div id="hpFill" class="fill hp-fill"></div>
        </div>

        <div id="abilities" class="abilities"></div>

        <div class="compact-mobile">
          <div class="info-block">
            <span class="info-label">天賦所向</span>
            <span id="potentialText" class="info-value">尚未選定</span>
          </div>

          <div class="info-block">
            <span class="info-label">傷勢</span>
            <span id="injuryText" class="info-value">無</span>
          </div>

          <div class="info-block">
            <span class="info-label">兵器</span>
            <span id="weaponText" class="info-value">尚未持兵</span>
            <span id="weaponDetail" class="equipment-detail"></span>
          </div>

          <div class="info-block">
            <span class="info-label">甲衣</span>
            <span id="armourText" class="info-value">尋常布衣</span>
            <span id="armourDetail" class="equipment-detail"></span>
          </div>
        </div>

        <div class="info-block">
          <span class="info-label">經歷</span>
          <div id="tagList" class="tag-list">
            <span class="tag">尚無</span>
          </div>
        </div>

        <div class="info-block">
          <span class="info-label">聲望</span>
          <span id="reputationText" class="info-value">鄉里無名</span>
        </div>

        <div class="status-box">
          <span class="info-label">此刻境況</span>
          <span id="battleStatus" class="info-value">命書尚未展開</span>
        </div>
      </aside>

      <section class="story-panel" aria-live="polite">
        <h2 id="storyHeading" class="story-heading">一頁無字之書</h2>
        <div id="sceneMeta" class="scene-meta"></div>
        <div id="storyText"></div>
        <div id="enemyArea"></div>
        <div id="battleArea"></div>
        <div id="rollArea"></div>

        <h3 class="actions-title">你要如何做？</h3>
        <div id="actions"></div>
      </section>
    </div>

    <footer class="footer">
      歷史如河，人命如舟。此卷不保證英雄得勝，亦不保證善人長存。
    </footer>
  </main>

  <div id="modalBackdrop" class="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">卷冊</h2>
      <div id="modalContent"></div>
      <div id="modalActions" class="modal-actions"></div>
    </section>
  </div>

    function newNpc(name, role) {

        role,

        battle: null,
        lastRolls: []
      };
    }

    let state = newState();

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function esc(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function die(sides) {
      return Math.floor(Math.random() * sides) + 1;
    }

    function signed(value) {
      return value >= 0 ? `+${value}` : `${value}`;
    }

    function abilityModifier(score) {
      return clamp(Math.round((score - 50) / 12.5), -3, 5);
    }

    function hasTag(tag) {
      return state.tags.includes(tag);
    }

    function addTag(tag) {
      if (!state.tags.includes(tag)) state.tags.push(tag);
    }

    function addTrait(trait) {
      if (!state.traits.includes(trait)) state.traits.push(trait);
    }

    function addHistory(text) {
      if (!state.history.includes(text)) state.history.push(text);
    }

    function addItem(item) {
      if (!state.items.includes(item)) state.items.push(item);
    }

    function remember(npcId, memory, relationship = 0) {
      const npc = state.npcs[npcId];
      if (!npc) return;
      if (!npc.memories.includes(memory)) npc.memories.push(memory);
      npc.relationship = clamp(npc.relationship + relationship, -100, 100);
    }

    function applyGrowth(gains) {
      Object.entries(gains).forEach(([ability, amount]) => {
        const multiplier = state.potential === ability ? 1.45 : 1;
        state.abilities[ability] += Math.round(amount * multiplier);
      });
      updateMaxHp(true);
    }

    function updateMaxHp(heal = false) {
      const oldMax = state.maxHp;
      state.maxHp = 27 + Math.floor(state.abilities.strength / 10);
      if (heal) {
        state.hp = clamp(state.hp + Math.max(0, state.maxHp - oldMax), 0, state.maxHp);
      }
    }

    function injuryPenalty(ability) {
      if (
        state.injury.severity >= 2 &&
        (!state.injury.ability || state.injury.ability === ability)
      ) {
        return state.injury.penalty;
      }
      return 0;
    }

    function setInjury(critical = false) {
      if (state.hp <= 0) return;
      const ratio = state.hp / state.maxHp;

      if (critical && ratio <= 0.45) {
        const injuries = [
          { name: "肋側深創", ability: "strength", penalty: -2 },
          { name: "肩骨重挫", ability: "strength", penalty: -2 },
          { name: "大腿裂傷", ability: "agility", penalty: -2 }
        ];
        state.injury = { ...injuries[die(injuries.length) - 1], severity: 3 };
      } else if (critical && state.injury.severity < 2) {
        state.injury = {
          name: "深長刀創",
          severity: 2,
          ability: "strength",
          penalty: -1
        };
      } else if (ratio <= 0.3 && state.injury.severity < 2) {
        state.injury = {
          name: "失血眩暈",
          severity: 2,
          ability: "agility",
          penalty: -1
        };
      } else if (ratio <= 0.65 && state.injury.severity === 0) {
        state.injury = {
          name: "皮肉傷",
          severity: 1,
          ability: null,
          penalty: 0
        };
      }
    }

    function check(ability, dc, extra = 0, label = "判定") {
      const natural = die(20);
      const abilityMod = abilityModifier(state.abilities[ability]);
      const injuryMod = injuryPenalty(ability);
      const total = natural + abilityMod + extra + injuryMod;
      const success = natural === 20 || (natural !== 1 && total >= dc);

      return {
        natural,
        ability,
        abilityMod,
        injuryMod,
        extra,
        total,
        dc,
        success,
        critical: natural === 20,
        disaster: natural === 1,
        line:
          `${label}：d20 ${natural} ${signed(abilityMod)} ` +
          `${signed(extra)} ${signed(injuryMod)} = ${total}，對抗 ${dc}`
      };
    }

    function damage(sides, critical, reduction = 0) {
      const rolls = [die(sides)];
      if (critical) rolls.push(die(sides));
      const raw = rolls.reduce((sum, value) => sum + value, 0);
      return {
        rolls,
        raw,
        reduction,
        final: Math.max(0, raw - reduction)
      };
    }

    function saveGame() {
      if (state.phase === "creation" && state.name === "未題名") return;
      state.version = SAVE_VERSION;
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    }

    function saveCheckpoint() {
      localStorage.setItem(CHECKPOINT_KEY, JSON.stringify(state));
      saveGame();
    }

    function loadStored(key) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (data.version !== SAVE_VERSION) return null;
        return data;
      } catch {
        return null;
      }
    }

    function clearSaves() {
      localStorage.removeItem(SAVE_KEY);
      localStorage.removeItem(CHECKPOINT_KEY);
    }

    function formatParagraphs(paragraphs) {
      return paragraphs
        .filter(Boolean)
        .map((paragraph) => {
          const safe = esc(paragraph);
          if (paragraph.startsWith("『")) return `<p class="speech">${safe}</p>`;
          if (paragraph.startsWith("【史勢】")) return `<p class="history">${safe}</p>`;
          if (paragraph.startsWith("【警告】")) return `<p class="warning">${safe}</p>`;
          if (paragraph.startsWith("【結果】")) return `<p class="good">${safe}</p>`;
          return `<p>${safe}</p>`;
        })
        .join("");
    }

    function naturalStatus() {
      if (state.phase === "creation") return "命書尚未展開";
      if (state.phase === "childhood") return "尚在桑澤里成長";
      if (state.phase === "equipment") return "即將踏入成年";
      if (state.phase === "chapter1") return "黑松嶺危機之中";
      if (state.phase === "duel") return "正與韓魁交鋒";
      if (state.phase === "battlefield1") return "正護衛黑松嶺糧隊";
      if (state.phase === "chapter1End") return "第一卷已留下後果";
      if (state.phase === "chapter2") return "黃巾之亂已經爆發";
      if (state.phase === "battlefield2") return "涿水渡口激戰之中";
      if (state.phase === "chapter2End") return "第二卷已告終";
      if (state.phase === "death") return "命書染血";
      return state.status;
    }

    function reputationSummary() {
      const r = state.reputation;
      const parts = [];

      if (r.village >= 20) parts.push("鄉里敬重");
      else if (r.village <= -15) parts.push("鄉里非議");
      else parts.push("鄉里聲望平常");

      if (r.military >= 20) parts.push("軍中有名");
      if (r.government >= 15) parts.push("官府信任");
      if (state.traits.length) {
        parts.push(state.traits.slice(0, 2).map((t) => TRAIT_NAMES[t]).join("、"));
      }

      return parts.join("・");
    }

    function renderSidebar() {
      $("playerName").textContent = state.name;
      $("playerAge").textContent =
        state.age ? `${state.age} 歲・${state.year} 年` : "初生";

      const safeHp = Math.max(0, state.hp);
      $("hpText").textContent = `${safeHp} / ${state.maxHp}`;
      $("hpFill").style.width =
        `${state.maxHp ? clamp(safeHp / state.maxHp * 100, 0, 100) : 0}%`;

      $("abilities").innerHTML = Object.entries(ABILITY_NAMES)
        .map(([key, name]) => `
          <div class="ability">
            <span>${name}</span>
            <span>${state.abilities[key]}</span>
          </div>
        `)
        .join("");

      $("potentialText").textContent =
        state.potential ? POTENTIALS[state.potential].name : "尚未選定";

      $("injuryText").textContent =
        state.injury.severity
          ? `${state.injury.name}${state.injury.penalty ? `（${state.injury.penalty}）` : ""}`
          : "無";

      $("weaponText").textContent = state.weapon?.name || "尚未持兵";
      $("weaponDetail").textContent = state.weapon
        ? `命中 ${signed(state.weapon.attack)}・傷害 1d${state.weapon.sides}`
        : "";

      $("armourText").textContent = state.armour?.name || "尋常布衣";
      $("armourDetail").textContent = state.armour
        ? `護勢 ${signed(state.armour.defence)}・減傷 ${state.armour.reduction}`
        : "";

      $("tagList").innerHTML = state.tags.length
        ? state.tags.slice(-8).map((tag) => `<span class="tag">${esc(TAG_NAMES[tag] || tag)}</span>`).join("")
        : '<span class="tag">尚無</span>';

      $("reputationText").textContent = reputationSummary();
      $("battleStatus").textContent = naturalStatus();
    }

    function renderEnemy() {
      const area = $("enemyArea");
      const enemy = state.combat?.enemy;

      if (state.phase !== "duel" || !enemy || enemy.hp <= 0) {
        area.innerHTML = "";
        return;
      }

      const percent = clamp(enemy.hp / enemy.maxHp * 100, 0, 100);
      area.innerHTML = `
        <div class="enemy-card">
          <div class="enemy-row">
            <strong>${esc(enemy.name)}</strong>
            <span>${enemy.hp} / ${enemy.maxHp}</span>
          </div>
          <div class="track">
            <div class="fill enemy-fill" style="width:${percent}%"></div>
          </div>
          <span class="equipment-detail">
            ${esc(enemy.weapon.name)}・${esc(enemy.armour.name)}
          </span>
        </div>
      `;
    }

    function renderBattle() {
      const area = $("battleArea");
      const b = state.battle;

      if (!b || !["battlefield1", "battlefield2"].includes(state.phase)) {
        area.innerHTML = "";
        return;
      }

      area.innerHTML = `
        <div class="battle-card">
          <div class="battle-row">
            <strong>${esc(b.name)}</strong>
            <span>第 ${b.round} / ${b.maxRounds} 輪</span>
          </div>

          <div class="bar-header">
            <span>我方士氣</span><span>${b.morale}</span>
          </div>
          <div class="track">
            <div class="fill morale-fill" style="width:${b.morale}%"></div>
          </div>

          <div class="bar-header">
            <span>隊形</span><span>${b.formation}</span>
          </div>
          <div class="track">
            <div class="fill formation-fill" style="width:${b.formation}%"></div>
          </div>

          <div class="bar-header">
            <span>敵軍士氣</span><span>${b.enemyMorale}</span>
          </div>
          <div class="track">
            <div class="fill enemy-fill" style="width:${b.enemyMorale}%"></div>
          </div>

          <span class="equipment-detail">
            ${esc(b.objective)}・位置 ${signed(b.position)}・受護目標 ${b.protected}
          </span>
        </div>
      `;
    }

    function setActions(actions) {
      const container = $("actions");
      container.innerHTML = "";

      actions.forEach((action) => {
        const button = document.createElement("button");
        const available = action.available !== false;

        button.type = "button";
        button.className =
          `action-button${action.className ? ` ${action.className}` : ""}`;
        button.disabled = !available;
        button.innerHTML =
          `${esc(action.label)}` +
          (action.note ? `<small>${esc(action.note)}</small>` : "") +
          (!available && action.reason
            ? `<small>未能採取：${esc(action.reason)}</small>`
            : "");

        if (available) {
          button.addEventListener("click", () => {
            if (state.locked) return;
            state.locked = true;
            container.querySelectorAll("button").forEach((item) => {
              item.disabled = true;
            });
            action.handler();
          }, { once: true });
        }

        container.appendChild(button);
      });
    }

    function setScene({
      heading,
      paragraphs = [],
      rolls = [],
      actions = [],
      meta = null,
      save = true
    }) {
      state.locked = false;
      state.lastRolls = rolls;
      renderSidebar();

      $("storyHeading").textContent = heading;
      $("sceneMeta").textContent =
        meta || `${state.originRegion}・${state.year} 年${state.month ? `・${state.month}` : ""}`;
      $("storyText").innerHTML = formatParagraphs(paragraphs);

      $("rollArea").innerHTML = rolls.length
        ? `
          <details class="roll-details">
            <summary>展開判定詳情</summary>
            <div class="roll-lines">
              ${rolls.map((line) => `<div class="roll-line">${esc(line)}</div>`).join("")}
            </div>
          </details>
        `
        : "";

      renderEnemy();
      renderBattle();
      setActions(actions);

      if (save) saveGame();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function startCreation() {
      state = newState();
      clearSaves();
      renderSidebar();

      $("storyHeading").textContent = "無字命頁";
      $("sceneMeta").textContent = "幽州・涿郡・公元一六八年";
      $("enemyArea").innerHTML = "";
      $("battleArea").innerHTML = "";
      $("rollArea").innerHTML = "";

      $("storyText").innerHTML = `
        <p>你原本不屬於這個時代。</p>
        <p>睜眼之時，漢室未亡，天下卻已處處腐壞。你生於幽州涿郡桑澤里一戶尋常人家，既無名門血統，亦無天命保證。</p>
        <p>你會長成甚麼人，要由往後十六年逐步決定。</p>

        <div class="creation-box">
          <label for="nameInput">在命簿寫下姓名</label>
          <input
            id="nameInput"
            type="text"
            maxlength="12"
            placeholder="例如：沈越"
            autocomplete="off"
            enterkeyhint="done"
          >
          <label>選擇與生俱來的潛能</label>
          <span class="choice-note">
            潛能影響初始能力與日後成長，並不保證你能在亂世生還。
          </span>
        </div>
      `;

      setActions(Object.entries(POTENTIALS).map(([key, potential]) => ({
        label: potential.name,
        note: potential.description,
        handler: () => choosePotential(key)
      })));
    }

    function choosePotential(key) {
      const input = $("nameInput");
      const name = input?.value.trim();

      if (!name) {
        state.locked = false;
        $("actions").querySelectorAll("button").forEach((button) => {
          button.disabled = false;
        });
        alert("請先寫下人物姓名。");
        input?.focus();
        return;
      }

      state.name = name.slice(0, 12);
      state.potential = key;
      state.abilities = clone(POTENTIALS[key].scores);
      state.age = 1;
      state.year = 169;
      state.chapter = 1;
      state.phase = "childhood";
      state.scene = "birth";
      updateMaxHp();
      state.hp = state.maxHp;

      addHistory(`生於公元一六八年，幽州涿郡桑澤里。`);
      addHistory(`先天天賦為「${POTENTIALS[key].name}」。`);

      setScene({
        heading: "第一卷・黑松嶺",
        paragraphs: [
          `${state.name}，你的名字被寫入桑澤里一戶尋常人家的舊冊。`,
          `你有「${POTENTIALS[key].name}」之資，但亂世從不保證有才之人能活到成名。`,
          "這一卷記下你如何長大，以及你第一次真正見血的日子。"
        ],
        actions: [{
          label: "讓歲月向前",
          className: "history-action",
          handler: showChildhoodStage
        }]
      });

      saveCheckpoint();
    }

    function showChildhoodStage() {
      const stage = CHILDHOOD[state.childhoodIndex];
      state.phase = "childhood";
      state.age = stage.age;
      state.year = state.birthYear + stage.age;

      setScene({
        heading: stage.heading,
        paragraphs: [stage.intro],
        actions: stage.choices.map((choice) => ({
          label: choice.label,
          handler: () => resolveChildhood(choice)
        }))
      });
    }

    function resolveChildhood(choice) {
      applyGrowth(choice.gains);
      addTag(choice.tag);
      addHistory(`${state.age} 歲：${choice.label}。`);
      remember(choice.npc, `曾在${state.age}歲時與${state.name}共同生活或訓練。`, 12);

      const growth = Object.entries(choice.gains).map(([ability, amount]) => {
        const actual = Math.round(amount * (state.potential === ability ? 1.45 : 1));
        return `${ABILITY_NAMES[ability]} ${signed(actual)}`;
      });

      state.childhoodIndex += 1;

      if (state.childhoodIndex < CHILDHOOD.length) {
        setScene({
          heading: "歲月留痕",
          paragraphs: [
            choice.text,
            "數字會留在命簿，旁人記得的卻是你曾經做過甚麼。這段經歷日後可能替你打開另一條路。"
          ],
          rolls: growth,
          actions: [{
            label: "走向下一段歲月",
            handler: showChildhoodStage
          }]
        });
      } else {
        state.age = 16;
        state.year = 184;
        state.month = "正月";
        state.phase = "equipment";

        setScene({
          heading: "光和七年・年十六",
          paragraphs: [
            choice.text,
            "鄰近數里準備合力將糧食與藥材送往北面聚落。道路上已有數隊商旅失蹤，田伯仍決定帶鄉勇護送。",
            "你已成年。村中拿出僅存的兵械，讓你選擇第一次上陣所持之物。",
            "遠方有人低聲傳唱「蒼天已死」，但此刻大部分人仍只當那是流民之間的怪話。"
          ],
          rolls: growth,
          actions: equipmentActions()
        });
      }
    }

    function equipmentActions() {
      return [
        {
          label: "百鍊環首刀與綴片皮甲",
          note: "武力近戰，攻守平衡。",
          handler: () => chooseEquipment("sword", "leather")
        },
        {
          label: "白蠟短矛與輕皮護衣",
          note: "身法命中較佳，護身較薄。",
          handler: () => chooseEquipment("spear", "light")
        },
        {
          label: "沉背戰斧與厚絮戰衣",
          note: "命中較難，但一擊沉重。",
          handler: () => chooseEquipment("axe", "padded")
        },
        {
          label: "舊制鐵劍與綴片皮甲",
          note: "依靠身法，沒有明顯短處。",
          handler: () => chooseEquipment("straightSword", "leather")
        }
      ];
    }

    function chooseEquipment(weaponId, armourId) {
      state.weapon = clone(WEAPONS[weaponId]);
      state.armour = clone(ARMOURS[armourId]);
      state.phase = "chapter1";
      state.scene = "convoy";
      addHistory(`成年時選擇${state.weapon.name}與${state.armour.name}。`);

      setScene({
        heading: "第一次披甲",
        paragraphs: [
          `你握住${state.weapon.name}。${state.weapon.flavour}`,
          `身上的${state.armour.name}並不華美。${state.armour.flavour}`,
          "周平也加入護糧隊，田伯則帶著十餘名鄉勇走在最前。杜岳臨行前只提醒你一句：山林忽然無鳥，往往不是好事。"
        ],
        actions: [{
          label: "隨隊進入黑松嶺",
          className: "danger",
          handler: blackPineApproach
        }]
      });
    }

    function blackPineApproach() {
      setScene({
        heading: "黑松嶺山道",
        paragraphs: [
          "午後寒霧沿山坡沉下。糧車陷入濕泥，十餘名鄉勇前後拉成長線。",
          "兩側坡地不算高，灌木卻足以藏人。田伯催促眾人加快腳步，周平握矛的手則一直沒有放鬆。",
          "呢段路只需要作出一次真正重要的安排。"
        ],
        actions: [
          {
            label: "放慢腳步，仔細察看山坡與泥地",
            note: "洞察；山地經驗可提供幫助。",
            handler: () => detectAmbush("awareness")
          },
          {
            label: "先行探看彎口，再從側坡折返",
            note: "身法；斥候或商道經驗可提供幫助。",
            handler: () => detectAmbush("agility")
          },
          {
            label: "重排前後人手，以糧車互相掩護",
            note: "才智；兵書或鄉勇經驗可提供幫助。",
            handler: () => detectAmbush("intellect")
          },
          {
            label: "喝令眾人收聲結隊，停止爭相推車",
            note: "氣度；巡夜號令可提供幫助。",
            handler: () => detectAmbush("presence")
          }
        ]
      });
    }

    function detectAmbush(ability) {
      let extra = 0;
      if (ability === "awareness" && hasTag("mountain")) extra += 2;
      if (ability === "agility" && (hasTag("scouting") || hasTag("roads"))) extra += 2;
      if (ability === "intellect" && (hasTag("strategy") || hasTag("militia"))) extra += 2;
      if (ability === "presence" && hasTag("command")) extra += 2;

      const result = check(ability, 13, extra, "黑松嶺警戒");
      state.chapter1.ambushDetected = result.success;

      if (result.success) {
        addTag("ambushSense");
        addTrait(
          ability === "presence" ? "commanding" :
          ability === "intellect" ? "strategist" : "prudent"
        );

        setScene({
          heading: "林上伏兵",
          paragraphs: [
            result.critical
              ? "你在第一支箭離弦之前已經看見灌木後的人影。鄉勇靠向糧車，無人被最初一輪箭矢射中。"
              : "碎石由坡頂滾下時，你立即喝停隊伍。箭矢落在眾人原本將要踏入的位置。",
            "虯髯大漢韓魁提著缺口山刀走下坡來，身後十餘名賊眾齊聲呼喝。",
            "『糧車留下，某可讓你們帶傷者回去。若自問有膽，便出來與韓某決個生死！』",
            "你看見幾名山賊臂上纏著褪色黃布，但那不像正式旗號，更像刻意遮掩甚麼。"
          ],
          rolls: [result.line],
          actions: [
            {
              label: "迎戰韓魁，借斬將動搖群賊",
              className: "danger",
              handler: startHanKuiDuel
            },
            {
              label: "拒絕叫陣，結車守住糧藥",
              className: "safe",
              handler: () => startBlackPineBattle(true)
            },
            {
              label: "指出黃布與囤糧之事，試探韓魁",
              note: "需要足夠洞察、才智或經史見聞。",
              available:
                state.abilities.awareness >= 60 ||
                state.abilities.intellect >= 60 ||
                hasTag("classics"),
              reason: "你未能從零碎跡象推斷背後意義。",
              handler: questionHanKui
            }
          ]
        });
      } else {
        state.chapter1.casualties += result.disaster ? 3 : 1;
        state.npcs.zhouPing.status = result.disaster ? "箭傷" : "輕傷";

        setScene({
          heading: "伏擊驟發",
          paragraphs: [
            "坡上驟然響起喊聲。箭矢、碎石與滾木一同落下，牲口受驚，糧車橫在路中。",
            result.disaster
              ? "周平被一箭射倒，田伯帶人回身救他時，原本鬆散的隊列瞬間斷成數截。"
              : "一名鄉勇倒在車輪旁，其他人則爭相尋找掩護。",
            "你沒有看清頭領所在。此刻只能在混亂之中重建陣腳，或者帶人放棄糧車。"
          ],
          rolls: [result.line],
          actions: [{
            label: "在伏擊中穩住隊伍",
            className: "danger",
            handler: () => startBlackPineBattle(false)
          }]
        });
      }
    }

    function questionHanKui() {
      const extra =
        (hasTag("classics") ? 1 : 0) +
        (hasTag("strategy") ? 1 : 0);
      const result = check(
        state.abilities.presence >= state.abilities.intellect ? "presence" : "intellect",
        14,
        extra,
        "試探韓魁"
      );

      if (result.success) {
        state.chapter1.clues += result.critical ? 2 : 1;
        addTag("yellowClue");
        addItem("寫有「甲子」二字的殘信");

        setScene({
          heading: "未起之亂",
          paragraphs: [
            "你沒有回應單挑，只把目光落在黃布與坡後被油布遮住的兵器上。",
            "『普通山寨不需要數十柄新磨的矛頭。買你們兵器的人，是否也叫你們等到甲子年？』",
            "韓魁臉上的笑意消失了。他身後一名賊人下意識望向坡後，隨即被韓魁一刀背打翻。",
            "『知道得太多，只會死得更快。』",
            "你未知道山寨背後係邊個，但已經證明黑松嶺唔只係一次尋常劫糧。"
          ],
          rolls: [result.line],
          actions: [
            {
              label: "趁其軍心動搖結車反擊",
              className: "safe",
              handler: () => startBlackPineBattle(true, 10)
            },
            {
              label: "迎戰韓魁，逼他留下更多答案",
              className: "danger",
              handler: startHanKuiDuel
            }
          ]
        });
      } else {
        setScene({
          heading: "言語未能破局",
          paragraphs: [
            "你試圖逼問黃布與兵器來歷，韓魁卻只仰頭大笑。",
            "賊眾跟著敲打兵刃，將你聲音完全壓過。無論真相係乜，今日仍要先保住性命。"
          ],
          rolls: [result.line],
          actions: [
            {
              label: "結車迎戰",
              handler: () => startBlackPineBattle(true)
            },
            {
              label: "接受韓魁叫陣",
              className: "danger",
              handler: startHanKuiDuel
            }
          ]
        });
      }
    }

    function startHanKuiDuel() {
      state.phase = "duel";
      state.scene = "hanKuiDuel";
      state.combat = {
        enemy: {
          id: "hanKui",
          name: "黑石寨頭領・韓魁",
          hp: 31,
          maxHp: 31,
          strength: 61,
          agility: 54,
          morale: 62,
          exposed: false,
          weapon: {
            name: "缺口山刀",
            attack: 1,
            sides: 8,
            ability: "strength"
          },
          armour: {
            name: "硬皮坎肩",
            defence: 2,
            reduction: 1
          }
        },
        guarded: false,
        rounds: 0
      };

      setScene({
        heading: "山道鬥將",
        paragraphs: [
          "你越過糧車踏入山道中央。左右鄉勇讓出窄路，坡上賊眾亦逐漸收聲。",
          "韓魁扛起缺口山刀，咧嘴露出黃牙。",
          "『敢站出來，便算半條好漢。另一半，要看你流多少血！』"
        ],
        actions: duelActions()
      });
    }

    function playerDefence(extra = 0) {
      return 10 +
        (state.armour?.defence || 0) +
        abilityModifier(state.abilities.agility) +
        extra;
    }

    function enemyDefence(enemy) {
      return 10 + enemy.armour.defence + abilityModifier(enemy.agility);
    }

    function duelActions() {
      const enemy = state.combat?.enemy;
      if (!enemy || enemy.hp <= 0 || state.hp <= 0) return [];

      return [
        {
          label: `以${state.weapon.name}進攻`,
          handler: duelAttack
        },
        {
          label: "沉身守勢，尋找空門",
          note: "本回合提高防護；才智較高者更易取得優勢。",
          handler: duelDefend
        },
        {
          label: "厲聲挫其膽氣",
          note: "氣度可能令韓魁暴露，但失敗仍會遭反擊。",
          handler: duelIntimidate
        },
        {
          label: "退回車陣，放棄單挑",
          note: "保留性命，將勝負交回整體戰場。",
          className: "safe",
          handler: withdrawFromDuel
        }
      ];
    }

    function duelAttack() {
      const enemy = state.combat.enemy;
      state.combat.rounds += 1;

      const ability = state.weapon.ability;
      const natural = die(20);
      const mod = abilityModifier(state.abilities[ability]);
      const injury = injuryPenalty(ability);
      const exposed = enemy.exposed ? 2 : 0;
      const total = natural + state.weapon.attack + mod + injury + exposed;
      const defence = enemyDefence(enemy);
      const hit = natural === 20 || (natural !== 1 && total >= defence);

      const rolls = [
        `攻擊：d20 ${natural} ${signed(state.weapon.attack)} ${signed(mod)} ${signed(injury + exposed)} = ${total}，對抗 ${defence}`
      ];
      const paragraphs = [];
      enemy.exposed = false;

      if (hit) {
        const dealt = damage(
          state.weapon.sides,
          natural === 20,
          enemy.armour.reduction
        );
        enemy.hp = Math.max(0, enemy.hp - dealt.final);
        rolls.push(
          `${state.weapon.name}：${dealt.rolls.join(" + ")}，甲衣抵去 ${dealt.reduction}，造成 ${dealt.final} 點傷害`
        );

        if (natural === 20) {
          enemy.morale -= 15;
          paragraphs.push(
            "你迎著刀光踏入半步，刃鋒從韓魁甲縫斬入。血沿腰側湧出，坡上吶喊驟然一滯。"
          );
        } else if (dealt.final === 0) {
          paragraphs.push("兵刃正中硬皮坎肩，卻只把韓魁震退半步。");
        } else {
          paragraphs.push("你壓開山刀，順勢在韓魁肩臂留下血口。");
        }
      } else if (natural === 1) {
        paragraphs.push("你踩中鬆動碎石，出手尚未展開便失去重心。");
      } else {
        paragraphs.push("韓魁橫刀封住路線，你的兵刃從皮甲外掠過。");
      }

      if (enemy.hp <= 0) {
        finishHanKui("killed", paragraphs, rolls);
        return;
      }

      const retaliation = enemyDuelAttack(natural === 1 ? 2 : 0);
      paragraphs.push(...retaliation.paragraphs);
      rolls.push(...retaliation.rolls);

      if (state.hp <= 0) {
        showDeath(paragraphs, rolls, "命斷黑松嶺");
        return;
      }

      setScene({
        heading: "刀光未歇",
        paragraphs,
        rolls,
        actions: duelActions()
      });
    }

    function duelDefend() {
      const result = check(
        "intellect",
        12,
        hasTag("strategy") ? 2 : 0,
        "守勢判定"
      );
      const enemy = state.combat.enemy;
      const paragraphs = [];
      state.combat.guarded = true;

      if (result.success) {
        enemy.exposed = true;
        paragraphs.push(
          result.critical
            ? "你故意讓出半步。韓魁重刀劈入糧車木框，你已轉到他側後。"
            : "你斜引刀勢，迫使韓魁連續兩次斬向空處。"
        );
      } else {
        paragraphs.push("你想誘他深入，韓魁卻以刀背猛撞，反把你逼向山壁。");
      }

      const retaliation = enemyDuelAttack(0);
      state.combat.guarded = false;
      paragraphs.push(...retaliation.paragraphs);

      const rolls = [result.line, ...retaliation.rolls];

      if (state.hp <= 0) {
        showDeath(paragraphs, rolls, "命斷黑松嶺");
        return;
      }

      setScene({
        heading: "守中待變",
        paragraphs,
        rolls,
        actions: duelActions()
      });
    }

    function duelIntimidate() {
      const enemy = state.combat.enemy;
      const result = check(
        "presence",
        14,
        hasTag("command") ? 1 : 0,
        "喝陣判定"
      );
      const paragraphs = [];

      if (result.success) {
        enemy.morale -= result.critical ? 24 : 12;
        enemy.exposed = true;
        paragraphs.push(
          "你逐一喝出韓魁方才退過的步數。賊眾之間傳來不安低語，韓魁暴怒前衝，胸前空門亦隨之露出。"
        );
      } else {
        enemy.morale += 5;
        paragraphs.push(
          "韓魁以刀刃重拍皮甲，賊眾跟著鼓噪。你的話被山呼般的聲浪壓了回來。"
        );
      }

      const retaliation = enemyDuelAttack(result.disaster ? 2 : 0);
      paragraphs.push(...retaliation.paragraphs);
      const rolls = [result.line, ...retaliation.rolls];

      if (state.hp <= 0) {
        showDeath(paragraphs, rolls, "命斷黑松嶺");
        return;
      }

      setScene({
        heading: "兩陣奪氣",
        paragraphs,
        rolls,
        actions: duelActions()
      });
    }

    function enemyDuelAttack(bonus = 0) {
      const enemy = state.combat.enemy;
      const natural = die(20);
      const mod = abilityModifier(enemy.strength);
      const total = natural + enemy.weapon.attack + mod + bonus;
      const defence = playerDefence(state.combat.guarded ? 3 : 0);
      const hit = natural === 20 || (natural !== 1 && total >= defence);

      const rolls = [
        `韓魁攻擊：d20 ${natural} ${signed(enemy.weapon.attack)} ${signed(mod + bonus)} = ${total}，對抗 ${defence}`
      ];
      const paragraphs = [];

      if (natural === 1) {
        enemy.exposed = true;
        paragraphs.push("韓魁踩上自己流下的血，重刀撞向山壁，一時無法回守。");
        return { paragraphs, rolls };
      }

      if (!hit) {
        paragraphs.push("山刀貼著衣甲掃過，沉重風聲幾乎奪走呼吸，終究沒有斬實。");
        return { paragraphs, rolls };
      }

      const dealt = damage(
        enemy.weapon.sides,
        natural === 20,
        state.armour.reduction
      );
      state.hp = Math.max(0, state.hp - dealt.final);
      setInjury(natural === 20);

      rolls.push(
        `${enemy.weapon.name}：${dealt.rolls.join(" + ")}，甲衣抵去 ${dealt.reduction}，造成 ${dealt.final} 點傷害`
      );

      paragraphs.push(
        natural === 20
          ? "韓魁先撞開你的防守，再旋身重斬。甲片在巨響中迸裂，鮮血立即浸透內衣。"
          : "你擋住正面一斬，卻被回刀割中腰側。護甲卸去部分力道，傷口仍火辣作痛。"
      );

      return { paragraphs, rolls };
    }

    function withdrawFromDuel() {
      addTrait("prudent");
      state.reputation.military -= 2;

      setScene({
        heading: "退回車陣",
        paragraphs: [
          "你以兵刃逼開韓魁，沒有繼續將整隊命運押在一場單挑之上。",
          "賊眾嘲笑你怯戰，田伯卻立即讓出車陣缺口。韓魁未死，糧隊亦尚未敗。"
        ],
        actions: [{
          label: "結車迎擊群賊",
          handler: () => startBlackPineBattle(true)
        }]
      });
    }

    function finishHanKui(fate, paragraphs, rolls) {
      state.combat = null;
      state.phase = "chapter1";
      state.chapter1.hanKuiFate = fate;
      state.chapter1.banditsBroken = true;
      state.chapter1.convoySaved = true;
      state.npcs.hanKui.alive = fate !== "killed";
      state.npcs.hanKui.status = fate === "killed" ? "死於黑松嶺" : "敗退";
      state.reputation.village += 20;
      state.reputation.military += 16;
      addTrait("brave");
      addTag("firstBattle");
      addTag("banditHunter");
      addHistory("於黑松嶺單挑擊敗賊首韓魁。");

      if (state.chapter1.clues > 0) {
        paragraphs.push(
          "你從韓魁貼身衣袋找到一封殘信，上面只有「甲子」、「大吉」與一個模糊收糧地點。"
        );
      } else {
        state.chapter1.clues = 1;
        addTag("yellowClue");
        addItem("韓魁身上的黃布符記");
        paragraphs.push(
          "韓魁倒地後，一塊繡有古怪符號的黃布從衣內滑出。你暫時不明白它代表甚麼。"
        );
      }

      endChapter1Victory(
        paragraphs.concat([
          "韓魁倒下後，黑石寨群賊失去主心骨，先後逃入坡後荒林。糧車得以繼續前行。"
        ]),
        rolls,
        "斬將破賊"
      );
    }

    function startBlackPineBattle(prepared, moraleBonus = 0) {
      state.phase = "battlefield1";
      state.combat = null;
      state.battle = {
        id: "blackPine",
        name: "黑松嶺護糧戰",
        objective: "保住糧車並帶眾人離開山道",
        round: 1,
        maxRounds: 4,
        morale: clamp((prepared ? 58 : 35) + moraleBonus, 0, 100),
        formation: prepared ? 60 : 28,
        enemyMorale: prepared ? 62 : 75,
        position: prepared ? 1 : -2,
        protected: prepared ? 3 : 2,
        enemyAdvantage: prepared ? 0 : 3
      };

      setScene({
        heading: "黑松嶺激戰",
        paragraphs: [
          prepared
            ? "糧車首尾相接，持矛者由車隙向外，傷者退入中央。群賊無法再靠第一輪箭矢奪走勝勢。"
            : "你踩過散落糧袋，把仍能聽見命令的人逐個拉回車旁。隊形破碎，但未到完全無法挽救。",
          "你不需要指揮每一個腳步，只需要喺真正改變勝負的時候落決定。"
        ],
        actions: blackPineBattleActions()
      });
    }

    function blackPineBattleActions() {
      const b = state.battle;
      return [
        {
          label: "穩住隊形與軍心",
          note: "氣度；恢復士氣與隊形。",
          handler: () => resolveBlackPineAction("rally")
        },
        {
          label: "尋找坡上敵軍主力",
          note: "洞察；削弱敵軍地勢優勢。",
          handler: () => resolveBlackPineAction("locate")
        },
        {
          label: "清出糧車退路",
          note: "才智；增加受護目標與戰場位置。",
          handler: () => resolveBlackPineAction("route")
        },
        {
          label: "率眾反擊",
          note: "需要尚可隊形；武器能力影響結果。",
          className: "danger",
          available: b.formation >= 42,
          reason: "隊形太散，貿然衝出只會被逐個殺死。",
          handler: () => resolveBlackPineAction("counter")
        },
        {
          label: "放棄糧車，帶生還者撤走",
          className: "safe",
          available: b.morale <= 42 || b.protected <= 1,
          reason: "眾人仍願意守住糧車，現時撤退只會自行放棄勝機。",
          handler: () => resolveBlackPineAction("retreat")
        }
      ];
    }

    function resolveBlackPineAction(type) {
      const b = state.battle;
      const paragraphs = [];
      const rolls = [];
      let result;

      if (type === "rally") {
        result = check("presence", 13 + b.enemyAdvantage, hasTag("command") ? 2 : 0, "整隊");
        if (result.success) {
          b.morale += result.critical ? 20 : 12;
          b.formation += result.critical ? 18 : 10;
          b.enemyMorale -= result.critical ? 9 : 3;
          paragraphs.push("你沿車陣逐人喝令，散開的鄉勇重新看見彼此，長兵亦再次由車隙伸出。");
        } else {
          b.morale -= result.disaster ? 12 : 6;
          paragraphs.push("箭雨與慘叫切碎你的命令。有人聽見，更多人卻只顧躲避。");
        }
      }

      if (type === "locate") {
        result = check("awareness", 13 + b.enemyAdvantage, hasTag("mountain") ? 2 : 0, "察敵");
        if (result.success) {
          b.enemyAdvantage -= result.critical ? 2 : 1;
          b.position += result.critical ? 2 : 1;
          b.enemyMorale -= 6;
          paragraphs.push("你循箭矢角度找到左坡主力，並指出右側只有數人虛張聲勢。包圍終於露出缺口。");
        } else {
          b.enemyAdvantage += result.disaster ? 1 : 0;
          paragraphs.push("山壁回音與人影混成一片，你幾次追錯旗號，仍未找到真正主力。");
        }
      }

      if (type === "route") {
        result = check("intellect", 13 + Math.max(0, -b.position), hasTag("roads") || hasTag("strategy") ? 2 : 0, "護路");
        if (result.success) {
          b.position += 1;
          b.formation += 7;
          b.protected = Math.min(4, b.protected + 1);
          paragraphs.push("你命人砍斷套繩、移開受驚牲口，再用糧袋墊住車輪。後路與傷者都得到掩護。");
        } else {
          b.formation -= 6;
          paragraphs.push("車軸卡死石縫，幫手又被散落貨物絆倒，退路未能清出。");
        }
      }

      if (type === "counter") {
        const ability = state.weapon.ability;
        result = check(
          ability,
          14 + b.enemyAdvantage,
          state.weapon.attack + (hasTag("militia") ? 1 : 0),
          "反擊"
        );
        if (result.success) {
          b.enemyMorale -= result.critical ? 27 : 16;
          b.morale += 8;
          b.position += 1;
          paragraphs.push("你由兩車之間衝出，鄉勇緊隨其後。最前方山賊翻倒，後排收勢不及，彼此撞成一團。");
        } else {
          b.morale -= 8;
          b.formation -= 9;
          b.position -= 1;
          paragraphs.push("你才離開糧車，坡上第二輪箭矢便已落下。反擊停在半途，退回的人更加混亂。");
        }
      }

      if (type === "retreat") {
        result = check(
          "intellect",
          14 + b.enemyAdvantage,
          Math.floor(b.formation / 30) - 1,
          "撤離"
        );
        rolls.push(result.line);

        if (result.success) {
          state.chapter1.convoySaved = false;
          state.chapter1.hanKuiFate = "佔據黑石寨並奪得糧藥";
          state.chapter1.casualties += 2;
          addTrait("survivor");
          addTag("firstBattle");
          addHistory("黑松嶺敗退，但帶部分鄉勇生還。");

          finishChapter1Defeat([
            "你令最後一排交替掩護，傷者沿清出的窄路逐步撤走。",
            "糧車與藥材終究留在黑松嶺。韓魁得到足以供養更多人嘅物資，桑澤里亦將為此付出代價。"
          ], rolls);
          return;
        }

        b.morale -= 14;
        b.formation -= 12;
        paragraphs.push("撤退命令傳到後排時，前方已誤以為全隊潰敗。人群爭相擠入窄路，山賊趁勢壓下。");
      }

      if (result && type !== "retreat") rolls.push(result.line);
      normalizeBattle(b);

      if (b.enemyMorale <= 0) {
        state.chapter1.convoySaved = true;
        state.chapter1.banditsBroken = true;
        state.chapter1.hanKuiFate = "敗逃";
        state.npcs.hanKui.status = "負傷逃離黑松嶺";
        addTag("firstBattle");
        addTag("convoyGuard");
        addTrait("commanding");
        state.reputation.village += 17;
        state.reputation.military += 13;
        addHistory("率眾守住黑松嶺糧隊，韓魁敗逃。");

        if (state.chapter1.clues === 0) {
          state.chapter1.clues = 1;
          addTag("yellowClue");
          addItem("黑石寨遺下的甲子符記");
          paragraphs.push("賊眾遺下的糧袋底部畫有黃符，旁邊寫著「甲子」二字。");
        }

        endChapter1Victory(
          paragraphs.concat([
            "群賊再無法維持陣勢。韓魁在幾名親信掩護下逃入荒林，黑石寨勢力卻已被擊破。",
            "糧車仍能前行，但泥地上亦留下幾名永遠無法回村的人。"
          ]),
          rolls,
          "山道破賊"
        );
        return;
      }

      const pressure = blackPinePressure();
      paragraphs.push(...pressure.paragraphs);
      rolls.push(...pressure.rolls);
      normalizeBattle(b);

      if (state.hp <= 0) {
        showDeath(paragraphs, rolls, "命斷黑松嶺");
        return;
      }

      if (b.morale <= 0 || b.formation <= 0) {
        state.chapter1.convoySaved = false;
        state.chapter1.hanKuiFate = "奪取糧藥";
        state.chapter1.casualties += 3;
        addTag("firstBattle");
        addTrait("survivor");
        addHistory("黑松嶺軍心潰散，糧藥落入黑石寨。");

        finishChapter1Defeat(
          paragraphs.concat([
            "最後一點秩序終於消失。有人棄械奔逃，有人鑽入車底，再沒有人聽得清命令。",
            "你只能隨殘存人手離開山道。糧車、傷者與未能帶走的兵械，全落入韓魁手中。"
          ]),
          rolls
        );
        return;
      }

      b.round += 1;

      if (b.round > b.maxRounds) {
        if (b.protected >= 3 && b.morale >= 35) {
          state.chapter1.convoySaved = true;
          state.chapter1.hanKuiFate = "未能奪糧，退回黑石寨";
          state.reputation.village += 12;
          addTag("convoyGuard");
          addTag("firstBattle");
          addTrait("reliable");
          addHistory("在黑松嶺捱過圍攻，成功護走糧車。");

          endChapter1Victory(
            paragraphs.concat([
              "夜色逐漸壓下。韓魁無法在援手可能趕到前攻破車陣，只能帶賊眾退回山上。",
              "你沒有殲滅黑石寨，但成功把糧藥與生還者帶離山道。"
            ]),
            rolls,
            "守糧而還"
          );
        } else {
          finishChapter1Defeat(
            paragraphs.concat([
              "天色已黑，糧車仍困在山道。你只能焚去部分物資，再帶傷者趁夜撤離。",
              "韓魁沒有得到全部糧食，但桑澤里亦未能完成原本的護送。"
            ]),
            rolls
          );
        }
        return;
      }

      setScene({
        heading: b.enemyAdvantage >= 3 ? "山勢仍在敵手" : "車陣血戰",
        paragraphs,
        rolls,
        actions: blackPineBattleActions()
      });
    }

    function blackPinePressure() {
      const b = state.battle;
      const natural = die(20);
      const bonus = 1 + b.enemyAdvantage;
      const total = natural + bonus;
      const defence = playerDefence() + Math.floor(b.formation / 35);
      const hit = natural === 20 || (natural !== 1 && total >= defence);
      const rolls = [`賊眾攻勢：d20 ${natural} ${signed(bonus)} = ${total}，對抗 ${defence}`];
      const paragraphs = [];

      if (natural === 1) {
        b.enemyMorale -= 8;
        paragraphs.push("一根滾木反撞倒坡上賊眾，鄉勇見狀爆出喝彩。");
      } else if (!hit) {
        b.formation -= 2;
        paragraphs.push("箭矢大多被糧車與甲衣擋住。眾人被迫低頭，陣腳仍未散開。");
      } else {
        const dealt = damage(6, natural === 20, state.armour.reduction);
        state.hp = Math.max(0, state.hp - dealt.final);
        b.morale -= natural === 20 ? 12 : 6;
        b.formation -= natural === 20 ? 12 : 7;
        setInjury(natural === 20);
        rolls.push(
          `亂軍刀箭：${dealt.rolls.join(" + ")}，減傷 ${dealt.reduction}，造成 ${dealt.final} 點傷害`
        );
        paragraphs.push(
          natural === 20
            ? "箭矢集中落向同一段車陣。木板碎裂，鄉勇倒地，你亦在缺口中被重重斬中。"
            : "山賊由車底鑽入，短刀越過護甲。你將他逼退，傷口卻已開始滲血。"
        );
      }

      return { paragraphs, rolls };
    }

    function normalizeBattle(b) {
      b.morale = clamp(b.morale, 0, 100);
      b.formation = clamp(b.formation, 0, 100);
      b.enemyMorale = clamp(b.enemyMorale, 0, 100);
      b.position = clamp(b.position, -3, 3);
      b.enemyAdvantage = clamp(b.enemyAdvantage, -2, 5);
      b.protected = clamp(b.protected, 0, 4);
    }

    function endChapter1Victory(paragraphs, rolls, heading) {
      state.phase = "chapter1End";
      state.chapter1.outcome = "victory";
      state.battle = null;
      state.combat = null;

      if (state.npcs.zhouPing.status === "箭傷") {
        remember("zhouPing", `${state.name}在黑松嶺將他帶回。`, 10);
      }

      setScene({
        heading,
        paragraphs: paragraphs.concat([
          "你活過第一場真正戰鬥。勝利沒有令死者重新站起，亦沒有解開黃布與「甲子」背後的意思。",
          "但桑澤里從此有人記得你的名字。"
        ]),
        rolls,
        actions: [{
          label: "收束第一卷",
          className: "history-action",
          handler: chapter1Aftermath
        }]
      });
    }

    function finishChapter1Defeat(paragraphs, rolls) {
      state.phase = "chapter1End";
      state.chapter1.outcome = "defeat";
      state.battle = null;
      state.combat = null;
      state.reputation.village -= 6;

      setScene({
        heading: "敗退而還",
        paragraphs: paragraphs.concat([
          "你沒有死，但失敗同樣會留在人的一生。桑澤里失去糧藥，死者家人亦不會因你已盡力便停止哀哭。",
          "黑松嶺之敗將成為下一段人生的起點，而不是被重置的舊紀錄。"
        ]),
        rolls,
        actions: [{
          label: "收束第一卷",
          handler: chapter1Aftermath
        }]
      });
    }

    function chapter1Aftermath() {
      state.chapter = 1;
      state.year = 184;
      state.month = "二月";
      state.location = state.home;

      const result = state.chapter1.outcome === "victory"
        ? "糧藥得以送達，桑澤里雖辦了幾場喪事，仍有餘力照顧傷者。"
        : "失去糧藥後，村中病者最先受苦。有人責怪田伯，亦有人把怨氣落在每個生還者身上。";

      setScene({
        heading: "第一卷終・風雨欲來",
        paragraphs: [
          result,
          state.chapter1.hanKuiFate === "敗逃"
            ? "韓魁仍然生還。有人看見他帶殘部向南而去，亦有人話黑石寨夜裡出現更多黃布人。"
            : state.chapter1.hanKuiFate === "killed"
              ? "韓魁已死，但黑石寨背後提供兵器與消息的人仍未現身。"
              : "黑石寨仍然存在，而且比一個月前得到更多糧食與兵器。",
          "二十餘日後，驛道上傳來急馬。冀州、潁川、南陽等地同時爆發大規模起事，聚眾者以黃巾裹頭，州郡震動。",
          "【史勢】光和七年，太平道起事。原定日期因告密而提前，地方官府倉促徵兵，各地豪強亦開始自募人手。",
          "你在黑松嶺見過的黃布與「甲子」，終於有了名字。"
        ],
        actions: [{
          label: "帶着此身進入第二卷",
          className: "danger",
          handler: beginChapter2
        }]
      });
    }

    function healBetweenChapters() {
      if (state.injury.severity === 1) {
        state.injury = { name: "無", severity: 0, ability: null, penalty: 0 };
        state.hp = state.maxHp;
      } else if (state.injury.severity === 2) {
        state.injury.severity = 1;
        state.injury.penalty = 0;
        state.hp = Math.max(state.hp, Math.ceil(state.maxHp * 0.8));
      } else if (state.injury.severity >= 3) {
        state.injury.severity = 2;
        state.injury.penalty = -1;
        state.hp = Math.max(state.hp, Math.ceil(state.maxHp * 0.65));
      } else {
        state.hp = state.maxHp;
      }
    }

    function beginChapter2() {
      healBetweenChapters();
      state.chapter = 2;
      state.phase = "chapter2";
      state.scene = "yellowOutbreak";
      state.year = 184;
      state.month = "二月下旬";
      state.age = 16;
      addHistory("親歷黃巾之亂爆發。");
      saveCheckpoint();

      setScene({
        heading: "第二卷・黃巾初起",
        paragraphs: [
          "涿縣城門外擠滿流民、徵募者與等待入城的車隊。官府文書貼了一層又一層，昨日的命令今日便可能作廢。",
          "太平道信眾並非全是持刀亂軍。有人曾替窮戶治病，有人只求免於苛稅；但城外亦已有黃巾隊伍殺吏奪倉，裹挾不願從者。",
          "涿郡開始招募義兵。兩名販馬商人張世平、蘇雙願意提供馬匹與資財，一名叫劉備的本地人亦開始招合徒眾。",
          "同一時間，盧生發現黑松嶺殘信上的收糧地點，可能就位於涿水渡口附近。",
          "你唔需要處理所有事情。今日所揀嘅道路，將決定你以甚麼身份撞入歷史。"
        ],
        actions: chapter2RouteActions()
      });
    }

    function routeRequirement(condition, reason) {
      return { available: condition, reason };
    }

    function chapter2RouteActions() {
      const scoutAvailable =
        state.abilities.awareness >= 58 ||
        state.abilities.agility >= 58 ||
        hasTag("mountain") ||
        hasTag("roads") ||
        hasTag("scouting");

      const logisticsAvailable =
        state.abilities.intellect >= 58 ||
        hasTag("strategy") ||
        hasTag("classics") ||
        hasTag("convoyGuard");

      const leaderAvailable =
        state.abilities.presence >= 58 ||
        state.reputation.village >= 10 ||
        hasTag("command") ||
        hasTag("mediation");

      const yellowAvailable =
        hasTag("yellowClue") ||
        state.chapter1.outcome === "defeat" ||
        state.reputation.government < 0;

      return [
        {
          label: "響應劉備等人的義兵招募",
          note: "以普通應募者身份進入前線。",
          className: "history-action",
          handler: () => chooseChapter2Route("volunteer")
        },
        {
          label: "沿黑松嶺線索偵察涿水渡口",
          note: "由情報與山路開始接近亂局。",
          ...routeRequirement(scoutAvailable, "缺乏偵察能力或相關道路經驗。"),
          handler: () => chooseChapter2Route("scout")
        },
        {
          label: "協助商隊整理軍糧與道路",
          note: "由後勤與謀略支援新募義兵。",
          ...routeRequirement(logisticsAvailable, "未有足夠文書、兵書或護糧經驗。"),
          handler: () => chooseChapter2Route("logistics")
        },
        {
          label: "先組織桑澤里青壯與難民",
          note: "帶住自己建立的人際關係進入亂局。",
          ...routeRequirement(leaderAvailable, "你目前未有足夠聲望或號令經驗。"),
          handler: () => chooseChapter2Route("organize")
        },
        {
          label: "留守桑澤里，不把家人交給陌生軍隊",
          note: "留守同樣係完整道路，但戰火未必會避開你。",
          className: "safe",
          handler: () => chooseChapter2Route("stay")
        },
        {
          label: "循黃符接觸當地太平道信眾",
          note: "不等於立即加入黃巾；你會先看清他們係甚麼人。",
          className: "danger",
          ...routeRequirement(yellowAvailable, "你未有足夠線索找到秘密接頭者。"),
          handler: () => chooseChapter2Route("taiping")
        }
      ];
    }

    function chooseChapter2Route(route) {
      state.chapter2.route = route;

      const handlers = {
        volunteer: volunteerRoute,
        scout: scoutRoute,
        logistics: logisticsRoute,
        organize: organizeRoute,
        stay: stayRoute,
        taiping: taipingRoute
      };

      handlers[route]();
    }

    function volunteerRoute() {
      state.chapter2.allegiance = "涿郡義兵";
      state.faction = "涿郡義兵";
      addTag("volunteer");
      addHistory("黃巾初起時響應涿郡義兵招募。");

      setScene({
        heading: "市井募兵",
        paragraphs: [
          "涿縣市口聚了數百人。有人自備刀弓，更多人只拿木棍與農具。",
          "一名身長臂長、神色沉靜的男子逐一問明應募者籍貫與所長。他便是劉備。",
          "不遠處，一名赤面長髯大漢替受欺壓的流民攔住醉卒；另一名豹頭環眼的壯漢則在空地高聲整隊。",
          "你不是他們等待多年的英雄，只是今日眾多應募者之一。"
        ],
        actions: [
          {
            label: "展示黑松嶺實戰所得",
            note: "初陣經驗會影響劉備判斷。",
            handler: () => volunteerTest("combat")
          },
          {
            label: "先說清自己能替眾人做甚麼",
            note: "氣度與可靠名聲較重要。",
            handler: () => volunteerTest("presence")
          },
          {
            label: "呈上黑石寨留下的甲子線索",
            note: "可能令你直接接觸軍中情報工作。",
            available: hasTag("yellowClue"),
            reason: "你沒有可以證明黑石寨聯繫的實物。",
            handler: () => volunteerTest("clue")
          }
        ]
      });
    }

    function volunteerTest(type) {
      let result;

      if (type === "combat") {
        result = check(
          state.weapon.ability,
          13,
          hasTag("firstBattle") ? 2 : 0,
          "試武"
        );
      } else if (type === "presence") {
        result = check(
          "presence",
          13,
          state.traits.includes("reliable") ? 2 : 0,
          "應募陳詞"
        );
      } else {
        result = check(
          "intellect",
          12,
          state.chapter1.clues,
          "呈報線索"
        );
      }

      state.chapter2.metLiuBei = true;

      if (result.success) {
        state.reputation.military += 8;
        paragraphsMeetLiu(result, type, true);
      } else {
        state.reputation.military += 2;
        paragraphsMeetLiu(result, type, false);
      }
    }

    function paragraphsMeetLiu(result, type, success) {
      const special =
        type === "clue"
          ? "劉備讀完殘信，沒有在眾人面前聲張，只叫你把渡口位置再說一遍。"
          : type === "combat"
            ? "赤面長髯的關羽看過你的步法，微微點頭，卻沒有出言稱讚。"
            : "劉備聽完你對桑澤里人手與糧況的說明，先問傷者如何，再問你願意承擔甚麼。";

      setScene({
        heading: success ? "獲留軍前" : "仍是新卒",
        paragraphs: [
          special,
          success
            ? "『有實戰而不妄言者，可用。』劉備將你編入前隊，並准你參與渡口行動。"
            : "你沒有立即脫穎而出。劉備仍把你留下，只係安排在較外圍的位置。亂世從軍，本來就唔會人人第一日得到賞識。",

    function chapter2Convergence(role) {
      state.phase = "chapter2";
      state.location = "涿水渡口";
      state.chapter2.objective = "保住渡口與難民通道";

      let opening;

      if (state.chapter2.allegiance === "涿郡黃巾") {
        opening = [
          "渡口強硬派已點燃第一堆柴薪。你帶願意護民的黃巾信眾守住橋頭，既要抵擋渠帥親兵，亦要避免同北岸義兵全面互殺。",
          "遠處可見關羽長刀與張飛蛇矛般的長兵在人群間開路。劉備則不斷喝令義兵放開難民通道。",
          "你唔係為殺光其中一邊而戰，而係要令百姓活著過橋。"
        ];
      } else if (state.chapter2.allegiance === "太平道溫和信眾") {
        opening = [
          "你與馬蘭打開南岸柵欄，難民開始湧向橋面。強硬派立即派人封路，北岸義兵亦誤以為所有黃巾都準備進攻。",
          "你要在兩股兵力之間維持一條生路。任何一邊失控，都會先把橋上百姓推入河中。"
        ];
      } else {
        opening = [
          "義兵趕到時，強硬黃巾已經控制南岸糧棚。數百名難民被困在橋面與營地之間。",
          "劉備下令不得向橋上放箭。關羽領人壓住左岸，張飛則準備撞開焚橋隊伍。",
          `你以「${role}」身份進入戰場。任務唔係殺盡黃巾，而係保住渡口、糧道與百姓。`
        ];
      }

      setScene({
        heading: "涿水渡口",
        paragraphs: opening.concat([
          "黑石寨殘部亦出現在南岸。如果韓魁仍然生還，今日可能就藏在黃巾旗號之後。"
        ]),
        actions: [{
          label: "進入渡口決戰",
          className: "danger",
          handler: startChapter2Battle
        }]
      });
    }

    function startChapter2Battle() {
      state.phase = "battlefield2";

      const route = state.chapter2.route;
      let morale = 52;
      let formation = 48;
      let position = 0;
      let protectedPeople = 2;

      if (route === "organize" || route === "stay") morale += 8;
      if (route === "scout") position += 1;
      if (route === "logistics") formation += 8;
      if (state.chapter1.outcome === "victory") morale += 5;
      if (state.chapter2.civiliansSaved >= 15) protectedPeople += 1;

      state.battle = {
        id: "zhuoFord",
        name: "涿水渡口爭奪",
        objective: "守住難民通道直至最後一批人過橋",
        round: 1,
        maxRounds: 5,
        morale: clamp(morale, 0, 100),
        formation: clamp(formation, 0, 100),
        enemyMorale: 72,
        position,
        protected: protectedPeople,
        enemyAdvantage: 2,
        bridgeIntegrity: 3,
        personalThreat: 0
      };

      setScene({
        heading: "黃巾、義兵與百姓",
        paragraphs: [
          "鼓聲響起後，再冇人能完整看清全場。黃巾、義兵、潰卒與逃難百姓擠在同一片泥地。",
          "真正重要的只有三件事：橋不能太早被燒、隊伍不能崩潰、難民通道必須保持。",
          "你只能選擇自己最能改變的一處。"
        ],
        actions: chapter2BattleActions()
      });
    }

    function chapter2BattleActions() {
      const b = state.battle;
      const route = state.chapter2.route;

      const actions = [
        {
          label: "穩住隊伍，分開兵卒與難民",
          note: "氣度；提升士氣、隊形與受護目標。",
          handler: () => resolveChapter2Battle("rally")
        },
        {
          label: "搶佔橋側高地",
          note: "洞察或身法；改善位置並壓制縱火者。",
          handler: () => resolveChapter2Battle("position")
        },
        {
          label: "護送一批難民過橋",
          note: "直接推進主要目標，但會承受更大個人風險。",
          className: "safe",
          handler: () => resolveChapter2Battle("escort")
        },
        {
          label: "率隊打擊焚橋頭目",
          note: "個人戰鬥會影響敵軍士氣，但不能代替護送目標。",
          className: "danger",
          handler: () => resolveChapter2Battle("strike")
             }
      ];

      const canParley =
        state.chapter2.route === "taiping" ||
        hasTag("taipingContact") ||
        state.abilities.presence >= 68;

      actions.push({
        label: "向仍願護民的黃巾喊話",
        note: "分化強硬派，避免所有黃巾都被迫死戰。",
        available: canParley,
        reason: "你未有足夠聯繫或聲望令敵陣相信你。",
        handler: () => resolveChapter2Battle("parley")
      });

      if (
        state.chapter2.route === "scout" ||
        hasTag("militaryScout") ||
        hasTag("mountain") ||
        hasTag("roads")
      ) {
        actions.push({
          label: "沿蘆葦灘繞到焚橋隊側後",
          note: "斥候道路；可削弱地勢優勢並保護橋梁。",
          handler: () => resolveChapter2Battle("flank")
        });
      }

      if (
        !b.hanKuiResolved &&
        state.chapter1.hanKuiFate !== "killed" &&
        b.round >= 2
      ) {
        actions.unshift({
          label: "迎向黑石寨殘部",
          note: "韓魁可能就在亂軍之中。此舉會令你離開難民通道。",
          className: "danger",
          handler: confrontHanKuiAtFord
        });
      }

      return actions;
    }

    function resolveChapter2Battle(type) {
      const b = state.battle;
      const paragraphs = [];
      const rolls = [];
      let result;

      if (type === "rally") {
        result = check(
          "presence",
          13 + Math.max(0, b.enemyAdvantage),
          (hasTag("command") ? 2 : 0) +
          (hasTag("localLeader") ? 1 : 0),
          "渡口整隊"
        );

        if (result.critical) {
          b.morale += 20;
          b.formation += 18;
          b.protected += 1;
          b.enemyMorale -= 8;
          paragraphs.push(
            "你衝到橋頭中央，先將兵卒與難民分成兩條通道，再命持盾者面向南岸。清楚命令迅速壓過哭喊，幾名原本失控的鄉勇亦重新歸隊。"
          );
        } else if (result.success) {
          b.morale += 12;
          b.formation += 10;
          b.protected += 1;
          paragraphs.push(
            "你沿橋頭逐人喝令，將傷者、孩童與持兵者分開。混亂未止，但眾人終於知道下一步要往哪裡走。"
          );
        } else {
          b.morale -= result.disaster ? 12 : 6;
          b.formation -= result.disaster ? 8 : 4;
          paragraphs.push(
            "鼓聲、火聲與哭喊吞沒你的命令。有人誤以為橋已失守，反而推著人群向最窄處擠去。"
          );
        }
      }

      if (type === "position") {
        const ability =
          state.abilities.awareness >= state.abilities.agility
            ? "awareness"
            : "agility";

        result = check(
          ability,
          14 + Math.max(0, b.enemyAdvantage - 1),
          (hasTag("militaryScout") ? 2 : 0) +
          (hasTag("scouting") ? 1 : 0),
          "搶佔橋側"
        );

        if (result.critical) {
          b.position += 2;
          b.enemyAdvantage -= 2;
          b.bridgeIntegrity = Math.min(3, b.bridgeIntegrity + 1);
          b.enemyMorale -= 8;
          paragraphs.push(
            "你沒有沿石階直衝，而是踩過淺水與蘆根繞到橋側土丘。焚橋者忽然發現自己暴露在兩面兵刃之間，只得丟下火把退走。"
          );
        } else if (result.success) {
          b.position += 1;
          b.enemyAdvantage -= 1;
          b.bridgeIntegrity = Math.min(3, b.bridgeIntegrity + 1);
          paragraphs.push(
            "你搶先佔住橋側高地，幾名弓手隨即跟上。縱火者無法再毫無遮掩地接近木樁。"
          );
        } else {
          b.position -= 1;
          b.morale -= 4;
          paragraphs.push(
            "你沿濕滑斜坡上攀，卻撞上一隊早已伏在蘆葦後的持矛者。隊伍被迫退回橋邊。"
          );
        }
      }

      if (type === "escort") {
        const ability =
          state.abilities.strength >= state.abilities.presence
            ? "strength"
            : "presence";

        result = check(
          ability,
          13 + Math.max(0, b.enemyAdvantage),
          (state.traits.includes("benevolent") ? 1 : 0) +
          (hasTag("localLeader") ? 1 : 0),
          "護送難民"
        );

        if (result.critical) {
          b.protected += 2;
          b.morale += 8;
          state.chapter2.civiliansSaved += 20;
          paragraphs.push(
            "你帶持盾者逆著人流推開一條窄路，再親手抱起倒在橋面的孩童。兩批難民趁空隙越過北岸，後方人群亦不再盲目推擠。"
          );
        } else if (result.success) {
          b.protected += 1;
          state.chapter2.civiliansSaved += 10;
          paragraphs.push(
            "你守在通道最外側，讓老人、傷者與孩童先過。刀矛幾次伸到身前，仍未能截斷人流。"
          );
        } else {
          b.formation -= 6;
          b.morale -= 5;
          b.personalThreat += result.disaster ? 2 : 1;
          paragraphs.push(
            "人群忽然因一匹倒下的牲口堵成一團。你試圖拉開通道，自己與護衛反被擠離隊形。"
          );
        }
      }

      if (type === "strike") {
        const ability = state.weapon.ability;

        result = check(
          ability,
          15 + Math.max(0, b.enemyAdvantage),
          state.weapon.attack +
          (hasTag("firstBattle") ? 1 : 0) +
          (state.traits.includes("brave") ? 1 : 0),
          "突擊焚橋隊"
        );

        if (result.critical) {
          b.enemyMorale -= 26;
          b.morale += 10;
          b.position += 1;
          b.bridgeIntegrity = Math.min(3, b.bridgeIntegrity + 1);
          paragraphs.push(
            "你踏過未燃盡的柴薪直取焚橋頭目。對方才舉刀，兵刃已穿過防守。頭目倒地後，周圍黃巾一時無人敢再拾起火把。"
          );
        } else if (result.success) {
          b.enemyMorale -= 15;
          b.morale += 5;
          paragraphs.push(
            "你帶數名同伴撞入焚橋隊側面，迫使他們放棄柴薪拔刀迎戰。橋下火勢暫時停止蔓延。"
          );
        } else {
          b.formation -= 8;
          b.morale -= 7;
          b.personalThreat += result.disaster ? 3 : 2;
          paragraphs.push(
            "你離開護送通道後，敵方弓手立即集中箭矢。突擊未能接近頭目，身後隊形反而露出缺口。"
          );
        }
      }

      if (type === "parley") {
        result = check(
          "presence",
          15,
          (hasTag("taipingContact") ? 2 : 0) +
          (state.chapter2.yellowTruth ? 1 : 0) +
          (state.traits.includes("benevolent") ? 1 : 0),
          "陣前喊話"
        );

        if (result.critical) {
          b.enemyMorale -= 25;
          b.protected += 1;
          b.enemyAdvantage -= 1;
          paragraphs.push(
            "你高聲叫出馬蘭與幾名太平道施藥者的名字，再指出強硬派正準備連自己人一同燒死。最前排黃巾先放低長矛，隨後整隊讓開難民通道。"
          );
        } else if (result.success) {
          b.enemyMorale -= 14;
          b.protected += 1;
          paragraphs.push(
            "你沒有要求所有黃巾投降，只要求仍記得救民初衷的人退開一步。幾名信眾互望片刻，終於轉身制止身後的縱火者。"
          );
        } else {
          b.enemyMorale += result.disaster ? 10 : 5;
          b.morale -= 5;
          paragraphs.push(
            "強硬派敲響銅鑼，斥你受官府收買。原本仍在猶豫的人被逼著重新舉起兵刃。"
          );
        }
      }

      if (type === "flank") {
        const ability =
          state.abilities.agility >= state.abilities.awareness
            ? "agility"
            : "awareness";

        result = check(
          ability,
          14,
          (hasTag("militaryScout") ? 2 : 0) +
          (hasTag("roads") ? 1 : 0) +
          (hasTag("mountain") ? 1 : 0),
          "蘆灘迂迴"
        );

        if (result.critical) {
          b.enemyAdvantage -= 2;
          b.position += 2;
          b.enemyMorale -= 13;
          b.bridgeIntegrity = Math.min(3, b.bridgeIntegrity + 1);
          paragraphs.push(
            "你帶人伏低穿過蘆葦灘，從火油車後突然現身。敵方以為退路被截，立即棄下數桶火油。"
          );
        } else if (result.success) {
          b.enemyAdvantage -= 1;
          b.position += 1;
          b.enemyMorale -= 7;
          paragraphs.push(
            "你由淺灘繞過正面，迫使焚橋隊分兵回守。北岸壓力隨之減輕。"
          );
        } else {
          b.position -= 1;
          b.personalThreat += 1;
          paragraphs.push(
            "河泥比預想更深，幾名同伴陷在蘆根之間。敵方發現動靜後立即向淺灘射箭。"
          );
        }
      }

      if (result) rolls.push(result.line);

      normalizeChapter2Battle();

      if (checkChapter2BattleEnd(paragraphs, rolls)) return;

      const pressure = chapter2EnemyPressure();
      paragraphs.push(...pressure.paragraphs);
      rolls.push(...pressure.rolls);

      normalizeChapter2Battle();

      if (state.hp <= 0) {
        showDeath(paragraphs, rolls, "命斷涿水");
        return;
      }

      if (checkChapter2BattleEnd(paragraphs, rolls)) return;

      b.round += 1;

      if (b.round > b.maxRounds) {
        resolveChapter2Timeout(paragraphs, rolls);
        return;
      }

      setScene({
        heading: chapter2BattleHeading(),
        paragraphs,
        rolls,
        actions: chapter2BattleActions()
      });
    }
