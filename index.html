<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#17110d">

  <title>逆命錄・黃巾篇 V5.0A</title>

  <style>
    :root {
      color-scheme: dark;

      --black: #0d0a08;
      --deep: #17110d;
      --panel: #211812;
      --panel-soft: #2b2018;

      --parchment: #decda6;
      --bright: #f1e4c4;
      --muted: #a99472;

      --border: #6c5234;
      --border-bright: #9b784c;

      --blood: #8c2924;
      --blood-bright: #bd493d;

      --gold: #c69a4b;
      --green: #72885d;
      --blue: #718496;

      --shadow: rgba(0, 0, 0, 0.54);
      --hud-height: 78px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--black);
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);

      color: var(--parchment);

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(122, 84, 46, 0.18),
          transparent 34rem
        ),
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.012) 0,
          rgba(255, 255, 255, 0.012) 1px,
          transparent 1px,
          transparent 5px
        ),
        var(--black);

      font-family:
        "Songti TC",
        "Noto Serif TC",
        "PingFang TC",
        "Microsoft JhengHei",
        serif;

      line-height: 1.55;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #app {
      width: min(960px, 100%);
      margin: 0 auto;
      padding: 7px;
    }

    .masthead {
      padding: 10px 8px;
      text-align: center;

      border: 1px solid var(--border);

      background:
        linear-gradient(
          rgba(27, 19, 14, 0.95),
          rgba(18, 13, 10, 0.98)
        ),
        var(--panel);

      box-shadow: 0 6px 18px var(--shadow);
    }

    .masthead h1 {
      margin: 0;

      color: var(--bright);

      font-size: clamp(1.55rem, 7vw, 2.4rem);
      letter-spacing: 0.18em;
      text-indent: 0.18em;
    }

    .masthead p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.74rem;
      letter-spacing: 0.08em;
    }

    .compact-hud {
      position: sticky;
      z-index: 20;
      top: 0;

      margin-top: 6px;
      padding: 8px;

      border: 1px solid var(--border);
      background: rgba(25, 18, 13, 0.97);
      box-shadow: 0 6px 18px var(--shadow);
      backdrop-filter: blur(8px);
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .hud-name {
      color: var(--bright);
      font-weight: 700;
    }

    .hud-context {
      color: var(--muted);
      font-size: 0.72rem;
      text-align: right;
    }

    .hud-meters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .hud-meter-header {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 2px;
      font-size: 0.69rem;
    }

    .meter-track {
      height: 7px;
      overflow: hidden;
      border: 1px solid #5d4731;
      background: #100c0a;
    }

    .meter-fill {
      height: 100%;
      transition: width 120ms ease;
    }

    .posture-fill {
      background: linear-gradient(90deg, #4e6270, #86a2b3);
    }

    .stamina-fill {
      background: linear-gradient(90deg, #4c5b3b, #829964);
    }

    .enemy-fill {
      background: linear-gradient(90deg, #632a27, #a8463f);
    }

    .morale-fill {
      background: linear-gradient(90deg, #725b32, #c09a51);
    }

    .hud-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }

    .tag {
      padding: 2px 6px;
      color: var(--muted);
      border: 1px solid rgba(155, 120, 76, 0.48);
      background: rgba(0, 0, 0, 0.2);
      font-size: 0.66rem;
    }

    .tag.warning {
      color: #e7b099;
      border-color: rgba(189, 73, 61, 0.62);
    }

    .tag.good {
      color: #bdc99f;
      border-color: rgba(114, 136, 93, 0.72);
    }

    .main-panel {
      margin-top: 7px;
      padding: 14px 12px 210px;

      border: 1px solid var(--border);

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.018),
          transparent 40%
        ),
        var(--panel);

      box-shadow: 0 8px 24px var(--shadow);
    }

    .story-heading {
      margin: 0 0 11px;
      color: var(--bright);
      font-size: clamp(1.2rem, 5vw, 1.75rem);
      line-height: 1.3;
    }

    #storyText p {
      margin: 0 0 10px;
    }

    .creation-box {
      margin: 12px 0;
      padding: 11px;
      border: 1px solid rgba(155, 120, 76, 0.58);
      background: rgba(0, 0, 0, 0.18);
    }

    .creation-box label {
      display: block;
      margin-bottom: 5px;
      color: var(--gold);
    }

    .creation-box input {
      width: 100%;
      min-height: 46px;
      padding: 9px 10px;

      color: var(--bright);
      border: 1px solid var(--border-bright);
      border-radius: 0;
      outline: none;
      background: #120e0b;
    }

    .summary-card,
    .battle-summary,
    .history-alert,
    .tutorial-hint {
      margin: 10px 0;
      padding: 9px 10px;
      border: 1px solid rgba(155, 120, 76, 0.52);
      background: rgba(0, 0, 0, 0.19);
    }

    .history-alert {
      color: #f0c5a6;
      border-color: var(--blood-bright);
      background: rgba(91, 25, 20, 0.24);
    }

    .tutorial-hint {
      color: #c6d0dc;
      border-left: 4px solid var(--blue);
    }

    .summary-title {
      margin-bottom: 5px;
      color: var(--gold);
      font-size: 0.78rem;
      letter-spacing: 0.09em;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px 10px;
      font-size: 0.78rem;
    }

    .summary-grid strong {
      color: var(--gold);
    }

    .enemy-focus {
      margin: 10px 0;
      padding: 10px;

      border: 1px solid rgba(140, 41, 36, 0.76);
      background: rgba(75, 22, 19, 0.17);
    }

    .enemy-focus.leader {
      border-color: var(--gold);
      background: rgba(104, 72, 25, 0.14);
    }

    .enemy-focus-header {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .enemy-focus-header strong {
      color: var(--bright);
    }

    .enemy-focus-header span {
      color: var(--muted);
      font-size: 0.72rem;
      text-align: right;
    }

    .enemy-mini-status {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.72rem;
    }

    details {
      margin: 9px 0;
      border: 1px solid rgba(155, 120, 76, 0.42);
      background: rgba(0, 0, 0, 0.16);
    }

    summary {
      padding: 8px 10px;
      color: var(--gold);
      cursor: pointer;
      font-size: 0.78rem;
    }

    .details-body {
      padding: 0 10px 10px;
      color: var(--muted);
      font-size: 0.73rem;
    }

    .roll-line + .roll-line {
      margin-top: 4px;
    }

    .success-line {
      color: #bdc99f;
    }

    .failure-line {
      color: #e0aa97;
    }

    .action-tray {
      position: fixed;
      z-index: 30;
      right: 0;
      bottom: 0;
      left: 0;

      padding:
        6px
        max(7px, env(safe-area-inset-right))
        max(7px, env(safe-area-inset-bottom))
        max(7px, env(safe-area-inset-left));

      border-top: 1px solid var(--border);
      background: rgba(18, 13, 10, 0.98);
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.64);
      backdrop-filter: blur(9px);
    }

    .tray-inner {
      width: min(960px, 100%);
      margin: 0 auto;
    }

    .turn-brief {
      min-height: 20px;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 0.7rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .action-tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 5px;
    }

    .tab-button {
      flex: 1;
      min-height: 34px;
      padding: 5px 7px;

      color: var(--muted);
      border: 1px solid var(--border);
      background: #17110d;
      cursor: pointer;
    }

    .tab-button.active {
      color: var(--bright);
      border-color: var(--gold);
      background: #332417;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
      max-height: 126px;
      overflow-y: auto;
    }

    .action-button {
      min-height: 52px;
      padding: 7px 8px;

      color: var(--bright);
      border: 1px solid var(--border-bright);
      border-radius: 0;

      background:
        linear-gradient(
          rgba(71, 51, 36, 0.79),
          rgba(43, 31, 23, 0.94)
        ),
        var(--panel-soft);

      cursor: pointer;
      text-align: center;
      line-height: 1.2;
      font-size: 0.8rem;
    }

    .action-button.danger {
      border-color: var(--blood-bright);
      background: linear-gradient(#692b26, #381b18);
    }

    .action-button.execution {
      border-color: #ed715d;
      background: linear-gradient(#8d261f, #42120f);
      box-shadow: 0 0 12px rgba(140, 41, 36, 0.32);
    }

    .action-button.safe {
      border-color: var(--green);
    }

    .action-button.info {
      border-color: var(--blue);
    }

    .action-button:disabled {
      opacity: 0.38;
      cursor: default;
    }

    .action-button small {
      display: none;
    }

    .noncombat-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin-top: 12px;
    }

    .noncombat-actions .action-button {
      min-height: 58px;
      text-align: left;
      padding: 10px;
    }

    .noncombat-actions .action-button small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.7rem;
    }

    @media (min-width: 761px) {
      .compact-hud {
        top: 6px;
      }

      .main-panel {
        padding-bottom: 190px;
      }

      .actions {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }

      .action-button small {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 0.65rem;
      }
    }

    @media (max-width: 420px) {
      .masthead h1 {
        font-size: 1.5rem;
      }

      .main-panel {
        padding: 12px 10px 205px;
      }

      .summary-grid {
        grid-template-columns: 1fr 1fr;
      }

      .actions {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .action-button {
        padding: 6px 4px;
        font-size: 0.76rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>

  <main id="app">
    <header class="masthead">

    <section class="main-panel">

      <div id="storyText"></div>
      <div id="tutorialArea"></div>
      <div id="summaryArea"></div>
      <div id="enemyArea"></div>
      <div id="rollArea"></div>

      <div id="noncombatActions" class="noncombat-actions"></div>
    </section>
  </main>

  <section id="actionTray" class="action-tray" hidden>
    <div class="tray-inner">

        <button type="button" class="tab-button" data-tab="response">
          應對

        <button type="button" class="tab-button" data-tab="tactic">
          戰術
        </button>
      </div>

      <div id="combatActions" class="actions"></div>
    </div>
  </section>

        frontage: 4,
        pressure: 2,
        escapeDifficulty: 2
      }
    };

    let game = null;
    let combat = null;

    let activeCombatTab = "attack";
    let buttonsLocked = false;
    let rngState = 1;

    function clamp(value, minimum, maximum) {
      return Math.max(minimum, Math.min(maximum, value));
    }

    function signed(value) {
      return value >= 0 ? `+${value}` : `${value}`;
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function createSeed() {
      if (window.crypto && window.crypto.getRandomValues) {
        const values = new Uint32Array(1);
        window.crypto.getRandomValues(values);
        return values[0] || 1;
      }

      return (
        (
          Date.now() ^
          Math.floor(Math.random() * 4294967295)
        ) >>> 0
      ) || 1;
    }

    function seedRng(seed) {
      rngState = seed >>> 0 || 1;
    }

    function random() {
      rngState += 0x6D2B79F5;

      let value = rngState;

      value = Math.imul(
        value ^ (value >>> 15),
        value | 1
      );

      value ^= value + Math.imul(
        value ^ (value >>> 7),
        value | 61
      );

      return (
        (value ^ (value >>> 14)) >>> 0
      ) / 4294967296;
    }

    function die(sides) {
      return Math.floor(random() * sides) + 1;
    }

    function abilityModifier(score) {
      return clamp(
        Math.round((score - 50) / 10),
        -5,
        5
      );
    }

    function skillModifier(score) {
      return clamp(
        Math.round((score - 50) / 10),
        -5,
        5
      );
    }

    function baseAbilities() {
      return {
        might: 50,
        agility: 50,
        endurance: 50,
        perception: 50,
        intellect: 50,
        will: 50,
        presence: 50
      };
    }

    function baseSkills() {
      return {
        blade: 28,
        spear: 28,
        polearm: 24,
        dueling: 30,
        awareness: 28,
        command: 18,
        tactics: 20,
        medicine: 12
      };
    }

    function applyBonuses(target, bonuses) {
      Object.entries(bonuses || {}).forEach(([key, amount]) => {
        target[key] = clamp(
          (target[key] || 0) + amount,
          0,
          99
        );
      });
    }

    function createGameState() {
      return {
        phase: "creation",
        name: "",
        age: 0,
        pastLife: null,
        childhoodIndex: 0,

        abilities: baseAbilities(),
        skills: baseSkills(),

        traits: [],
        weapon: null,

        rank: "鄉勇",
        merit: 0,
        renown: 0,

        wounds: [],

        affinity: {
          cao: 0,
          liu: 0,
          sun: 0
        },

        weaponHistory: [],

        historicalDivergence: 0,
        history: []
      };
    }

    function fatigueLabel(fatigue) {
      if (fatigue <= 0) return "精力尚足";
      if (fatigue <= 2) return "開始疲累";
      if (fatigue <= 4) return "呼吸沉重";
      if (fatigue <= 6) return "動作遲緩";
      return "接近力竭";
    }

    function woundSummary(wounds) {
      if (!wounds || wounds.length === 0) {
        return "無傷";
      }

      return wounds
        .map(wound => `${wound.name}（${wound.severity}）`)
        .join("、");
    }

    function campaignSummaryHtml() {
      if (!game) return "";

      return `
        <div class="summary-card">
          <div class="summary-title">軍旅命簿</div>

          <div class="summary-grid">
            <div><strong>年齡：</strong>${game.age || "—"}</div>
            <div><strong>軍職：</strong>${escapeHtml(game.rank)}</div>
            <div><strong>軍功：</strong>${game.merit}</div>
            <div><strong>武名：</strong>${game.renown}</div>
            <div><strong>兵器：</strong>${game.weapon ? escapeHtml(game.weapon.name) : "未選"}</div>
            <div><strong>傷勢：</strong>${escapeHtml(woundSummary(game.wounds))}</div>
          </div>
        </div>
      `;
    }

    function setNarrativeScene(
      heading,
      paragraphs,
      actions = [],
      options = {}
    ) {
      combat = null;
      activeCombatTab = "attack";

      document.getElementById("actionTray").hidden = true;

      document.getElementById("storyHeading").textContent = heading;

      document.getElementById("storyText").innerHTML =
        paragraphs
          .map(paragraph => `<p>${escapeHtml(paragraph)}</p>`)
          .join("");

      document.getElementById("tutorialArea").innerHTML =
        options.alert
          ? `
            <div class="history-alert">
              ${escapeHtml(options.alert)}
            </div>
          `
          : "";

      document.getElementById("summaryArea").innerHTML =
        options.hideSummary
          ? ""
          : campaignSummaryHtml();

      document.getElementById("enemyArea").innerHTML = "";
      document.getElementById("rollArea").innerHTML = "";

      renderNarrativeActions(actions);
      renderHud();
    }

    function renderNarrativeActions(actions) {
      const container = document.getElementById("noncombatActions");

      container.innerHTML = "";
      buttonsLocked = false;

      actions.forEach(action => {
        const button = document.createElement("button");

        button.type = "button";
        button.className =
          `action-button ${action.className || ""}`;

        button.innerHTML =
          `${escapeHtml(action.label)}` +
          (
            action.note
              ? `<small>${escapeHtml(action.note)}</small>`
              : ""
          );

        button.addEventListener("click", () => {
          if (buttonsLocked) return;

          buttonsLocked = true;

          container
            .querySelectorAll("button")
            .forEach(item => {
              item.disabled = true;
            });

          action.handler();
        });

        container.appendChild(button);
      });
    }

    function startCreation() {
      game = createGameState();

      setNarrativeScene(
        "前世已盡",
        [
          "你原本生活喺另一個時代。",
          "死亡之後，你冇迎來虛無。再次睜眼時，屋頂係煙燻發黑嘅木樑，窗外有人談論漢室、徵斂同太平道。",
          "你帶住前世記憶喺東漢末年重新出生，但記憶唔等於力量。呢副身體仍然要重新成長。"
        ],
        [],
        {
          hideSummary: true
        }
      );

      document.getElementById("storyText").innerHTML += `
        <div class="creation-box">
          <label for="nameInput">今世姓名</label>

          <input
            id="nameInput"
            type="text"
            maxlength="12"
            placeholder="例如：沈越"
            autocomplete="off"
            enterkeyhint="done"
          >
        </div>
      `;

      renderNarrativeActions(
        Object.entries(PAST_LIVES).map(([key, pastLife]) => ({
          label: pastLife.name,
          note: pastLife.description,
          handler: () => choosePastLife(key)
        }))
      );
    }

    function choosePastLife(key) {
      const input = document.getElementById("nameInput");
      const name = input ? input.value.trim() : "";

      if (!name) {
        alert("請先輸入今世姓名。");
        buttonsLocked = false;

        document
          .querySelectorAll("#noncombatActions button")
          .forEach(button => {
            button.disabled = false;
          });

        return;
      }

      game.name = name.slice(0, 12);
      game.pastLife = key;
      game.age = 1;

      applyBonuses(
        game.abilities,
        PAST_LIVES[key].abilities
      );

      applyBonuses(
        game.skills,
        PAST_LIVES[key].skills
      );

      applyBonuses(
        game.affinity,
        PAST_LIVES[key].affinity
      );

      game.history.push(
        `前世身分：${PAST_LIVES[key].name}`
      );

      showChildhoodEvent();
    }

    function showChildhoodEvent() {
      const event =
        CHILDHOOD_EVENTS[
          game.childhoodIndex
        ];

      if (!event) {
        chooseWeaponScene();
        return;
      }

      game.age = event.age;

      setNarrativeScene(
        event.heading,
        [
          event.text,
          "你今次嘅選擇會逐漸塑造將來嘅性格同軍旅方向，但命簿唔會立即公開所有數值變化。"
        ],
        event.choices.map(choice => ({
          label: choice.label,
          note: choice.note,
          handler: () => resolveChildhoodChoice(choice)
        }))
      );
    }

    function resolveChildhoodChoice(choice) {
      applyBonuses(
        game.abilities,
        choice.abilities
      );

      applyBonuses(
        game.skills,
        choice.skills
      );

      applyBonuses(
        game.affinity,
        choice.affinity
      );

      game.traits.push(choice.trait);
      game.history.push(
        `${game.age}歲：${choice.label}`
      );

      game.childhoodIndex += 1;

      setNarrativeScene(
        "歲月留痕",
        [
          `你選擇咗「${choice.label}」。`,
          `呢段經歷令你逐漸形成「${choice.trait}」嘅特質。`,
          "歲月繼續向大亂逼近。"
        ],
        [
          {
            label: "繼續成長",
            handler: showChildhoodEvent
          }
        ]
      );
    }

    function chooseWeaponScene() {
      game.age = 18;

      setNarrativeScene(
        "光和六年・第一次持兵",
        [
          "附近村落準備押送糧藥穿過黑松嶺。山中盜匪已經劫過兩隊商旅，鄉勇缺少能夠持兵嘅人。",
          "你知道黃巾之亂即將爆發，但眼前第一個考驗只係一段冇記載喺史書上嘅山路。",
          "村中畀你選擇一件兵器。佢可能只陪你經歷第一戰，亦可能隨你走過整段軍旅人生。"
        ],
        Object.entries(WEAPONS).map(([key, weapon]) => ({
          label: weapon.name,
          note:
            `命中 ${signed(weapon.accuracy)}・衝擊 d${weapon.damageSides}`,
          handler: () => chooseWeapon(key)
        }))
      );
    }

    function chooseWeapon(key) {
      game.weapon = clone(WEAPONS[key]);

      game.skills[key] = clamp(
        (game.skills[key] || 0) + 8,
        0,
        99
      );

      game.weaponHistory.push(
        `光和六年，由村中領取${game.weapon.name}`
      );

      firstBattleApproach();
    }

    function firstBattleApproach() {
      setNarrativeScene(
        "黑松嶺・第一個軍事判斷",
        [
          "糧隊進入山道後，兩側林木愈來愈密。前方車輪陷入濕泥，後排仍然繼續向前。",
          "呢場戰鬥同時係第一個 combat tutorial。遊戲唔會直接講出所有正確答案；你要由行動結果逐漸理解規律。",
          "你準備點樣通過最危險嘅彎口？"
        ],
        [
          {
            label: "觀察泥地與林梢",
            note: "依靠洞察同臨敵經驗判斷伏兵。",
            handler: () => resolveFirstApproach("observe")
          },
          {
            label: "令鄉勇靠近糧車",
            note: "依靠才智同戰術維持隊形。",
            handler: () => resolveFirstApproach("formation")
          },
          {
            label: "自告奮勇先行探路",
            note: "依靠身法同膽量搶先發現危險。",
            handler: () => resolveFirstApproach("advance")
          }
        ]
      );
    }

    function tacticalCheck(
      label,
      abilityKey,
      skillKey,
      difficulty,
      situation = 0
    ) {
      const roll = die(20);

      const ability =
        abilityModifier(
          game.abilities[abilityKey]
      );

      const skill =
        skillModifier(
          game.skills[skillKey] || 0
        );

      const total =
        roll +
        ability +
        skill +
        situation;

      const success =
        roll !== 1 &&
        (
          roll === 20 ||
          total >= difficulty
        );

      return {
        label,
        roll,
        ability,
        skill,
        situation,
        total,
        difficulty,
        success,
        critical: roll === 20,
        disaster: roll === 1
      };
    }

    function tacticalLine(result) {
      return (
        `${result.label}：d20［${result.roll}］ ` +
        `${signed(result.ability)} 能力 ` +
        `${signed(result.skill)} 技能 ` +
        `${signed(result.situation)} 戰況 ` +
        `= ${result.total}，對抗 ${result.difficulty}`
      );
    }

    function resolveFirstApproach(type) {
      seedRng(createSeed());

      let result;
      let config;

      if (type === "observe") {
        result = tacticalCheck(
          "察覺伏兵",
          "perception",
          "awareness",
          13,
          1
        );

        game.affinity.cao += 1;
      }

      if (type === "formation") {
        result = tacticalCheck(
          "整理隊形",
          "intellect",
          "tactics",
          13,
          0
        );

        game.affinity.liu += 1;
      }

      if (type === "advance") {
        result = tacticalCheck(
          "先行探路",
          "agility",
          "awareness",
          14,
          -1
        );

        game.affinity.sun += 1;
      }

      config = result.success
        ? {
            enemyCount: 3,
            terrain: "gate",
            playerInitiative: 1,
            enemyMorale: 58,
            tutorial: true,
            openingText:
              "你提早察覺山賊動靜，鄉勇成功靠住糧車建立防線。三名敵人先行衝落山道。",
            tacticalResult: tacticalLine(result)
          }
        : {
            enemyCount: 4,
            terrain: "road",
            playerInitiative: -1,
            enemyMorale: 72,
            tutorial: true,
            openingText:
              "你未能及時發現真正伏兵。亂箭落下之後，隊形斷裂，你被幾名山賊隔離。",
            tacticalResult: tacticalLine(result)
          };

      beginCombat(
        config,
        {
          win: finishFirstBattleWin,
          escape: finishFirstBattleEscape,
          defeat: finishFirstBattleDefeat
        }
      );
    }

    function makeCombatPlayer(config) {
      const endurance =
        abilityModifier(
          game.abilities.endurance
        );

      const will =
        abilityModifier(
          game.abilities.will
        );

      const maxPosture =
        Math.max(
          15,
          18 + endurance + will
        );

      const maxStamina =
        Math.max(
          14,
          18 + endurance * 2
        );

      return {
        name: game.name,
        abilities: clone(game.abilities),
        skills: clone(game.skills),
        weapon: clone(game.weapon),

        armour: {
          name: "綴片皮甲",
          mitigation: 1,
          woundProtection: 1
        },

        maxPosture,
        posture: maxPosture,

        maxStamina,
        stamina: maxStamina,

        fatigue: 0,
        wounds: clone(game.wounds),

        guarded: false,
        focus: 0,
        opening: false,

        defeated: false,
        dead: false,

        lastAction: null,
        repeatCount: 0
      };
    }

    function makeEnemy(index, leader = false) {
      if (leader) {
        return {
          id: index,
          name: "黃巾小帥・趙弘",
          leader: true,

          abilities: {
            might: 64,
            agility: 56,
            endurance: 60,
            perception: 54,
            will: 63
          },

          skills: {
            blade: 59,
            dueling: 56,
            awareness: 50
          },

          weapon: {
            name: "厚背戰刀",
            ability: "might",
            skill: "blade",
            accuracy: 1,
            damageSides: 8,
            staminaCost: 2,
            piercing: 0
          },

          armour: {
            mitigation: 2,
            woundProtection: 1
          },

          maxPosture: 21,
          posture: 21,
          maxStamina: 20,
          stamina: 20,

          guarded: false,
          exposed: false,
          wounds: [],

          defeated: false,
          dead: false,
          fled: false,
          position: "reserve"
        };
      }

      return {
        id: index,
        name: `敵兵・${index + 1}`,
        leader: false,

        abilities: {
          might: 51,
          agility: 48,
          endurance: 50,
          perception: 45,
          will: 44
        },

        skills: {
          blade: 42,
          dueling: 39,
          awareness: 37
        },

        weapon: {
          name: "短柄刀",
          ability: "might",
          skill: "blade",
          accuracy: 0,
          damageSides: 6,
          staminaCost: 2,
          piercing: 0
        },

        armour: {
          mitigation: 1,
          woundProtection: 0
        },

        maxPosture: 15,
        posture: 15,
        maxStamina: 15,
        stamina: 15,

        guarded: false,
        exposed: false,
        wounds: [],

        defeated: false,
        dead: false,
        fled: false,
        position: "reserve"
      };
    }

    function beginCombat(config, callbacks) {
      const seed =
        config.seed || createSeed();

      seedRng(seed);

      combat = {
        phase: "battle",
        seed,
        round: 1,

        terrain:
          clone(
            TERRAINS[config.terrain || "road"]
          ),

        player:
          makeCombatPlayer(config),

        enemies: [],

        initiative:
          config.playerInitiative || 0,

        morale:
          config.enemyMorale || 65,

        escapeProgress: 0,
        escapeTarget:
          config.enemyCount >= 5
            ? 3
            : 2,

        retreatGap: false,
        tutorial:
          Boolean(config.tutorial),

        tutorialStep: 0,

        turnBrief:
          "敵人逐步逼近。",

        callbacks,
        tacticalResult:
          config.tacticalResult || "",

        context:
          config.context || "個人戰鬥"
      };

      for (
        let index = 0;
        index < config.enemyCount;
        index += 1
      ) {
        combat.enemies.push(
          makeEnemy(
            index,
            Boolean(
              config.hasLeader &&
              index === 0
            )
          )
        );
      }

      fillFrontline();

      document.getElementById("noncombatActions").innerHTML = "";
      document.getElementById("actionTray").hidden = false;

      setCombatScene(
        "戰鬥開始",
        [
          config.openingText ||
          "敵人由前後逼近，你必須立即作出判斷。"
        ],
        config.tacticalResult
          ? [config.tacticalResult]
          : []
      );
    }

    function livingEnemies() {
      if (!combat) return [];

      return combat.enemies.filter(
        enemy =>
          !enemy.defeated &&
          !enemy.fled
      );
    }

    function frontEnemies() {
      if (!combat) return [];

      return combat.enemies.filter(
        enemy =>
          !enemy.defeated &&
          !enemy.fled &&
          enemy.position === "front"
      );
    }

    function reserveEnemies() {
      if (!combat) return [];

      return combat.enemies.filter(
        enemy =>
          !enemy.defeated &&
          !enemy.fled &&
          enemy.position === "reserve"
      );
    }

    function fillFrontline(paragraphs = []) {
      if (!combat) return;

      const reserves =
        reserveEnemies();

      while (
        frontEnemies().length <
          combat.terrain.frontage &&
        reserves.length > 0
      ) {
        const enemy =
          reserves.shift();

        enemy.position = "front";

        if (paragraphs.length > 0) {
          paragraphs.push(
            enemy.leader
              ? `${enemy.name}親自補入前線。`
              : `${enemy.name}踏過倒地同伴，補入前線。`
          );
        }

        if (
          combat.player.weapon.key === "spear"
        ) {
          enemy.posture =
            Math.max(
              0,
              enemy.posture -
              combat.player.weapon.reachControl
            );
        }
      }
    }

    function currentTarget() {
      const front =
        frontEnemies();

      if (front.length === 0) {
        return null;
      }

      return (
        front.find(
          enemy =>
            enemy.exposed &&
            enemy.posture <= 0
        ) ||
        front
          .slice()
          .sort(
            (left, right) =>
              left.posture -
              right.posture
          )[0]
      );
    }

    function combatFatiguePenalty() {
      if (!combat) return 0;

      return Math.floor(
        combat.player.fatigue / 2
      );
    }

    function gainFatigue(amount) {
      combat.player.fatigue =
        clamp(
          combat.player.fatigue + amount,
          0,
          FATIGUE_MAX
        );
    }

    function combatWoundPenalty(combatant) {
      let penalty = 0;

      combatant.wounds.forEach(wound => {
        if (wound.severity === "輕傷") {
          penalty += 1;
        }

        if (wound.severity === "重傷") {
          penalty += 3;
        }

        if (wound.severity === "致命傷") {
          penalty += 6;
        }
      });

      if (
        combatant.stamina <=
        combatant.maxStamina * 0.25
      ) {
        penalty += 2;
      } else if (
        combatant.stamina <=
        combatant.maxStamina * 0.5
      ) {
        penalty += 1;
      }

      return penalty;
    }

    function defenceOf(combatant, extra = 0) {
      return (
        12 +
        abilityModifier(
          combatant.abilities.agility
        ) +
        skillModifier(
          combatant.skills.dueling || 0
        ) +
        (
          combatant.guarded
            ? 3
            : 0
        ) +
        extra -
        combatWoundPenalty(combatant) -
        (
          combatant.posture <= 0
            ? 3
            : 0
        )
      );
    }

    function rollD20(
      advantage = false,
      disadvantage = false
    ) {
      const first = die(20);

      if (
        advantage &&
        !disadvantage
      ) {
        const second = die(20);

        return {
          value:
            Math.max(first, second),
          dice: [first, second],
          mode: "優勢"
        };
      }

      if (
        disadvantage &&
        !advantage
      ) {
        const second = die(20);

        return {
          value:
            Math.min(first, second),
          dice: [first, second],
          mode: "劣勢"
        };
      }

      return {
        value: first,
        dice: [first],
        mode: "正常"
      };
    }

    function attackRoll(
      attacker,
      defender,
      options = {}
    ) {
      const weapon =
        attacker.weapon;

      const roll =
        rollD20(
          Boolean(options.advantage),
          Boolean(options.disadvantage)
        );

      const ability =
        abilityModifier(
          attacker.abilities[
            weapon.ability
          ]
        );

      const skill =
        skillModifier(
          attacker.skills[
            weapon.skill
          ]
        );

      const fatigue =
        attacker === combat.player
          ? combatFatiguePenalty()
          : 0;

      const injury =
        combatWoundPenalty(attacker);

      const situation =
        options.situation || 0;

      const total =
        roll.value +
        ability +
        skill +
        weapon.accuracy +
        situation -
        fatigue -
        injury;

      const defence =
        defenceOf(
          defender,
          options.defenceModifier || 0
        );

      const success =
        roll.value !== 1 &&
        (
          roll.value === 20 ||
          total >= defence
        );

      return {
        roll,
        ability,
        skill,
        weaponBonus:
          weapon.accuracy,

        fatigue,
        injury,
        situation,
        total,
        defence,
        success,

        margin:
          total - defence,

        critical:
          roll.value === 20,

        disaster:
          roll.value === 1
      };
    }

    function attackLine(label, result) {
      return (
        `${label}：${result.roll.mode} d20［` +
        `${result.roll.dice.join("、")}］ ` +
        `${signed(result.ability)} 能力 ` +
        `${signed(result.skill)} 武技 ` +
        `${signed(result.weaponBonus)} 兵器 ` +
        `${signed(result.situation)} 戰況 ` +
        `${signed(-result.injury)} 傷勢 ` +
        `${signed(-result.fatigue)} 疲勞 ` +
        `= ${result.total}，對抗 ${result.defence}`
      );
    }

    function resultLine(result) {
      if (result.disaster) {
        return "結果：大失敗";
      }

      if (!result.success) {
        return "結果：失敗";
      }

      if (result.critical) {
        return "結果：大成功";
      }

      if (result.margin >= 5) {
        return "結果：強成功";
      }

      return "結果：成功";
    }

    function effectRoll(
      sides,
      critical = false
    ) {
      const dice = [die(sides)];

      if (critical) {
        dice.push(die(sides));
      }

      return {
        dice,
        total:
          dice.reduce(
            (sum, value) =>
              sum + value,
            0
          )
      };
    }

    function addWound(target, severity) {
      const names = {
        輕傷: [
          "手臂割傷",
          "肩背裂傷",
          "肋側刀傷"
        ],
        重傷: [
          "持兵手重傷",
          "大腿深創",
          "腹側重創"
        ],
        致命傷: [
          "胸腹致命傷",
          "大量失血",
          "頸側致命傷"
        ]
      };

      const list =
        names[severity];

      const wound = {
        severity,
        name:
          list[
            die(list.length) - 1
          ]
      };

      target.wounds.push(wound);

      if (severity === "重傷") {
        target.defeated = true;
      }

      if (severity === "致命傷") {
        target.defeated = true;
        target.dead = true;
      }

      const lightCount =
        target.wounds.filter(
          item =>
            item.severity === "輕傷"
        ).length;

      if (lightCount >= 2) {
        target.defeated = true;
      }

      return wound;
    }

    function resolveImpact(
      attacker,
      defender,
      attackResult,
      options = {}
    ) {
      const effect =
        effectRoll(
          options.damageSides ||
          attacker.weapon.damageSides,
          attackResult.critical
        );

      const raw =
        effect.total +
        Math.max(
          0,
          abilityModifier(
            attacker.abilities.might
          )
        ) +
        (
          options.styleBonus || 0
        ) +
        Math.max(
          0,
          Math.floor(
            attackResult.margin / 5
          )
        );

      const mitigation =
        Math.max(
          0,
          defender.armour.mitigation -
          (
            attacker.weapon.piercing ||
            0
          )
        );

      const impact =
        Math.max(
          1,
          raw - mitigation
        );

      defender.posture =
        Math.max(
          0,
          defender.posture - impact
        );

      const ratio =
        defender.posture /
        defender.maxPosture;

      let wound = null;
      let woundRoll = null;

      if (
        attackResult.critical ||
        ratio <= 0.3 ||
        (
          ratio <= 0.6 &&
          attackResult.margin >= 5
        )
      ) {
        const roll =
          die(20);

        const vulnerability =
          ratio <= 0
            ? 6
            : ratio <= 0.3
              ? 4
              : 2;

        const total =
          roll +
          Math.floor(impact / 2) +
          vulnerability -
          abilityModifier(
            defender.abilities.endurance
          ) -
          (
            defender.armour
              .woundProtection || 0
          );

        woundRoll = {
          roll,
          total
        };

        let severity = null;

        if (total >= 25) {
          severity = "致命傷";
        } else if (total >= 20) {
          severity = "重傷";
        } else if (total >= 15) {
          severity = "輕傷";
        }

        if (severity) {
          wound =
            addWound(
              defender,
              severity
            );
        }
      }

      return {
        effect,
        raw,
        mitigation,
        impact,
        woundRoll,
        wound
      };
    }

    function impactLines(label, result) {
      const lines = [
        `${label}衝擊：［${result.effect.dice.join("、")}］，總衝擊 ${result.raw}`,
        `護甲抵消 ${result.mitigation}；造成 ${result.impact} 點架勢損失`
      ];

      if (result.woundRoll) {
        lines.push(
          `傷勢判定：d20［${result.woundRoll.roll}］，總值 ${result.woundRoll.total}`
        );
      }

      if (result.wound) {
        lines.push(
          `造成傷勢：${result.wound.name}（${result.wound.severity}）`
        );
      }

      return lines;
    }

    function repetitionPenalty(action) {
      const player =
        combat.player;

      if (
        player.lastAction !== action
      ) {
        player.lastAction = action;
        player.repeatCount = 1;
        return 0;
      }

      player.repeatCount += 1;

      if (
        player.weapon.key === "blade"
      ) {
        if (player.repeatCount === 2) {
          return 0;
        }

        if (player.repeatCount === 3) {
          return -1;
        }

        return -3;
      }

      if (player.repeatCount === 2) {
        return -1;
      }

      if (player.repeatCount === 3) {
        return -3;
      }

      return -5;
    }

    function crowdPressure() {
      const living =
        livingEnemies().length;

      let pressure =
        combat.terrain.pressure;

      if (living >= 3) pressure += 1;
      if (living >= 6) pressure += 1;
      if (living >= 10) pressure += 1;

      return clamp(
        pressure,
        0,
        5
      );
    }

    function spendStamina(
      combatant,
      amount
    ) {
      combatant.stamina =
        Math.max(
          0,
          combatant.stamina - amount
        );
    }

    function finishEnemy(enemy, executed = false) {
      if (!enemy.defeated) return;

      enemy.position = "down";

      let moraleLoss =
        executed ? 20 : 13;

      if (enemy.dead) {
        moraleLoss += 5;
      }

      if (enemy.leader) {
        moraleLoss += 25;
      }

      combat.morale =
        Math.max(
          0,
          combat.morale - moraleLoss
        );

      combat.initiative =
        clamp(
          combat.initiative + 1,
          -2,
          2
        );
    }

    function playerAttack(type) {
      const player =
        combat.player;

      const target =
        currentTarget();

      if (!target) return;

      const paragraphs = [];
      const lines = [];

      let label = "快攻";
      let staminaCost = 1;
      let situation =
        combat.initiative;
      let styleBonus = 0;

      situation +=
        repetitionPenalty(type);

      if (type === "heavy") {
        label = "猛擊";
        staminaCost = 4;
        situation -= 1;
        styleBonus = 4;
        gainFatigue(
          1 +
          (
            player.weapon.heavyFatigue ||
            0
          )
        );
      }

      if (type === "pressure") {
        label = "迫攻";
        staminaCost = 3;
      }

      spendStamina(
        player,
        staminaCost
      );

      const result =
        attackRoll(
          player,
          target,
          {
            situation,
            advantage:
              player.opening ||
              player.focus >= 3
          }
        );

      lines.push(
        attackLine(label, result),
        resultLine(result)
      );

      player.opening = false;
      player.focus = 0;

      if (!result.success) {
        combat.initiative =
          clamp(
            combat.initiative -
            (
              result.disaster
                ? 2
                : 1
            ),
            -2,
            2
          );

        paragraphs.push(
          result.disaster
            ? "你踏步失衡，前線敵人立即由兩側壓近。"
            : `${label}未能越過${target.name}嘅防守。`
        );

        enemyPhase(
          paragraphs,
          lines,
          result.disaster ? 2 : 0
        );

        return;
      }

      if (type === "pressure") {
        const effect =
          effectRoll(
            6,
            result.critical
          );

        const amount =
          effect.total +
          Math.max(
            0,
            abilityModifier(
              player.abilities.might
            )
          );

        target.posture =
          Math.max(
            0,
            target.posture - amount
          );

        target.stamina =
          Math.max(
            0,
            target.stamina - 2
          );

        lines.push(
          `迫攻效果：d6［${effect.dice.join("、")}］，造成 ${amount} 點架勢損失`
        );
      } else {
        const impact =
          resolveImpact(
            player,
            target,
            result,
            {
              styleBonus
            }
          );

        lines.push(
          ...impactLines(
            label,
            impact
          )
        );

        if (impact.wound) {
          paragraphs.push(
            `你造成「${impact.wound.name}」。`
          );
        }
      }

      if (
        target.posture <= 0 &&
        (
          result.critical ||
          result.margin >= 5
        )
      ) {
        target.exposed = true;

        paragraphs.push(
          `${target.name}架勢崩潰，致命空門一閃而過。`
        );
      }

      if (type === "heavy") {
        combat.retreatGap = true;
      }

      if (target.defeated) {
        finishEnemy(target);

        paragraphs.push(
          `${target.name}失去戰鬥能力。`
        );

        fillFrontline(paragraphs);
      }

      if (result.margin >= 5) {
        combat.initiative =
          clamp(
            combat.initiative + 1,
            -2,
            2
          );
      }

      if (checkCombatEnd(paragraphs, lines)) {
        return;
      }

      enemyPhase(paragraphs, lines);
    }

    function playerSweep() {
      const player =
        combat.player;

      const targets =
        frontEnemies()
          .slice(
            0,
            player.weapon.key === "polearm"
              ? 3
              : 2
          );

      const paragraphs = [
        "你扭腰轉步，以兵刃橫掃整段前線。"
      ];

      const lines = [];

      spendStamina(player, 5);
      gainFatigue(
        player.weapon.key === "polearm"
          ? 2
          : 1
      );

      targets.forEach((target, index) => {
        const result =
          attackRoll(
            player,
            target,
            {
              situation:
                combat.initiative -
                2 +
                player.weapon.sweepBonus -
                index * 3,

              disadvantage:
                player.weapon.key ===
                "spear"
            }
          );

        lines.push(
          attackLine(
            `橫掃・${target.name}`,
            result
          ),
          resultLine(result)
        );

        if (!result.success) return;

        const impact =
          resolveImpact(
            player,
            target,
            result,
            {
              damageSides:
                player.weapon.key ===
                  "polearm"
                  ? 8
                  : 6,

              styleBonus:
                player.weapon.key ===
                  "polearm"
                  ? 2
                  : 0
            }
          );

        lines.push(
          ...impactLines(
            `橫掃・${target.name}`,
            impact
          )
        );

        if (target.defeated) {
          finishEnemy(target);
        }
      });

      combat.retreatGap = true;
      fillFrontline(paragraphs);

      if (checkCombatEnd(paragraphs, lines)) {
        return;
      }

      enemyPhase(paragraphs, lines, 1);
    }

    function playerDefend() {
      const player =
        combat.player;

      const paragraphs = [
        "你收緊架勢，守住真正可以進入要害嘅方向。"
      ];

      const lines = [];

      player.guarded = true;
      spendStamina(player, 1);

      const outcomes =
        enemyPhase(
          paragraphs,
          lines,
          0,
          true
        );

      if (
        !combat ||
        combat.phase !== "battle"
      ) {
        return;
      }

      const missed =
        outcomes
          ? outcomes.find(
              outcome =>
                outcome &&
                !outcome.hit
            )
          : null;

      if (missed) {
        const result =
          attackRoll(
            player,
            missed.enemy,
            {
              situation:
                combat.initiative +
                2 +
                (
                  player.weapon
                    .counterBonus || 0
                )
            }
          );

        lines.push(
          attackLine(
            "守後反擊",
            result
          ),
          resultLine(result)
        );

        if (result.success) {
          const impact =
            resolveImpact(
              player,
              missed.enemy,
              result,
              {
                styleBonus: 1
              }
            );

          lines.push(
            ...impactLines(
              "守後反擊",
              impact
            )
          );

          if (
            missed.enemy.defeated
          ) {
            finishEnemy(
              missed.enemy
            );

            fillFrontline(
              paragraphs
            );
          }
        }
      }

      const wasHit =
        outcomes
          ? outcomes.some(
              outcome =>
                outcome.hit
            )
          : false;

      if (!wasHit) {
        combat.retreatGap = true;

        paragraphs.push(
          "你守住攻勢之餘，身後出現一段退路空隙。"
        );
      }

      player.guarded = false;

      if (checkCombatEnd(paragraphs, lines)) {
        return;
      }

      finishCombatRound(paragraphs, lines);
    }

    function playerObserve() {
      const player =
        combat.player;

      const roll = die(20);

      const total =
        roll +
        abilityModifier(
          player.abilities.perception
        ) +
        skillModifier(
          player.skills.awareness
        ) +
        combat.initiative -
        Math.floor(
          crowdPressure() / 2
        ) -
        combatFatiguePenalty();

      const difficulty =
        13 +
        Math.floor(
          livingEnemies().length / 6
        );

      const success =
        roll !== 1 &&
        (
          roll === 20 ||
          total >= difficulty
        );

      const lines = [
        `觀察：d20［${roll}］，總值 ${total}，對抗 ${difficulty}`,
        success
          ? "結果：成功"
          : "結果：失敗"
      ];

      const paragraphs = [];

      spendStamina(player, 1);

      if (success) {
        player.focus =
          roll === 20 ? 4 : 3;

        combat.initiative =
          clamp(
            combat.initiative + 1,
            -2,
            2
          );

        paragraphs.push(
          "你逐漸睇出前線補位、呼吸同兵刃互相阻礙嘅規律。"
        );
      } else {
        player.focus = 0;

        combat.initiative =
          clamp(
            combat.initiative - 1,
            -2,
            2
          );

        paragraphs.push(
          "叫喊、人影同兵刃互相交錯，你未能分清真正威脅。"
        );
      }

      enemyPhase(
        paragraphs,
        lines,
        success ? -1 : 1
      );
    }

    function playerFeint() {
      const player =
        combat.player;

      const target =
        currentTarget();

      if (!target) return;

      const roll = die(20);

      const total =
        roll +
        abilityModifier(
          player.abilities.agility
        ) +
        skillModifier(
          player.skills.dueling
        ) +
        combat.initiative -
        combatFatiguePenalty();

      const difficulty =
        13 +
        abilityModifier(
          target.abilities.perception
        ) +
        Math.max(
          0,
          skillModifier(
            target.skills.dueling
          )
        );

      const success =
        roll !== 1 &&
        (
          roll === 20 ||
          total >= difficulty
        );

      const lines = [
        `佯攻：d20［${roll}］，總值 ${total}，對抗 ${difficulty}`,
        success
          ? "結果：成功"
          : "結果：失敗"
      ];

      const paragraphs = [];

      spendStamina(player, 2);

      if (success) {
        target.posture =
          Math.max(
            0,
            target.posture - 3
          );

        target.exposed = true;
        player.opening = true;

        combat.initiative =
          clamp(
            combat.initiative + 1,
            -2,
            2
          );

        paragraphs.push(
          `你以假動作牽開${target.name}嘅防守。`
        );
      } else {
        combat.initiative =
          clamp(
            combat.initiative - 1,
            -2,
            2
          );

        paragraphs.push(
          `${target.name}冇被假動作騙開。`
        );
      }

      enemyPhase(paragraphs, lines);
    }

    function playerRecover() {
      const player =
        combat.player;

      const roll = die(6);

      const recovery =
        Math.max(
          1,
          roll +
          Math.max(
            0,
            abilityModifier(
              player.abilities.endurance
            )
          ) -
          Math.floor(
            crowdPressure() / 2
          )
        );

      const oldPosture =
        player.posture;

      player.posture =
        Math.min(
          player.maxPosture,
          player.posture + recovery
        );

      const staminaGain =
        Math.max(
          0,
          3 -
          Math.floor(
            player.fatigue / 2
          )
        );

      player.stamina =
        Math.min(
          player.maxStamina,
          player.stamina +
          staminaGain
        );

      if (player.fatigue > 0) {
        player.fatigue -= 1;
      }

      const lines = [
        `重整：d6［${roll}］，恢復 ${player.posture - oldPosture} 架勢、${staminaGain} 體力`
      ];

      enemyPhase(
        ["你拉開半步調整呼吸。"],
        lines,
        2
      );
    }

    function playerBreakout() {
      const player =
        combat.player;

      const roll = die(20);

      const gapBonus =
        combat.retreatGap
          ? 3
          : 0;

      const spearBonus =
        player.weapon.breakoutBonus ||
        0;

      const pressure =
        crowdPressure();

      const total =
        roll +
        abilityModifier(
          player.abilities.agility
        ) +
        skillModifier(
          player.skills.awareness
        ) +
        combat.initiative +
        gapBonus +
        spearBonus -
        Math.floor(
          pressure / 2
        ) -
        combatFatiguePenalty();

      const difficulty =
        13 +
        combat.terrain
          .escapeDifficulty +
        Math.floor(
          pressure / 2
        );

      const success =
        roll !== 1 &&
        (
          roll === 20 ||
          total >= difficulty
        );

      const margin =
        total - difficulty;

      const lines = [
        `突圍：d20［${roll}］，總值 ${total}，對抗 ${difficulty}`,
        success
          ? "結果：成功"
          : "結果：失敗"
      ];

      const paragraphs = [];

      spendStamina(player, 3);
      combat.retreatGap = false;

      if (success) {
        combat.escapeProgress +=
          margin >= 5 ||
          roll === 20
            ? 2
            : 1;

        paragraphs.push(
          "你逼退正面敵人，沿地形打開一段退路。"
        );

        if (
          combat.escapeProgress >=
          combat.escapeTarget
        ) {
          finishCombat(
            "escape",
            [
              ...paragraphs,
              "你把握缺口衝出包圍，冇再留喺原地同全部敵人死戰。"
            ],
            lines
          );

          return;
        }
      } else {
        combat.initiative =
          clamp(
            combat.initiative - 1,
            -2,
            2
          );

        paragraphs.push(
          "敵人互相補位，將你逼回原來位置。"
        );
      }

      enemyPhase(paragraphs, lines);
    }

    function playerIntimidate() {
      const player =
        combat.player;

      const defeatedCount =
        combat.enemies.filter(
          enemy =>
            enemy.defeated
        ).length;

      const leaderDown =
        !combat.enemies.some(
          enemy =>
            enemy.leader &&
            !enemy.defeated &&
            !enemy.fled
        );

      const roll = die(20);

      const total =
        roll +
        abilityModifier(
          player.abilities.will
        ) +
        defeatedCount * 3 +
        (
          leaderDown ? 5 : 0
        ) +
        combat.initiative;

      const difficulty =
        15 +
        Math.floor(
          livingEnemies().length / 5
        );

      const success =
        roll !== 1 &&
        (
          roll === 20 ||
          total >= difficulty
        );

      const lines = [
        `威震群敵：d20［${roll}］，總值 ${total}，對抗 ${difficulty}`,
        success
          ? "結果：成功"
          : "結果：失敗"
      ];

      if (success) {
        combat.morale =
          Math.max(
            0,
            combat.morale -
            (
              8 +
              defeatedCount * 5 +
              (
                leaderDown ? 10 : 0
              )
            )
          );
      } else {
        combat.morale =
          Math.min(
            100,
            combat.morale + 4
          );
      }

      if (checkMoraleCollapse()) {
        finishCombat(
          "win",
          [
            "餘下敵人再維持唔住陣勢，轉身逃離戰場。"
          ],
          lines
        );

        return;
      }

      enemyPhase(
        [
          success
            ? "你以兵刃指向餘下敵人，佢哋嘅腳步明顯遲疑。"
            : "敵人以叫罵互相壯膽，暫時冇人後退。"
        ],
        lines
      );
    }

    function playerExecute() {
      const target =
        frontEnemies().find(
          enemy =>
            enemy.posture <= 0 &&
            enemy.exposed
        );

      if (!target) return;

      const player =
        combat.player;

      spendStamina(player, 3);
      gainFatigue(1);

      const result =
        attackRoll(
          player,
          target,
          {
            advantage: true,
            situation:
              combat.initiative +
              2 +
              (
                player.weapon
                  .executeBonus || 0
              )
          }
        );

      const lines = [
        attackLine(
          "決死斬擊",
          result
        )
      ];

      target.exposed = false;

      if (result.success) {
        if (
          result.critical ||
          result.margin >= 6
        ) {
          target.defeated = true;
          target.dead = true;
          addWound(
            target,
            "致命傷"
          );

          lines.push(
            "結果：致命一擊"
          );
        } else {
          target.defeated = true;
          addWound(
            target,
            "重傷"
          );

          lines.push(
            "結果：重傷擊敗"
          );
        }

        finishEnemy(target, true);
        fillFrontline([]);

        if (checkCombatEnd([], lines)) {
          return;
        }

        enemyPhase(
          [
            `${target.name}喺決死一擊之下倒地，旁邊敵人一時失聲。`
          ],
          lines
        );

        return;
      }

      lines.push(
        result.disaster
          ? "結果：大失敗"
          : "結果：失敗"
      );

      combat.initiative = -2;

      enemyPhase(
        [
          "你踏入斬殺線，但對方喺最後一刻避開。其他敵人立即由側面壓入。"
        ],
        lines,
        result.disaster ? 4 : 2
      );
    }

    function playerSweepPlaceholder() {
      playerSweep();
    }

    function enemyAttack(enemy, bonus = 0) {
      const player =
        combat.player;

      let type = "quick";
      const selector = random();

      if (selector >= 0.78) {
        type = "heavy";
      } else if (selector >= 0.55) {
        type = "pressure";
      }

      let label =
        `${enemy.name}快攻`;

      let situation =
        -combat.initiative +
        Math.floor(
          crowdPressure() / 2
        ) +
        bonus;

      let styleBonus = 0;
      let staminaCost = 1;

      if (type === "heavy") {
        label =
          `${enemy.name}猛擊`;
        situation -= 1;
        styleBonus = 2;
        staminaCost = 3;
      }

      if (type === "pressure") {
        label =
          `${enemy.name}迫攻`;
        staminaCost = 2;
      }

      if (enemy.leader) {
        situation += 1;
      }

      if (
        player.weapon.key === "spear" &&
        (
          reserveEnemies().length > 0 ||
          frontEnemies().length > 1
        )
      ) {
        situation -=
          player.weapon.reachControl;
      }

      spendStamina(
        enemy,
        staminaCost
      );

      const result =
        attackRoll(
          enemy,
          player,
          { situation }
        );

      const lines = [
        attackLine(label, result),
        resultLine(result)
      ];

      const paragraphs = [];

      if (!result.success) {
        paragraphs.push(
          player.guarded
            ? `你將${enemy.name}嘅攻勢引向空處。`
            : `${enemy.name}嘅兵刃擦身而過。`
        );

        if (result.disaster) {
          enemy.exposed = true;
        }

        return {
          enemy,
          hit: false,
          lines,
          paragraphs
        };
      }

      if (type === "pressure") {
        const effect =
          effectRoll(
            6,
            result.critical
          );

        const amount =
          effect.total +
          Math.max(
            0,
            abilityModifier(
              enemy.abilities.might
            )
          );

        player.posture =
          Math.max(
            0,
            player.posture - amount
          );

        player.stamina =
          Math.max(
            0,
            player.stamina - 1
          );

        lines.push(
          `迫攻造成 ${amount} 點架勢損失`
        );
      } else {
        const impact =
          resolveImpact(
            enemy,
            player,
            result,
            {
              styleBonus
            }
          );

        lines.push(
          ...impactLines(
            label,
            impact
          )
        );
      }

      return {
        enemy,
        hit: true,
        lines,
        paragraphs
      };
    }

    function enemyPhase(
      paragraphs,
      lines,
      bonus = 0,
      returnOnly = false
    ) {
      const outcomes = [];

      const attackers =
        frontEnemies().slice(0, 2);

      attackers.forEach(enemy => {
        if (combat.player.defeated) {
          return;
        }

        const outcome =
          enemyAttack(
            enemy,
            bonus
          );

        outcomes.push(outcome);

        paragraphs.push(
          ...outcome.paragraphs
        );

        lines.push(
          ...outcome.lines
        );
      });

      if (
        reserveEnemies().length > 0 &&
        !combat.player.defeated
      ) {
        const roll = die(20);

        const total =
          roll +
          Math.min(
            3,
            Math.ceil(
              reserveEnemies().length / 4
            )
          ) +
          combat.terrain.pressure +
          bonus;

        const defence =
          13 +
          abilityModifier(
            combat.player
              .abilities.perception
          ) +
          skillModifier(
            combat.player
              .skills.awareness
          ) +
          (
            combat.player.guarded
              ? 2
              : 0
          );

        lines.push(
          `後排壓力：d20［${roll}］，總值 ${total}，對抗 ${defence}`
        );

        if (
          roll !== 1 &&
          (
            roll === 20 ||
            total >= defence
          )
        ) {
          const loss =
            die(4) + 1;

          combat.player.posture =
            Math.max(
              0,
              combat.player.posture -
              loss
            );

          combat.player.stamina =
            Math.max(
              0,
              combat.player.stamina - 1
            );

          paragraphs.push(
            `後排投石同長兵干擾令你額外失去 ${loss} 點架勢。`
          );
        }
      }

      if (returnOnly) {
        if (checkCombatEnd(paragraphs, lines)) {
          return null;
        }

        return outcomes;
      }

      combat.player.guarded = false;

      if (checkCombatEnd(paragraphs, lines)) {
        return outcomes;
      }

      finishCombatRound(paragraphs, lines);
      return outcomes;
    }

    function checkMoraleCollapse() {
      if (combat.morale <= 0) {
        livingEnemies().forEach(enemy => {
          enemy.fled = true;
          enemy.position = "fled";
        });

        return true;
      }

      if (combat.morale <= 20) {
        const roll = die(20);

        if (
          roll +
          Math.floor(
            combat.morale / 10
          ) <
          12
        ) {
          livingEnemies().forEach(enemy => {
            enemy.fled = true;
            enemy.position = "fled";
          });

          return true;
        }
      }

      return false;
    }

    function checkCombatEnd(
      paragraphs,
      lines
    ) {
      if (
        !combat ||
        combat.phase !== "battle"
      ) {
        return false;
      }

      if (combat.player.defeated) {
        finishCombat(
          "defeat",
          [
            ...paragraphs,
            combat.player.dead
              ? "你受到致命傷，戰場聲音逐漸遠去。"
              : "你重傷倒地，已經無法繼續戰鬥。"
          ],
          lines
        );

        return true;
      }

      if (
        livingEnemies().length === 0
      ) {
        finishCombat(
          "win",
          [
            ...paragraphs,
            "餘下敵人全部倒下或逃走。"
          ],
          lines
        );

        return true;
      }

      if (checkMoraleCollapse()) {
        finishCombat(
          "win",
          [
            ...paragraphs,
            "敵方士氣崩潰，餘眾四散逃命。"
          ],
          lines
        );

        return true;
      }

      return false;
    }

    function finishCombatRound(
      paragraphs,
      lines
    ) {
      fillFrontline(paragraphs);

      combat.round += 1;

      if (
        combat.round >= 8 &&
        (
          combat.round - 8
        ) % 4 === 0
      ) {
        gainFatigue(1);
      }

      if (combat.round >= 8) {
        combat.player.stamina =
          Math.max(
            0,
            combat.player.stamina - 1
          );

        paragraphs.push(
          "長時間受圍令呼吸逐漸沉重。"
        );
      }

      combat.turnBrief =
        paragraphs[
          paragraphs.length - 1
        ] ||
        "戰況持續。";

      setCombatScene(
        `戰場交鋒・第 ${combat.round} 合`,
        paragraphs,
        lines
      );
    }

    function finishCombat(
      outcome,
      paragraphs,
      lines
    ) {
      combat.phase = "ending";

      game.wounds =
        clone(
          combat.player.wounds
        );

      const callbacks =
        combat.callbacks;

      const resultData = {
        outcome,
        round:
          combat.round,

        defeated:
          combat.enemies.filter(
            enemy =>
              enemy.defeated
          ).length,

        dead:
          combat.enemies.filter(
            enemy =>
              enemy.dead
          ).length,

        fled:
          combat.enemies.filter(
            enemy =>
              enemy.fled
          ).length,

        fatigue:
          combat.player.fatigue
      };

      document.getElementById("actionTray").hidden = true;

      setNarrativeScene(
        outcome === "win"
          ? "戰鬥得勝"
          : outcome === "escape"
            ? "成功脫離"
            : "戰鬥失利",
        [
          ...paragraphs,
          `戰鬥喺第 ${combat.round} 合結束。`,
          `傷勢：${woundSummary(game.wounds)}。`
        ],
        [
          {
            label: "承受戰後結果",
            handler: () => {
              if (
                outcome === "win" &&
                callbacks.win
              ) {
                callbacks.win(resultData);
                return;
              }

              if (
                outcome === "escape" &&
                callbacks.escape
              ) {
                callbacks.escape(resultData);
                return;
              }

              if (
                callbacks.defeat
              ) {
                callbacks.defeat(resultData);
              }
            }
          }
        ]
      );
    }

    function canExecute() {
      return Boolean(
        combat &&
        combat.phase === "battle" &&
        frontEnemies().some(
          enemy =>
            enemy.posture <= 0 &&
            enemy.exposed
        )
      );
    }

    function combatActions() {
      if (
        !combat ||
        combat.phase !== "battle"
      ) {
        return [];
      }

      const player =
        combat.player;

      return [
        {
          tab: "attack",
          label: "快攻",
          note: "快速攻擊當前最虛弱敵人。",
          handler: () =>
            playerAttack("quick")
        },
        {
          tab: "attack",
          label: "猛擊",
          note: "高衝擊，會增加疲勞。",
          className: "danger",
          disabled:
            player.stamina < 4,
          handler: () =>
            playerAttack("heavy")
        },
        {
          tab: "attack",
          label: "迫攻",
          note: "削減架勢同體力。",
          disabled:
            player.stamina < 3,
          handler: () =>
            playerAttack("pressure")
        },
        {
          tab: "attack",
          label: "橫掃",
          note: "同時攻擊多名前線敵人。",
          className: "danger",
          disabled:
            player.stamina < 5 ||
            frontEnemies().length < 2,
          handler:
            playerSweepPlaceholder
        },
        {
          tab: "attack",
          label: "決死斬擊",
          note: "把握致命空門。",
          className: "execution",
          disabled:
            !canExecute(),
          handler:
            playerExecute
        },

        {
          tab: "response",
          label: "防守反擊",
          note: "守住攻勢並尋找反擊機會。",
          className: "safe",
          handler:
            playerDefend
        },
        {
          tab: "response",
          label: "重整",
          note: "恢復架勢同少量體力。",
          className: "safe",
          handler:
            playerRecover
        },
        {
          tab: "response",
          label: "觀察",
          note: "掌握敵人補位同攻擊節奏。",
          className: "info",
          handler:
            playerObserve
        },
        {
          tab: "response",
          label: "佯攻",
          note: "牽開當前敵人防守。",
          handler:
            playerFeint
        },

        {
          tab: "tactic",
          label: "突圍",
          note: "逐步打開退路。",
          className: "safe",
          handler:
            playerBreakout
        },
        {
          tab: "tactic",
          label: "威震群敵",
          note: "以戰果打擊群體士氣。",
