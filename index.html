          handler:
            playerIntimidate
        }
      ];
    }

    function tutorialText() {
      if (
        !combat ||
        !combat.tutorial
      ) {
        return "";
      }

      if (combat.round === 1) {
        return (
          "先觀察自己同敵人嘅架勢。直接攻擊可以推進戰況，" +
          "但唔同行動嘅風險、體力消耗同結果並不相同。"
        );
      }

      if (combat.round === 2) {
        return (
          "敵人架勢降低後，更容易受到真正傷勢。" +
          "強成功、大成功同致命空門尤其重要。"
        );
      }

      if (combat.round === 3) {
        return (
          "如果敵人架勢崩潰兼露出空門，決死斬擊會解鎖。" +
          "失敗時會令自己暴露。"
        );
      }

      if (combat.round === 4) {
        return (
          "多人戰唔一定要殺清所有人。你可以削弱士氣，" +
          "亦可以利用防守或猛擊製造空隙，再嘗試突圍。"
        );
      }

      return "";
    }

    function setCombatScene(
      heading,
      paragraphs,
      lines = []
    ) {
      document.getElementById("storyHeading").textContent = heading;

      document.getElementById("storyText").innerHTML =
        paragraphs
          .map(paragraph => `<p>${escapeHtml(paragraph)}</p>`)
          .join("");

      const hint =
        tutorialText();

      document.getElementById("tutorialArea").innerHTML =
        hint
          ? `
            <div class="tutorial-hint">
              <strong>戰場領悟：</strong>
              ${escapeHtml(hint)}
            </div>
          `
          : "";

      renderCombatSummary();
      renderEnemyFocus();
      renderCombatLog(lines);
      renderCombatActions();
      renderHud();

      document.getElementById("actionTray").hidden = false;
    }

    function renderCombatSummary() {
      if (!combat) return;

      const leaderActive =
        combat.enemies.some(
          enemy =>
            enemy.leader &&
            !enemy.defeated &&
            !enemy.fled
        );

      document.getElementById("summaryArea").innerHTML = `
        <div class="battle-summary">
          <div class="summary-grid">
            <div><strong>前線：</strong>${frontEnemies().length}</div>
            <div><strong>後排：</strong>${reserveEnemies().length}</div>
            <div><strong>仍可戰：</strong>${livingEnemies().length}</div>
            <div><strong>敵方士氣：</strong>${combat.morale}</div>
            <div><strong>突圍：</strong>${combat.escapeProgress}/${combat.escapeTarget}</div>
            <div><strong>頭領：</strong>${leaderActive ? "仍在" : "已失去作用"}</div>
          </div>
        </div>
      `;
    }

    function renderEnemyFocus() {
      const target =
        currentTarget();

      if (!target) {
        document.getElementById("enemyArea").innerHTML = "";
        return;
      }

      const posturePercent =
        clamp(
          target.posture /
          target.maxPosture *
          100,
          0,
          100
        );

      const staminaPercent =
        clamp(
          target.stamina /
          target.maxStamina *
          100,
          0,
          100
        );

      document.getElementById("enemyArea").innerHTML = `
        <div class="enemy-focus ${target.leader ? "leader" : ""}">
          <div class="enemy-focus-header">
            <strong>
              ${escapeHtml(target.name)}
              ${target.leader ? "【頭領】" : ""}
            </strong>

            <span>
              ${
                target.exposed &&
                target.posture <= 0
                  ? "致命空門"
                  : target.posture <= 0
                    ? "架勢崩潰"
                    : "前線交鋒"
              }
            </span>
          </div>

          <div class="hud-meter-header">
            <span>架勢</span>
            <span>${target.posture}/${target.maxPosture}</span>
          </div>

          <div class="meter-track">
            <div
              class="meter-fill enemy-fill"
              style="width:${posturePercent}%"
            ></div>
          </div>

          <div class="hud-meter-header" style="margin-top:6px">
            <span>體力</span>
            <span>${target.stamina}/${target.maxStamina}</span>
          </div>

          <div class="meter-track">
            <div
              class="meter-fill stamina-fill"
              style="width:${staminaPercent}%"
            ></div>
          </div>

          <div class="enemy-mini-status">
            傷勢：${escapeHtml(woundSummary(target.wounds))}
          </div>
        </div>

        <details>
          <summary>查看完整敵方狀況</summary>

          <div class="details-body">
            ${combat.enemies
              .map(enemy => {
                let status = "後排";

                if (enemy.position === "front") status = "前線";
                if (enemy.fled) status = "已逃走";
                if (enemy.defeated) {
                  status = enemy.dead
                    ? "死亡"
                    : "倒地";
                }

                return (
                  `${escapeHtml(enemy.name)}：` +
                  `${status}・架勢 ${enemy.posture}/${enemy.maxPosture}` +
                  `<br>`
                );
              })
              .join("")}
          </div>
        </details>
      `;
    }

    function renderCombatLog(lines) {
      if (!lines || lines.length === 0) {
        document.getElementById("rollArea").innerHTML = "";
        return;
      }

      document.getElementById("rollArea").innerHTML = `
        <details>
          <summary>查看今合骰局紀錄</summary>

          <div class="details-body">
            ${lines
              .map(line => {
                let className = "";

                if (
                  line.includes("結果：成功") ||
                  line.includes("結果：強成功") ||
                  line.includes("結果：大成功") ||
                  line.includes("結果：致命")
                ) {
                  className = "success-line";
                }

                if (
                  line.includes("結果：失敗") ||
                  line.includes("結果：大失敗")
                ) {
                  className = "failure-line";
                }

                return (
                  `<div class="roll-line ${className}">` +
                  `${escapeHtml(line)}` +
                  `</div>`
                );
              })
              .join("")}
          </div>
        </details>
      `;
    }

    function renderCombatActions() {
      const container =
        document.getElementById("combatActions");

      container.innerHTML = "";
      buttonsLocked = false;

      const actions =
        combatActions().filter(
          action =>
            action.tab === activeCombatTab
        );

      actions.forEach(action => {
        const button =
          document.createElement("button");

        button.type = "button";
        button.className =
          `action-button ${action.className || ""}`;
        button.disabled =
          Boolean(action.disabled);

        button.innerHTML =
          `${escapeHtml(action.label)}` +
          (
            action.note
              ? `<small>${escapeHtml(action.note)}</small>`
              : ""
          );

        button.addEventListener("click", () => {
          if (
            buttonsLocked ||
            button.disabled
          ) {
            return;
          }

          buttonsLocked = true;

          container
            .querySelectorAll("button")
            .forEach(item => {
              item.disabled = true;
            });

          action.handler();
        });

        container.appendChild(button);
      });

      document.getElementById("turnBrief").textContent =
        combat.turnBrief ||
        `第 ${combat.round} 合・${combat.terrain.name}`;
    }

    function renderHud() {
      const name =
        combat
          ? combat.player.name
          : game && game.name
            ? game.name
            : "未題名";

      document.getElementById("hudName").textContent = name;

      if (!combat) {
        document.getElementById("hudContext").textContent =
          game
            ? `${game.age || 0}歲・${game.rank}`
            : "轉生未始";

        document.getElementById("hudPostureText").textContent = "—";
        document.getElementById("hudStaminaText").textContent = "—";
        document.getElementById("hudPostureFill").style.width = "0%";
        document.getElementById("hudStaminaFill").style.width = "0%";

        document.getElementById("hudTags").innerHTML =
          game
            ? `
              <span class="tag">軍功 ${game.merit}</span>
              <span class="tag">武名 ${game.renown}</span>
              <span class="tag">${escapeHtml(woundSummary(game.wounds))}</span>
            `
            : "";

        return;
      }

      const player =
        combat.player;

      document.getElementById("hudContext").textContent =
        `第 ${combat.round} 合・${combat.terrain.name}`;

      document.getElementById("hudPostureText").textContent =
        `${player.posture}/${player.maxPosture}`;

      document.getElementById("hudStaminaText").textContent =
        `${player.stamina}/${player.maxStamina}`;

      document.getElementById("hudPostureFill").style.width =
        `${clamp(
          player.posture /
          player.maxPosture *
          100,
          0,
          100
        )}%`;

      document.getElementById("hudStaminaFill").style.width =
        `${clamp(
          player.stamina /
          player.maxStamina *
          100,
          0,
          100
        )}%`;

      const initiative =
        combat.initiative >= 2
          ? "完全掌握"
          : combat.initiative === 1
            ? "略佔先機"
            : combat.initiative <= -2
              ? "完全受壓"
              : combat.initiative === -1
                ? "略處下風"
                : "勢均力敵";

      const fatigue =
        fatigueLabel(
          player.fatigue
        );

      const injury =
        woundSummary(
          player.wounds
        );

      document.getElementById("hudTags").innerHTML = `
        <span class="tag ${combat.initiative > 0 ? "good" : combat.initiative < 0 ? "warning" : ""}">
          ${escapeHtml(initiative)}
        </span>

        <span class="tag ${player.fatigue >= 5 ? "warning" : ""}">
          ${escapeHtml(fatigue)}
        </span>

        <span class="tag ${player.wounds.length > 0 ? "warning" : ""}">
          ${escapeHtml(injury)}
        </span>

        <span class="tag">
          前 ${frontEnemies().length}・後 ${reserveEnemies().length}
        </span>
      `;
    }

    document
      .querySelectorAll(".tab-button")
      .forEach(button => {
        button.addEventListener("click", () => {
          activeCombatTab =
            button.dataset.tab;

          document
            .querySelectorAll(".tab-button")
            .forEach(item => {
              item.classList.toggle(
                "active",
                item === button
              );
            });

          renderCombatActions();
        });
      });

    function finishFirstBattleWin(result) {
      game.merit += 8;
      game.renown += 5;

      game.weaponHistory.push(
        `黑松嶺首戰：擊退山賊，倒下敵人 ${result.defeated} 名`
      );

      game.history.push(
        "十八歲：黑松嶺首戰得勝"
      );

      setNarrativeScene(
        "首戰留名",
        [
          "糧隊成功通過黑松嶺。村中鄉勇第一次真正將你視為可以並肩作戰嘅人物。",
          "你並未因此成為名將，但你已經跨過由訓練走向真正戰場嘅第一道門。",
          "數月之後，各地太平道同時起事。黃巾之亂正式爆發。"
        ],
        [
          {
            label: "加入漢軍討伐黃巾",
            className: "danger",
            handler: yellowTurbanEnlistment
          }
        ]
      );
    }

    function finishFirstBattleEscape(result) {
      game.merit += 3;
      game.renown += 1;

      game.weaponHistory.push(
        "黑松嶺首戰：被圍後成功突圍"
      );

      game.history.push(
        "十八歲：黑松嶺遇伏，成功生還"
      );

      setNarrativeScene(
        "首戰生還",
        [
          "你冇能夠擊潰所有山賊，但成功由包圍中救返自己同身邊幾名鄉勇。",
          "有人認為你臨危知退，亦有人認為你未能守住糧隊。",
          "不久之後，黃巾之亂爆發。地方官府開始大規模招募義兵。"
        ],
        [
          {
            label: "帶住首戰教訓加入漢軍",
            handler: yellowTurbanEnlistment
          }
        ]
      );
    }

    function finishFirstBattleDefeat(result) {
      game.renown = Math.max(
        0,
        game.renown - 1
      );

      game.history.push(
        "十八歲：黑松嶺重傷落敗"
      );

      setNarrativeScene(
        "敗戰與傷痕",
        [
          "鄉勇將你由山道拖返村中。你冇死，但糧隊損失慘重。",
          "傷勢令你休養數月，亦令你明白前世知識並唔會替你擋住兵刃。",
          "當你勉強恢復行動時，黃巾之亂已經席捲多地。"
        ],
        [
          {
            label: "帶傷加入地方義軍",
            className: "danger",
            handler: yellowTurbanEnlistment
          }
        ]
      );
    }

    function yellowTurbanEnlistment() {
      game.rank = "義兵";
      game.age = 19;

      setNarrativeScene(
        "黃巾篇・投入亂軍",
        [
          "官府、豪族同地方義軍倉促集結。你被編入一支臨時隊伍，暫時只需要服從軍令。",
          "你冇資格決定整場戰役，但可以選擇自己願意承擔邊一種任務。",
          "呢個選擇會影響你遇到嘅人物、軍功同將來軍事道路。"
        ],
        [
          {
            label: "擔任前鋒",
            note: "危險最高，重視勇猛、突破同即時戰果。",
            className: "danger",
            handler: () => yellowMission("vanguard")
          },
          {
            label: "護送傷兵與糧隊",
            note: "保護部隊後路、百姓同受傷同袍。",
            className: "safe",
            handler: () => yellowMission("protect")
          },
          {
            label: "協助軍吏偵察部署",
            note: "分析地形、敵情同攻擊方向。",
            className: "info",
            handler: () => yellowMission("recon")
          }
        ]
      );
    }

    function yellowMission(type) {
      seedRng(createSeed());

      let result;
      let config;

      if (type === "vanguard") {
        game.affinity.sun += 3;

        result = tacticalCheck(
          "前鋒突破",
          "will",
          game.weapon.skill,
          15,
          0
        );

        config = {
          enemyCount:
            result.success ? 4 : 6,
          terrain:
            result.success ? "road" : "open",
          playerInitiative:
            result.success ? 1 : -1,
          enemyMorale:
            result.success ? 62 : 78,
          hasLeader: true,
          openingText:
            result.success
              ? "你同前鋒一齊衝破黃巾外圍，敵方小帥被迫親自補入缺口。"
              : "前鋒衝勢被拒，你同友軍失去聯繫，數名黃巾兵由兩側包圍。",
          context: "黃巾前鋒戰",
          tacticalResult:
            tacticalLine(result)
        };
      }

      if (type === "protect") {
        game.affinity.liu += 3;

        result = tacticalCheck(
          "保護後路",
          "presence",
          "command",
          14,
          1
        );

        config = {
          enemyCount:
            result.success ? 3 : 5,
          terrain: "gate",
          playerInitiative:
            result.success ? 1 : 0,
          enemyMorale:
            result.success ? 58 : 70,
          hasLeader: false,
          openingText:
            result.success
              ? "你成功將傷兵同糧車帶入窄口，只需要擋住追兵一段時間。"
              : "傷兵隊伍喺撤離時散開，你被迫獨自擋住多名追兵。",
          context: "護送撤離",
          tacticalResult:
            tacticalLine(result)
        };
      }

      if (type === "recon") {
        game.affinity.cao += 3;

        result = tacticalCheck(
          "偵察部署",
          "intellect",
          "tactics",
          14,
          1
        );

        config = {
          enemyCount:
            result.success ? 3 : 5,
          terrain:
            result.success ? "gate" : "road",
          playerInitiative:
            result.success ? 2 : -1,
          enemyMorale:
            result.success ? 55 : 72,
          hasLeader: true,
          openingText:
            result.success
              ? "你提早發現敵方小隊沿林地轉移，並搶先佔住必經位置。"
              : "你誤判敵軍轉移方向，返回本隊途中遭到截擊。",
          context: "偵察遭遇",
          tacticalResult:
            tacticalLine(result)
        };
      }

      beginCombat(
        config,
        {
          win:
            data => finishYellowMission(type, data, "win"),
          escape:
            data => finishYellowMission(type, data, "escape"),
          defeat:
            data => finishYellowMission(type, data, "defeat")
        }
      );
    }

    function finishYellowMission(type, data, outcome) {
      if (outcome === "win") {
        game.merit +=
          type === "vanguard" ? 12 : 9;

        game.renown +=
          type === "vanguard" ? 7 : 4;

        game.weaponHistory.push(
          `黃巾戰事：${type}任務得勝`
        );
      }

      if (outcome === "escape") {
        game.merit += 3;
        game.renown += 1;
      }

      if (outcome === "defeat") {
        game.merit = Math.max(
          0,
          game.merit - 2
        );
      }

      if (
        game.merit >= 10
      ) {
        game.rank = "伍長";
      }

      setNarrativeScene(
        "黃巾戰事・軍功初立",
        [
          outcome === "win"
            ? "你完成軍令，戰後名冊第一次正式記低你嘅軍功。"
            : outcome === "escape"
              ? "任務未算成功，但你保存性命同部分同袍，仍然帶回有用情報。"
              : "任務失敗令部隊付出代價。你冇被處死，但上司對你嘅信任下降。",
          "隨住戰線推進，你開始接觸到幾支來自不同地方嘅漢軍與義軍。",
          "真正決定你將來軍旅道路嘅一場戰事即將開始。"
        ],
        [
          {
            label: "進入黃巾篇決戰",
            className: "danger",
            handler: yellowFinalBriefing
          }
        ]
      );
    }

    function yellowFinalBriefing() {
      setNarrativeScene(
        "黃巾篇・長社外圍",
        [
          "黃巾軍依草結營，官軍數次進攻未果。風向、營地同敵軍士氣逐漸成為勝負關鍵。",
          "史實中漢軍最終會取得勝利。但你所在嘅局部戰線仍然可能全軍覆沒，亦可能因你而產生更大戰果。",
          "你只係一名基層軍人，無法單靠一場單挑改寫整場戰役。但你可以影響局部因果。"
        ],
        [
          {
            label: "護住右翼直到火攻開始",
            note: "穩住友軍，避免局部潰敗。",
            className: "safe",
            handler: () => yellowFinalPlan("hold")
          },
          {
            label: "穿越混亂奪取敵旗",
            note: "高風險行動，可能直接打擊敵軍士氣。",
            className: "danger",
            handler: () => yellowFinalPlan("banner")
          },
          {
            label: "救援被隔離軍官",
            note: "可能建立重要關係，但會離開原本位置。",
            className: "info",
            handler: () => yellowFinalPlan("rescue")
          }
        ]
      );
    }

    function yellowFinalPlan(type) {
      seedRng(createSeed());

      let result;
      let config;

      if (type === "hold") {
        game.affinity.cao += 2;

        result = tacticalCheck(
          "堅守右翼",
          "will",
          "command",
          16,
          game.rank === "伍長" ? 1 : 0
        );

        config = {
          enemyCount:
            result.success ? 5 : 7,
          terrain: "gate",
          playerInitiative:
            result.success ? 1 : -1,
          enemyMorale:
            result.success ? 64 : 80,
          hasLeader: true,
          openingText:
            result.success
              ? "你將身邊義兵重新集結，守住右翼缺口，黃巾小帥親自帶人衝擊。"
              : "友軍先一步潰散，你被留喺缺口承受敵軍集中攻勢。",
          context: "長社右翼",
          tacticalResult:
            tacticalLine(result)
        };
      }

      if (type === "banner") {
        game.affinity.sun += 2;

        result = tacticalCheck(
          "突擊敵旗",
          "agility",
          game.weapon.skill,
          17,
          game.renown >= 5 ? 1 : 0
        );

        config = {
          enemyCount:
            result.success ? 4 : 8,
          terrain: "open",
          playerInitiative:
            result.success ? 2 : -2,
          enemyMorale:
            result.success ? 50 : 85,
          hasLeader: true,
          openingText:
            result.success
              ? "你利用火煙掩護接近敵旗。護旗兵倉促迎戰，後方黃巾已開始混亂。"
              : "你過早暴露喺開闊地，護旗兵同附近援軍一齊向你包圍。",
          context: "黃巾旗陣",
          tacticalResult:
            tacticalLine(result)
        };
      }

      if (type === "rescue") {
        game.affinity.liu += 2;

        result = tacticalCheck(
          "救援軍官",
          "perception",
          "awareness",
          16,
          game.merit >= 8 ? 1 : 0
        );

        config = {
          enemyCount:
            result.success ? 4 : 6,
          terrain: "road",
          playerInitiative:
            result.success ? 1 : -1,
          enemyMorale:
            result.success ? 60 : 76,
          hasLeader: false,
          openingText:
            result.success
              ? "你搶先發現友軍被圍位置，沿火場邊緣切入敵人側面。"
              : "你到達時友軍已經潰散，只剩自己陷入敵陣。",
          context: "火場救援",
          tacticalResult:
            tacticalLine(result)
        };
      }

      beginCombat(
        config,
        {
          win:
            data => finishYellowArc(type, data, "win"),
          escape:
            data => finishYellowArc(type, data, "escape"),
          defeat:
            data => finishYellowArc(type, data, "defeat")
        }
      );
    }

    function finishYellowArc(type, data, outcome) {
      if (outcome === "win") {
        game.merit += 15;
        game.renown += 10;

        game.weaponHistory.push(
          `長社外圍：完成${type}任務`
        );
      }

      if (outcome === "escape") {
        game.merit += 4;
      }

      if (outcome === "defeat") {
        game.merit = Math.max(
          0,
          game.merit - 4
        );
      }

      if (
        outcome === "win" &&
        data.defeated >= 4 &&
        game.merit >= 25
      ) {
        game.historicalDivergence = 1;
      }

      if (game.merit >= 25) {
        game.rank = "什長";
      } else if (game.merit >= 10) {
        game.rank = "伍長";
      }

      choosePatronEnding(outcome);
    }

    function choosePatronEnding(outcome) {
      const opportunities = [
        {
          key: "cao",
          name: "曹操麾下軍吏",
          score:
            game.affinity.cao +
            Math.floor(
              game.merit / 8
            ),
          text:
            "一名來自騎都尉曹操軍中嘅軍吏讀過戰後名冊，認為你識得判斷局勢同執行軍令。"
        },
        {
          key: "liu",
          name: "涿郡義軍使者",
          score:
            game.affinity.liu +
            Math.floor(
              game.renown / 6
            ),
          text:
            "一名涿郡義軍使者打聽過你保護同袍同百姓嘅事，邀請你同佢哋並肩作戰。"
        },
        {
          key: "sun",
          name: "孫堅軍中校吏",
          score:
            game.affinity.sun +
            Math.floor(
              game.renown / 5
            ),
          text:
            "一名孫堅軍中校吏留意到你敢於衝陣同近身作戰，認為你適合加入更精悍嘅部隊。"
        }
      ]
        .sort(
          (left, right) =>
            right.score - left.score
        );

      const best =
        opportunities[0];

      const second =
        opportunities[1];

      const paragraphs = [
        "黃巾主力逐漸被鎮壓，但亂世並冇因此結束。",
        outcome === "win"
          ? "你帶住軍功、傷痕同逐漸建立嘅武名離開戰場。"
          : "你未能取得理想戰果，但仍然由亂軍中活咗落嚟。",
        best.text
      ];

      if (
        second.score >=
        best.score - 1
      ) {
        paragraphs.push(
          second.text
        );
      }

      const actions = [
        {
          label: `接受${best.name}邀請`,
          note: "將呢次軍旅人生帶入下一個 faction campaign。",
          handler: () =>
            showPrototypeEnding(
              best
            )
        }
      ];

      if (
        second.score >=
        best.score - 1
      ) {
        actions.push({
          label: `改投${second.name}`,
          note: "拒絕最自然嘅機會，選擇另一條軍旅道路。",
          handler: () =>
            showPrototypeEnding(
              second
            )
        });
      }

      actions.push({
        label: "暫時留喺地方軍中",
        note: "唔立即依附著名人物，繼續累積軍功。",
        className: "safe",
        handler: () =>
          showPrototypeEnding({
            name: "地方軍旅道路",
            key: "local"
          })
      });

      setNarrativeScene(
        "黃巾篇終・新的軍旅道路",
        paragraphs,
        actions,
        {
          alert:
            game.historicalDivergence > 0
              ? "歷史分歧：局部。你嘅戰果令一支原本會受重創嘅友軍保存更多兵力，後續局勢將獲得有利修正。"
              : ""
        }
      );
    }

    function showPrototypeEnding(path) {
      const divergenceText =
        game.historicalDivergence > 0
          ? "你已造成一次局部歷史分歧。史實大方向仍未改變，但下一段 campaign 嘅兵力、人物同機會將有所不同。"
          : "你尚未改變大型歷史結果，但個人軍旅道路已經偏離原本不存在於史書嘅人生。";

      setNarrativeScene(
        "逆命錄・黃巾篇終",
        [
          `${game.name}，十九歲。`,
          `軍職：${game.rank}；軍功：${game.merit}；武名：${game.renown}。`,
          `下一段道路：${path.name}。`,
          divergenceText,
          `你嘅${game.weapon.name}已經記錄咗 ${game.weaponHistory.length} 段重要經歷。`,
          "V5.0A prototype 到此結束。正式下一階段會由呢個 affiliation 進入 faction campaign。"
        ],
        [
          {
            label: "查看人物小傳",
            className: "info",
            handler: showChronicle
          },
          {
            label: "以新人物重新開始",
            className: "danger",
            handler: startCreation
          }
        ],
        {
          alert:
            game.historicalDivergence > 0
              ? "你已經改變局部歷史。"
              : ""
        }
      );
    }

    function showChronicle() {
      setNarrativeScene(
        `${game.name}・軍旅小傳`,
        [
          ...game.history,
          ...game.weaponHistory.map(
            entry =>
              `兵器經歷：${entry}`
          ),
          `人物特質：${game.traits.join("、") || "未形成"}`,
          `最終傷勢：${woundSummary(game.wounds)}`
        ],
        [
          {
            label: "重新開始",
            handler: startCreation
          }
        ]
      );
    }

    startCreation();
  </script>
</body>
</html>
